name: Inspect IMP-008E symmetric NtContinue return

on:
  push:
    branches: [exp/imp-008e-windows-nce-rasterizer-recovery-runtime]
    paths:
      - .github/workflows/probe-imp008e-v7-stack-eligibility-d1-e5-e2-serial-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: imp008e-symmetric-ntcontinue-return
  cancel-in-progress: false

jobs:
  inspect-ntcontinue:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 5
    steps:
      - name: Run symmetric binary and print transition tail
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git -C eden rev-parse HEAD).Trim() -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31'){throw 'unexpected retained HEAD'}
          $exe=(Resolve-Path 'eden/build/bin/imp008e_symmetric_stack_bridge_e2.exe').Path
          $eden=(Resolve-Path eden).Path
          $psi=New-Object Diagnostics.ProcessStartInfo
          $psi.FileName=$exe; $psi.WorkingDirectory=$eden; $psi.UseShellExecute=$false; $psi.RedirectStandardOutput=$true; $psi.RedirectStandardError=$true
          $p=New-Object Diagnostics.Process; $p.StartInfo=$psi; [void]$p.Start(); $ot=$p.StandardOutput.ReadToEndAsync(); $et=$p.StandardError.ReadToEndAsync(); $timeout=-not $p.WaitForExit(30000); if($timeout){$p.Kill();$p.WaitForExit()}
          $log=$ot.Result+$et.Result; $rc=if($timeout){124}else{$p.ExitCode}
          Write-Host "IMP008E_SYM_NTCONT_RC=$rc"
          foreach($line in ($log -split "`r?`n")){if($line -match 'IMP008B_E2_|IMP008E_E2_PRE_RUN|IMP008E_E2_DATA_AV|NT_CONTINUE|FAST|FAIL'){Write-Host $line}}
          Write-Host 'IMP008E_SYM_NTCONT_INSPECT=PASS'
