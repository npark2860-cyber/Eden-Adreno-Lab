name: Inspect IMP-008E E2 pass fail address delta

on:
  workflow_dispatch:
  push:
    branches: [exp/imp-008e-windows-nce-rasterizer-recovery-runtime]
    paths:
      - .github/workflows/probe-imp008e-v7-stack-eligibility-d1-e5-e2-serial-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: inspect-imp008e-e2-pass-fail-address-delta
  cancel-in-progress: false

jobs:
  inspect-e2-address-delta:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 5
    steps:
      - name: Print retained E2 pass fail transition lines
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git -C eden rev-parse HEAD).Trim() -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31'){throw 'unexpected retained HEAD'}
          $logs=@(
            'eden/imp008e-order-E2_BASELINE_1.log',
            'eden/imp008e-order-E2_BASELINE_2.log',
            'eden/imp008e-order-E2_AFTER_E5.log',
            'eden/imp008e-order-E2_AFTER_D1_E5.log',
            'eden/imp008e-final-rerun.log',
            'eden/imp008e-ab-rerun.log'
          )
          $patterns=@(
            'IMP008E_E2_GUEST_STACK_QUERY=',
            'IMP008E_E2_INITIAL_PROTECTION',
            'IMP008E_E2_CACHED_PROTECTION',
            'IMP008E_E2_PRE_RUN ',
            'IMP008B_E2_RESTORE_CONTEXT ',
            'IMP008B_E2_RESTORE_PC_ADDR=',
            'IMP008B_E2_RESTORE_SP_ADDR=',
            'IMP008B_GENERIC_STACK_TOP=',
            'IMP008B_E2_BEFORE_NT_CONTINUE=',
            'IMP008E_E2_DATA_AV',
            'IMP008E_E2_REEXECUTED',
            'IMP008E_E2_CONTEXT_COHERENT',
            'IMP008E_E2_PHYSICAL_X18_TEB_AFTER',
            'IMP008E_E2_GATE='
          )
          foreach($path in $logs){
            if(-not(Test-Path $path)){Write-Host "IMP008E_LOG_MISSING=$path"; continue}
            Write-Host "===== IMP008E_LOG_BEGIN $path ====="
            foreach($line in [IO.File]::ReadAllLines((Resolve-Path $path).Path)){
              foreach($p in $patterns){if($line.Contains($p)){Write-Host $line; break}}
            }
            Write-Host "===== IMP008E_LOG_END $path ====="
          }
          Write-Host 'IMP008E_E2_PASS_FAIL_ADDRESS_DELTA_INSPECT=PASS'
