name: Inspect IMP-008E V6 production exact diff

on:
  workflow_dispatch:
  push:
    branches: [exp/imp-008e-windows-nce-rasterizer-recovery-runtime]
    paths:
      - .github/workflows/probe-imp008e-v7-stack-eligibility-d1-e5-e2-serial-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: inspect-imp008e-v6-production-exact-diff
  cancel-in-progress: false

jobs:
  inspect-v6-production-diff:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 5
    steps:
      - name: Diff retained V6 PASS source against corrected production
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $retained='38ffd8f36f797c487e3e88ec7dbe4cac327a2c31'
          $production='6e1167c953fe17bc95dda954910fb69b65153fa3'
          if((git -C eden rev-parse HEAD).Trim() -ne $retained){throw 'unexpected retained HEAD'}
          $v6='eden/build/e2_runthread_private_stack_lease_scope_v6/arm_nce_windows.cpp'
          if(-not(Test-Path $v6)){throw 'retained V6 source missing'}
          git -C eden fetch --no-tags origin $production
          if($LASTEXITCODE-ne 0){throw "fetch production rc=$LASTEXITCODE"}
          $prod='eden/build/imp008e_v6_exact_diff_production.cpp'
          $lines=& git -C eden show "${production}:src/core/arm/nce/arm_nce_windows.cpp"
          if($LASTEXITCODE-ne 0){throw 'production export failed'}
          [IO.File]::WriteAllText((Join-Path (Resolve-Path eden).Path 'build/imp008e_v6_exact_diff_production.cpp'),(($lines -join "`n")+"`n"),[Text.UTF8Encoding]::new($false))

          Write-Host '===== IMP008E_V6_PRODUCTION_FULL_DIFF_BEGIN ====='
          $old=$ErrorActionPreference; $ErrorActionPreference='Continue'
          & git --no-pager diff --no-index --unified=3 -- $v6 $prod
          $diffRc=$LASTEXITCODE
          $ErrorActionPreference=$old
          if($diffRc-ne 0 -and $diffRc-ne 1){throw "git diff rc=$diffRc"}
          Write-Host '===== IMP008E_V6_PRODUCTION_FULL_DIFF_END ====='

          Write-Host '===== IMP008E_V6_KEY_LINES ====='
          Select-String -Path $v6 -Pattern 'private_stack_|VirtualAlloc2|MapViewOfFile3|VirtualFreeEx|WindowsNceEnterGuest|WindowsNceEnterGuestContext|CurrentNceContext::Clear|m_windows_pending_nce_fault|WindowsX18FallbackTrap::TryRedirect|ContinueContext|EXCEPTION_CONTINUE_EXECUTION|StackBase|StackLimit' | ForEach-Object { Write-Host ("{0}:{1}: {2}" -f $_.Path,$_.LineNumber,$_.Line.Trim()) }
          Write-Host '===== IMP008E_PRODUCTION_KEY_LINES ====='
          Select-String -Path $prod -Pattern 'private_stack_|AcquireDirectMappedPrivateLease|PrivateMappingLease|WindowsNceEnterGuest|WindowsNceEnterGuestContext|CurrentNceContext::Clear|m_windows_pending_nce_fault|WindowsX18FallbackTrap::TryRedirect|ContinueContext|EXCEPTION_CONTINUE_EXECUTION|StackBase|StackLimit' | ForEach-Object { Write-Host ("{0}:{1}: {2}" -f $_.Path,$_.LineNumber,$_.Line.Trim()) }
          Write-Host 'IMP008E_V6_PRODUCTION_EXACT_DIFF=PASS'
