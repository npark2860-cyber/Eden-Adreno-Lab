name: Promote IMP-008E validated stack bridges

on:
  push:
    branches: [exp/imp-008e-windows-nce-rasterizer-recovery-runtime]
    paths:
      - .github/workflows/probe-imp008e-v7-stack-eligibility-d1-e5-e2-serial-selfhosted-arm64.yml

permissions:
  contents: write

concurrency:
  group: imp008e-promote-validated-stack-bridges
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify retained validated candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git -C eden rev-parse HEAD).Trim() -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31'){throw 'unexpected retained HEAD'}
          $dir='eden/build/imp008e_guest_stack_bridge_e2'
          $files=@(
            "$dir/arm_nce_windows.cpp",
            "$dir/windows_nce_transition_spbridge.cpp",
            "$dir/windows_nce_entry_spbridge.asm",
            'eden/build/bin/imp008e_spbridge_e2.exe'
          )
          foreach($p in $files){if(-not(Test-Path $p)){throw "validated candidate missing: $p"}}
          $eden=(Resolve-Path eden).Path
          for($i=1;$i-le 4;$i++){
            $psi=New-Object Diagnostics.ProcessStartInfo;$psi.FileName=(Resolve-Path 'eden/build/bin/imp008e_spbridge_e2.exe').Path;$psi.WorkingDirectory=$eden;$psi.UseShellExecute=$false;$psi.RedirectStandardOutput=$true;$psi.RedirectStandardError=$true
            $p=New-Object Diagnostics.Process;$p.StartInfo=$psi;[void]$p.Start();$ot=$p.StandardOutput.ReadToEndAsync();$et=$p.StandardError.ReadToEndAsync();$timeout=-not $p.WaitForExit(30000);if($timeout){$p.Kill();$p.WaitForExit()};$log=$ot.Result+$et.Result;$rc=if($timeout){124}else{$p.ExitCode}
            if($rc-ne 0){throw "validated candidate rerun $i rc=$rc"}
            foreach($m in @('IMP008E_E2_DATA_AV_EXACT=PASS','IMP008E_E2_REEXECUTED_VALUE_EXACT=PASS','IMP008E_E2_CONTEXT_COHERENT=PASS','IMP008E_E2_PHYSICAL_X18_TEB_AFTER=PASS','IMP008E_E2_GATE=PASS')){if(-not $log.Contains($m)){throw "validated candidate rerun $i missing $m"}}
            Write-Host "IMP008E_PROMOTE_PREFLIGHT_${i}=PASS"
          }
          Write-Host 'IMP008E_PROMOTE_PREFLIGHT=PASS'

      - name: Promote exact validated sources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:GH_TOKEN)){throw 'missing GitHub token'}
          $repo='npark2860-cyber/Eden-Adreno-Lab'
          $branch='exp/imp-008e-windows-nce-rasterizer-recovery-runtime'
          $branchEsc=[Uri]::EscapeDataString($branch)
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          $head=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/branches/$branchEsc"
          if($head.commit.sha -ne $env:GITHUB_SHA){throw "branch moved before promotion: $($head.commit.sha)"}
          $dir=(Resolve-Path 'eden/build/imp008e_guest_stack_bridge_e2').Path
          $items=@(
            @{Path='src/core/arm/nce/arm_nce_windows.cpp';Local=(Join-Path $dir 'arm_nce_windows.cpp')},
            @{Path='src/core/arm/nce/windows_nce_transition.cpp';Local=(Join-Path $dir 'windows_nce_transition_spbridge.cpp')},
            @{Path='src/core/arm/nce/windows_nce_entry.asm';Local=(Join-Path $dir 'windows_nce_entry_spbridge.asm')}
          )
          foreach($item in $items){
            $path=$item.Path
            $meta=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/contents/$path`?ref=$branchEsc"
            $bytes=[IO.File]::ReadAllBytes($item.Local)
            $body=@{
              message="nce: promote validated symmetric stack bridge [skip ci]"
              content=[Convert]::ToBase64String($bytes)
              sha=$meta.sha
              branch=$branch
            } | ConvertTo-Json -Compress
            $result=Invoke-RestMethod -Method Put -Headers $headers -ContentType 'application/json' -Uri "https://api.github.com/repos/$repo/contents/$path" -Body $body
            Write-Host "IMP008E_PROMOTED $path COMMIT=$($result.commit.sha)"
          }
          Write-Host 'IMP008E_VALIDATED_STACK_BRIDGE_PROMOTION=PASS'
