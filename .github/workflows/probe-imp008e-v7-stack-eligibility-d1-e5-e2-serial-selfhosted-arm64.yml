name: Inspect IMP-008E V6 breakpoint continuation

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp008e-v7-stack-eligibility-d1-e5-e2-serial-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: inspect-imp008e-v6-breakpoint-continuation
  cancel-in-progress: false

jobs:
  inspect-v6-breakpoint:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 5
    steps:
      - name: Print exact V6 VEH continuation ranges
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git -C eden rev-parse HEAD).Trim() -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31'){throw 'unexpected retained HEAD'}
          $v6='eden/build/e2_runthread_private_stack_lease_scope_v6/arm_nce_windows.cpp'
          if(-not(Test-Path $v6)){throw 'retained V6 source missing'}
          $c=Get-Content $v6
          Write-Host '===== V6_BREAKPOINT_145_198 ====='
          for($i=144;$i-lt [Math]::Min(198,$c.Count);$i++){Write-Host ('{0,5}: {1}' -f ($i+1),$c[$i])}
          Write-Host '===== V6_AV_197_220 ====='
          for($i=196;$i-lt [Math]::Min(220,$c.Count);$i++){Write-Host ('{0,5}: {1}' -f ($i+1),$c[$i])}
          Write-Host 'IMP008E_V6_BREAKPOINT_CONTINUATION_INSPECT=PASS'
