name: Stage IMP-008E symmetric bridge ref

on:
  push:
    branches: [exp/imp-008e-windows-nce-rasterizer-recovery-runtime]
    paths:
      - .github/workflows/probe-imp008e-v7-stack-eligibility-d1-e5-e2-serial-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: imp008e-stage-symmetric-bridge-ref
  cancel-in-progress: false

jobs:
  stage-ref:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 5
    steps:
      - name: Fetch required source ref
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $retained='38ffd8f36f797c487e3e88ec7dbe4cac327a2c31'
          $required='8e1c9312fa2d025ced91b968c1b077b7ec45bde8'
          if((git -C eden rev-parse HEAD).Trim() -ne $retained){throw 'unexpected retained HEAD'}
          git -C eden fetch --no-tags origin $required
          if($LASTEXITCODE-ne 0){throw "fetch rc=$LASTEXITCODE"}
          git -C eden cat-file -e "$required`:src/core/arm/nce/windows_cross_thread_break.h"
          if($LASTEXITCODE-ne 0){throw 'required header unavailable'}
          Write-Host 'IMP008E_SYMMETRIC_REQUIRED_REF_STAGED=PASS'
