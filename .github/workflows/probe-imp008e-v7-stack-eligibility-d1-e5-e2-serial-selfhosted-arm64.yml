name: Inspect IMP-008E AB vs final E2 binary

on:
  workflow_dispatch:
  push:
    branches: [exp/imp-008e-windows-nce-rasterizer-recovery-runtime]
    paths:
      - .github/workflows/probe-imp008e-v7-stack-eligibility-d1-e5-e2-serial-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: inspect-imp008e-ab-vs-final-e2-binary
  cancel-in-progress: false

jobs:
  inspect-ab-vs-final:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 5
    steps:
      - name: Compare retained sources objects and executables
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git -C eden rev-parse HEAD).Trim() -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31'){throw 'unexpected retained HEAD'}
          $abSrc='eden/build/imp008e_prod_av_dispatcher_e2/arm_nce_windows.cpp'
          $finalSrc='eden/build/imp008e_final_compile_7c842909/arm_nce_windows.cpp'
          $abObj='eden/build/imp008e_prod_av_dispatcher_e2/arm_nce_windows.cpp.obj'
          $finalObj='eden/build/imp008e_final_compile_7c842909/arm_nce_windows.cpp.obj'
          $abExe='eden/build/bin/imp008e_prod_av_dispatcher_e2.exe'
          $finalExe='eden/build/bin/imp008e_e2_final_production.exe'
          foreach($p in @($abSrc,$finalSrc,$abObj,$finalObj,$abExe,$finalExe)){if(-not(Test-Path $p)){throw "missing retained file: $p"}}
          function Get-Sha256([string]$path){
            $sha=[Security.Cryptography.SHA256]::Create()
            try {
              $stream=[IO.File]::OpenRead((Resolve-Path $path).Path)
              try { return ([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-','') }
              finally { $stream.Dispose() }
            } finally { $sha.Dispose() }
          }
          foreach($p in @($abSrc,$finalSrc,$abObj,$finalObj,$abExe,$finalExe)){$h=Get-Sha256 $p; Write-Host "IMP008E_HASH PATH=$p SHA256=$h"}
          $abText=[IO.File]::ReadAllText((Resolve-Path $abSrc).Path).Replace("`r`n","`n")
          $finalText=[IO.File]::ReadAllText((Resolve-Path $finalSrc).Path).Replace("`r`n","`n")
          Write-Host ("IMP008E_SOURCE_IDENTICAL=" + ($abText -ceq $finalText))
          if($abText -cne $finalText){
            $old=$ErrorActionPreference; $ErrorActionPreference='Continue'
            & git --no-pager diff --no-index --unified=5 -- $abSrc $finalSrc
            $ErrorActionPreference=$old
          }

          function Run-E2([string]$label,[string]$exe,[string]$logName){
            $eden=(Resolve-Path eden).Path
            $psi=New-Object Diagnostics.ProcessStartInfo
            $psi.FileName=(Resolve-Path $exe).Path
            $psi.WorkingDirectory=$eden; $psi.UseShellExecute=$false; $psi.RedirectStandardOutput=$true; $psi.RedirectStandardError=$true
            $p=New-Object Diagnostics.Process; $p.StartInfo=$psi; [void]$p.Start(); $ot=$p.StandardOutput.ReadToEndAsync(); $et=$p.StandardError.ReadToEndAsync(); $timeout=-not $p.WaitForExit(60000); if($timeout){$p.Kill();$p.WaitForExit()}
            $out=$ot.Result; $err=$et.Result; $rc=if($timeout){124}else{$p.ExitCode}; $log=$out+$err
            [IO.File]::WriteAllText((Join-Path $eden $logName),$log)
            Write-Host "IMP008E_${label}_RC=$rc"
            foreach($marker in @('IMP008E_E2_DATA_AV_EXACT=PASS','IMP008E_E2_REEXECUTED_VALUE_EXACT=PASS','IMP008E_E2_GATE=PASS')){Write-Host ("IMP008E_${label}_MARKER " + $marker + '=' + $log.Contains($marker))}
            return $rc
          }
          $abRc=Run-E2 'AB' $abExe 'imp008e-ab-rerun.log'
          $finalRc=Run-E2 'FINAL' $finalExe 'imp008e-final-rerun.log'
          Write-Host "IMP008E_AB_VS_FINAL_RC AB=$abRc FINAL=$finalRc"
          Write-Host 'IMP008E_AB_VS_FINAL_INSPECT=PASS'
