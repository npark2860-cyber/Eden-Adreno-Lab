name: Compare IMP-008E guest and symmetric bridge binaries

on:
  push:
    branches: [exp/imp-008e-windows-nce-rasterizer-recovery-runtime]
    paths:
      - .github/workflows/probe-imp008e-v7-stack-eligibility-d1-e5-e2-serial-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: imp008e-bridge-binary-ab
  cancel-in-progress: false

jobs:
  bridge-binary-ab:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 8
    steps:
      - name: Run retained guest-only and symmetric binaries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git -C eden rev-parse HEAD).Trim() -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31'){throw 'unexpected retained HEAD'}
          $eden=(Resolve-Path eden).Path
          $cases=@(
            @{Name='GUEST'; Exe='eden/build/bin/imp008e_guest_stack_bridge_e2.exe'},
            @{Name='SYMMETRIC'; Exe='eden/build/bin/imp008e_symmetric_stack_bridge_e2.exe'}
          )
          foreach($c in $cases){if(-not(Test-Path $c.Exe)){throw "missing $($c.Exe)"}}
          function Run-One([string]$name,[string]$exe,[int]$iter){
            $psi=New-Object Diagnostics.ProcessStartInfo
            $psi.FileName=(Resolve-Path $exe).Path
            $psi.WorkingDirectory=$eden
            $psi.UseShellExecute=$false
            $psi.RedirectStandardOutput=$true
            $psi.RedirectStandardError=$true
            $p=New-Object Diagnostics.Process; $p.StartInfo=$psi; [void]$p.Start()
            $ot=$p.StandardOutput.ReadToEndAsync(); $et=$p.StandardError.ReadToEndAsync()
            $timeout=-not $p.WaitForExit(30000); if($timeout){$p.Kill();$p.WaitForExit()}
            $out=$ot.Result+$et.Result; $rc=if($timeout){124}else{$p.ExitCode}
            Write-Host "IMP008E_AB_${name}_${iter}_RC=$rc"
            foreach($line in ($out -split "`r?`n")){
              if($line -match 'IMP008E_E2_GUEST_STACK_QUERY=|IMP008E_E2_PRE_RUN |IMP008E_E2_DATA_AV|IMP008E_E2_GATE=|IMP008B_E2_RESTORE_ENTER=|IMP008B_E2_BEFORE_NT_CONTINUE=') { Write-Host "IMP008E_AB_${name}_${iter} $line" }
            }
          }
          for($i=1;$i-le 4;$i++){
            foreach($c in $cases){Run-One $c.Name $c.Exe $i}
          }
          Write-Host 'IMP008E_BRIDGE_BINARY_AB_COMPLETE=PASS'
