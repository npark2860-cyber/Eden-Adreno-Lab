name: Validate IMP-008E production HostMemory lease D1 E5 E2

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp008e-v7-stack-eligibility-d1-e5-e2-serial-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: validate-imp008e-production-hostmemory-lease-runtime
  cancel-in-progress: false

jobs:
  production-d1-e5-e2:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 20
    steps:
      - name: Verify exact promoted production object
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $retained='38ffd8f36f797c487e3e88ec7dbe4cac327a2c31'
          if((git -C eden rev-parse HEAD).Trim() -ne $retained){throw 'unexpected retained HEAD'}
          $prodObj='eden/build/imp008e_production_hostmemory_lease_compile_ecacd4c7/arm_nce_windows.cpp.obj'
          $prodSrc='eden/build/imp008e_production_hostmemory_lease_compile_ecacd4c7/arm_nce_windows.cpp'
          $genericObj='eden/build/generic_stacktop_ab/windows_nce_transition.cpp.obj'
          $e2Src='eden/build/e2_pagetable_stack_query_v1/rasterizer_cached_retry_pagetable_stack.cpp'
          foreach($p in @($prodObj,$prodSrc,$genericObj,$e2Src)){if(-not(Test-Path $p)){throw "required retained file missing: $p"}}
          $src=[IO.File]::ReadAllText((Resolve-Path $prodSrc).Path)
          if(-not $src.Contains('AcquireDirectMappedPrivateLease')){throw 'production lease API call missing from promoted source'}
          Write-Host 'IMP008E_PRODUCTION_RUNTIME_INPUT=PASS SOURCE=ecacd4c798a461d46796c13064d5da5dc74888c0'

      - name: D1 with promoted production source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='eden/build/imp008e_production_runtime_ecacd4c7'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $src=(Resolve-Path 'eden/probes/windows-arm64-nce-fault-d1/data_fault_skip_runtime.cpp').Path
          $dst=Join-Path (Resolve-Path $dir).Path 'data_fault_skip_runtime.cpp'
          $text=[IO.File]::ReadAllText($src)
          $needle='if (getter_literal_matches == 0) {'
          if(( [regex]::Matches($text,[regex]::Escape($needle)) ).Count -lt 1){throw 'D1 stale getter condition missing'}
          $text=$text.Replace($needle,'if (false && getter_literal_matches == 0) { // current patcher compatibility')
          [IO.File]::WriteAllText($dst,$text,[Text.UTF8Encoding]::new($false))

          Push-Location eden/build
          try {
            $commands=& 'C:\msys64\usr\bin\ninja.exe' -t commands imp008b_e5_x18_runtime
            if($LASTEXITCODE-ne 0){throw "ninja commands rc=$LASTEXITCODE"}
            $compileHits=@($commands|Where-Object{(($_ -replace '\\','/')) -match " -c '?C:/.*?/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant\.cpp'?$"})
            if($compileHits.Count-ne 1){throw "E5 probe compile command count=$($compileHits.Count)"}
            $compile=[string]$compileHits[0]
            $oldObj='src/yuzu_cmd/CMakeFiles/imp008b_e5_x18_runtime.dir/__/__/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp.obj'
            $newObj='imp008e_production_runtime_ecacd4c7/data_fault_skip_runtime.cpp.obj'
            $compile=$compile.Replace($oldObj,$newObj)
            $compile=[regex]::Replace($compile,'-MF\s+\S+\.obj\.d','-MF imp008e_production_runtime_ecacd4c7\data_fault_skip_runtime.cpp.obj.d')
            $d1Source=((Resolve-Path 'imp008e_production_runtime_ecacd4c7/data_fault_skip_runtime.cpp').Path -replace '\\','/')
            $compile=[regex]::Replace($compile,"-c\s+'?C:/[^']*?/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant\.cpp'?",('-c '+$d1Source))
            $compile=$compile.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64').Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64').Replace('C:\msys64\clangarm64\bin\sccache.exe ','').Replace('C:/msys64/clangarm64/bin/sccache.exe ','')
            $compile=[regex]::Replace($compile,"'(C:/[^']+)'",'$1')
            & $env:ComSpec /D /S /C $compile
            if($LASTEXITCODE-ne 0){throw "D1 production compile rc=$LASTEXITCODE"}

            $linkHits=@($commands|Where-Object{$_ -match '-o bin\\imp008b_e5_x18_runtime\.exe'})
            if($linkHits.Count-ne 1){throw "E5 link command count=$($linkHits.Count)"}
            $link=[string]$linkHits[0]
            $link=$link.Replace($oldObj,$newObj)
            $link=$link.Replace('bin\imp008b_e5_x18_runtime.exe','bin\imp008d_d1_production_lease.exe')
            $link=$link.Replace('src\yuzu_cmd\libimp008b_e5_x18_runtime.a','src\yuzu_cmd\libimp008d_d1_production_lease.a')
            $link=$link.Replace('src/core/libcore.a','imp008e_production_hostmemory_lease_compile_ecacd4c7/arm_nce_windows.cpp.obj generic_stacktop_ab/windows_nce_transition.cpp.obj src/core/libcore.a')
            $link=$link.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64').Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64')
            & $env:ComSpec /D /S /C $link 2>&1 | Tee-Object -FilePath '..\imp008d-d1-production-lease-link.log'
            if($LASTEXITCODE-ne 0){throw "D1 production link rc=$LASTEXITCODE"}
          } finally { Pop-Location }

          $edenPath=(Resolve-Path eden).Path
          $psi=New-Object Diagnostics.ProcessStartInfo
          $psi.FileName=(Resolve-Path 'eden/build/bin/imp008d_d1_production_lease.exe').Path
          $psi.WorkingDirectory=$edenPath; $psi.UseShellExecute=$false; $psi.RedirectStandardOutput=$true; $psi.RedirectStandardError=$true
          $p=New-Object Diagnostics.Process; $p.StartInfo=$psi; [void]$p.Start()
          $ot=$p.StandardOutput.ReadToEndAsync(); $et=$p.StandardError.ReadToEndAsync(); $timeout=-not $p.WaitForExit(30000); if($timeout){$p.Kill();$p.WaitForExit()}
          $out=$ot.Result; $err=$et.Result; $rc=if($timeout){124}else{$p.ExitCode}; $log=$out+$err
          [IO.File]::WriteAllText((Join-Path $edenPath 'imp008d-d1-production-lease.log'),$log)
          Write-Host $out; Write-Host $err; Write-Host "IMP008D_D1_PRODUCTION_LEASE_RC=$rc"
          if($rc-ne 0){throw "D1 production runtime rc=$rc"}
          if(-not $log.Contains('IMP008B_GENERIC_STACK_TOP=PASS')){throw 'D1 generic transition missing'}
          if(-not $log.Contains('IMP008D_D1_GATE=PASS')){throw 'D1 production gate failed'}
          Write-Host 'IMP008D_D1_PRODUCTION_LEASE=PASS'

      - name: E5 with same promoted production source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location eden/build
          try {
            $commands=& 'C:\msys64\usr\bin\ninja.exe' -t commands imp008b_e5_x18_runtime
            $linkHits=@($commands|Where-Object{$_ -match '-o bin\\imp008b_e5_x18_runtime\.exe'})
            if($linkHits.Count-ne 1){throw "E5 link command count=$($linkHits.Count)"}
            $link=[string]$linkHits[0]
            $link=$link.Replace('bin\imp008b_e5_x18_runtime.exe','bin\imp008b_e5_production_lease.exe')
            $link=$link.Replace('src\yuzu_cmd\libimp008b_e5_x18_runtime.a','src\yuzu_cmd\libimp008b_e5_production_lease.a')
            $link=$link.Replace('src/core/libcore.a','imp008e_production_hostmemory_lease_compile_ecacd4c7/arm_nce_windows.cpp.obj generic_stacktop_ab/windows_nce_transition.cpp.obj src/core/libcore.a')
            $link=$link.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64').Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64')
            & $env:ComSpec /D /S /C $link 2>&1 | Tee-Object -FilePath '..\imp008b-e5-production-lease-link.log'
            if($LASTEXITCODE-ne 0){throw "E5 production link rc=$LASTEXITCODE"}
          } finally { Pop-Location }

          $edenPath=(Resolve-Path eden).Path
          $psi=New-Object Diagnostics.ProcessStartInfo
          $psi.FileName=(Resolve-Path 'eden/build/bin/imp008b_e5_production_lease.exe').Path
          $psi.WorkingDirectory=$edenPath; $psi.UseShellExecute=$false; $psi.RedirectStandardOutput=$true; $psi.RedirectStandardError=$true
          $p=New-Object Diagnostics.Process; $p.StartInfo=$psi; [void]$p.Start()
          $ot=$p.StandardOutput.ReadToEndAsync(); $et=$p.StandardError.ReadToEndAsync(); $timeout=-not $p.WaitForExit(30000); if($timeout){$p.Kill();$p.WaitForExit()}
          $out=$ot.Result; $err=$et.Result; $rc=if($timeout){124}else{$p.ExitCode}; $log=$out+$err
          [IO.File]::WriteAllText((Join-Path $edenPath 'imp008b-e5-production-lease.log'),$log)
          Write-Host $out; Write-Host $err; Write-Host "IMP008B_E5_PRODUCTION_LEASE_RC=$rc"
          if($rc-ne 0){throw "E5 production runtime rc=$rc"}
          if(-not $log.Contains('IMP008B_GENERIC_STACK_TOP=PASS')){throw 'E5 generic transition missing'}
          if(-not $log.Contains('IMP008B_E5_GATE=PASS')){throw 'E5 production gate failed'}
          Write-Host 'IMP008B_E5_PRODUCTION_LEASE=PASS'

      - name: E2 with same promoted production source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location eden/build
          try {
            $commands=& 'C:\msys64\usr\bin\ninja.exe' -t commands imp008b_e5_x18_runtime
            $compileHits=@($commands|Where-Object{(($_ -replace '\\','/')) -match " -c '?C:/.*?/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant\.cpp'?$"})
            if($compileHits.Count-ne 1){throw "E5 probe compile command count=$($compileHits.Count)"}
            $compile=[string]$compileHits[0]
            $oldObj='src/yuzu_cmd/CMakeFiles/imp008b_e5_x18_runtime.dir/__/__/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp.obj'
            $newObj='imp008e_production_runtime_ecacd4c7/rasterizer_cached_retry_pagetable_stack.cpp.obj'
            $compile=$compile.Replace($oldObj,$newObj)
            $compile=[regex]::Replace($compile,'-MF\s+\S+\.obj\.d','-MF imp008e_production_runtime_ecacd4c7\rasterizer_cached_retry_pagetable_stack.cpp.obj.d')
            $e2Source=((Resolve-Path 'e2_pagetable_stack_query_v1/rasterizer_cached_retry_pagetable_stack.cpp').Path -replace '\\','/')
            $compile=[regex]::Replace($compile,"-c\s+'?C:/[^']*?/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant\.cpp'?",('-c '+$e2Source))
            $compile=$compile.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64').Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64').Replace('C:\msys64\clangarm64\bin\sccache.exe ','').Replace('C:/msys64/clangarm64/bin/sccache.exe ','')
            $compile=[regex]::Replace($compile,"'(C:/[^']+)'",'$1')
            & $env:ComSpec /D /S /C $compile
            if($LASTEXITCODE-ne 0){throw "E2 production probe compile rc=$LASTEXITCODE"}

            $linkHits=@($commands|Where-Object{$_ -match '-o bin\\imp008b_e5_x18_runtime\.exe'})
            if($linkHits.Count-ne 1){throw "E5 link command count=$($linkHits.Count)"}
            $link=[string]$linkHits[0]
            $link=$link.Replace($oldObj,$newObj)
            $link=$link.Replace('bin\imp008b_e5_x18_runtime.exe','bin\imp008e_e2_production_lease.exe')
            $link=$link.Replace('src\yuzu_cmd\libimp008b_e5_x18_runtime.a','src\yuzu_cmd\libimp008e_e2_production_lease.a')
            $link=$link.Replace('src/core/libcore.a','imp008e_production_hostmemory_lease_compile_ecacd4c7/arm_nce_windows.cpp.obj generic_stacktop_ab/windows_nce_transition.cpp.obj src/core/libcore.a')
            $link=$link.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64').Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64')
            & $env:ComSpec /D /S /C $link 2>&1 | Tee-Object -FilePath '..\imp008e-e2-production-lease-link.log'
            if($LASTEXITCODE-ne 0){throw "E2 production link rc=$LASTEXITCODE"}
          } finally { Pop-Location }

          $edenPath=(Resolve-Path eden).Path
          $psi=New-Object Diagnostics.ProcessStartInfo
          $psi.FileName=(Resolve-Path 'eden/build/bin/imp008e_e2_production_lease.exe').Path
          $psi.WorkingDirectory=$edenPath; $psi.UseShellExecute=$false; $psi.RedirectStandardOutput=$true; $psi.RedirectStandardError=$true
          $p=New-Object Diagnostics.Process; $p.StartInfo=$psi; [void]$p.Start()
          $ot=$p.StandardOutput.ReadToEndAsync(); $et=$p.StandardError.ReadToEndAsync(); $timeout=-not $p.WaitForExit(60000); if($timeout){$p.Kill();$p.WaitForExit()}
          $out=$ot.Result; $err=$et.Result; $rc=if($timeout){124}else{$p.ExitCode}; $log=$out+$err
          [IO.File]::WriteAllText((Join-Path $edenPath 'imp008e-e2-production-lease.log'),$log)
          Write-Host $out; Write-Host $err; Write-Host "IMP008E_E2_PRODUCTION_LEASE_RC=$rc"
          if($rc-ne 0){throw "E2 production runtime rc=$rc"}
          foreach($marker in @('IMP008E_E2_GUEST_STACK_QUERY=PASS','IMP008E_E2_DATA_AV_EXACT=PASS','IMP008E_E2_REEXECUTED_VALUE_EXACT=PASS','IMP008E_E2_CONTEXT_COHERENT=PASS','IMP008E_E2_PHYSICAL_X18_TEB_AFTER=PASS','IMP008E_E2_GATE=PASS')){if(-not $log.Contains($marker)){throw "E2 production marker missing: $marker"}}
          if(-not $log.Contains('IMP008B_GENERIC_STACK_TOP=PASS')){throw 'E2 generic transition missing'}
          Write-Host 'IMP008E_E2_PRODUCTION_LEASE=PASS'
          Write-Host 'IMP008E_PRODUCTION_D1_E5_E2_SERIAL_GATE=PASS'

      - name: Upload production regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imp008e-production-hostmemory-lease-d1-e5-e2
          path: |
            eden/imp008d-d1-production-lease-link.log
            eden/imp008d-d1-production-lease.log
            eden/imp008b-e5-production-lease-link.log
            eden/imp008b-e5-production-lease.log
            eden/imp008e-e2-production-lease-link.log
            eden/imp008e-e2-production-lease.log
            eden/imp008d-d1-first-exception.bin
          if-no-files-found: warn
