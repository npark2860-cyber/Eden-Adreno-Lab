name: Inspect IMP-008E symmetric bridge fail-fast

on:
  push:
    branches: [exp/imp-008e-windows-nce-rasterizer-recovery-runtime]
    paths:
      - .github/workflows/probe-imp008e-v7-stack-eligibility-d1-e5-e2-serial-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: imp008e-symmetric-failfast-inspect
  cancel-in-progress: false

jobs:
  inspect-failfast:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 8
    steps:
      - name: Compare bridge symbols and inspect fail-fast
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git -C eden rev-parse HEAD).Trim() -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31'){throw 'unexpected retained HEAD'}
          $guest=(Resolve-Path 'eden/build/bin/imp008e_guest_stack_bridge_e2.exe').Path
          $sym=(Resolve-Path 'eden/build/bin/imp008e_symmetric_stack_bridge_e2.exe').Path
          $llvm='C:\msys64\clangarm64\bin'
          foreach($exe in @($guest,$sym)){if(-not(Test-Path $exe)){throw "missing $exe"}}
          foreach($tool in @('llvm-nm.exe','llvm-objdump.exe','llvm-readobj.exe')){if(-not(Test-Path (Join-Path $llvm $tool))){throw "missing $tool"}}

          foreach($case in @(@('GUEST',$guest),@('SYMMETRIC',$sym))){
            $name=$case[0]; $exe=$case[1]
            Write-Host "===== IMP008E_${name}_SYMBOLS ====="
            & (Join-Path $llvm 'llvm-nm.exe') -n $exe | Select-String 'WindowsNceGuestStackBridge|WindowsNceHostStackBridge|WindowsNceContinueGuestContext|WindowsNceRestoreGuestContext'
            Write-Host "===== IMP008E_${name}_GUEST_BRIDGE_DISASM ====="
            & (Join-Path $llvm 'llvm-objdump.exe') -d --disassemble-symbols=WindowsNceGuestStackBridge $exe
            Write-Host "===== IMP008E_${name}_CONTINUE_DISASM ====="
            & (Join-Path $llvm 'llvm-objdump.exe') -d --disassemble-symbols=WindowsNceContinueGuestContext $exe
            Write-Host "===== IMP008E_${name}_LOAD_CONFIG ====="
            & (Join-Path $llvm 'llvm-readobj.exe') --coff-load-config $exe | Select-String 'Guard|EHCont|SecurityCookie|SEHandler'
          }

          $candidates=@(
            'C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64\cdb.exe',
            'C:\Program Files\Windows Kits\10\Debuggers\arm64\cdb.exe'
          )
          $cdb=$candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if($null-eq $cdb){
            foreach($root in @('C:\Program Files (x86)\Windows Kits\10\Debuggers','C:\Program Files\Windows Kits\10\Debuggers')){
              if(Test-Path $root){
                $found=Get-ChildItem $root -Filter cdb.exe -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.FullName -match '\\arm64\\'} | Select-Object -First 1
                if($null-ne $found){$cdb=$found.FullName;break}
              }
            }
          }
          if($null-eq $cdb){
            Write-Host 'IMP008E_CDB_AVAILABLE=NO'
          } else {
            Write-Host "IMP008E_CDB_AVAILABLE=YES PATH=$cdb"
            & $cdb -o -g -G -c 'sxe 0xc0000409;g;.exr -1;r;kb;q' $sym
            Write-Host "IMP008E_CDB_RC=$LASTEXITCODE"
          }
          Write-Host 'IMP008E_SYMMETRIC_FAILFAST_INSPECT=PASS'
