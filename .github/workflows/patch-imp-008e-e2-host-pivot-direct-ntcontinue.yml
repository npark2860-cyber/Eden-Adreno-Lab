name: Prepare IMP-008E E2 Host Pivot Direct NtContinue

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/patch-imp-008e-e2-host-pivot-direct-ntcontinue.yml

permissions:
  contents: write
  actions: write

jobs:
  prepare-direct-ntcontinue:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Change only VEH host-pivot continuation seam
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('.github/workflows/probe-imp-008e-e2-host-pivot-full-recovery.yml')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)(^[ \t]*NCE::WindowsNceTransition::RedirectToHost\(\n'
              r'^[ \t]*context, \*guest, true, static_cast<u64>\(HaltReason::PrefetchAbort\)\);\n)'
              r'^[ \t]*return EXCEPTION_CONTINUE_EXECUTION;'
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'host-pivot continuation anchor mismatch: {len(matches)}')
          indent = re.match(r'^[ \t]*', matches[0].group(0).splitlines()[-1]).group(0)
          text = pattern.sub(r'\1' + indent + 'NCE::WindowsNceTransition::ContinueContext(context);', text, count=1)

          old_guard = "grep -Fq 'static_cast<u64>(HaltReason::PrefetchAbort));' /tmp/pivot-production.diff"
          new_guard = "grep -Fq 'NCE::WindowsNceTransition::ContinueContext(context);' /tmp/pivot-production.diff"
          if text.count(old_guard) != 1:
              raise SystemExit(f'causal guard anchor mismatch: {text.count(old_guard)}')
          text = text.replace(old_guard, new_guard)
          path.write_text(text, encoding='utf-8', newline='\n')
          print('IMP008E_E2_PIVOT_DIRECT_NTCONTINUE_PATCH=PASS')

      - name: Verify one-variable workflow delta
        shell: bash
        run: |
          set -euo pipefail
          git diff -- .github/workflows/probe-imp-008e-e2-host-pivot-full-recovery.yml | tee /tmp/direct-ntcontinue.diff
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = '.github/workflows/probe-imp-008e-e2-host-pivot-full-recovery.yml'
          grep -Fq -- '-                  return EXCEPTION_CONTINUE_EXECUTION;' /tmp/direct-ntcontinue.diff
          grep -Fq -- '+                  NCE::WindowsNceTransition::ContinueContext(context);' /tmp/direct-ntcontinue.diff
          grep -Fq 'NCE::WindowsNceTransition::RedirectToHost(' /tmp/direct-ntcontinue.diff
          ! grep -Fq 'g_windows_pending_nce_fault = false' /tmp/direct-ntcontinue.diff
          echo 'IMP008E_E2_PIVOT_DIRECT_NTCONTINUE_WORKFLOW_DELTA=PASS'

      - name: Commit diagnostic workflow delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/probe-imp-008e-e2-host-pivot-full-recovery.yml
          git commit -m 'IMP-008E: direct NtContinue after host pivot'
          echo "IMP008E_E2_PIVOT_DIRECT_NTCONTINUE_HEAD=$(git rev-parse HEAD)"
          git push origin HEAD:exp/imp-008e-windows-nce-rasterizer-recovery-runtime
