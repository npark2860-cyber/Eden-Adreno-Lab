name: Build Windows ARM64 NCE SVC21 Post-SVC Direct Reentry Validation

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/build-windows-arm64-nce-svc21-post-svc-direct-reentry-validation.yml

permissions:
  contents: read

concurrency:
  group: windows-arm64-nce-svc21-post-svc-direct-reentry-validation
  cancel-in-progress: false

jobs:
  build-package:
    name: Windows ARM64 NCE SVC21 post-SVC direct-reentry validation package
    runs-on: windows-11-arm
    timeout-minutes: 180

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO
      PROD_SHA: 1572c8c55508d67d4423e025ec30ad7f3d2f9291

    steps:
      - name: Checkout validated Eden NCE branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Verify production-equivalent source
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          git cat-file -e "$PROD_SHA^{commit}"
          git diff --quiet "$PROD_SHA" HEAD -- src/common src/core src/video_core CMakeLists.txt
          grep -Fq 'guest_sp_value <= allocation_base || guest_sp_value >= allocation_end' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'tib->StackLimit = reinterpret_cast<void*>(allocation_base);' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'tib->StackBase = reinterpret_cast<void*>(allocation_end);' src/core/arm/nce/arm_nce_windows.cpp
          echo 'NCE_SVC21_POST_SVC_DIRECT_REENTRY_SOURCE_GUARD=PASS'

      - name: Inject validation-only first substitution and one-shot direct reentry
        shell: pwsh
        working-directory: eden
        run: |
          @'
          from pathlib import Path

          path = Path("src/core/arm/nce/arm_nce_windows.cpp")
          text = path.read_text(encoding="utf-8")

          def replace_once(label, old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              text = text.replace(old, new, 1)

          old_range = (
              "    const auto guest_sp_value = static_cast<std::uintptr_t>(guest_sp);\n"
              "    if (guest_sp_value <= allocation_base || guest_sp_value >= allocation_end) {\n"
              "        return false;\n"
              "    }\n"
          )
          replace_once("range", old_range, old_range.replace(">= allocation_end", "> allocation_end"))

          old_teb = (
              "    auto* const tib = reinterpret_cast<NT_TIB*>(NtCurrentTeb());\n"
              "    bounds.tib = tib;\n"
              "    bounds.host_stack_base = tib->StackBase;\n"
              "    bounds.host_stack_limit = tib->StackLimit;\n"
              "    tib->StackLimit = reinterpret_cast<void*>(allocation_base);\n"
              "    tib->StackBase = reinterpret_cast<void*>(allocation_end);\n"
              "    return true;\n"
          )
          new_teb = (
              "    auto* const tib = reinterpret_cast<NT_TIB*>(NtCurrentTeb());\n"
              "    bounds.tib = tib;\n"
              "    bounds.host_stack_base = tib->StackBase;\n"
              "    bounds.host_stack_limit = tib->StackLimit;\n"
              "    static std::atomic<u32> diag_teb_counter{0};\n"
              "    if (diag_teb_counter.fetch_add(1, std::memory_order_relaxed) == 0) {\n"
              "        LOG_ERROR(Core_ARM,\n"
              "                  \"IMP008_REALGAME_DIAG TEB_PREENTRY_BYPASS guest_sp=0x{:016X} allocation_base=0x{:016X} allocation_end=0x{:016X}\",\n"
              "                  guest_sp, static_cast<u64>(allocation_base), static_cast<u64>(allocation_end));\n"
              "    }\n"
              "    return true;\n"
          )
          replace_once("teb-write", old_teb, new_teb)

          old_run_head = (
              "HaltReason ArmNce::RunThread(Kernel::KThread* thread) {\n"
              "    HaltReason hr = static_cast<HaltReason>(m_guest_ctx.esr_el1.exchange(0));\n"
              "    if (True(hr)) {\n"
              "        return hr;\n"
              "    }\n"
              "\n"
              "    auto* const thread_params = &thread->GetNativeExecutionParameters();\n"
              "    auto* const process = thread->GetOwnerProcess();\n"
          )
          new_run_head = (
              "HaltReason ArmNce::RunThread(Kernel::KThread* thread) {\n"
              "    static thread_local u32 diag_svc21_counter{0};\n"
              "    static thread_local bool diag_force_direct_reentry{false};\n"
              "    static thread_local Kernel::KThread* diag_force_thread{};\n"
              "\n"
              "    HaltReason hr = static_cast<HaltReason>(m_guest_ctx.esr_el1.exchange(0));\n"
              "    if (True(hr)) {\n"
              "        return hr;\n"
              "    }\n"
              "\n"
              "    auto* const thread_params = &thread->GetNativeExecutionParameters();\n"
              "    auto* const process = thread->GetOwnerProcess();\n"
              "\n"
              "    if (diag_force_direct_reentry && diag_force_thread == thread) {\n"
              "        LOG_ERROR(Core_ARM,\n"
              "                  \"IMP008_REALGAME_DIAG POST_SVC_HLE_RETURN result_x0=0x{:016X} pc=0x{:016X} sp=0x{:016X} fp=0x{:016X} lr=0x{:016X} stale_svc=0x{:02X}\",\n"
              "                  m_guest_ctx.cpu_registers[0], m_guest_ctx.pc, m_guest_ctx.sp,\n"
              "                  m_guest_ctx.cpu_registers[29], m_guest_ctx.cpu_registers[30],\n"
              "                  m_guest_ctx.svc);\n"
              "    }\n"
          )
          replace_once("run-head", old_run_head, new_run_head)

          old_entry = (
              "        if (const auto it = post_handlers.find(m_guest_ctx.pc); it != post_handlers.end()) {\n"
              "            hr = static_cast<HaltReason>(NCE::WindowsNceEnterGuest(\n"
              "                &m_guest_ctx, reinterpret_cast<const void*>(it->second)));\n"
              "        } else {\n"
              "            hr = static_cast<HaltReason>(NCE::WindowsNceEnterGuestContext(&m_guest_ctx));\n"
              "        }\n"
          )
          new_entry = (
              "        const bool diag_force_direct_now =\n"
              "            diag_force_direct_reentry && diag_force_thread == thread;\n"
              "        if (diag_force_direct_now) {\n"
              "            const auto diag_it = post_handlers.find(m_guest_ctx.pc);\n"
              "            const bool diag_post_hit = diag_it != post_handlers.end();\n"
              "            const u64 diag_trampoline = diag_post_hit ? diag_it->second : 0;\n"
              "            u32 diag_guest_code[4]{};\n"
              "            u32 diag_trampoline_code[8]{};\n"
              "            const bool diag_guest_code_ok = process->GetMemory().ReadBlock(\n"
              "                Common::ProcessAddress{m_guest_ctx.pc}, diag_guest_code, sizeof(diag_guest_code));\n"
              "            const bool diag_trampoline_code_ok = diag_trampoline != 0 &&\n"
              "                process->GetMemory().ReadBlock(Common::ProcessAddress{diag_trampoline},\n"
              "                                               diag_trampoline_code,\n"
              "                                               sizeof(diag_trampoline_code));\n"
              "            LOG_ERROR(Core_ARM,\n"
              "                      \"IMP008_REALGAME_DIAG POST_SVC_DIRECT_REENTRY_BEGIN pc=0x{:016X} post_hit={} trampoline=0x{:016X} guest_ok={} g0={:08X} g1={:08X} g2={:08X} g3={:08X} tramp_ok={} t0={:08X} t1={:08X} t2={:08X} t3={:08X} t4={:08X} t5={:08X} t6={:08X} t7={:08X}\",\n"
              "                      m_guest_ctx.pc, diag_post_hit, diag_trampoline, diag_guest_code_ok,\n"
              "                      diag_guest_code[0], diag_guest_code[1], diag_guest_code[2],\n"
              "                      diag_guest_code[3], diag_trampoline_code_ok, diag_trampoline_code[0],\n"
              "                      diag_trampoline_code[1], diag_trampoline_code[2],\n"
              "                      diag_trampoline_code[3], diag_trampoline_code[4],\n"
              "                      diag_trampoline_code[5], diag_trampoline_code[6],\n"
              "                      diag_trampoline_code[7]);\n"
              "            diag_force_direct_reentry = false;\n"
              "            diag_force_thread = nullptr;\n"
              "            hr = static_cast<HaltReason>(NCE::WindowsNceEnterGuestContext(&m_guest_ctx));\n"
              "            LOG_ERROR(Core_ARM,\n"
              "                      \"IMP008_REALGAME_DIAG POST_SVC_DIRECT_REENTRY_RETURN hr=0x{:016X} svc=0x{:02X} pc=0x{:016X} x0=0x{:016X} sp=0x{:016X} fp=0x{:016X} lr=0x{:016X}\",\n"
              "                      static_cast<u64>(hr), m_guest_ctx.svc, m_guest_ctx.pc,\n"
              "                      m_guest_ctx.cpu_registers[0], m_guest_ctx.sp,\n"
              "                      m_guest_ctx.cpu_registers[29], m_guest_ctx.cpu_registers[30]);\n"
              "        } else if (const auto it = post_handlers.find(m_guest_ctx.pc);\n"
              "                   it != post_handlers.end()) {\n"
              "            hr = static_cast<HaltReason>(NCE::WindowsNceEnterGuest(\n"
              "                &m_guest_ctx, reinterpret_cast<const void*>(it->second)));\n"
              "        } else {\n"
              "            hr = static_cast<HaltReason>(NCE::WindowsNceEnterGuestContext(&m_guest_ctx));\n"
              "        }\n"
          )
          replace_once("entry", old_entry, new_entry)

          old_clear = (
              "        RestoreHostTebStackBounds(teb_stack_bounds);\n"
              "        NCE::CurrentNceContext::Clear();\n"
              "\n"
              "        if (m_windows_pending_nce_fault) {\n"
          )
          new_clear = (
              "        RestoreHostTebStackBounds(teb_stack_bounds);\n"
              "        NCE::CurrentNceContext::Clear();\n"
              "\n"
              "        if (static_cast<u64>(hr) == static_cast<u64>(HaltReason::SupervisorCall) &&\n"
              "            m_guest_ctx.svc == 0x21 && m_guest_ctx.cpu_registers[0] == 0x20 &&\n"
              "            m_guest_ctx.tpidrro_el0 != 0) {\n"
              "            const u32 diag_occurrence = diag_svc21_counter++;\n"
              "            u32 diag_tls[4]{};\n"
              "            const bool diag_tls_ok = process->GetMemory().ReadBlock(\n"
              "                Common::ProcessAddress{m_guest_ctx.tpidrro_el0}, diag_tls, sizeof(diag_tls));\n"
              "            const Kernel::Handle diag_candidate = diag_tls_ok ? diag_tls[3] : 0;\n"
              "            auto diag_candidate_object = process->GetHandleTable().GetObjectForIpcWithoutPseudoHandle(\n"
              "                m_system.Kernel(), diag_candidate);\n"
              "            const bool diag_candidate_live = diag_candidate_object.IsNotNull();\n"
              "            LOG_ERROR(Core_ARM,\n"
              "                      \"IMP008_REALGAME_DIAG SVC21_DIRECT_REENTRY_EVENT n={} pc=0x{:016X} tls_ok={} w02=0x{:08X} w03=0x{:08X} live={} x0=0x{:016X}\",\n"
              "                      diag_occurrence, m_guest_ctx.pc, diag_tls_ok, diag_tls[2],\n"
              "                      diag_tls[3], diag_candidate_live, m_guest_ctx.cpu_registers[0]);\n"
              "            if (diag_occurrence == 0 && diag_tls_ok && diag_tls[2] == 0x20 &&\n"
              "                diag_candidate_live) {\n"
              "                m_guest_ctx.cpu_registers[0] = diag_candidate;\n"
              "                diag_force_direct_reentry = true;\n"
              "                diag_force_thread = thread;\n"
              "                LOG_ERROR(Core_ARM,\n"
              "                          \"IMP008_REALGAME_DIAG SVC21_FIRST_SUBSTITUTE old=0x00000020 new=0x{:08X}=LIVE force_direct_next=true\",\n"
              "                          diag_candidate);\n"
              "            }\n"
              "        }\n"
              "\n"
              "        if (m_windows_pending_nce_fault) {\n"
          )
          replace_once("clear", old_clear, new_clear)

          path.write_text(text, encoding="utf-8")

          for marker in [
              "TEB_PREENTRY_BYPASS",
              "POST_SVC_HLE_RETURN",
              "POST_SVC_DIRECT_REENTRY_BEGIN",
              "POST_SVC_DIRECT_REENTRY_RETURN",
              "SVC21_DIRECT_REENTRY_EVENT",
              "SVC21_FIRST_SUBSTITUTE",
          ]:
              if f"IMP008_REALGAME_DIAG {marker}" not in text:
                  raise SystemExit(f"missing marker {marker}")
          if "guest_sp_value >= allocation_end" in text:
              raise SystemExit("old inclusive upper-bound rejection still present")
          if "tib->StackLimit = reinterpret_cast<void*>(allocation_base);" in text:
              raise SystemExit("guest TEB StackLimit overwrite still present")
          if "tib->StackBase = reinterpret_cast<void*>(allocation_end);" in text:
              raise SystemExit("guest TEB StackBase overwrite still present")
          print("NCE_SVC21_POST_SVC_DIRECT_REENTRY_INJECTION=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'post-SVC direct-reentry injection failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          Write-Host 'NCE_SVC21_POST_SVC_DIRECT_REENTRY_PATCH=PASS'

      - name: Checkout fixed dc95-era Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Set up normal Eden CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 GUI build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'IMP008_REALGAME_DIAG POST_SVC_DIRECT_REENTRY_BEGIN' src/core/arm/nce/arm_nce_windows.cpp
          echo 'NCE_SVC21_POST_SVC_DIRECT_REENTRY_CONFIGURE=PASS'

      - name: Build full Windows ARM64 Eden GUI
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe || {
            echo 'GUI executable not found after full build' >&2
            find build -maxdepth 4 -iname '*.exe' -print
            exit 41
          }
          echo 'NCE_SVC21_POST_SVC_DIRECT_REENTRY_BUILD=PASS'

      - name: Package Windows ARM64 Eden
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: nce-svc21-post-svc-direct-reentry-${{ github.sha }}
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          find artifacts -maxdepth 2 -type f -print
          echo 'NCE_SVC21_POST_SVC_DIRECT_REENTRY_PACKAGE=PASS'

      - name: Verify single-file package upload boundary
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path eden/artifacts -File)
          Write-Host "Package files found: $($files.Count)"
          $files | ForEach-Object { Write-Host $_.FullName }
          if ($files.Count -ne 1) { throw "Expected exactly one packaged file; found $($files.Count)" }
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item -LiteralPath $files[0].FullName -Destination upload/ -Force
          $upload = @(Get-ChildItem -Path upload -File)
          if ($upload.Count -ne 1) { throw "Expected exactly one upload file; found $($upload.Count)" }
          Write-Host 'NCE_SVC21_POST_SVC_DIRECT_REENTRY_SINGLE_FILE_UPLOAD_BOUNDARY=PASS'

      - name: Upload Windows ARM64 NCE SVC21 post-SVC direct-reentry validation package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-SVC21-POST-SVC-DIRECT-REENTRY-${{ github.sha }}
          archive: false
          path: upload/*
          if-no-files-found: error
          retention-days: 14
