name: Probe IMP-008E E2 RunThread Private Stack Lease Sticky V5

on:
  workflow_dispatch:
  push:
    branches: [exp/imp-008e-windows-nce-rasterizer-recovery-runtime]
    paths:
      - .github/workflows/probe-imp008e-e2-runthread-private-stack-lease-sticky-v5-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp008e-e2-runthread-private-stack-lease-sticky-v5
  cancel-in-progress: false

jobs:
  e2-runthread-private-stack-lease-sticky-v5:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 8
    steps:
      - name: Execute sticky RunThread lease probe
        shell: powershell
        run: |
          $payload=''
          $script=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload))
          $scriptPath=Join-Path $env:RUNNER_TEMP 'imp008e-sticky-v5.ps1'
          [IO.File]::WriteAllText($scriptPath,$script,[Text.UTF8Encoding]::new($false))
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $scriptPath
          exit $LASTEXITCODE
