name: Build Windows ARM64 NCE CINC X30 Bypass Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/build-windows-arm64-nce-cinc-x30-bypass-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: windows-arm64-nce-cinc-x30-bypass-diagnostic
  cancel-in-progress: false

jobs:
  build-package:
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO
      PROD_SHA: e9665e6457ba163f91a42d804862acac0d486378
      V3_WORKFLOW: .github/workflows/build-windows-arm64-nce-teb-bidirectional-return-validation.yml
      BREADCRUMB_WORKFLOW: .github/workflows/build-windows-arm64-nce-reentry-breadcrumb-diagnostic.yml

    steps:
      - uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Verify diagnostic baseline
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          git cat-file -e "$PROD_SHA^{commit}"
          git diff --quiet "$PROD_SHA" HEAD -- src/common src/core src/video_core CMakeLists.txt
          test -f "$V3_WORKFLOW"
          test -f "$BREADCRUMB_WORKFLOW"
          grep -Fq 'IMP008_REENTRY_BREADCRUMB_PRE' "$BREADCRUMB_WORKFLOW"
          echo 'NCE_CINC_X30_BYPASS_GUARD=PASS'

      - name: Replay validated V3
        shell: pwsh
        working-directory: eden
        run: |
          @'
          from pathlib import Path
          import textwrap
          path = Path(".github/workflows/build-windows-arm64-nce-teb-bidirectional-return-validation.yml")
          text = path.read_text(encoding="utf-8")
          start_marker = "          @'\n"
          end_marker = "\n          '@ | python -"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          exec(compile(textwrap.dedent(text[start:end]), f"<{path}>", "exec"), {})
          print("NCE_CINC_X30_BYPASS_V3_REPLAY=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'validated V3 replay failed' }

      - name: Replay breadcrumb instrumentation
        shell: pwsh
        working-directory: eden
        run: |
          @'
          from pathlib import Path
          import textwrap
          path = Path(".github/workflows/build-windows-arm64-nce-reentry-breadcrumb-diagnostic.yml")
          text = path.read_text(encoding="utf-8")
          section = "      - name: Inject host-stack exception observer and reentry breadcrumbs"
          text = text[text.index(section):]
          start_marker = "          @'\n"
          end_marker = "\n          '@ | python -"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          exec(compile(textwrap.dedent(text[start:end]), "<breadcrumb-injection>", "exec"), {})
          print("NCE_CINC_X30_BYPASS_BREADCRUMB_REPLAY=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'breadcrumb replay failed' }

      - name: Inject svc27 x30 bypass
        shell: pwsh
        working-directory: eden
        run: |
          @'
          from pathlib import Path
          p = Path("src/core/arm/nce/patcher.cpp")
          s = p.read_text(encoding="utf-8")
          old = """    if (is_pre)\n        this->BranchToModulePre(module_dest);\n    else\n        this->BranchToModule(module_dest);\n#else\n"""
          new = """    // Diagnostic-only semantic equivalent for the NCE-DIAG svcOutputDebugString\n    // return stub: module+0x7708 is `ret`, therefore B + RET is equivalent to BR x30.\n    // Bypass only this exact svc/destination pair to isolate the branch/RET boundary.\n    if (svc_id == 0x27U && module_dest == 0x7708U) {\n        cg.dw(0xD61F03C0U); // br x30\n    } else if (is_pre) {\n        this->BranchToModulePre(module_dest);\n    } else {\n        this->BranchToModule(module_dest);\n    }\n#else\n"""
          if s.count(old) != 1:
              raise SystemExit(f"svc branch anchor count={s.count(old)}")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("NCE_CINC_X30_BYPASS_INJECTION=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'x30 bypass injection failed' }
          git diff --check
          grep -Fq 'svc_id == 0x27U && module_dest == 0x7708U' src/core/arm/nce/patcher.cpp
          grep -Fq 'cg.dw(0xD61F03C0U);' src/core/arm/nce/patcher.cpp
          grep -Fq 'IMP008_REENTRY_BREADCRUMB_PRE' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'IMP008_CINC_STACK_LR' src/core/arm/nce/arm_nce_windows.cpp

      - uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed CI scripts
        shell: bash
        run: |
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 GUI build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'cg.dw(0xD61F03C0U);' src/core/arm/nce/patcher.cpp
          echo 'NCE_CINC_X30_BYPASS_CONFIGURE=PASS'

      - name: Build full Windows ARM64 Eden GUI
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          echo 'NCE_CINC_X30_BYPASS_BUILD=PASS'

      - name: Package Windows ARM64 Eden
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: nce-cinc-x30-bypass-${{ github.sha }}
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          echo 'NCE_CINC_X30_BYPASS_PACKAGE=PASS'

      - name: Prepare upload
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path eden/artifacts -File)
          if ($files.Count -ne 1) { throw "Expected one package; found $($files.Count)" }
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item $files[0].FullName upload/ -Force

      - uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-CINC-X30-BYPASS-${{ github.sha }}
          archive: false
          path: upload/*
          retention-days: 14
