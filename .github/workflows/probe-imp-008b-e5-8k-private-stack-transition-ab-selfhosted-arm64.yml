name: Probe IMP-008B E5 8K Detached Private Stack A-B

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-e5-8k-private-stack-transition-ab-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp-008b-e5-8k-private-stack-transition-ab
  cancel-in-progress: false

jobs:
  e5-8k-detached-private-stack:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 60
    steps:
      - name: Restore baseline module geometry and patch only guest stack geometry
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'eden/.git')) { throw 'retained eden checkout missing' }
          $head = (git -C eden rev-parse HEAD).Trim()
          if ($head -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31') { throw "unexpected retained head $head" }

          $runtime = 'eden/src/core/arm/nce/arm_nce_windows.cpp'
          $transition = 'eden/src/core/arm/nce/windows_nce_transition.cpp'
          $probe = 'eden/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp'
          if (-not (Select-String -Path $runtime -SimpleMatch 'IMP008B_E5_AB_HISTORICAL_RUNTHREAD=PASS' -Quiet)) { throw 'RunThread TEB bypass missing' }
          if (-not (Select-String -Path $runtime -SimpleMatch 'IMP008B_E5_GENERIC_VEH_ENTER=PASS' -Quiet)) { throw 'generic VEH observer missing' }
          if (-not (Select-String -Path $runtime -SimpleMatch 'IMP008B_E5_X18_VEH_ENTER=PASS' -Quiet)) { throw 'x18 VEH observer missing' }

          # Undo only the two files changed by the previous invalid 8K harness attempt.
          # Do not touch the retained runtime diagnostics in arm_nce_windows.cpp.
          git -C eden checkout -- 'probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp' 'src/core/arm/nce/windows_nce_transition.cpp'
          if ($LASTEXITCODE -ne 0) { throw 'targeted checkout failed' }
          if (-not (Select-String -Path $probe -SimpleMatch 'constexpr std::size_t InitialImageSize = PageSize * 2;' -Quiet)) { throw 'baseline 2-page image not restored' }
          if (-not (Select-String -Path $probe -SimpleMatch 'data.size = static_cast<u32>(PageSize);' -Quiet)) { throw 'baseline 1-page data segment not restored' }

          $utf8 = New-Object System.Text.UTF8Encoding($false)
          function Replace-Base64([string]$Path, [string]$Old64, [string]$New64, [string]$Name) {
            $text = [IO.File]::ReadAllText($Path).Replace("`r`n", "`n")
            $old = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($Old64))
            $new = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($New64))
            $i = $text.IndexOf($old, [System.StringComparison]::Ordinal)
            if ($i -lt 0) { throw "$Name anchor missing" }
            if ($text.IndexOf($old, $i + $old.Length, [System.StringComparison]::Ordinal) -ge 0) { throw "$Name anchor not unique" }
            $text = $text.Substring(0, $i) + $new + $text.Substring($i + $old.Length)
            [IO.File]::WriteAllText($Path, $text, $utf8)
          }

          Replace-Base64 $probe `
            'ICAgIGNvbnN0IHU2NCBndWVzdF9zcCA9IGxvYWRfYmFzZV91NjQgKyBJbml0aWFsSW1hZ2VTaXplIC0gMHgyMDsK' `
            '' `
            'detached 8K guest stack'

          Replace-Base64 $transition `
            '' `
            '' `
            'publish detached 8K stack'

          git -C eden diff --check -- 'probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp' 'src/core/arm/nce/windows_nce_transition.cpp'
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          if (-not (Select-String -Path $probe -SimpleMatch 'IMP008B_E5_8K_GUEST_STACK=PASS' -Quiet)) { throw 'probe stack patch missing' }
          if (-not (Select-String -Path $transition -SimpleMatch 'IMP008B_E5_8K_STACK_READY=PASS' -Quiet)) { throw 'transition stack patch missing' }
          Write-Host 'IMP008B_E5_8K_DETACHED_PATCH=PASS'

      - name: Set up CLANGARM64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          cache: false
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p
            toolchain:p clang:p python-pip:p lld:p openssl:p boost:p fmt:p lz4:p
            nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p
            glslang:p enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p
            xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p libwebp:p
            libtiff:p brotli:p

      - name: Rebuild E5 target incrementally
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build --target imp008b_e5_x18_runtime --parallel
          test -f build/bin/imp008b_e5_x18_runtime.exe
          echo 'IMP008B_E5_8K_DETACHED_BUILD=PASS'

      - name: Launch E5 with detached 8K private guest stack
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -uo pipefail
          set +e
          timeout 30s build/bin/imp008b_e5_x18_runtime.exe > imp008b-e5-8k-detached.out.log 2> imp008b-e5-8k-detached.err.log
          rc=$?
          set -e
          printf '%s\n' "$rc" > imp008b-e5-8k-detached.rc
          cat imp008b-e5-8k-detached.out.log imp008b-e5-8k-detached.err.log > imp008b-e5-8k-detached.log 2>/dev/null || true
          cat imp008b-e5-8k-detached.log || true
          echo "IMP008B_E5_8K_DETACHED_RC=$rc"

      - name: Classify E5 8K stack boundary
        if: always()
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'imp008b-e5-8k-detached.log')) { throw 'runtime log missing' }
          Get-Content 'imp008b-e5-8k-detached.log' | Select-String -Pattern 'IMP008B_E5_(8K_|GENERIC_VEH_|X18_VEH_|X18_TRYREDIRECT|RUNTHREAD_RETURNED|GUEST_X18_EXECUTED|SVC_RETURN|ARCH_CONTEXT|HALT_REASON|SVC_NUMBER|RETURN_CONTEXT|GATE)|IMP008B_E2_RESTORE_CONTEXT|IMP008B_E2_BEFORE_NT_CONTINUE'

          $ready = Select-String -Path 'imp008b-e5-8k-detached.log' -SimpleMatch 'IMP008B_E5_8K_STACK_READY=PASS' -Quiet
          $generic = Select-String -Path 'imp008b-e5-8k-detached.log' -SimpleMatch 'IMP008B_E5_GENERIC_VEH_ENTER=PASS' -Quiet
          $x18 = Select-String -Path 'imp008b-e5-8k-detached.log' -SimpleMatch 'IMP008B_E5_X18_VEH_ENTER=PASS' -Quiet
          $fallback = Select-String -Path 'imp008b-e5-8k-detached.log' -Pattern 'IMP008B_E5_X18_TRYREDIRECT.*PASS' -Quiet
          $secondRestore = Select-String -Path 'imp008b-e5-8k-detached.log' -Pattern 'IMP008B_E2_RESTORE_CONTEXT PC=0x[0-9A-Fa-f]*28 ' -Quiet
          $returned = Select-String -Path 'imp008b-e5-8k-detached.log' -SimpleMatch 'IMP008B_E5_RUNTHREAD_RETURNED=PASS' -Quiet
          $svc = Select-String -Path 'imp008b-e5-8k-detached.log' -SimpleMatch 'IMP008B_E5_SVC_NUMBER_RAW=0x00000055' -Quiet
          $x18result = Select-String -Path 'imp008b-e5-8k-detached.log' -SimpleMatch 'IMP008B_E5_GUEST_X18_EXECUTED=PASS' -Quiet
          $gate = Select-String -Path 'imp008b-e5-8k-detached.log' -SimpleMatch 'IMP008B_E5_GATE=PASS' -Quiet

          Write-Host ('IMP008B_E5_8K_READY=' + $(if ($ready) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_GENERIC_VEH=' + $(if ($generic) {'PASS'} else {'NO_ENTRY'}))
          Write-Host ('IMP008B_E5_8K_X18_VEH=' + $(if ($x18) {'PASS'} else {'NO_ENTRY'}))
          Write-Host ('IMP008B_E5_8K_FALLBACK=' + $(if ($fallback) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_SECOND_RESTORE=' + $(if ($secondRestore) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_RUNTHREAD_RETURNED=' + $(if ($returned) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_SVC55=' + $(if ($svc) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_X18_RESULT=' + $(if ($x18result) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_GATE=' + $(if ($gate) {'PASS'} else {'NO'}))

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-8k-detached-private-stack-ab
          path: |
            eden/imp008b-e5-8k-detached.log
            eden/imp008b-e5-8k-detached.out.log
            eden/imp008b-e5-8k-detached.err.log
            eden/imp008b-e5-8k-detached.rc
          if-no-files-found: warn
