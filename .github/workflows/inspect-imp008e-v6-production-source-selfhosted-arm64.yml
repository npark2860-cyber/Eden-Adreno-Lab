name: Inspect IMP-008E Generic Transition Source

on:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/inspect-imp008e-v6-production-source-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: inspect-imp008e-generic-transition-source
  cancel-in-progress: false

jobs:
  inspect-generic-transition-source:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 5
    steps:
      - name: Print retained generic transition PASS source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='eden/build/generic_stacktop_ab/windows_nce_transition.cpp'
          if(-not(Test-Path $src)){throw 'retained generic transition PASS source missing'}
          Write-Host 'IMP008E_GENERIC_TRANSITION_SOURCE_BEGIN'
          Get-Content $src
          Write-Host 'IMP008E_GENERIC_TRANSITION_SOURCE_END'
