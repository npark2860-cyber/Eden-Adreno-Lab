name: Inspect IMP-008E V6 Production Source

on:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/inspect-imp008e-v6-production-source-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: inspect-imp008e-v6-production-source
  cancel-in-progress: false

jobs:
  inspect-v6-source:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 5
    steps:
      - name: Print retained V6 PASS source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='eden/build/e2_runthread_private_stack_lease_scope_v6/arm_nce_windows.cpp'
          if(-not(Test-Path $src)){throw 'retained V6 PASS source missing'}
          Write-Host 'IMP008E_V6_SOURCE_BEGIN'
          Get-Content $src
          Write-Host 'IMP008E_V6_SOURCE_END'
