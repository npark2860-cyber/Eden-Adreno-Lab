name: Probe IMP-008E E2 Large Stack Native Exit

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008e-e2-large-stack-native-exit.yml

permissions:
  actions: read
  contents: read

jobs:
  verify-native-exit:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 10
    steps:
      - name: Download exact large-stack artifact
        uses: actions/download-artifact@v5
        with:
          name: imp008e-e2-large-stack-83df18fc30745d39d54a77e6d999ea4701af5ac8
          path: e2
          repository: npark2860-cyber/Eden-Adreno-Lab
          run-id: 34424240842
          github-token: ${{ github.token }}

      - name: Verify artifact boundary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'ARM64') { throw 'Physical ARM64 runner boundary mismatch' }
          $exe = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e_e2_rasterizer_cached_retry.exe' | Select-Object -First 1
          $shaFile = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e-e2.source-sha.txt' | Select-Object -First 1
          if ($null -eq $exe -or $null -eq $shaFile) { throw 'Artifact incomplete' }
          $sourceSha = [System.IO.File]::ReadAllText($shaFile.FullName).Trim()
          if ($sourceSha -ne '83df18fc30745d39d54a77e6d999ea4701af5ac8') { throw "Artifact source SHA mismatch: $sourceSha" }
          Write-Host "IMP008E_E2_NATIVEEXIT_RUNNER=$env:RUNNER_NAME"
          Write-Host "IMP008E_E2_NATIVEEXIT_EXE_SHA256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          Write-Host 'IMP008E_E2_NATIVEEXIT_ARTIFACT_BOUNDARY=PASS'

      - name: Run exact artifact with native exit capture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e_e2_rasterizer_cached_retry.exe' | Select-Object -First 1
          Add-Type -Language CSharp -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class NativeExitCapture {
              const uint WAIT_OBJECT_0 = 0x00000000;
              const uint WAIT_TIMEOUT = 0x00000102;
              [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)]
              struct STARTUPINFO {
                  public uint cb; public string lpReserved, lpDesktop, lpTitle;
                  public uint dwX, dwY, dwXSize, dwYSize, dwXCountChars, dwYCountChars, dwFillAttribute, dwFlags;
                  public ushort wShowWindow, cbReserved2;
                  public IntPtr lpReserved2, hStdInput, hStdOutput, hStdError;
              }
              [StructLayout(LayoutKind.Sequential)]
              struct PROCESS_INFORMATION { public IntPtr hProcess, hThread; public uint dwProcessId, dwThreadId; }
              [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
              static extern bool CreateProcessW(string app, StringBuilder cmd, IntPtr pa, IntPtr ta, bool inherit, uint flags, IntPtr env, string cwd, ref STARTUPINFO si, out PROCESS_INFORMATION pi);
              [DllImport("kernel32.dll", SetLastError=true)] static extern uint WaitForSingleObject(IntPtr h, uint ms);
              [DllImport("kernel32.dll", SetLastError=true)] static extern bool GetExitCodeProcess(IntPtr h, out uint code);
              [DllImport("kernel32.dll", SetLastError=true)] static extern bool TerminateProcess(IntPtr h, uint code);
              [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr h);
              public static uint Run(string exe) {
                  STARTUPINFO si = new STARTUPINFO(); si.cb = (uint)Marshal.SizeOf(typeof(STARTUPINFO));
                  PROCESS_INFORMATION pi;
                  var cmd = new StringBuilder("\"" + exe + "\"");
                  if (!CreateProcessW(exe, cmd, IntPtr.Zero, IntPtr.Zero, false, 0, IntPtr.Zero, System.IO.Path.GetDirectoryName(exe), ref si, out pi))
                      throw new Win32Exception(Marshal.GetLastWin32Error());
                  try {
                      uint w = WaitForSingleObject(pi.hProcess, 300000);
                      if (w == WAIT_TIMEOUT) { TerminateProcess(pi.hProcess, 124); return 0x0000007C; }
                      if (w != WAIT_OBJECT_0) throw new Win32Exception(Marshal.GetLastWin32Error());
                      uint code;
                      if (!GetExitCodeProcess(pi.hProcess, out code)) throw new Win32Exception(Marshal.GetLastWin32Error());
                      return code;
                  } finally {
                      if (pi.hThread != IntPtr.Zero) CloseHandle(pi.hThread);
                      if (pi.hProcess != IntPtr.Zero) CloseHandle(pi.hProcess);
                  }
              }
          }
          '@
          $code = [NativeExitCapture]::Run($exe.FullName)
          $signed = [BitConverter]::ToInt32([BitConverter]::GetBytes([uint32]$code), 0)
          Write-Host ('IMP008E_E2_NATIVEEXIT_HEX=0x{0:X8}' -f [uint32]$code)
          Write-Host "IMP008E_E2_NATIVEEXIT_SIGNED=$signed"
          if ([uint32]$code -eq 0) { Write-Host 'IMP008E_E2_NATIVEEXIT_CLASSIFICATION=EXIT_ZERO_GATE_INCOMPLETE' }
          elseif ([uint32]$code -eq 0xC00000FD) { Write-Host 'IMP008E_E2_NATIVEEXIT_CLASSIFICATION=STACK_OVERFLOW_CONFIRMED' }
          else { Write-Host ('IMP008E_E2_NATIVEEXIT_CLASSIFICATION=NONZERO_0x{0:X8}' -f [uint32]$code) }
