name: Probe IMP-008B E5 Mixed TEB Limit A/B V2

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-e5-mixed-teb-limit-ab-v2-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp-008b-e5-mixed-teb-limit-ab-v2
  cancel-in-progress: false

jobs:
  e5-mixed-teb-limit-ab-v2:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 15
    steps:
      - name: Run mixed TEB StackLimit A/B once
        shell: powershell
        run: |
          $script=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          Invoke-Expression $script

      - name: Upload mixed TEB V2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-mixed-teb-limit-ab-v2
          path: |
            imp008b-e5-mixed-teb-v2-commands.txt
            imp008b-e5-mixed-teb-v2-link.log
            imp008b-e5-mixed-teb-v2.log
            imp008b-e5-mixed-teb-v2.out.log
            imp008b-e5-mixed-teb-v2.err.log
            imp008b-e5-mixed-teb-v2.rc
          if-no-files-found: warn
