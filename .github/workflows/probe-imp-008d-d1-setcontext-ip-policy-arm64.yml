name: Probe IMP-008D D1 SetContext IP Validation Policy

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008d-windows-nce-data-fault-runtime
    paths:
      - '.github/workflows/probe-imp-008d-d1-setcontext-ip-policy-arm64.yml'

permissions:
  contents: read

jobs:
  d1-setcontext-ip-policy-runtime:
    runs-on: windows-11-arm
    timeout-minutes: 120

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout IMP-008D branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Checkout fixed dc95-era Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Add D1 target to checkout only
        shell: bash
        working-directory: eden
        run: |
          cat >> src/yuzu_cmd/CMakeLists.txt <<'CMAKE'

          file(WRITE "${CMAKE_BINARY_DIR}/imp008d_d1_vma.cpp"
              "#define VMA_IMPLEMENTATION\n#include \"video_core/vulkan_common/vma.h\"\n")
          add_executable(imp008d_d1_data_fault_skip
              ${CMAKE_SOURCE_DIR}/probes/windows-arm64-nce-fault-d1/data_fault_skip_runtime.cpp
              ${CMAKE_BINARY_DIR}/imp008d_d1_vma.cpp)
          target_include_directories(imp008d_d1_data_fault_skip PRIVATE ${CMAKE_SOURCE_DIR}/src)
          target_link_libraries(imp008d_d1_data_fault_skip PRIVATE
              common core input_common frontend_common video_core merry::oaknut)
          target_link_libraries(imp008d_d1_data_fault_skip PRIVATE ${PLATFORM_LIBRARIES} Threads::Threads)
          CMAKE
          echo 'IMP008D_D1_TARGET_WIRING=PASS'

      - name: Set up normal Eden CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure normal Windows ARM64 product build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'arm_nce_windows.cpp' build/compile_commands.json
          echo 'IMP008D_D1_NORMAL_CONFIGURE=PASS'

      - name: Build D1 diagnostic executable
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build --target imp008d_d1_data_fault_skip --parallel > imp008d-d1-build.log 2>&1
          cat imp008d-d1-build.log
          echo 'IMP008D_D1_BUILD=PASS'

      - name: Build checkout-only SetContext IP policy observer
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cat > imp008d-d1-setcontext-policy-observer.cpp <<'CPP'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>

          #include <cstdint>
          #include <cstdio>
          #include <string>
          #include <vector>

          namespace {

          std::wstring ReadEnv(const wchar_t* name) {
              const DWORD size = GetEnvironmentVariableW(name, nullptr, 0);
              if (size == 0) {
                  return {};
              }
              std::vector<wchar_t> buffer(size);
              if (GetEnvironmentVariableW(name, buffer.data(), size) == 0) {
                  return {};
              }
              return std::wstring(buffer.data());
          }

          } // namespace

          int wmain() {
              const std::wstring target = ReadEnv(L"D1_TARGET_WIN");
              const std::wstring workdir = ReadEnv(L"D1_WORKDIR_WIN");
              if (target.empty() || workdir.empty()) {
                  return 70;
              }

              FILE* log = std::fopen("imp008d-d1-setcontext-policy.log", "wb");
              if (log == nullptr) {
                  return 71;
              }

              std::wstring command = L"\"" + target + L"\"";
              std::vector<wchar_t> command_line(command.begin(), command.end());
              command_line.push_back(L'\0');

              STARTUPINFOW startup{};
              startup.cb = sizeof(startup);
              PROCESS_INFORMATION process{};
              if (!CreateProcessW(target.c_str(), command_line.data(), nullptr, nullptr, TRUE,
                                  CREATE_SUSPENDED, nullptr, workdir.c_str(), &startup, &process)) {
                  std::fprintf(log, "IMP008D_D1_SETCONTEXT_CREATE_PROCESS=FAIL ERROR=%lu\n",
                               static_cast<unsigned long>(GetLastError()));
                  std::fclose(log);
                  return 72;
              }

              struct ShadowPolicyRaw {
                  DWORD Flags;
              } policy{};
              constexpr auto ProcessUserShadowStackPolicyRaw =
                  static_cast<PROCESS_MITIGATION_POLICY>(15);
              const BOOL policy_ok = GetProcessMitigationPolicy(
                  process.hProcess, ProcessUserShadowStackPolicyRaw, &policy, sizeof(policy));

              if (policy_ok) {
                  const unsigned enable_shadow = (policy.Flags >> 0) & 1U;
                  const unsigned audit_shadow = (policy.Flags >> 1) & 1U;
                  const unsigned setcontext_ip = (policy.Flags >> 2) & 1U;
                  const unsigned audit_setcontext_ip = (policy.Flags >> 3) & 1U;
                  const unsigned strict_shadow = (policy.Flags >> 4) & 1U;
                  const unsigned block_non_cet = (policy.Flags >> 5) & 1U;
                  const unsigned block_non_ehcont = (policy.Flags >> 6) & 1U;
                  const unsigned audit_block = (policy.Flags >> 7) & 1U;
                  const unsigned dynamic_apis_oop = (policy.Flags >> 8) & 1U;
                  const unsigned relaxed = (policy.Flags >> 9) & 1U;
                  std::fprintf(log,
                               "IMP008D_D1_SETCONTEXT_POLICY_QUERY=PASS FLAGS=0x%08lX "
                               "SHADOW=%u AUDIT_SHADOW=%u SETCONTEXT_IP=%u AUDIT_SETCONTEXT_IP=%u "
                               "STRICT=%u BLOCK_NON_CET=%u BLOCK_NON_EHCONT=%u AUDIT_BLOCK=%u "
                               "DYNAMIC_APIS_OOP=%u RELAXED=%u\n",
                               static_cast<unsigned long>(policy.Flags), enable_shadow, audit_shadow,
                               setcontext_ip, audit_setcontext_ip, strict_shadow, block_non_cet,
                               block_non_ehcont, audit_block, dynamic_apis_oop, relaxed);
              } else {
                  std::fprintf(log, "IMP008D_D1_SETCONTEXT_POLICY_QUERY=FAIL ERROR=%lu\n",
                               static_cast<unsigned long>(GetLastError()));
              }
              std::fflush(log);

              if (ResumeThread(process.hThread) == static_cast<DWORD>(-1)) {
                  std::fprintf(log, "IMP008D_D1_SETCONTEXT_RESUME=FAIL ERROR=%lu\n",
                               static_cast<unsigned long>(GetLastError()));
                  TerminateProcess(process.hProcess, 73);
                  CloseHandle(process.hThread);
                  CloseHandle(process.hProcess);
                  std::fclose(log);
                  return 73;
              }

              WaitForSingleObject(process.hProcess, INFINITE);
              DWORD exit_code{};
              if (!GetExitCodeProcess(process.hProcess, &exit_code)) {
                  std::fprintf(log, "IMP008D_D1_SETCONTEXT_EXIT_QUERY=FAIL ERROR=%lu\n",
                               static_cast<unsigned long>(GetLastError()));
                  CloseHandle(process.hThread);
                  CloseHandle(process.hProcess);
                  std::fclose(log);
                  return 74;
              }

              std::fprintf(log, "IMP008D_D1_SETCONTEXT_TARGET_EXIT=0x%08lX\n",
                           static_cast<unsigned long>(exit_code));
              std::fprintf(log, "IMP008D_D1_SETCONTEXT_OBSERVER_DONE=PASS\n");
              std::fflush(log);
              CloseHandle(process.hThread);
              CloseHandle(process.hProcess);
              std::fclose(log);
              return policy_ok ? 0 : 75;
          }
          CPP
          clang++ -std=c++20 -O2 -Wall -Wextra -municode imp008d-d1-setcontext-policy-observer.cpp \
            -o imp008d-d1-setcontext-policy-observer.exe
          test -f imp008d-d1-setcontext-policy-observer.exe
          echo 'IMP008D_D1_SETCONTEXT_POLICY_OBSERVER_BUILD=PASS'

      - name: Run D1 under SetContext IP policy observer
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          exe="$(find build -type f -name 'imp008d_d1_data_fault_skip.exe' -print -quit)"
          test -n "$exe"
          export D1_TARGET_WIN="$(cygpath -aw "$exe")"
          export D1_WORKDIR_WIN="$(cygpath -aw .)"
          set +e
          ./imp008d-d1-setcontext-policy-observer.exe > imp008d-d1.out.log 2> imp008d-d1.err.log
          observer_rc=$?
          set -e
          printf '%s\n' "$observer_rc" > imp008d-d1-setcontext-policy-observer.rc
          cat imp008d-d1.out.log || true
          cat imp008d-d1.err.log >&2 || true
          cat imp008d-d1-setcontext-policy.log || true
          echo "IMP008D_D1_SETCONTEXT_POLICY_OBSERVER_EXIT=$observer_rc"
          test "$observer_rc" -eq 0
          echo 'IMP008D_D1_SETCONTEXT_POLICY_RUNTIME_CAPTURE=PASS'

      - name: Classify D1 SetContext IP policy
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          grep -Fq 'IMP008D_D1_SETCONTEXT_POLICY_QUERY=PASS' imp008d-d1-setcontext-policy.log
          line="$(grep -F 'IMP008D_D1_SETCONTEXT_POLICY_QUERY=PASS' imp008d-d1-setcontext-policy.log | tail -n 1)"
          exit_line="$(grep -F 'IMP008D_D1_SETCONTEXT_TARGET_EXIT=' imp008d-d1-setcontext-policy.log | tail -n 1)"
          echo "$line"
          echo "$exit_line"
          if printf '%s\n' "$line" | grep -Fq 'SETCONTEXT_IP=1'; then
            echo 'IMP008D_D1_SETCONTEXT_POLICY_CLASSIFICATION=IP_VALIDATION_ENABLED'
          else
            echo 'IMP008D_D1_SETCONTEXT_POLICY_CLASSIFICATION=IP_VALIDATION_DISABLED'
          fi
          if printf '%s\n' "$exit_line" | grep -Fq '0xC0000409'; then
            echo 'IMP008D_D1_SETCONTEXT_POLICY_EXIT=INVALID_SET_CONTEXT_PERSISTS'
          else
            echo 'IMP008D_D1_SETCONTEXT_POLICY_EXIT=CHANGED'
          fi
          exit 1

      - name: Persist D1 SetContext IP policy logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imp008d-d1-setcontext-ip-policy-${{ github.run_id }}
          path: |
            eden/imp008d-d1-build.log
            eden/imp008d-d1.out.log
            eden/imp008d-d1.err.log
            eden/imp008d-d1-setcontext-policy.log
            eden/imp008d-d1-setcontext-policy-observer.rc
            eden/imp008d-d1-first-exception.bin
          if-no-files-found: warn
