name: Trigger X1 Buffer Category Once

on:
  push:
    branches:
      - exp/x1-buffer-category-correlation
    paths:
      - .github/workflows/trigger-buffer-category-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.head_commit.message == 'ci: trigger one authorized X1 buffer-category ARM64 build'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch manual ARM64 workflow once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-dc95-x1-full-flow.yml/dispatches \
            -d '{"ref":"exp/x1-buffer-category-correlation"}'
