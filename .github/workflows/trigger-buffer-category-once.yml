name: Trigger X1 Buffer Category Once

on:
  push:
    branches:
      - exp/x1-buffer-category-correlation
    paths:
      - .github/workflows/trigger-buffer-category-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch manual ARM64 workflow once
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-dc95-x1-full-flow.yml',
              ref: 'exp/x1-buffer-category-correlation'
            })
