name: Probe Self-Hosted Clean Control Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-self-hosted-clean-control-runtime.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: probe-self-hosted-clean-control-runtime
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 10

    steps:
      - name: Download validated CLEAN CONTROL Eden package
        uses: actions/download-artifact@v7
        with:
          name: Eden-Windows-nce-cinc-x18-veh-clean-control-01631df046d8c2b920c642a48261a8d430140392-arm64-clang-standard.zip
          path: runtime/eden
          github-token: ${{ github.token }}
          repository: npark2860-cyber/Eden-Adreno-Lab
          run-id: 34760701668

      - name: Download validated NCE-DIAG executables
        uses: actions/download-artifact@v7
        with:
          name: NCE-DIAG-0.2.1-executables
          path: runtime/nce-diag
          github-token: ${{ github.token }}
          repository: npark2860-cyber/NCE-DIAG
          run-id: 34704427664

      - name: Run CLEAN CONTROL CINC headless
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'runtime-output'
          New-Item -ItemType Directory -Force $outDir | Out-Null

          $eden = Join-Path $env:GITHUB_WORKSPACE 'runtime/eden/eden-cli.exe'
          $cinc = Join-Path $env:GITHUB_WORKSPACE 'runtime/nce-diag/NCE-DIAG-CINC.nro'
          if (-not (Test-Path $eden -PathType Leaf)) { throw "missing eden CLI: $eden" }
          if (-not (Test-Path $cinc -PathType Leaf)) { throw "missing CINC NRO: $cinc" }

          $stdout = Join-Path $outDir 'eden-cli.stdout.txt'
          $stderr = Join-Path $outDir 'eden-cli.stderr.txt'
          $status = Join-Path $outDir 'runtime-status.txt'
          $logDelta = Join-Path $outDir 'eden_log_delta.txt'
          $logPath = Join-Path $env:APPDATA 'eden/log/eden_log.txt'

          $beforeExists = Test-Path $logPath -PathType Leaf
          $beforeLength = if ($beforeExists) { (Get-Item $logPath).Length } else { 0 }
          $beforeWrite = if ($beforeExists) { (Get-Item $logPath).LastWriteTimeUtc } else { [DateTime]::MinValue }

          $p = Start-Process -FilePath $eden -ArgumentList @('--null-render', $cinc) `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru

          $finished = $p.WaitForExit(30000)
          if (-not $finished) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $p.WaitForExit()
          } else {
            $p.WaitForExit()
          }
          $p.Refresh()
          $exitCode = try { $p.ExitCode } catch { 'UNAVAILABLE' }

          $afterExists = Test-Path $logPath -PathType Leaf
          $afterLength = if ($afterExists) { (Get-Item $logPath).Length } else { 0 }
          $afterWrite = if ($afterExists) { (Get-Item $logPath).LastWriteTimeUtc } else { [DateTime]::MinValue }

          if ($afterExists -and $afterWrite -gt $beforeWrite) {
            $bytes = [System.IO.File]::ReadAllBytes($logPath)
            if ($beforeExists -and $afterLength -ge $beforeLength -and $beforeLength -lt $bytes.Length) {
              $start = [int64]$beforeLength
              $count = [int64]$bytes.Length - $start
              $slice = New-Object byte[] $count
              [Array]::Copy($bytes, $start, $slice, 0, $count)
              [System.IO.File]::WriteAllBytes($logDelta, $slice)
            } else {
              [System.IO.File]::WriteAllBytes($logDelta, $bytes)
            }
          } else {
            Set-Content $logDelta 'NO_NEW_EDEN_LOG_DATA'
          }

          $logText = Get-Content $logDelta -Raw -ErrorAction SilentlyContinue
          $metadata = $null -ne $logText -and $logText.Contains('IMP008_CINC_X18_METADATA')
          $caller = $null -ne $logText -and $logText.Contains('IMP008_CINC_CALLER_ARG_SETUP_APPLIED')
          $fallbackPre = $null -ne $logText -and $logText.Contains('IMP008_X18_FALLBACK_PRE')
          $fallbackPost = $null -ne $logText -and $logText.Contains('IMP008_X18_FALLBACK_POST')
          $cascade = $null -ne $logText -and $logText.Contains('4001000A')

          @(
            'BASELINE=CINC_X18_VEH_CLEAN_CONTROL',
            'CLEAN_CONTROL_RUN=34760701668',
            'CLEAN_CONTROL_HEAD=01631df046d8c2b920c642a48261a8d430140392',
            'NCE_DIAG_RUN=34704427664',
            'NCE_DIAG_HEAD=f3b1dfb469fe50ddd5abbbb9b4405148a64c5f84',
            "FINISHED_WITHIN_30S=$finished",
            "EXIT_CODE=$exitCode",
            "LOG_EXISTED_BEFORE=$beforeExists",
            "LOG_EXISTS_AFTER=$afterExists",
            "LOG_LENGTH_BEFORE=$beforeLength",
            "LOG_LENGTH_AFTER=$afterLength",
            "METADATA=$metadata",
            "CALLER_SETUP=$caller",
            "FALLBACK_PRE=$fallbackPre",
            "FALLBACK_POST=$fallbackPost",
            "CASCADE_4001000A=$cascade",
            "LOG_PATH=$logPath"
          ) | Set-Content $status

          Get-Content $status
          Write-Output '--- STDOUT ---'
          Get-Content $stdout -ErrorAction SilentlyContinue | Select-Object -Last 80
          Write-Output '--- STDERR ---'
          Get-Content $stderr -ErrorAction SilentlyContinue | Select-Object -Last 80
          Write-Output '--- EDEN LOG DELTA ---'
          Get-Content $logDelta -ErrorAction SilentlyContinue | Select-Object -Last 120

      - name: Upload CLEAN CONTROL runtime observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SELF-HOSTED-CLEAN-CONTROL-RUNTIME
          path: runtime-output/*
          if-no-files-found: warn
          retention-days: 14
