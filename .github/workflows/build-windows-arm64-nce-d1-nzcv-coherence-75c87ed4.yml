name: Build Windows ARM64 NCE D1 NZCV coherence 75c87ed4

on:
  push:
    branches:
      - fix/windows-nce-d1-nzcv-coherence-75c87ed4
    paths:
      - .github/diagnostics/d1-nzcv-coherence-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-d1-nzcv-coherence-75c87ed4
  cancel-in-progress: false

env:
  BASE_SHA: 75c87ed4507a0fe6f1a89912a5353c3a5c03f3ba
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: d1-nzcv-coherence

jobs:
  validate-build-package:
    name: Windows ARM64 NCE D1 NZCV coherence
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact D1 Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/d1-nzcv-coherence/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact D1 single-variable scope
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$SOURCE" merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=no)"
          git -C "$SOURCE" diff --check "$BASE_SHA" "$GITHUB_SHA"

          CHANGED="$(git -C "$SOURCE" diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(src/core/arm/nce/patcher\.cpp|src/core/arm/nce/arm_nce_windows\.cpp|probes/windows-arm64-nce-d1-nzcv/svc_nzcv_roundtrip\.cpp|\.github/workflows/build-windows-arm64-nce-d1-nzcv-coherence-75c87ed4\.yml|\.github/diagnostics/d1-nzcv-coherence-trigger\.txt)$' || true)"
          test -z "$UNEXPECTED"

          # Read validation source directly from the exact Git object, never from an assumed branch tip.
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/patcher.cpp" | grep -Fq 'Keep the canonical architectural NZCV bits coherent'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/patcher.cpp" | grep -Fq 'cg.STR(W1, X30, offsetof(GuestContext, pstate));'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp" | grep -Fq 'm_guest_ctx.nzcv = ctx.pstate & 0xF0000000U;'
          git -C "$SOURCE" show "$GITHUB_SHA:probes/windows-arm64-nce-d1-nzcv/svc_nzcv_roundtrip.cpp" | grep -Fq 'GuestAddsX0One = 0xB1000400'
          git -C "$SOURCE" show "$GITHUB_SHA:probes/windows-arm64-nce-d1-nzcv/svc_nzcv_roundtrip.cpp" | grep -Fq 'GuestMrsX0Nzcv = 0xD53B4200'
          git -C "$SOURCE" show "$GITHUB_SHA:probes/windows-arm64-nce-d1-nzcv/svc_nzcv_roundtrip.cpp" | grep -Fq 'IMP008_D1_NZCV_REENTRY_COHERENCE=PASS'

          git -C "$SOURCE" diff "$BASE_SHA" "$GITHUB_SHA" -- src/core/arm/nce/patcher.cpp src/core/arm/nce/arm_nce_windows.cpp > "$PROV/D1_NZCV_PRODUCTION.diff"
          git -C "$SOURCE" show "$GITHUB_SHA:probes/windows-arm64-nce-d1-nzcv/svc_nzcv_roundtrip.cpp" > "$PROV/D1_NZCV_PROBE_SOURCE.cpp"
          printf 'BASE_SHA=%s\nD1_SHA=%s\nSOURCE_MODE=exact Git object\nHYPOTHESIS=Windows SVC/scheduler producers must keep GuestContext nzcv and pstate NZCV bits coherent\nREGRESSION=ADDS changes NZCV -> SVC save -> scheduler-visible pstate; host SetContext injects different NZCV -> ordinary x18 fallback -> MRS NZCV must preserve injected value\nISOLATION_DIR=build/validation/%s/%s\n' "$BASE_SHA" "$GITHUB_SHA" "$GITHUB_SHA" "$TEST_NAME" > "$PROV/BUILD_INFO.txt"

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: build/validation/${{ github.sha }}/d1-nzcv-coherence/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Add D1 regression target to isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          cat >> "$SOURCE/src/yuzu_cmd/CMakeLists.txt" <<'CMAKE'

          # D1 NZCV regression executable. Validation-only target added after exact Git-object
          # provenance checks; production source remains the committed Git object.
          file(WRITE "${CMAKE_BINARY_DIR}/imp008_d1_nzcv_vma.cpp"
              "#define VMA_IMPLEMENTATION\n#include \"video_core/vulkan_common/vma.h\"\n")
          add_executable(imp008_d1_nzcv
              ${CMAKE_SOURCE_DIR}/probes/windows-arm64-nce-d1-nzcv/svc_nzcv_roundtrip.cpp
              ${CMAKE_BINARY_DIR}/imp008_d1_nzcv_vma.cpp)
          target_include_directories(imp008_d1_nzcv PRIVATE ${CMAKE_SOURCE_DIR}/src)
          target_link_libraries(imp008_d1_nzcv PRIVATE
              common core input_common frontend_common video_core merry::oaknut)
          target_link_libraries(imp008_d1_nzcv PRIVATE ${PLATFORM_LIBRARIES} Threads::Threads)
          CMAKE
          printf 'VALIDATION_CMAKE_WIRING=src/yuzu_cmd/CMakeLists.txt working-tree append after provenance verification\n' >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: false
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure D1 Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d1-nzcv-coherence/source
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'arm_nce_windows.cpp' build/compile_commands.json
          grep -Fq 'windows-arm64-nce-d1-nzcv/svc_nzcv_roundtrip.cpp' build/compile_commands.json
          printf 'CONFIGURE_COMMAND=./.ci/build/configure.sh -DCCACHE_PATH=sccache\nNCE_COMPILE_GUARD=HAS_NCE=1\n' >> ../provenance/BUILD_INFO.txt

      - name: Build and run D1 NZCV regression
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d1-nzcv-coherence/source
        run: |
          set -euo pipefail
          cmake --build build --target imp008_d1_nzcv --parallel
          exe="$(find build -type f -name 'imp008_d1_nzcv.exe' -print -quit)"
          test -n "$exe"
          winexe="$(cygpath -w "$exe")"
          winout="$(cygpath -w ../d1-nzcv.out.log)"
          winerr="$(cygpath -w ../d1-nzcv.err.log)"
          export D1_EXE="$winexe"
          export D1_OUT="$winout"
          export D1_ERR="$winerr"
          set +e
          powershell.exe -NoProfile -NonInteractive -Command '$ErrorActionPreference = "Stop"; $p = Start-Process -FilePath $env:D1_EXE -NoNewWindow -Wait -PassThru -RedirectStandardOutput $env:D1_OUT -RedirectStandardError $env:D1_ERR; Write-Host ("IMP008_D1_NZCV_PROCESS_EXIT=" + $p.ExitCode); exit $p.ExitCode'
          rc=$?
          set -e
          cat ../d1-nzcv.out.log 2>/dev/null || true
          cat ../d1-nzcv.err.log >&2 2>/dev/null || true
          test "$rc" -eq 0
          grep -Fq 'IMP008_D1_NZCV_SVC_SAVE_COHERENCE=PASS' ../d1-nzcv.out.log
          grep -Fq 'IMP008_D1_NZCV_SCHEDULER_INPUT=PASS' ../d1-nzcv.out.log
          grep -Fq 'IMP008_D1_NZCV_X18_FALLBACK_PRESERVED=PASS' ../d1-nzcv.out.log
          grep -Fq 'IMP008_D1_NZCV_REENTRY_COHERENCE=PASS' ../d1-nzcv.out.log
          grep -Fq 'IMP008_D1_NZCV_GATE=PASS' ../d1-nzcv.out.log
          cp ../d1-nzcv.out.log ../provenance/
          cp ../d1-nzcv.err.log ../provenance/
          printf 'D1_NZCV_REGRESSION=PASS\n' >> ../provenance/BUILD_INFO.txt

      - name: Build full Windows ARM64 Eden after D1 regression
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d1-nzcv-coherence/source
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          printf 'FULL_BUILD_COMMAND=cmake --build build\n' >> ../provenance/BUILD_INFO.txt

      - name: Package Windows ARM64 Eden D1
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d1-nzcv-coherence/source
        env:
          ARTIFACT_REF: nce-d1-nzcv-coherence-75c87ed4
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          printf 'PACKAGE_COMMAND=./.ci/package/windows.sh\nARTIFACT_REF=nce-d1-nzcv-coherence-75c87ed4\n' >> ../provenance/BUILD_INFO.txt

      - name: Prepare D1 upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged Eden artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash
          "PACKAGE_FILE=$($files[0].Name)" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          "PACKAGE_SHA256=$hash" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')

      - name: Upload D1 validated package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-D1-NZCV-COHERENCE-75c87ed4
          path: build/validation/${{ github.sha }}/d1-nzcv-coherence/upload/*
          if-no-files-found: error
          retention-days: 14
