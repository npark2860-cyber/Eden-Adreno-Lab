name: Probe IMP-002 CurrentNceContext ARM64

on:
  push:
    branches:
      - exp/imp-002-current-nce-context
    paths:
      - src/core/arm/nce/current_nce_context.h
      - src/core/arm/nce/arm_nce.cpp
      - .github/workflows/probe-imp-002-current-nce-context-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-current-nce-context:
    runs-on: windows-11-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CLANGARM64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          pacboy: >-
            clang:p boost:p fmt:p unordered_dense:p

      - name: Compile actual Eden CurrentNceContext header
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cat > imp002_probe.cpp <<'EOF'
          #include "core/arm/nce/current_nce_context.h"
          int main() {
              using Carrier = Core::NCE::CurrentNceContext;
              Carrier::Install(nullptr);
              if (Carrier::Get() != nullptr) return 1;
              Carrier::Clear();
              return Carrier::Get() == nullptr ? 0 : 2;
          }
          EOF
          clang++ \
            -std=c++20 \
            -Wall -Wextra \
            -D_WIN32 -D_WIN64 -DARCHITECTURE_arm64 \
            -Isrc \
            -c imp002_probe.cpp \
            -o imp002_probe.o
          test -s imp002_probe.o
          echo "CURRENT_NCE_CONTEXT_COMPILE=PASS"
