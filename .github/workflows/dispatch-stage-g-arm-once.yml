name: Dispatch Stage G ARM Once

on:
  push:
    branches:
      - tmp/stage-g-arm-dispatch-20260829
    paths:
      - .github/workflows/dispatch-stage-g-arm-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch persistent Stage G ARM workflow exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            repos/npark2860-cyber/Eden-Adreno-Lab/actions/workflows/build-dc95-x1-address-arbiter-attribution.yml/dispatches \
            -f ref='exp/x1-waker-stage-g-producer-cpu-attribution'
