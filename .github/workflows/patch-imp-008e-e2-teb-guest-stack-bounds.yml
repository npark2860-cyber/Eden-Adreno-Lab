name: Prepare IMP-008E E2 TEB Guest Stack Bounds

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/patch-imp-008e-e2-teb-guest-stack-bounds.yml

permissions:
  contents: write
  actions: write

jobs:
  prepare-teb-stack-bounds:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add only guest TEB stack-bounds probe variable
        shell: python
        run: |
          from pathlib import Path
          import base64

          path = Path('.github/workflows/probe-imp-008e-e2-host-pivot-full-recovery.yml')
          text = path.read_text(encoding='utf-8')
          anchor = '      - name: Route cached AV through host stack checkout only\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'host-pivot step anchor mismatch: {text.count(anchor)}')

          step_b64 = ''
          step = base64.b64decode(step_b64).decode('utf-8')
          text = text.replace(anchor, step + anchor, 1)

          guard_anchor = "          grep -Fq 'IMP008E_E2_CPU_MANAGER_BARRIER_HELD' probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp\n"
          guard_new = guard_anchor + "          grep -Fq 'IMP008E_E2_TEB_GUEST_STACK_BOUNDS=PASS' probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp\n"
          if text.count(guard_anchor) != 1:
              raise SystemExit(f'causal guard anchor mismatch: {text.count(guard_anchor)}')
          text = text.replace(guard_anchor, guard_new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          print('IMP008E_E2_TEB_GUEST_STACK_WORKFLOW_PATCH=PASS')

      - name: Verify one-variable workflow delta
        shell: bash
        run: |
          set -euo pipefail
          git diff -- .github/workflows/probe-imp-008e-e2-host-pivot-full-recovery.yml | tee /tmp/teb-stack.diff
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = '.github/workflows/probe-imp-008e-e2-host-pivot-full-recovery.yml'
          grep -Fq 'Register guest allocation as TEB stack bounds checkout only' /tmp/teb-stack.diff
          grep -Fq 'teb_for_stack->NtTib.StackLimit' /tmp/teb-stack.diff
          grep -Fq 'teb_for_stack->NtTib.StackBase' /tmp/teb-stack.diff
          grep -Fq 'IMP008E_E2_TEB_GUEST_STACK_BOUNDS=PASS' /tmp/teb-stack.diff
          grep -Fq 'IMP008E_E2_TEB_STACK_BOUNDS_RESTORED' /tmp/teb-stack.diff
          ! grep -Fq 'DataPages = 1024' /tmp/teb-stack.diff
          echo 'IMP008E_E2_TEB_GUEST_STACK_WORKFLOW_DELTA=PASS'

      - name: Commit diagnostic workflow delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/probe-imp-008e-e2-host-pivot-full-recovery.yml
          git commit -m 'IMP-008E: register guest stack bounds in TEB probe'
          echo "IMP008E_E2_TEB_GUEST_STACK_HEAD=$(git rev-parse HEAD)"
          git push origin HEAD:exp/imp-008e-windows-nce-rasterizer-recovery-runtime
