name: Build Windows ARM64 NCE clean success v2 break recovery

on:
  push:
    branches:
      - diag/windows-nce-post-audio-reentry-5cb6c51c
    paths:
      - .github/diagnostics/clean-success-v2-break-recovery-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-clean-success-v2-break-recovery
  cancel-in-progress: false

env:
  BASE_SHA: 0ffca136f86a64304781a7259a43b671ccb1b8f4
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: clean-success-v2-break-recovery

jobs:
  build-package:
    name: Windows ARM64 NCE clean success
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact clean-success Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/clean-success-v2-break-recovery/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify clean-success composition
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$SOURCE" merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          git -C "$SOURCE" diff --check "$BASE_SHA" "$GITHUB_SHA"

          while IFS= read -r changed; do
            case "$changed" in
              src/core/arm/nce/arm_nce_windows.cpp|              src/common/host_memory.cpp|              src/common/windows_nce_post_audio_probe.h|              src/audio_core/device/device_session.cpp|              .github/workflows/build-windows-arm64-nce-clean-success-v2-break-recovery-0ffca136.yml|              .github/diagnostics/clean-success-v2-break-recovery-trigger.txt)
                ;;
              *)
                echo "Unexpected changed path: $changed"
                exit 1
                ;;
            esac
          done < <(git -C "$SOURCE" diff --name-only "$BASE_SHA" "$GITHUB_SHA")

          MAIN_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/yuzu/main.cpp")"
          ! grep -Eq 'V63_|V64_|V65_|V70_|RunWindowsNceV63Watchdog' <<<"$MAIN_SRC"

          ARM_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp")"
          ! grep -Eq 'WindowsNceV74|V74ProvenanceMagicBase|NCE_V74_AV_PROVENANCE_RETURNED|NCE_V16_FALLBACK_STACK_SYNC' <<<"$ARM_SRC"
          grep -Fq 'WindowsX18FallbackTrap::TryRedirect' <<<"$ARM_SRC"
          grep -Fq 'context.X[18] = reinterpret_cast<u64>(NtCurrentTeb())' <<<"$ARM_SRC"
          grep -Fq 'NCE::WindowsNceTransition::ContinueContext(context)' <<<"$ARM_SRC"
          grep -Fq 'Kernel::KProcessAddress{guest_sp - 1}' <<<"$ARM_SRC"
          grep -Fq 'guest_sp > stack_end' <<<"$ARM_SRC"
          grep -Fq 'SyncToBacking()' <<<"$ARM_SRC"
          grep -Fq 'SyncFromBacking()' <<<"$ARM_SRC"
          grep -Fq '!process->GetMemory().IsValidVirtualAddressRange(context.Pc, sizeof(u32))' <<<"$ARM_SRC"

          ASM_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/windows_nce_entry.asm")"
          ! grep -Fq 'V74' <<<"$ASM_SRC"
          grep -Fq 'stp     x14, x15, [x18, #WindowsTebStackBase]' <<<"$ASM_SRC"
          grep -Fq 'WindowsNceHostStackBridge PROC' <<<"$ASM_SRC"
          grep -Fq 'str     x1, [x18, #8]' <<<"$ASM_SRC"
          grep -Fq 'str     x2, [x18, #16]' <<<"$ASM_SRC"
          grep -Fq 'mov     sp, x3' <<<"$ASM_SRC"
          grep -Fq 'ret     x16' <<<"$ASM_SRC"

          TRANS_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/windows_nce_transition.cpp")"
          ! grep -Eq 'IMP008B_E2_|TraceVirtualMapping|std::fprintf|std::fputs' <<<"$TRANS_SRC"
          grep -Fq 'std::call_once(g_nt_continue_once, ResolveNtContinue)' <<<"$TRANS_SRC"
          grep -Fq 'NtCurrentTeb())->StackLimit' <<<"$TRANS_SRC"
          grep -Fq 'WindowsNceTransition::ContinueContext(bridge_context)' <<<"$TRANS_SRC"

          PATCH_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/patcher.cpp")"
          grep -Fq 'Keep the canonical architectural NZCV bits coherent' <<<"$PATCH_SRC"

          grep -Fq 'Preserve the working 20da host-return recovery' <<<"$ARM_SRC"
          grep -Fq 'breakpoint_pc_is_guest' <<<"$ARM_SRC"
          grep -Fq 'HaltReason::PrefetchAbort' <<<"$ARM_SRC"
          grep -Fq 'HaltReason::BreakLoop' <<<"$ARM_SRC"
          grep -Fq 'static_cast<u64>(reason)' <<<"$ARM_SRC"
          grep -Fq 'NCE_POST_AUDIO_RUNTHREAD_REENTRY' <<<"$ARM_SRC"
          grep -Fq 'NCE_POST_AUDIO_ENTER_GUEST' <<<"$ARM_SRC"

          AUDIO_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/audio_core/device/device_session.cpp")"
          grep -Fq 'NCE_POST_AUDIO_PROBE_ARMED' <<<"$AUDIO_SRC"
          grep -Fq 'name == "DeviceOut-2"' <<<"$AUDIO_SRC"

          PROBE_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/common/windows_nce_post_audio_probe.h")"
          grep -Fq 'ObserveRunThread' <<<"$PROBE_SRC"
          grep -Fq 'ObserveEnterGuest' <<<"$PROBE_SRC"

          HOST_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/common/host_memory.cpp")"
          ! grep -Fq 'NCE_V18_SPLIT_NOOP_EXACT_PLACEHOLDER' <<<"$HOST_SRC"
          grep -Fq 'static_cast<size_t>(region.RegionSize) == length) {' <<<"$HOST_SRC"
          grep -Fq 'NCE_V18_SPLIT_FAIL' <<<"$HOST_SRC"

          test -z "$(git -C "$SOURCE" diff "$BASE_SHA" "$GITHUB_SHA" --             src/yuzu/main.cpp             src/core/arm/nce/windows_nce_entry.asm             src/core/arm/nce/windows_nce_transition.cpp             src/core/arm/nce/patcher.cpp             src/core/arm/nce/guest_context.h             src/core/arm/nce/arm_nce.h             src/common/host_memory.h             src/common/host_memory_windows_lease.h             src/core/hle/kernel/physical_core.cpp             src/core/hle/kernel/physical_core.h)"

          git -C "$SOURCE" diff "$BASE_SHA" "$GITHUB_SHA" --             src/core/arm/nce/arm_nce_windows.cpp             src/common/host_memory.cpp             src/common/windows_nce_post_audio_probe.h             src/audio_core/device/device_session.cpp             > "$PROV/CLEAN_SUCCESS_V2_RUNTIME.diff"

          printf 'BASE_SHA=%s\nCANDIDATE_SHA=%s\nSOURCE_MODE=exact Git object\nCOMPOSITION=resume-gate candidate plus one-shot post-audio guest re-entry discriminator\nLOG_CLEANUP=silence exact-placeholder split no-op Info log only; retain fail logging and behavior\nSTATE_VARIABLE=after DeviceOut-2 completion, does application guest thread reach RunThread and WindowsNceEnterGuest\nDIAGNOSTIC_CAPTURE=three one-shot markers only: ARMED, RUNTHREAD_REENTRY, ENTER_GUEST\n'             "$BASE_SHA" "$GITHUB_SHA" > "$PROV/BUILD_INFO.txt"

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: ${{ env.CI_REF }}
          path: build/validation/${{ github.sha }}/clean-success-v2-break-recovery/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 base
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          cache: false

      - name: Install CLANGARM64 toolchain from pinned direct mirrors
        shell: msys2 {0}
        run: |
          set -euo pipefail

          cat > /etc/pacman.d/mirrorlist.mingw <<'EOF'
          Server = https://repo.msys2.org/mingw/$repo/
          Server = https://mirror.yandex.ru/mirrors/msys2/mingw/$repo/
          Server = https://mirror.accum.se/mirror/msys2.org/mingw/$repo/
          Server = https://ftp.nluug.nl/pub/os/windows/msys2/builds/mingw/$repo/
          EOF

          cat > /etc/pacman.d/mirrorlist.msys <<'EOF'
          Server = https://repo.msys2.org/msys/$arch/
          Server = https://mirror.yandex.ru/mirrors/msys2/msys/$arch/
          Server = https://mirror.accum.se/mirror/msys2.org/msys/$arch/
          Server = https://ftp.nluug.nl/pub/os/windows/msys2/builds/msys/$arch/
          EOF

          if ! grep -Eq '^[[:space:]]*DisableDownloadTimeout([[:space:]]|$)' /etc/pacman.conf; then
            printf '\nDisableDownloadTimeout\n' >> /etc/pacman.conf
          fi

          pacman --noconfirm -Syy
          pacman --noconfirm -S --needed --overwrite '*'             git make autoconf libtool automake-wrapper patch jq pactoys ninja

          pacboy --noconfirm -S --needed             qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p             openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p             enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p             libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 NCE clean-success build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/clean-success-v2-break-recovery/source
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json

      - name: Build full Windows ARM64 Eden clean-success candidate
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/clean-success-v2-break-recovery/source
        run: |
          set -euo pipefail
          cmake --build build

      - name: Package Windows ARM64 Eden clean-success candidate
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/clean-success-v2-break-recovery/source
        env:
          ARTIFACT_REF: nce-clean-success-v2-break-recovery
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh

      - name: Prepare upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force

      - name: Upload clean-success v2 candidate
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-CLEAN-SUCCESS-V2-BREAK-RECOVERY
          path: build/validation/${{ github.sha }}/clean-success-v2-break-recovery/upload/*
          if-no-files-found: error
          retention-days: 14
