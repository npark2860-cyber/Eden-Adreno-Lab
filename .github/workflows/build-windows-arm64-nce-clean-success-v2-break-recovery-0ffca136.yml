name: Build Windows ARM64 NCE clean success v2 break recovery

on:
  push:
    branches:
      - fix/windows-nce-context-x18-teb-5cb6c51c
    paths:
      - .github/diagnostics/clean-success-v2-break-recovery-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-clean-success-v2-break-recovery
  cancel-in-progress: false

env:
  BASE_SHA: 0ffca136f86a64304781a7259a43b671ccb1b8f4
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: clean-success-v2-break-recovery

jobs:
  build-package:
    name: Windows ARM64 NCE clean success
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact clean-success Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/clean-success-v2-break-recovery/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify clean-success composition
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$SOURCE" merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          git -C "$SOURCE" diff --check "$BASE_SHA" "$GITHUB_SHA"

          while IFS= read -r changed; do
            case "$changed" in
              src/core/arm/nce/arm_nce_windows.cpp|              src/core/arm/nce/windows_nce_transition.cpp|              src/core/arm/nce/x18_fallback.cpp|              src/core/arm/nce/x18_fallback.h|              src/core/arm/nce/x18_classifier.cpp|              src/core/arm/nce/windows_x18_fallback_trap.cpp|              src/core/arm/nce/windows_x18_fallback_trap.h|              src/core/arm/nce/x18_site_patcher.h|              src/core/arm/nce/windows_x18_fallback_runner.cpp|              src/core/arm/nce/windows_x18_fallback_runner.h|              src/core/arm/nce/patcher.cpp|              src/core/arm/nce/x18_site_patcher.cpp|              src/core/arm/dynarmic/arm_dynarmic_64.cpp|              src/core/arm/dynarmic/arm_dynarmic_64.h|              src/core/CMakeLists.txt|              src/common/host_memory.cpp|              .github/workflows/build-windows-arm64-nce-clean-success-v2-break-recovery-0ffca136.yml|              .github/diagnostics/clean-success-v2-break-recovery-trigger.txt)
                ;;
              *)
                echo "Unexpected changed path: $changed"
                exit 1
                ;;
            esac
          done < <(git -C "$SOURCE" diff --name-only "$BASE_SHA" "$GITHUB_SHA")

          MAIN_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/yuzu/main.cpp")"
          ! grep -Eq 'V63_|V64_|V65_|V70_|RunWindowsNceV63Watchdog' <<<"$MAIN_SRC"

          ARM_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp")"
          ! grep -Eq 'WindowsNceV74|V74ProvenanceMagicBase|NCE_V74_AV_PROVENANCE_RETURNED|NCE_V16_FALLBACK_STACK_SYNC' <<<"$ARM_SRC"
          grep -Fq 'WindowsX18FallbackTrap::TryRedirect' <<<"$ARM_SRC"
          grep -Fq 'context.X[18] = reinterpret_cast<u64>(NtCurrentTeb())' <<<"$ARM_SRC"
          grep -Fq 'NCE::WindowsNceTransition::ContinueContext(context)' <<<"$ARM_SRC"
          grep -Fq 'Kernel::KProcessAddress{guest_sp - 1}' <<<"$ARM_SRC"
          grep -Fq 'guest_sp > stack_end' <<<"$ARM_SRC"
          grep -Fq 'SyncToBacking()' <<<"$ARM_SRC"
          grep -Fq 'SyncFromBacking()' <<<"$ARM_SRC"
          grep -Fq 'P2CNeedsPrivateStackSync' <<<"$ARM_SRC"
          grep -Fq 'P2BByteAccessAliasesPrivateStackBacking' <<<"$ARM_SRC"
          grep -Fq 'needs_private_stack_sync' <<<"$ARM_SRC"
          grep -Fq '!process->GetMemory().IsValidVirtualAddressRange(context.Pc, sizeof(u32))' <<<"$ARM_SRC"

          ASM_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/windows_nce_entry.asm")"
          ! grep -Fq 'V74' <<<"$ASM_SRC"
          grep -Fq 'stp     x14, x15, [x18, #WindowsTebStackBase]' <<<"$ASM_SRC"
          grep -Fq 'WindowsNceHostStackBridge PROC' <<<"$ASM_SRC"
          grep -Fq 'str     x1, [x18, #8]' <<<"$ASM_SRC"
          grep -Fq 'str     x2, [x18, #16]' <<<"$ASM_SRC"
          grep -Fq 'mov     sp, x3' <<<"$ASM_SRC"
          grep -Fq 'ret     x16' <<<"$ASM_SRC"

          CORE_CMAKE="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/CMakeLists.txt")"
          grep -Fq 'Microsoft Visual Studio/18/*/VC/Tools/MSVC/*/bin/Hostarm64/arm64/armasm64.exe' <<<"$CORE_CMAKE"

          TRANS_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/windows_nce_transition.cpp")"
          ! grep -Eq 'IMP008B_E2_|TraceVirtualMapping|std::fprintf|std::fputs' <<<"$TRANS_SRC"
          grep -Fq 'std::call_once(g_nt_continue_once, ResolveNtContinue)' <<<"$TRANS_SRC"
          grep -Fq 'NtCurrentTeb())->StackLimit' <<<"$TRANS_SRC"
          grep -Fq 'guest->windows_guest_stack_limit' <<<"$TRANS_SRC"
          grep -Fq 'guest->windows_guest_stack_base' <<<"$TRANS_SRC"
          grep -Fq 'RunThread has already validated the active guest stack' <<<"$TRANS_SRC"
          grep -Fq 'WindowsNceTransition::ContinueContext(bridge_context)' <<<"$TRANS_SRC"
          grep -Fq 'context.X[18] = reinterpret_cast<std::uint64_t>(NtCurrentTeb())' <<<"$TRANS_SRC"

          PATCH_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/patcher.cpp")"
          grep -Fq 'Keep the canonical architectural NZCV bits coherent' <<<"$PATCH_SRC"
          grep -Fq 'BuildWindowsX18BitfieldPlan' <<<"$PATCH_SRC"
          grep -Fq 'WriteWindowsX18BitfieldTrampoline' <<<"$PATCH_SRC"
          grep -Fq 'physical x18 Windows/TEB-owned at all times' <<<"$PATCH_SRC"
          grep -Fq 'CNTFRQ_EL0 -> X18 must update the' <<<"$PATCH_SRC"
          grep -Fq 'compute the guest counter in ordinary scratch registers' <<<"$PATCH_SRC"

          X18_SITE_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/x18_site_patcher.cpp")"
          grep -Fq 'metadata.find(runtime_pc) != metadata.end()' <<<"$X18_SITE_SRC"
          grep -Fq 'MayAccessGuestMemory' <<<"$X18_SITE_SRC"

          X18_CLASSIFIER_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/x18_classifier.cpp")"
          grep -Fq 'IsGuestMemoryAccess' <<<"$X18_CLASSIFIER_SRC"
          grep -Fq 'MayAccessGuestMemory' <<<"$X18_CLASSIFIER_SRC"
          grep -Fq 'CanUseDirectTrampoline' <<<"$X18_CLASSIFIER_SRC"

          X18_TRAP_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/windows_x18_fallback_trap.cpp")"
          grep -Fq 'FindSiteInfo' <<<"$X18_TRAP_SRC"
          grep -Fq 'MetadataMayAccessMemoryBit' <<<"$X18_TRAP_SRC"

          grep -Fq 'WriteWindowsX18DirectTrampoline' <<<"$PATCH_SRC"
          grep -Fq 'WindowsNceExecuteDirectX18' <<<"$PATCH_SRC"
          grep -Fq 'no Windows/C++ helper may run on the guest stack' <<<"$PATCH_SRC"
          grep -Fq 'windows_host_stack_base' <<<"$PATCH_SRC"
          grep -Fq 'windows_guest_stack_base' <<<"$PATCH_SRC"

          DYN64_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/dynarmic/arm_dynarmic_64.cpp")"
          grep -Fq 'ReadMemoryWithPrivateView' <<<"$DYN64_SRC"
          grep -Fq 'WriteMemoryWithPrivateView' <<<"$DYN64_SRC"
          grep -Fq 'force_memory_callbacks' <<<"$DYN64_SRC"
          grep -Fq 'm_single_instruction_override_active && vaddr == m_single_instruction_override_pc' <<<"$DYN64_SRC"

          DYN64_HDR="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/dynarmic/arm_dynarmic_64.h")"
          grep -Fq 'm_single_instruction_override_active' <<<"$DYN64_HDR"
          grep -Fq 'm_single_instruction_override_instruction' <<<"$DYN64_HDR"

          X18_FALLBACK_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/x18_fallback.cpp")"
          grep -Fq 'm_single_instruction_override_active = true' <<<"$X18_FALLBACK_SRC"
          grep -Fq 'm_single_instruction_override_active = false' <<<"$X18_FALLBACK_SRC"
          ! grep -Fq 'm_cb->m_memory.ReadBlock(aligned_pc, &m_cb->cached_code_page' <<<"$X18_FALLBACK_SRC"

          X18_RUNNER_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/windows_x18_fallback_runner.cpp")"
          grep -Fq 'SetPrivateMemoryView' <<<"$X18_RUNNER_SRC"
          grep -Fq 'core_index, true' <<<"$X18_RUNNER_SRC"
          grep -Fq 'ExecuteDirect' <<<"$X18_RUNNER_SRC"
          grep -Fq 'WindowsNceExecuteDirectX18' <<<"$X18_RUNNER_SRC"
          grep -Fq 'DirectStackRefreshMarker' <<<"$X18_RUNNER_SRC"
          grep -Fq 'guest->sp <= stack_limit' <<<"$X18_RUNNER_SRC"

          grep -Fq 'fallback_uses_private_stack_view' <<<"$ARM_SRC"
          grep -Fq 'SetDirectPrivateStackView' <<<"$ARM_SRC"
          grep -Fq 'DirectStackRefreshMarker' <<<"$ARM_SRC"

          grep -Fq 'Preserve the working 20da host-return recovery' <<<"$ARM_SRC"
          grep -Fq 'breakpoint_pc_is_guest' <<<"$ARM_SRC"
          grep -Fq 'HaltReason::PrefetchAbort' <<<"$ARM_SRC"
          grep -Fq 'HaltReason::BreakLoop' <<<"$ARM_SRC"
          grep -Fq 'static_cast<u64>(reason)' <<<"$ARM_SRC"

          HOST_SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/common/host_memory.cpp")"
          ! grep -Fq 'NCE_V18_SPLIT_NOOP_EXACT_PLACEHOLDER' <<<"$HOST_SRC"
          grep -Fq 'static_cast<size_t>(region.RegionSize) == length) {' <<<"$HOST_SRC"
          grep -Fq 'NCE_V18_SPLIT_FAIL' <<<"$HOST_SRC"

          test -z "$(git -C "$SOURCE" diff "$BASE_SHA" "$GITHUB_SHA" --             src/yuzu/main.cpp             src/core/arm/nce/windows_nce_entry.asm             src/core/arm/nce/guest_context.h             src/core/arm/nce/arm_nce.h             src/common/host_memory.h             src/common/host_memory_windows_lease.h             src/core/hle/kernel/physical_core.cpp             src/core/hle/kernel/physical_core.h)"

          git -C "$SOURCE" diff "$BASE_SHA" "$GITHUB_SHA" --             src/core/arm/nce/arm_nce_windows.cpp             src/core/arm/nce/windows_nce_transition.cpp             src/core/arm/nce/x18_fallback.cpp             src/core/arm/nce/x18_fallback.h             src/core/arm/nce/x18_classifier.cpp             src/core/arm/nce/windows_x18_fallback_trap.cpp             src/core/arm/nce/windows_x18_fallback_trap.h             src/core/arm/nce/x18_site_patcher.h             src/core/arm/nce/windows_x18_fallback_runner.cpp             src/core/arm/nce/windows_x18_fallback_runner.h             src/core/arm/nce/patcher.cpp             src/core/arm/nce/x18_site_patcher.cpp             src/core/arm/dynarmic/arm_dynarmic_64.cpp             src/core/arm/dynarmic/arm_dynarmic_64.h             src/core/CMakeLists.txt             src/common/host_memory.cpp             > "$PROV/CLEAN_SUCCESS_V2_RUNTIME.diff"

          printf 'BASE_SHA=%s\nCANDIDATE_SHA=%s\nSOURCE_MODE=exact Git object\nCOMPOSITION=clean-success v2 plus P2A-P2E reductions plus P3C/P3D correctness fixes plus P3E direct single-step opcode override without 4 KiB page pre-read\nLOG_CLEANUP=silence exact-placeholder split no-op Info log only; retain fail logging and behavior\nSTATE_VARIABLE=preserve P3D semantics but replace per-Step 4 KiB code-page ReadBlock/mutation with an active (PC, instruction) MemoryReadCode override; Dynarmic single-step fetches exactly one instruction and existing (PC,instruction) JIT invalidation remains unchanged\nDIAGNOSTIC_CAPTURE=P3D external 30.1126s ETW proved hot NCE thread CPU-bound and exposed unconditional 4 KiB code-page read in every generic direct-x18 Step\n'             "$BASE_SHA" "$GITHUB_SHA" > "$PROV/BUILD_INFO.txt"

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: ${{ env.CI_REF }}
          path: build/validation/${{ github.sha }}/clean-success-v2-break-recovery/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 base
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          cache: false

      - name: Install CLANGARM64 toolchain from pinned direct mirrors
        shell: msys2 {0}
        run: |
          set -euo pipefail

          cat > /etc/pacman.d/mirrorlist.mingw <<'EOF'
          Server = https://repo.msys2.org/mingw/$repo/
          Server = https://mirror.yandex.ru/mirrors/msys2/mingw/$repo/
          Server = https://mirror.accum.se/mirror/msys2.org/mingw/$repo/
          Server = https://ftp.nluug.nl/pub/os/windows/msys2/builds/mingw/$repo/
          EOF

          cat > /etc/pacman.d/mirrorlist.msys <<'EOF'
          Server = https://repo.msys2.org/msys/$arch/
          Server = https://mirror.yandex.ru/mirrors/msys2/msys/$arch/
          Server = https://mirror.accum.se/mirror/msys2.org/msys/$arch/
          Server = https://ftp.nluug.nl/pub/os/windows/msys2/builds/msys/$arch/
          EOF

          if ! grep -Eq '^[[:space:]]*DisableDownloadTimeout([[:space:]]|$)' /etc/pacman.conf; then
            printf '\nDisableDownloadTimeout\n' >> /etc/pacman.conf
          fi

          pacman --noconfirm -Syy
          pacman --noconfirm -S --needed --overwrite '*'             git make autoconf libtool automake-wrapper patch jq pactoys ninja

          pacboy --noconfirm -S --needed             qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p             openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p             enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p             libwebp:p libtiff:p brotli:p

      - name: Ensure Visual Studio ARM64 assembler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Find-ArmAsm64 {
            $patterns = @(
              'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostarm64\arm64\armasm64.exe',
              'C:\Program Files\Microsoft Visual Studio\18\*\VC\Tools\MSVC\*\bin\Hostarm64\arm64\armasm64.exe',
              'C:\Program Files (x86)\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostarm64\arm64\armasm64.exe',
              'C:\Program Files (x86)\Microsoft Visual Studio\18\*\VC\Tools\MSVC\*\bin\Hostarm64\arm64\armasm64.exe'
            )
            foreach ($pattern in $patterns) {
              $match = Get-Item $pattern -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if ($match) { return $match.FullName }
            }
            return $null
          }

          $armasm = Find-ArmAsm64
          if (-not $armasm) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            if (-not (Test-Path $vswhere) -or -not (Test-Path $setup)) {
              throw 'Visual Studio installer/vswhere not found on hosted ARM64 runner'
            }

            $installPath = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1)
            if (-not $installPath) {
              throw 'No Visual Studio instance found to add the ARM64 toolchain component'
            }

            $argLine = 'modify --installPath "' + $installPath + '" --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --quiet --norestart'
            $proc = Start-Process -FilePath $setup -ArgumentList $argLine -Wait -PassThru
            if ($proc.ExitCode -notin @(0, 3010)) {
              throw "Visual Studio ARM64 component install failed with exit code $($proc.ExitCode)"
            }

            $armasm = Find-ArmAsm64
          }

          if (-not $armasm) {
            throw 'armasm64.exe still not found after ARM64 toolchain provisioning'
          }

          Write-Host "Using ARM64 assembler: $armasm"

      - name: Configure Windows ARM64 NCE clean-success build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/clean-success-v2-break-recovery/source
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json

      - name: Build full Windows ARM64 Eden clean-success candidate
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/clean-success-v2-break-recovery/source
        run: |
          set -euo pipefail
          cmake --build build

      - name: Package Windows ARM64 Eden clean-success candidate
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/clean-success-v2-break-recovery/source
        env:
          ARTIFACT_REF: nce-clean-success-v2-break-recovery
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh

      - name: Prepare upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force

      - name: Upload clean-success v2 candidate
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-CLEAN-SUCCESS-V2-BREAK-RECOVERY
          path: build/validation/${{ github.sha }}/clean-success-v2-break-recovery/upload/*
          if-no-files-found: error
          retention-days: 14
