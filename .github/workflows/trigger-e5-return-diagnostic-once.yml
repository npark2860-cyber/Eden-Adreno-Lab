name: Trigger E5 Return Diagnostic Once

on:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/trigger-e5-return-diagnostic-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-e5:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch E5 diagnostic workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/probe-imp-008b-e5-x18-runtime-invariant-arm64.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"
          echo 'IMP008B_E5_DIAGNOSTIC_DISPATCH=PASS'
