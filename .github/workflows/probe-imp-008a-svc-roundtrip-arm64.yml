name: Probe IMP-008A Windows SVC Roundtrip ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008-windows-nce-integration
    paths:
      - src/core/arm/nce/patcher.cpp
      - src/core/arm/nce/windows_generated_context.h
      - src/core/arm/nce/windows_nce_transition.cpp
      - src/core/arm/nce/windows_nce_transition.h
      - src/core/arm/nce/windows_nce_entry.asm
      - probes/windows-arm64-nce-svc-roundtrip/**
      - .github/workflows/probe-imp-008a-svc-roundtrip-arm64.yml

permissions:
  contents: read

jobs:
  svc-roundtrip:
    runs-on: windows-11-arm
    timeout-minutes: 12

    steps:
      - name: Checkout Eden implementation
        uses: actions/checkout@v4
        with:
          path: eden

      - name: Checkout fixed Oaknut dependency
        uses: actions/checkout@v4
        with:
          repository: eden-emulator/oaknut
          ref: v2.0.3
          path: oaknut

      - name: Assemble actual Windows NCE entry
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 11
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 12
          call "%VSROOT%\VC\Auxiliary\Build\vcvarsall.bat" arm64
          if errorlevel 1 exit /b 13
          armasm64 -nologo eden\src\core\arm\nce\windows_nce_entry.asm windows_nce_entry.obj
          if errorlevel 1 exit /b 14

      - name: Set up CLANGARM64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          pacboy: >-
            clang:p boost:p fmt:p unordered_dense:p

      - name: Build and run actual Windows SVC roundtrip
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cat > production_link_stubs.cpp <<'EOF'
          #include <cstdlib>
          #include "common/cpu_features.h"
          #include "common/logging.h"

          void AssertFailSoftImpl() {}
          [[noreturn]] void AssertFatalImpl() { std::abort(); }

          namespace Common {
          WallClock::WallClock(bool, u64) noexcept {}
          }

          namespace Common::Log {
          void FmtLogMessageImpl(Class, Level, const char*, unsigned int, const char*,
                                 fmt::string_view, const fmt::format_args&) {}
          } // namespace Common::Log
          EOF

          clang++ \
            -std=c++20 -O2 -ffunction-sections -fdata-sections \
            -D_WIN32 -D_WIN64 -DARCHITECTURE_arm64 -DHAS_NCE -DNDEBUG \
            -Ieden/src -Ioaknut/include \
            eden/probes/windows-arm64-nce-svc-roundtrip/production_probe.cpp \
            production_link_stubs.cpp \
            eden/src/core/arm/nce/windows_nce_transition.cpp \
            eden/src/core/arm/nce/patcher.cpp \
            windows_nce_entry.obj \
            -Wl,--gc-sections -lfmt \
            -o imp008a_svc_roundtrip_smoke.exe

          ./imp008a_svc_roundtrip_smoke.exe
