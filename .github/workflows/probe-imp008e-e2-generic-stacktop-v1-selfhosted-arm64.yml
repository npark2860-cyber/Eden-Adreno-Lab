name: Probe IMP-008E E2 Generic StackTop V1

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp008e-e2-generic-stacktop-v1-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp008e-e2-generic-stacktop-v1
  cancel-in-progress: false

jobs:
  e2-generic-stacktop-v1:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 15
    steps:
      - name: Verify retained generic transition state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'eden/.git')) { throw 'retained eden checkout missing' }
          $head = (git -C eden rev-parse HEAD).Trim()
          if ($head -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31') { throw "unexpected retained head $head" }
          if (-not (Test-Path 'eden/build/generic_stacktop_ab/windows_nce_transition.cpp.obj')) { throw 'generic transition object missing' }
          $src = [IO.File]::ReadAllText((Resolve-Path 'eden/build/generic_stacktop_ab/windows_nce_transition.cpp'))
          if (-not $src.Contains('IMP008B_GENERIC_STACK_TOP=PASS')) { throw 'generic transition marker missing' }
          if (-not (Test-Path 'eden/probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp')) { throw 'E2 probe missing' }
          Remove-Item 'eden/imp008e-e2-generic-stacktop-v1.log','eden/imp008e-e2-generic-stacktop-v1.out.log','eden/imp008e-e2-generic-stacktop-v1.err.log','eden/imp008e-e2-generic-stacktop-v1.rc','eden/imp008e-e2-generic-stacktop-v1-link.log' -Force -ErrorAction SilentlyContinue
          Write-Host 'IMP008E_E2_GENERIC_STACKTOP_PREP=PASS'

      - name: Compile E2 with retained product flags
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location 'eden/build'
          try {
            $commands = & 'C:\msys64\usr\bin\ninja.exe' -t commands imp008b_e5_x18_runtime
            if ($LASTEXITCODE -ne 0) { throw "ninja tool-mode rc=$LASTEXITCODE" }
            $hits = @($commands | Where-Object { (($_ -replace '\\','/')) -match " -c '?C:/.*?/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant\.cpp'?$" })
            if ($hits.Count -ne 1) { throw "E5 probe compile command count=$($hits.Count)" }
            $compile = [string]$hits[0]
            $oldObj = 'src/yuzu_cmd/CMakeFiles/imp008b_e5_x18_runtime.dir/__/__/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp.obj'
            $newObj = 'generic_stacktop_ab/rasterizer_cached_retry.cpp.obj'
            $compile = $compile.Replace($oldObj, $newObj)
            $compile = [regex]::Replace($compile, '-MF\s+\S+\.obj\.d', '-MF generic_stacktop_ab\rasterizer_cached_retry.cpp.obj.d')
            $compile = [regex]::Replace($compile, "-c\s+'?C:/[^']*?/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant\.cpp'?", '-c C:/actions-runner/_work/Eden-Adreno-Lab/Eden-Adreno-Lab/eden/probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp')
            $compile = $compile.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64', 'C:\msys64\clangarm64')
            $compile = $compile.Replace('C:/actions-runner/_work/_temp/msys64/clangarm64', 'C:/msys64/clangarm64')
            $compile = $compile.Replace('C:\msys64\clangarm64\bin\sccache.exe ', '')
            $compile = $compile.Replace('C:/msys64/clangarm64/bin/sccache.exe ', '')
            $compile = [regex]::Replace($compile, "'(C:/[^']+)'", '$1')
            & $env:ComSpec /D /S /C $compile
            $rc = $LASTEXITCODE
            Write-Host "IMP008E_E2_GENERIC_STACKTOP_COMPILE_RC=$rc"
            if ($rc -ne 0) { throw "E2 compile failed rc=$rc" }
          } finally { Pop-Location }

      - name: Link E2 with explicit generic transition object
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location 'eden/build'
          try {
            $commands = & 'C:\msys64\usr\bin\ninja.exe' -t commands imp008b_e5_x18_runtime
            $linkHits = @($commands | Where-Object { $_ -match '-o bin\\imp008b_e5_x18_runtime\.exe' })
            if ($linkHits.Count -ne 1) { throw "E5 link command count=$($linkHits.Count)" }
            $link = [string]$linkHits[0]
            $oldObj = 'src/yuzu_cmd/CMakeFiles/imp008b_e5_x18_runtime.dir/__/__/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp.obj'
            $newObj = 'generic_stacktop_ab/rasterizer_cached_retry.cpp.obj'
            $link = $link.Replace($oldObj, $newObj)
            $link = $link.Replace('bin\imp008b_e5_x18_runtime.exe', 'bin\imp008e_e2_generic_stacktop_v1.exe')
            $link = $link.Replace('src\yuzu_cmd\libimp008b_e5_x18_runtime.a', 'src\yuzu_cmd\libimp008e_e2_generic_stacktop_v1.a')
            $link = $link.Replace('src/core/libcore.a', 'generic_stacktop_ab/windows_nce_transition.cpp.obj src/core/libcore.a')
            $link = $link.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64', 'C:\msys64\clangarm64')
            $link = $link.Replace('C:/actions-runner/_work/_temp/msys64/clangarm64', 'C:/msys64/clangarm64')
            & $env:ComSpec /D /S /C $link 2>&1 | Tee-Object -FilePath '..\imp008e-e2-generic-stacktop-v1-link.log'
            $rc = $LASTEXITCODE
            Write-Host "IMP008E_E2_GENERIC_STACKTOP_LINK_RC=$rc"
            if ($rc -ne 0) { throw "E2 link failed rc=$rc" }
          } finally { Pop-Location }

      - name: Run E2 rasterizer retry exactly once
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $edenPath = (Resolve-Path 'eden').Path
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path 'eden/build/bin/imp008e_e2_generic_stacktop_v1.exe').Path
          $psi.WorkingDirectory = $edenPath
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = New-Object System.Diagnostics.Process; $p.StartInfo = $psi
          if (-not $p.Start()) { throw 'E2 runtime start failed' }
          $ot = $p.StandardOutput.ReadToEndAsync(); $et = $p.StandardError.ReadToEndAsync()
          $timeout = -not $p.WaitForExit(300000)
          if ($timeout) { $p.Kill(); $p.WaitForExit() }
          $out = $ot.Result; $err = $et.Result
          if ($timeout) { $rc = 124 } else { $rc = $p.ExitCode }
          [IO.File]::WriteAllText((Join-Path $edenPath 'imp008e-e2-generic-stacktop-v1.out.log'), $out)
          [IO.File]::WriteAllText((Join-Path $edenPath 'imp008e-e2-generic-stacktop-v1.err.log'), $err)
          [IO.File]::WriteAllText((Join-Path $edenPath 'imp008e-e2-generic-stacktop-v1.log'), $out + $err)
          [IO.File]::WriteAllText((Join-Path $edenPath 'imp008e-e2-generic-stacktop-v1.rc'), [string]$rc)
          Write-Host $out; Write-Host $err
          Write-Host ('IMP008E_E2_GENERIC_STACKTOP_RUNTIME_RC={0} (0x{1:X8})' -f $rc, ($rc -band 0xffffffffL))

      - name: Classify E2 generic StackTop result
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Get-Content 'eden/imp008e-e2-generic-stacktop-v1.log' -Raw
          Get-Content 'eden/imp008e-e2-generic-stacktop-v1.log' | Select-String -Pattern 'IMP008E_E2_(REAL_SYSTEM_LOAD|REAL_RASTERIZER|REAL_CACHE_CREATE|REAL_CACHE_NOACCESS|DATA_AV|RUNTHREAD_RETURNED|PRODUCTION_RETRY_STATE|FAILED_DATA_SKIP_NOT_USED|POST_RETURN_RW|SUPERVISOR_CALL_RETURN|SVC_NUMBER|REEXECUTED_VALUE_EXACT|POST_SVC_PC_EXACT|CONTEXT_COHERENT|PHYSICAL_X18_TEB_AFTER|GATE|FAIL)|IMP008B_GENERIC_STACK_TOP'
          $rc = (Get-Content 'eden/imp008e-e2-generic-stacktop-v1.rc' -Raw).Trim()
          Write-Host "IMP008E_E2_GENERIC_STACKTOP_RAW_RC=$rc"
          if ($log.Contains('IMP008E_E2_GATE=PASS')) {
            if (-not $log.Contains('IMP008B_GENERIC_STACK_TOP=PASS')) { throw 'E2 gate passed without generic transition marker' }
            Write-Host 'IMP008E_E2_GENERIC_STACKTOP_V1=PASS'
          } else {
            Write-Host 'IMP008E_E2_GENERIC_STACKTOP_V1=FAIL_OR_INCOMPLETE'
          }

      - name: Upload E2 generic StackTop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imp008e-e2-generic-stacktop-v1
          path: |
            eden/imp008e-e2-generic-stacktop-v1-link.log
            eden/imp008e-e2-generic-stacktop-v1.log
            eden/imp008e-e2-generic-stacktop-v1.out.log
            eden/imp008e-e2-generic-stacktop-v1.err.log
            eden/imp008e-e2-generic-stacktop-v1.rc
          if-no-files-found: warn
