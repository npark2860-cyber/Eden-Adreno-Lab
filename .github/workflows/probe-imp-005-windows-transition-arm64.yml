name: Probe IMP-005 Windows NCE Transition ARM64

on:
  push:
    branches:
      - exp/imp-005-windows-generated-transition-abi
    paths:
      - src/core/arm/nce/windows_nce_transition.h
      - src/core/arm/nce/windows_nce_transition.cpp
      - src/core/arm/nce/windows_nce_entry.asm
      - src/core/arm/nce/windows_cross_thread_break.h
      - probes/windows-arm64-nce-transition/**
      - .github/workflows/probe-imp-005-windows-transition-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-entry-transition-smoke:
    runs-on: windows-11-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSVC probe headers
        shell: cmd
        run: |
          C:\vcpkg\vcpkg.exe install fmt:arm64-windows boost-intrusive:arm64-windows unordered-dense:arm64-windows
          if errorlevel 1 exit /b 10

      - name: Build and run actual Eden transition smoke
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 11
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 12
          call "%VSROOT%\VC\Auxiliary\Build\vcvarsall.bat" arm64
          if errorlevel 1 exit /b 13

          armasm64 -nologo src\core\arm\nce\windows_nce_entry.asm windows_nce_entry.obj
          if errorlevel 1 exit /b 14
          armasm64 -nologo probes\windows-arm64-nce-transition\guest_loop.asm guest_loop.obj
          if errorlevel 1 exit /b 15

          cl /nologo /std:c++20 /utf-8 /O2 /GS- /EHsc /W4 /permissive- /Isrc /IC:\vcpkg\installed\arm64-windows\include probes\windows-arm64-nce-transition\fixed_entry_smoke.cpp src\core\arm\nce\windows_nce_transition.cpp windows_nce_entry.obj guest_loop.obj /Fe:imp005_transition_smoke.exe
          if errorlevel 1 exit /b 16
          imp005_transition_smoke.exe
          if errorlevel 1 exit /b 17

      - name: Print generated TLS getter listing
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\VC\Auxiliary\Build\vcvarsall.bat" arm64
          cl /nologo /std:c++20 /utf-8 /O2 /GS- /EHsc /W4 /permissive- /c /Isrc /IC:\vcpkg\installed\arm64-windows\include /FAs /Fawindows_nce_transition_listing.asm /Fo:windows_nce_transition_listing.obj src\core\arm\nce\windows_nce_transition.cpp
          if errorlevel 1 exit /b 18
          findstr /C:"GetCurrentNceContextForGeneratedCode" /C:"_tls" /C:"__tls" windows_nce_transition_listing.asm
