name: Build frozen IMP-008E production 055b212d

on:
  workflow_dispatch:
  push:
    branches:
      - build/imp008e-production-055b212d
    paths:
      - .github/workflows/build-production-windows-arm64-nce-055b212d.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: build-imp008e-production-055b212d
  cancel-in-progress: false

env:
  TARGET_SHA: 055b212df86dbfc18257b127ee5a0cbfda8ff861
  SOURCE_DIR: build/validation/055b212df86dbfc18257b127ee5a0cbfda8ff861/zelda-realgame-package/source
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a

jobs:
  build-package:
    name: Windows ARM64 NCE production package
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact frozen production Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: 055b212df86dbfc18257b127ee5a0cbfda8ff861
          path: build/validation/055b212df86dbfc18257b127ee5a0cbfda8ff861/zelda-realgame-package/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify immutable source provenance
        shell: bash
        working-directory: build/validation/055b212df86dbfc18257b127ee5a0cbfda8ff861/zelda-realgame-package/source
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p ../provenance
          git show "$TARGET_SHA:src/core/arm/nce/arm_nce_windows.cpp" > ../provenance/arm_nce_windows.cpp.git-object
          if test -f src/core/hle/kernel/k_page_table_base.cpp; then
            git show "$TARGET_SHA:src/core/hle/kernel/k_page_table_base.cpp" > ../provenance/k_page_table_base.cpp.git-object
          fi
          printf 'SOURCE_SHA=%s\nSOURCE_HEAD=%s\nSOURCE_REPOSITORY=%s\nSOURCE_MODE=exact immutable Git commit checkout\nISOLATION_DIR=%s\n' \
            "$TARGET_SHA" "$actual" 'npark2860-cyber/Eden-Adreno-Lab' "$SOURCE_DIR" > ../provenance/BUILD_INFO.txt
          echo 'IMP008E_PRODUCTION_SOURCE_GUARD=PASS'

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: build/validation/055b212df86dbfc18257b127ee5a0cbfda8ff861/zelda-realgame-package/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/$SOURCE_DIR"
          CI="$GITHUB_WORKSPACE/build/validation/$TARGET_SHA/zelda-realgame-package/ci"
          rm -rf "$SRC/.ci"
          cp -a "$CI/.ci" "$SRC/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$GITHUB_WORKSPACE/build/validation/$TARGET_SHA/zelda-realgame-package/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure exact production Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/055b212df86dbfc18257b127ee5a0cbfda8ff861/zelda-realgame-package/source
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          printf 'CONFIGURE_COMMAND=./.ci/build/configure.sh -DCCACHE_PATH=sccache\nNCE_COMPILE_GUARD=HAS_NCE=1\n' >> ../provenance/BUILD_INFO.txt
          echo 'IMP008E_PRODUCTION_CONFIGURE=PASS'

      - name: Build full Windows ARM64 Eden
        shell: msys2 {0}
        working-directory: build/validation/055b212df86dbfc18257b127ee5a0cbfda8ff861/zelda-realgame-package/source
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          test -f build/bin/eden-cli.exe || test -f build/bin/yuzu-cmd.exe || test -f build/bin/yuzu_cmd.exe
          printf 'BUILD_COMMAND=cmake --build build\n' >> ../provenance/BUILD_INFO.txt
          echo 'IMP008E_PRODUCTION_BUILD=PASS'

      - name: Package Windows ARM64 Eden
        shell: msys2 {0}
        working-directory: build/validation/055b212df86dbfc18257b127ee5a0cbfda8ff861/zelda-realgame-package/source
        env:
          ARTIFACT_REF: imp008e-production-055b212d
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          printf 'PACKAGE_COMMAND=./.ci/package/windows.sh\nARTIFACT_REF=imp008e-production-055b212d\n' >> ../provenance/BUILD_INFO.txt
          echo 'IMP008E_PRODUCTION_PACKAGE=PASS'

      - name: Prepare immutable test package
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:TARGET_SHA/zelda-realgame-package"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged Eden artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov 'BUILD_INFO.txt') $upload -Force
          Copy-Item (Join-Path $prov 'arm_nce_windows.cpp.git-object') $upload -Force
          if (Test-Path (Join-Path $prov 'k_page_table_base.cpp.git-object')) {
            Copy-Item (Join-Path $prov 'k_page_table_base.cpp.git-object') $upload -Force
          }
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash
          "PACKAGE_FILE=$($files[0].Name)" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          "PACKAGE_SHA256=$hash" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          Get-Content (Join-Path $upload 'BUILD_INFO.txt')

      - name: Upload Zelda real-game validation package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-PRODUCTION-055b212d
          path: build/validation/055b212df86dbfc18257b127ee5a0cbfda8ff861/zelda-realgame-package/upload/*
          if-no-files-found: error
          retention-days: 14
