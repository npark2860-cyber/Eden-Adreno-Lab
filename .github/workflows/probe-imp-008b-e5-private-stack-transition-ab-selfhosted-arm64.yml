name: Probe IMP-008B E5 Private Stack Transition A-B

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-e5-private-stack-transition-ab-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp-008b-e5-private-stack-transition-ab
  cancel-in-progress: false

jobs:
  e5-private-stack-transition:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 60
    steps:
      - name: Verify and patch retained E5 workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'eden/.git')) { throw 'retained eden checkout missing' }
          $head = (git -C eden rev-parse HEAD).Trim()
          if ($head -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31') { throw "unexpected retained head $head" }
          $runtime = 'eden/src/core/arm/nce/arm_nce_windows.cpp'
          if (-not (Select-String -Path $runtime -SimpleMatch 'IMP008B_E5_AB_HISTORICAL_RUNTHREAD=PASS' -Quiet)) { throw 'RunThread TEB bypass missing' }
          if (-not (Select-String -Path $runtime -SimpleMatch 'IMP008B_E5_GENERIC_VEH_ENTER=PASS' -Quiet)) { throw 'generic VEH observer missing' }
          $transition = 'eden/src/core/arm/nce/windows_nce_transition.cpp'
          git -C eden checkout -- 'src/core/arm/nce/windows_nce_transition.cpp'
          if ($LASTEXITCODE -ne 0) { throw 'transition reset failed' }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $old = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $new = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $text = [IO.File]::ReadAllText($transition).Replace("`r`n", "`n")
          if ($text.IndexOf($old) -lt 0) { throw 'normalized transition anchor missing' }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($transition, $text, $utf8)
          git -C eden diff --check -- 'src/core/arm/nce/windows_nce_transition.cpp'
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          Write-Host 'IMP008B_E5_PRIVATE_TRANSITION_PATCH=PASS'

      - name: Set up CLANGARM64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: false
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p
            toolchain:p clang:p python-pip:p lld:p openssl:p boost:p fmt:p lz4:p
            nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p
            glslang:p enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p
            xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p libwebp:p
            libtiff:p brotli:p

      - name: Rebuild E5 target incrementally
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build --target imp008b_e5_x18_runtime --parallel
          test -f build/bin/imp008b_e5_x18_runtime.exe
          echo 'IMP008B_E5_PRIVATE_TRANSITION_BUILD=PASS'

      - name: Launch E5 private-stack transition A-B
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -uo pipefail
          set +e
          timeout 30s build/bin/imp008b_e5_x18_runtime.exe > imp008b-e5-private-transition.out.log 2> imp008b-e5-private-transition.err.log
          rc=$?
          set -e
          printf '%s\n' "$rc" > imp008b-e5-private-transition.rc
          cat imp008b-e5-private-transition.out.log imp008b-e5-private-transition.err.log > imp008b-e5-private-transition.log 2>/dev/null || true
          cat imp008b-e5-private-transition.log || true
          echo "IMP008B_E5_PRIVATE_TRANSITION_RC=$rc"

      - name: Classify E5 private-stack transition
        if: always()
        shell: powershell
        working-directory: eden
        run: |
          if (-not (Test-Path 'imp008b-e5-private-transition.log')) { throw 'runtime log missing' }
          Get-Content 'imp008b-e5-private-transition.log' | Select-String -Pattern 'IMP008B_E5_(PRIVATE_STACK|GENERIC_VEH_|X18_VEH_|X18_TRYREDIRECT|RUNTHREAD_RETURNED|HALT_REASON|SVC_NUMBER|RETURN_CONTEXT)|IMP008B_E2_'
          $ready = Select-String -Path 'imp008b-e5-private-transition.log' -SimpleMatch 'IMP008B_E5_PRIVATE_STACK_READY=PASS' -Quiet
          if (-not $ready) { throw 'private stack transition not reached' }
          $generic = Select-String -Path 'imp008b-e5-private-transition.log' -SimpleMatch 'IMP008B_E5_GENERIC_VEH_ENTER=PASS' -Quiet
          $x18 = Select-String -Path 'imp008b-e5-private-transition.log' -SimpleMatch 'IMP008B_E5_X18_VEH_ENTER=PASS' -Quiet
          $returned = Select-String -Path 'imp008b-e5-private-transition.log' -SimpleMatch 'IMP008B_E5_RUNTHREAD_RETURNED=PASS' -Quiet
          if ($generic) { Write-Host 'IMP008B_E5_PRIVATE_TRANSITION_GENERIC_VEH=PASS' } else { Write-Host 'IMP008B_E5_PRIVATE_TRANSITION_GENERIC_VEH=NO_ENTRY' }
          if ($x18) { Write-Host 'IMP008B_E5_PRIVATE_TRANSITION_X18_VEH=PASS' } else { Write-Host 'IMP008B_E5_PRIVATE_TRANSITION_X18_VEH=NO_ENTRY' }
          if ($returned) { Write-Host 'IMP008B_E5_PRIVATE_TRANSITION_RUNTHREAD=PASS' } else { Write-Host 'IMP008B_E5_PRIVATE_TRANSITION_RUNTHREAD=NO' }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-private-stack-transition-ab
          path: |
            eden/imp008b-e5-private-transition.log
            eden/imp008b-e5-private-transition.out.log
            eden/imp008b-e5-private-transition.err.log
            eden/imp008b-e5-private-transition.rc
          if-no-files-found: warn
