name: Probe IMP-008E E2 RunThread Private Stack Lease V4

on:
  workflow_dispatch:
  push:
    branches: [exp/imp-008e-windows-nce-rasterizer-recovery-runtime]
    paths:
      - .github/workflows/probe-imp008e-e2-runthread-private-stack-lease-v4-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp008e-e2-runthread-private-stack-lease-v4
  cancel-in-progress: false

jobs:
  e2-runthread-private-stack-lease-v4:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 8
    steps:
      - name: Build exact retained RunThread lease probe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git -C eden rev-parse HEAD).Trim() -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31'){throw 'unexpected retained HEAD'}
          if(-not(Test-Path 'eden/build/generic_stacktop_ab/windows_nce_transition.cpp.obj')){throw 'generic transition object missing'}
          if(-not(Test-Path 'eden/build/e2_pagetable_stack_query_v1/rasterizer_cached_retry_pagetable_stack.cpp')){throw 'E2 source missing'}
          $dir='eden/build/e2_runthread_private_stack_lease_v4'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $armSrc=Join-Path (Resolve-Path $dir).Path 'arm_nce_windows.cpp'
          $text=[IO.File]::ReadAllText((Resolve-Path 'eden/src/core/arm/nce/arm_nce_windows.cpp').Path).Replace("`r`n","`n")
          $text=$text.Replace('#include <thread>',"#include <thread>`n#include <cstdio>`n#include <cstring>`n#include <vector>")
          $text=$text.Replace('#include "core/core.h"',"#include `"core/core.h`"`n#include `"core/device_memory.h`"")

          $old=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('ICAgICAgICBOQ0U6OkN1cnJlbnROY2VDb250ZXh0OjpDbGVhcigpOwoKICAgICAgICBpZiAobV93aW5kb3dzX3BlbmRpbmdfbmNlX2ZhdWx0KSB7Cg=='))
          $new=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          if(([regex]::Matches($text,[regex]::Escape($old))).Count-ne 1){throw 'return anchor mismatch'}
          $text=$text.Replace($old,$new)

          $old=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('ICAgICAgICBOQ0U6OkN1cnJlbnROY2VDb250ZXh0OjpJbnN0YWxsKHRocmVhZF9wYXJhbXMpOwogICAgICAgIHN0ZDo6ZnB1dHMoIklNUDAwOEJfRTVfQUJfSElTVE9SSUNBTF9SVU5USFJFQUQ9UEFTU1xuIiwgc3RkZXJyKTsKICAgICAgICBzdGQ6OmZmbHVzaChzdGRlcnIpOwo='))
          $new=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          if(([regex]::Matches($text,[regex]::Escape($old))).Count-ne 1){throw 'entry anchor mismatch'}
          $text=$text.Replace($old,$new)
          [IO.File]::WriteAllText($armSrc,$text,[Text.UTF8Encoding]::new($false))

          Push-Location eden/build
          try {
            $cmds=& 'C:\msys64\usr\bin\ninja.exe' -t commands imp008b_e5_x18_runtime
            if($LASTEXITCODE-ne 0){throw "ninja commands rc=$LASTEXITCODE"}
            $arm=@($cmds|Where-Object{(($_ -replace '\\','/')) -match " -c '?C:/.*?/src/core/arm/nce/arm_nce_windows\.cpp'?$"})
            if($arm.Count-ne 1){throw "arm compile count=$($arm.Count)"}
            $c=[string]$arm[0]
            $m=[regex]::Match($c,'-o\s+(\S*arm_nce_windows\.cpp\.obj)')
            if(!$m.Success){throw 'arm object path missing'}
            $oldArm=$m.Groups[1].Value.Trim("'")
            $newArm='e2_runthread_private_stack_lease_v4/arm_nce_windows.cpp.obj'
            $c=$c.Replace($oldArm,$newArm)
            $c=[regex]::Replace($c,'-MF\s+\S*arm_nce_windows\.cpp\.obj\.d','-MF e2_runthread_private_stack_lease_v4\arm_nce_windows.cpp.obj.d')
            $c=[regex]::Replace($c,"-c\s+'?C:/[^']*?/src/core/arm/nce/arm_nce_windows\.cpp'?",'-c C:/actions-runner/_work/Eden-Adreno-Lab/Eden-Adreno-Lab/eden/build/e2_runthread_private_stack_lease_v4/arm_nce_windows.cpp')
            $c=$c.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64').Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64').Replace('C:\msys64\clangarm64\bin\sccache.exe ','').Replace('C:/msys64/clangarm64/bin/sccache.exe ','')
            $c=[regex]::Replace($c,"'(C:/[^']+)'",'$1')
            & $env:ComSpec /D /S /C $c
            if($LASTEXITCODE-ne 0){throw "arm compile rc=$LASTEXITCODE"}

            $main=@($cmds|Where-Object{(($_ -replace '\\','/')) -match " -c '?C:/.*?/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant\.cpp'?$"})
            if($main.Count-ne 1){throw "main compile count=$($main.Count)"}
            $c=[string]$main[0]
            $oldMain='src/yuzu_cmd/CMakeFiles/imp008b_e5_x18_runtime.dir/__/__/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp.obj'
            $newMain='e2_runthread_private_stack_lease_v4/rasterizer_cached_retry.cpp.obj'
            $c=$c.Replace($oldMain,$newMain)
            $c=[regex]::Replace($c,'-MF\s+\S+\.obj\.d','-MF e2_runthread_private_stack_lease_v4\rasterizer_cached_retry.cpp.obj.d')
            $c=[regex]::Replace($c,"-c\s+'?C:/[^']*?/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant\.cpp'?",'-c C:/actions-runner/_work/Eden-Adreno-Lab/Eden-Adreno-Lab/eden/build/e2_pagetable_stack_query_v1/rasterizer_cached_retry_pagetable_stack.cpp')
            $c=$c.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64').Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64').Replace('C:\msys64\clangarm64\bin\sccache.exe ','').Replace('C:/msys64/clangarm64/bin/sccache.exe ','')
            $c=[regex]::Replace($c,"'(C:/[^']+)'",'$1')
            & $env:ComSpec /D /S /C $c
            if($LASTEXITCODE-ne 0){throw "main compile rc=$LASTEXITCODE"}

            $links=@($cmds|Where-Object{$_ -match '-o bin\\imp008b_e5_x18_runtime\.exe'})
            if($links.Count-ne 1){throw "link count=$($links.Count)"}
            $l=[string]$links[0]
            $l=$l.Replace($oldMain,$newMain).Replace('bin\imp008b_e5_x18_runtime.exe','bin\imp008e_e2_runthread_private_stack_lease_v4.exe').Replace('src\yuzu_cmd\libimp008b_e5_x18_runtime.a','src\yuzu_cmd\libimp008e_e2_runthread_private_stack_lease_v4.a').Replace('src/core/libcore.a',"$newArm generic_stacktop_ab/windows_nce_transition.cpp.obj src/core/libcore.a")
            $l=$l.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64').Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64')
            & $env:ComSpec /D /S /C $l
            if($LASTEXITCODE-ne 0){throw "link rc=$LASTEXITCODE"}
          } finally { Pop-Location }
          Write-Host 'IMP008E_E2_RUNTHREAD_PRIVATE_STACK_LEASE_V4_BUILD=PASS'

      - name: Run integrated E2 exactly once
        shell: powershell
        run: |
          $psi=New-Object Diagnostics.ProcessStartInfo
          $psi.FileName=(Resolve-Path 'eden/build/bin/imp008e_e2_runthread_private_stack_lease_v4.exe').Path
          $psi.WorkingDirectory=(Resolve-Path eden).Path
          $psi.UseShellExecute=$false
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          $p=New-Object Diagnostics.Process
          $p.StartInfo=$psi
          [void]$p.Start()
          $ot=$p.StandardOutput.ReadToEndAsync(); $et=$p.StandardError.ReadToEndAsync()
          $timeout=-not $p.WaitForExit(60000); if($timeout){$p.Kill();$p.WaitForExit()}
          $out=$ot.Result; $err=$et.Result; $rc=if($timeout){124}else{$p.ExitCode}; $log=$out+$err
          [IO.File]::WriteAllText((Join-Path (Resolve-Path eden).Path 'imp008e-e2-runthread-private-stack-lease-v4.log'),$log)
          Write-Host $out; Write-Host $err; Write-Host "IMP008E_E2_RUNTHREAD_PRIVATE_STACK_LEASE_V4_RC=$rc"

      - name: Classify result
        shell: powershell
        run: |
          $log=Get-Content 'eden/imp008e-e2-runthread-private-stack-lease-v4.log' -Raw
          Get-Content 'eden/imp008e-e2-runthread-private-stack-lease-v4.log' | Select-String -Pattern 'IMP008E_NCE_STACK_LEASE|IMP008E_E2_(GUEST_STACK_QUERY|DATA_AV_EXACT|PRODUCTION_RETRY_STATE|POST_RETURN_RW|SUPERVISOR_CALL_RETURN|SVC_NUMBER|REEXECUTED_VALUE_EXACT|POST_SVC_PC_EXACT|CONTEXT_COHERENT|PHYSICAL_X18_TEB_AFTER|GATE|FAIL)'
          if($log.Contains('IMP008E_E2_GATE=PASS') -and $log.Contains('IMP008E_NCE_STACK_LEASE_BEGIN=PASS') -and $log.Contains('IMP008E_NCE_STACK_LEASE_END=PASS')){Write-Host 'IMP008E_E2_RUNTHREAD_PRIVATE_STACK_LEASE_V4=PASS'} elseif($log.Contains('IMP008E_NCE_STACK_LEASE_BEGIN=PASS')){Write-Host 'IMP008E_E2_RUNTHREAD_PRIVATE_STACK_LEASE_V4=LEASE_ACTIVE_RUNTIME_FAIL'} else {Write-Host 'IMP008E_E2_RUNTHREAD_PRIVATE_STACK_LEASE_V4=LEASE_BEGIN_FAIL'}
