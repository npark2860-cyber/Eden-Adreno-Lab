name: One-shot X1 Waker Stage C Static Verify

on:
  push:
    branches:
      - exp/x1-waker-pre-signal-attribution
    paths:
      - .github/workflows/one-shot-x1-waker-stage-c-static.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Adreno Lab
        uses: actions/checkout@v7
        with:
          path: lab
          fetch-depth: 0

      - name: Checkout exact dc95
        uses: actions/checkout@v7
        with:
          repository: eden-emulator/mirror
          ref: dc95cd09eea9749250fe31a3072684d341d19417
          path: eden
          fetch-depth: 0

      - name: Apply retained diagnostic chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profiler-patches
          BASE=a845b6eafe39faf0b9dd038639a5db385cf9d08f
          for f in \
            src/video_core/renderer_vulkan/vk_buffer_cache.cpp \
            src/video_core/renderer_vulkan/vk_compute_pipeline.cpp \
            src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp \
            src/video_core/renderer_vulkan/vk_staging_buffer_pool.cpp \
            src/video_core/renderer_vulkan/vk_update_descriptor.cpp; do
            out="profiler-patches/$(basename "$f").patch"
            git -C lab diff --binary "$BASE" HEAD -- "$f" > "$out"
            test -s "$out"
            git -C eden apply --ignore-whitespace "../$out"
          done
          cp lab/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp eden/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp
          cp lab/src/video_core/renderer_vulkan/vk_adreno_profiler.h eden/src/video_core/renderer_vulkan/vk_adreno_profiler.h

          python lab/tools/adreno_lab/transplant_dc95_descriptor_ring_profiler.py eden
          python lab/tools/adreno_lab/transplant_dc95_logging_checkboxes.py eden
          python lab/tools/adreno_lab/transplant_dc95_full_flow_hooks.py eden
          python lab/tools/adreno_lab/transplant_dc95_scheduler_flow_profiler.py eden/src/video_core/renderer_vulkan/vk_scheduler.cpp
          python lab/tools/adreno_lab/finalize_dc95_full_flow_profiler.py eden
          python lab/tools/adreno_lab/transplant_dc95_draw_dispatch_correlation.py eden
          python lab/tools/adreno_lab/transplant_dc95_draw_dispatch_ab_controls.py eden
          python lab/tools/adreno_lab/transplant_dc95_draw_other_reasons.py eden
          python lab/tools/adreno_lab/transplant_dc95_texture_fill_reasons.py eden
          python lab/tools/adreno_lab/transplant_dc95_alias_copy_reasons.py eden
          python lab/tools/adreno_lab/transplant_dc95_alias_sync_redundancy.py eden
          python lab/tools/adreno_lab/transplant_dc95_uniform_stream_reuse.py eden
          python lab/tools/adreno_lab/transplant_dc95_uniform_payload_fingerprint.py eden
          python lab/tools/adreno_lab/transplant_dc95_uniform_cache_ab.py eden
          python lab/tools/adreno_lab/transplant_dc95_frame_cadence_attribution.py eden
          python lab/tools/adreno_lab/transplant_dc95_swap_interval_3_to_2_ab.py eden
          python lab/tools/adreno_lab/transplant_dc95_diagnostic_harness.py eden

          cp lab/src/video_core/renderer_vulkan/vk_x1_frame_build_profiler.h eden/src/video_core/renderer_vulkan/vk_x1_frame_build_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_frame_build_attribution.py eden
          cp lab/src/video_core/x1_gpu_command_profiler.h eden/src/video_core/x1_gpu_command_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_gpu_command_attribution.py eden
          cp lab/src/video_core/x1_gpu_submit_profiler.h eden/src/video_core/x1_gpu_submit_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_gpu_submit_gap_attribution.py eden
          cp lab/src/video_core/x1_guest_submit_profiler.h eden/src/video_core/x1_guest_submit_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_guest_submit_thread_attribution.py eden
          cp lab/src/core/x1_nvdrv_ipc_dispatch_profiler.h eden/src/core/x1_nvdrv_ipc_dispatch_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_nvdrv_ipc_dispatch_gap.py eden
          cp lab/src/core/x1_guest_post_wait_profiler.h eden/src/core/x1_guest_post_wait_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_guest_post_wait_attribution.py eden
          cp lab/src/core/x1_address_arbiter_profiler.h eden/src/core/x1_address_arbiter_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_address_arbiter_attribution.py eden

      - name: Snapshot pre-Stage-C state
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            lab/tools/adreno_lab/transplant_dc95_waker_pre_signal_attribution.py \
            lab/tools/adreno_lab/analyze_x1_waker_pre_signal_attribution.py
          mkdir -p pre-stage-c
          cp eden/src/core/hle/kernel/svc/svc_address_arbiter.cpp pre-stage-c/svc_address_arbiter.cpp
          cp eden/src/core/hle/kernel/k_thread.cpp pre-stage-c/k_thread.cpp
          cp eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp pre-stage-c/vk_rasterizer.cpp

      - name: Apply Stage C waker attribution
        shell: bash
        run: |
          set -euo pipefail
          cp lab/src/core/x1_waker_pre_signal_profiler.h eden/src/core/x1_waker_pre_signal_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_waker_pre_signal_attribution.py eden

      - name: Verify Stage C scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C eden rev-parse HEAD)" = "dc95cd09eea9749250fe31a3072684d341d19417"
          git -C eden diff --check

          PROF=eden/src/core/x1_waker_pre_signal_profiler.h
          SVC=eden/src/core/hle/kernel/svc/svc_address_arbiter.cpp
          KTHREAD=eden/src/core/hle/kernel/k_thread.cpp
          RASTER=eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp

          grep -q '\[X1-WAKER\]' "$PROF"
          grep -q 'waker_tid.compare_exchange_strong' "$PROF"
          grep -q 'RecordMatchingSignal' "$PROF"
          grep -q 'RecordThreadStateTransition' "$PROF"
          grep -q 'inter_signal_total_ns' "$PROF"
          grep -q 'current_interval_wait_ns' "$PROF"
          grep -q 'report_pc_mismatch' "$PROF"
          grep -q 'report_lr_mismatch' "$PROF"
          ! grep -qi '0x4f' "$PROF"

          grep -q 'x1_signal_context.pc' "$SVC"
          grep -q 'x1_signal_context.lr' "$SVC"
          grep -q 'RecordMatchingSignal' "$SVC"
          grep -q 'x1_waker_profiler.RecordThreadStateTransition' "$KTHREAD"
          grep -q 'X1WakerPreSignalProfiler::Get().Initialize' "$RASTER"
          grep -q 'X1WakerPreSignalProfiler::Get().FrameEnd' "$RASTER"

          check_count() {
            local before="$1" after="$2" token="$3"
            local b a
            b=$(grep -oF "$token" "$before" | wc -l | tr -d ' ')
            a=$(grep -oF "$token" "$after" | wc -l | tr -d ' ')
            test "$b" = "$a" || { echo "ERROR token count changed: $token $b -> $a" >&2; exit 1; }
          }

          check_count pre-stage-c/svc_address_arbiter.cpp "$SVC" 'WaitAddressArbiter('
          check_count pre-stage-c/svc_address_arbiter.cpp "$SVC" 'SignalAddressArbiter('
          check_count pre-stage-c/svc_address_arbiter.cpp "$SVC" 'IsValidArbitrationType('
          check_count pre-stage-c/svc_address_arbiter.cpp "$SVC" 'IsValidSignalType('
          check_count pre-stage-c/svc_address_arbiter.cpp "$SVC" 'x1_address_arbiter_profiler.RecordSignal('

          check_count pre-stage-c/k_thread.cpp "$KTHREAD" 'this->SetWaitReasonForDebugging({});'
          check_count pre-stage-c/k_thread.cpp "$KTHREAD" 'm_thread_state.store('
          check_count pre-stage-c/k_thread.cpp "$KTHREAD" 'KScheduler::OnThreadStateChanged('
          check_count pre-stage-c/k_thread.cpp "$KTHREAD" 'BeginWait('
          check_count pre-stage-c/k_thread.cpp "$KTHREAD" 'EndWait('
          check_count pre-stage-c/k_thread.cpp "$KTHREAD" 'x1_guest_wait_profiler.RecordThreadStateTransition('

          test "$(grep -oF 'RecordMatchingSignal(' "$SVC" | wc -l | tr -d ' ')" = 1
          test "$(grep -oF 'x1_waker_profiler.RecordThreadStateTransition(' "$KTHREAD" | wc -l | tr -d ' ')" = 1

          diff -u pre-stage-c/svc_address_arbiter.cpp "$SVC" > stage-c-svc.diff || true
          diff -u pre-stage-c/k_thread.cpp "$KTHREAD" > stage-c-kthread.diff || true
          diff -u pre-stage-c/vk_rasterizer.cpp "$RASTER" > stage-c-raster.diff || true
          cat stage-c-svc.diff stage-c-kthread.diff stage-c-raster.diff > stage-c-only.diff
          test -s stage-c-only.diff

          if grep -E '^\+.*(BeginWait\(|EndWait\(|SignalAddressArbiter\(|WaitHost\(|StallApplication\(|sleep_for|sleep_until|Sleep\(|SetPriority\(|SetCoreMask\(|Reschedule|YieldTo|PushGPUEntries\(|item\.swap_interval[[:space:]]*=|default_max_buffer_count[[:space:]]*=|SetTarget|SpeedLimit)' stage-c-only.diff; then
            echo 'ERROR: behavior-changing wait/signal/scheduling/GPU policy leaked into Stage C diff' >&2
            exit 1
          fi

          echo 'Stage C dynamic waker pre-signal static verification passed'
