name: Build dc95 X1 Frame Build Attribution

on:
  workflow_dispatch:
  push:
    branches:
      - exp/x1-frame-build-attribution
    paths:
      - .github/x1-frame-build-attribution-build-once

concurrency:
  group: dc95-x1-frame-build-attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: dc95 ARM64 / X1 frame-build attribution
    runs-on: windows-11-arm
    timeout-minutes: 180

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard

    steps:
      - name: Checkout Adreno Lab
        uses: actions/checkout@v7
        with:
          path: lab
          fetch-depth: 0

      - name: Checkout Eden CI workflow used by dc95-era nightlies
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Checkout exact known-good Eden source
        uses: actions/checkout@v7
        with:
          repository: eden-emulator/mirror
          ref: dc95cd09eea9749250fe31a3072684d341d19417
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact dc95 checkout
        shell: bash
        run: |
          set -e
          test "$(git -C eden rev-parse HEAD)" = "dc95cd09eea9749250fe31a3072684d341d19417"

      - name: Install dc95-era Eden CI scripts
        shell: bash
        run: |
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Prepare compile-validated P0.2 non-scheduler patches
        shell: bash
        run: |
          set -e
          mkdir -p profiler-patches
          BASE=a845b6eafe39faf0b9dd038639a5db385cf9d08f
          for f in \
            src/video_core/renderer_vulkan/vk_buffer_cache.cpp \
            src/video_core/renderer_vulkan/vk_compute_pipeline.cpp \
            src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp \
            src/video_core/renderer_vulkan/vk_staging_buffer_pool.cpp \
            src/video_core/renderer_vulkan/vk_update_descriptor.cpp; do
            out="profiler-patches/$(basename "$f").patch"
            git -C lab diff --binary "$BASE" HEAD -- "$f" > "$out"
            test -s "$out"
          done
          cp lab/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp eden/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp
          cp lab/src/video_core/renderer_vulkan/vk_adreno_profiler.h eden/src/video_core/renderer_vulkan/vk_adreno_profiler.h

      - name: Apply P0.2 non-scheduler source hooks
        shell: bash
        working-directory: eden
        run: |
          set -e
          for p in \
            ../profiler-patches/vk_buffer_cache.cpp.patch \
            ../profiler-patches/vk_compute_pipeline.cpp.patch \
            ../profiler-patches/vk_graphics_pipeline.cpp.patch \
            ../profiler-patches/vk_staging_buffer_pool.cpp.patch \
            ../profiler-patches/vk_update_descriptor.cpp.patch; do
            git apply --ignore-whitespace "$p"
          done

      - name: Recreate complete current X1 diagnostic chain
        shell: bash
        run: |
          set -e
          python lab/tools/adreno_lab/transplant_dc95_descriptor_ring_profiler.py eden
          python lab/tools/adreno_lab/transplant_dc95_logging_checkboxes.py eden
          python lab/tools/adreno_lab/transplant_dc95_full_flow_hooks.py eden
          python lab/tools/adreno_lab/transplant_dc95_scheduler_flow_profiler.py eden/src/video_core/renderer_vulkan/vk_scheduler.cpp
          python lab/tools/adreno_lab/finalize_dc95_full_flow_profiler.py eden
          python lab/tools/adreno_lab/transplant_dc95_draw_dispatch_correlation.py eden
          python lab/tools/adreno_lab/transplant_dc95_draw_dispatch_ab_controls.py eden
          python lab/tools/adreno_lab/transplant_dc95_draw_other_reasons.py eden
          python lab/tools/adreno_lab/transplant_dc95_texture_fill_reasons.py eden
          python lab/tools/adreno_lab/transplant_dc95_alias_copy_reasons.py eden
          python lab/tools/adreno_lab/transplant_dc95_alias_sync_redundancy.py eden
          python lab/tools/adreno_lab/transplant_dc95_uniform_stream_reuse.py eden
          python lab/tools/adreno_lab/transplant_dc95_uniform_payload_fingerprint.py eden
          python lab/tools/adreno_lab/transplant_dc95_uniform_cache_ab.py eden
          python lab/tools/adreno_lab/transplant_dc95_frame_cadence_attribution.py eden
          python lab/tools/adreno_lab/transplant_dc95_swap_interval_3_to_2_ab.py eden
          python lab/tools/adreno_lab/transplant_dc95_diagnostic_harness.py eden

      - name: Snapshot pre-frame-build state
        shell: bash
        run: |
          set -e
          python -m py_compile \
            lab/tools/adreno_lab/transplant_dc95_frame_build_attribution.py \
            lab/tools/adreno_lab/analyze_x1_frame_build_attribution.py \
            lab/tools/adreno_lab/analyze_x1_frame_cadence.py \
            lab/tools/adreno_lab/analyze_x1_dequeue_attribution.py

          test "$(git -C eden rev-parse HEAD)" = "dc95cd09eea9749250fe31a3072684d341d19417"
          git -C eden diff --check

          grep -q 'x1_frame_cadence_log' eden/src/common/settings.h
          grep -q 'x1_dequeue_attribution_log' eden/src/common/settings.h
          grep -q '\[X1-DEQUEUE\]\[END\]' eden/src/core/hle/service/nvnflinger/buffer_queue_producer.cpp

          mkdir -p pre-frame-build/intended pre-frame-build/critical
          cp eden/src/common/settings.h pre-frame-build/intended/
          cp eden/src/yuzu/configuration/configure_debug.h pre-frame-build/intended/
          cp eden/src/yuzu/configuration/configure_debug.cpp pre-frame-build/intended/
          cp eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp pre-frame-build/intended/
          cp eden/src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp pre-frame-build/intended/

          sha256sum eden/src/core/hle/service/nvnflinger/buffer_queue_producer.cpp > pre-frame-build/critical/producer.sha256
          sha256sum eden/src/core/hle/service/nvnflinger/hardware_composer.cpp > pre-frame-build/critical/composer.sha256
          sha256sum eden/src/core/hle/service/vi/conductor.cpp > pre-frame-build/critical/conductor.sha256
          sha256sum eden/src/video_core/gpu.cpp > pre-frame-build/critical/gpu.sha256
          sha256sum eden/src/video_core/renderer_vulkan/vk_swapchain.cpp > pre-frame-build/critical/swapchain.sha256
          sha256sum eden/src/video_core/renderer_vulkan/vk_scheduler.cpp > pre-frame-build/critical/scheduler.sha256
          sha256sum eden/src/core/hle/service/nvdrv/devices/nvhost_ctrl.cpp > pre-frame-build/critical/nvhost-ctrl.sha256
          sha256sum eden/src/video_core/buffer_cache/buffer_cache.h > pre-frame-build/critical/buffer-cache.sha256
          sha256sum eden/src/video_core/renderer_vulkan/vk_buffer_cache.cpp > pre-frame-build/critical/vk-buffer-cache.sha256

      - name: Apply runtime-selectable frame-build attribution
        shell: bash
        run: |
          set -e
          cp lab/src/video_core/renderer_vulkan/vk_x1_frame_build_profiler.h \
             eden/src/video_core/renderer_vulkan/vk_x1_frame_build_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_frame_build_attribution.py eden

      - name: Verify frame-build attribution before configure
        shell: bash
        run: |
          set -e
          test "$(git -C eden rev-parse HEAD)" = "dc95cd09eea9749250fe31a3072684d341d19417"
          git -C eden diff --check

          grep -q 'x1_frame_build_attribution_log' eden/src/common/settings.h
          grep -q 'X1 Log: Frame Build Attribution' eden/src/yuzu/configuration/configure_debug.cpp
          grep -q '\[X1-FRAMEBUILD\]' eden/src/video_core/renderer_vulkan/vk_x1_frame_build_profiler.h
          grep -q 'RecordPrepareDraw' eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -q 'RecordDispatch' eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -q 'RecordDrawTexture' eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -q 'RecordClear' eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -q 'RecordGraphicsConfigure' eden/src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp
          grep -q 'x1_fill_views_ns' eden/src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp
          grep -q 'x1_descriptor_prepare_ns' eden/src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp

          sha256sum -c pre-frame-build/critical/producer.sha256
          sha256sum -c pre-frame-build/critical/composer.sha256
          sha256sum -c pre-frame-build/critical/conductor.sha256
          sha256sum -c pre-frame-build/critical/gpu.sha256
          sha256sum -c pre-frame-build/critical/swapchain.sha256
          sha256sum -c pre-frame-build/critical/scheduler.sha256
          sha256sum -c pre-frame-build/critical/nvhost-ctrl.sha256
          sha256sum -c pre-frame-build/critical/buffer-cache.sha256
          sha256sum -c pre-frame-build/critical/vk-buffer-cache.sha256

          {
            diff -u pre-frame-build/intended/settings.h eden/src/common/settings.h || true
            diff -u pre-frame-build/intended/configure_debug.h eden/src/yuzu/configuration/configure_debug.h || true
            diff -u pre-frame-build/intended/configure_debug.cpp eden/src/yuzu/configuration/configure_debug.cpp || true
            diff -u pre-frame-build/intended/vk_rasterizer.cpp eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp || true
            diff -u pre-frame-build/intended/vk_graphics_pipeline.cpp eden/src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp || true
          } > frame-build-only.diff
          test -s frame-build-only.diff

          if grep -E '^\+.*(sleep_for|sleep_until|WaitForDequeueCondition\(|WaitForSyncOperation\(|WaitHost\(|ScheduleLoopingEvent\(|RequestComposite\(|SetTarget|SpeedLimit|item\.swap_interval[[:space:]]*=|m_swap_interval[[:space:]]*=|default_max_buffer_count[[:space:]]*=|override_max_buffer_count[[:space:]]*=)' frame-build-only.diff; then
            echo 'ERROR: behavior-changing timing/queue policy leaked into frame-build attribution diff' >&2
            exit 1
          fi

          git -C eden status --short

      - name: Set up MSYS2 CLANGARM64 exactly like Eden Nightly
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure dc95 ARM64 standard build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: ./.ci/build/configure.sh -DCCACHE_PATH=sccache

      - name: Build dc95 ARM64 X1 frame-build attribution
        shell: msys2 {0}
        working-directory: eden
        run: cmake --build build

      - name: Package with Eden CI Windows packager
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: dc95cd09ee-x1-frame-build-attribution
          MSYS_TOOLCHAIN: CLANGARM64
        run: ./.ci/package/windows.sh

      - name: Add analyzers and metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force extras | Out-Null
          Copy-Item lab/tools/adreno_lab/analyze_x1_frame_build_attribution.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_frame_cadence.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_dequeue_attribution.py extras/ -Force
          @'
          Experiment: X1 exact-dc95 runtime-selectable frame-build attribution
          Exact Eden source: dc95cd09eea9749250fe31a3072684d341d19417
          Branch: exp/x1-frame-build-attribution

          Existing diagnostic harness controls remain available.

          New control:
          - X1 Log: Frame Build Attribution

          Recommended first run:
          - Frame Build Attribution ON
          - Frame Cadence ON
          - Dequeue Attribution ON
          - all behavioral A/B controls OFF
          - Scheduler/Present/Pipeline/Upload/QCOM heavy logs OFF
          - Descriptor Ring OFF unless separately needed

          [X1-FRAMEBUILD] reports 120-frame wall-time aggregates for:
          - PrepareDraw total + FlushWork / GPU-memory FlushCaching / pre-config / Configure / post-config
          - GraphicsPipeline::Configure descriptor sync / stage scan / FillImageViews / image-buffer bind /
            graphics-buffer update / descriptor+render-target preparation / ConfigureDraw
          - DispatchCompute total + flush / memory / configure / issue
          - DrawTexture / Clear / FlushCommands / TickFrame
          '@ | Set-Content -Encoding UTF8 extras/FRAME_BUILD_ATTRIBUTION.txt

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-dc95-X1-frame-build-attribution
          path: |
            eden/artifacts/*
            extras/*
          if-no-files-found: error
          retention-days: 14
