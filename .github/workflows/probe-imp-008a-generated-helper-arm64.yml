name: Probe IMP-008A Generated Helper ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-helper:
    runs-on: windows-11-arm
    timeout-minutes: 10

    steps:
      - name: Checkout Eden implementation
        uses: actions/checkout@v4
        with:
          path: eden

      - name: Checkout fixed Oaknut dependency
        uses: actions/checkout@v4
        with:
          repository: eden-emulator/oaknut
          ref: v2.0.3
          path: oaknut

      - name: Set up CLANGARM64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          pacboy: >-
            clang:p boost:p fmt:p unordered_dense:p

      - name: Compile actual Eden production patcher
        shell: msys2 {0}
        run: |
          set -euo pipefail
          clang++ \
            -std=c++20 -Wall -Wextra \
            -D_WIN32 -D_WIN64 -DARCHITECTURE_arm64 -DHAS_NCE \
            -Ieden/src -Ioaknut/include \
            -c eden/src/core/arm/nce/patcher.cpp \
            -o imp008a_patcher.o
          test -s imp008a_patcher.o
          echo "IMP008A_GENERATED_HELPER_PATCHER_COMPILE=PASS"

      - name: Verify bounded Windows helper source
        shell: pwsh
        run: |
          $text = Get-Content -Raw eden/src/core/arm/nce/patcher.cpp
          if ($text -notmatch 'WriteWindowsCurrentNceParametersLookup') { throw 'missing Windows generated context lookup' }
          $header = Get-Content -Raw eden/src/core/arm/nce/windows_generated_context.h
          if ($header -match 'MRS\([^\r\n]*TPIDR_EL0') { throw 'Windows generated helper must not read physical TPIDR_EL0' }
          Write-Output 'IMP008A_GENERATED_HELPER_SOURCE_GUARD=PASS'

      - name: Build and run generated context runtime smoke
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cat > production_link_stubs.cpp <<'EOF'
          #include <cstdlib>
          #include "common/cpu_features.h"
          #include "common/logging.h"

          void AssertFailSoftImpl() {}
          [[noreturn]] void AssertFatalImpl() { std::abort(); }

          namespace Common {
          WallClock::WallClock(bool, u64) noexcept {}
          }

          namespace Common::Log {
          void FmtLogMessageImpl(Class, Level, const char*, unsigned int, const char*,
                                 fmt::string_view, const fmt::format_args&) {}
          } // namespace Common::Log
          EOF

          clang++ \
            -std=c++20 -O2 -ffunction-sections -fdata-sections \
            -D_WIN32 -D_WIN64 -DARCHITECTURE_arm64 -DHAS_NCE -DNDEBUG \
            -Ieden/src -Ioaknut/include \
            eden/probes/windows-arm64-nce-generated-context/production_probe.cpp \
            production_link_stubs.cpp \
            eden/src/core/arm/nce/patcher.cpp \
            -Wl,--gc-sections -lfmt \
            -o imp008a_generated_context_smoke.exe

          ./imp008a_generated_context_smoke.exe
