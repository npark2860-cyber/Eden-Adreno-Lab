name: One-shot dc95 X1 Guest Post Wait Attribution

on:
  push:
    branches:
      - exp/x1-guest-post-wait-attribution
    paths:
      - .github/x1-guest-post-wait-build.trigger

permissions:
  contents: read

jobs:
  build:
    name: dc95 ARM64 / X1 guest post-wait one-shot
    runs-on: windows-11-arm
    timeout-minutes: 180

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard

    steps:
      - name: Checkout Adreno Lab
        uses: actions/checkout@v7
        with:
          path: lab
          fetch-depth: 0

      - name: Checkout Eden CI workflow used by dc95-era nightlies
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Checkout exact known-good Eden source
        uses: actions/checkout@v7
        with:
          repository: eden-emulator/mirror
          ref: dc95cd09eea9749250fe31a3072684d341d19417
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Replay target pre-build and safety checks exactly
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C lab hash-object .github/workflows/build-dc95-x1-guest-post-wait-attribution.yml)" = "4398593085309d25c726884a74ddeeda6b907d0d"
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          root = Path.cwd()
          path = root / 'lab/.github/workflows/build-dc95-x1-guest-post-wait-attribution.yml'
          lines = path.read_text(encoding='utf-8').splitlines()
          stop_name = 'Set up MSYS2 CLANGARM64 exactly like Eden Nightly'
          git_bash = r'C:\Program Files\Git\bin\bash.exe'
          i = 0
          while i < len(lines):
              line = lines[i]
              if not line.startswith('      - name: '):
                  i += 1
                  continue
              name = line[len('      - name: '):]
              if name == stop_name:
                  break
              i += 1
              shell = None
              working_directory = None
              run = None
              while i < len(lines) and not lines[i].startswith('      - name: '):
                  cur = lines[i]
                  if cur.startswith('        shell: '):
                      shell = cur[len('        shell: '):].strip()
                      i += 1
                      continue
                  if cur.startswith('        working-directory: '):
                      working_directory = cur[len('        working-directory: '):].strip()
                      i += 1
                      continue
                  if cur == '        run: |':
                      i += 1
                      block = []
                      while i < len(lines):
                          body = lines[i]
                          if body.startswith('          '):
                              block.append(body[10:])
                              i += 1
                              continue
                          if body == '':
                              block.append('')
                              i += 1
                              continue
                          break
                      run = '\n'.join(block)
                      continue
                  if cur.startswith('        run: '):
                      run = cur[len('        run: '):]
                      i += 1
                      continue
                  i += 1
              if run is None:
                  continue
              if shell != 'bash':
                  raise SystemExit(f'unexpected pre-build shell for {name}: {shell!r}')
              cwd = root / working_directory if working_directory else root
              print(f'::group::{name}', flush=True)
              subprocess.run([git_bash, '--noprofile', '--norc', '-e', '-o', 'pipefail', '-c', run], cwd=cwd, env=os.environ.copy(), check=True)
              print('::endgroup::', flush=True)
          else:
              raise SystemExit('MSYS2 stop step not found in target workflow')
          PY

      - name: Set up MSYS2 CLANGARM64 exactly like Eden Nightly
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure dc95 ARM64 standard build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: ./.ci/build/configure.sh -DCCACHE_PATH=sccache

      - name: Build dc95 ARM64 X1 guest post-wait attribution
        shell: msys2 {0}
        working-directory: eden
        run: cmake --build build

      - name: Package with Eden CI Windows packager
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: dc95cd09ee-x1-guest-post-wait-attribution
          MSYS_TOOLCHAIN: CLANGARM64
        run: ./.ci/package/windows.sh

      - name: Add analyzers and metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force extras | Out-Null
          Copy-Item lab/tools/adreno_lab/analyze_x1_guest_post_wait_attribution.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_nvdrv_ipc_dispatch_gap.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_guest_submit_thread_attribution.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_gpu_submit_gap_attribution.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_gpu_command_attribution.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_frame_build_attribution.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_frame_cadence.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_dequeue_attribution.py extras/ -Force
          @'
          Experiment: X1 exact-dc95 guest post-wait attribution
          Exact Eden source: dc95cd09eea9749250fe31a3072684d341d19417
          Branch: exp/x1-guest-post-wait-attribution
          One-shot wrapper: corrected explicit Git Bash replay
          '@ | Set-Content -Encoding UTF8 extras/GUEST_POST_WAIT_ATTRIBUTION.txt

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-dc95-X1-guest-post-wait-attribution
          path: |
            eden/artifacts/*
            extras/*
          if-no-files-found: error
          retention-days: 14
