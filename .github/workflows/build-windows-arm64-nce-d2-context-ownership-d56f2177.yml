name: Build Windows ARM64 NCE D2 context ownership diagnostic

on:
  push:
    branches:
      - diag/windows-nce-d2-context-ownership-d56f2177
    paths:
      - .github/diagnostics/d2-context-ownership-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-d2-context-ownership-d56f2177
  cancel-in-progress: false

env:
  BASE_SHA: d56f2177ea94419b8cda96f644f3e4f4ec958b9e
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: d2-context-ownership

jobs:
  build-package:
    name: Windows ARM64 NCE D2 context ownership diagnostic
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact diagnostic Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/d2-context-ownership/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact diagnostic scope and preserved D2 contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$SOURCE" merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=no)"
          git -C "$SOURCE" diff --check "$BASE_SHA" "$GITHUB_SHA"

          CHANGED="$(git -C "$SOURCE" diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(src/core/arm/nce/arm_nce\.h|src/core/arm/nce/arm_nce_windows\.cpp|src/common/host_memory\.cpp|\.github/workflows/build-windows-arm64-nce-d2-context-ownership-d56f2177\.yml|\.github/diagnostics/d2-context-ownership-trigger\.txt)$' || true)"
          test -z "$UNEXPECTED"

          # D1/D2 production contracts remain present and untouched outside diagnostic insertions.
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp" | grep -Fq 'm_guest_ctx.nzcv = ctx.pstate & 0xF0000000U;'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp" | grep -Fq 'guest.windows_guest_stack_limit'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp" | grep -Fq 'NCE_V74_AV_PROVENANCE_RETURNED'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/windows_nce_entry.asm" | grep -Fq 'stp     x14, x15, [x18, #WindowsTebStackBase]'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/patcher.cpp" | grep -Fq 'cg.STP(X3, X4, X18, WindowsTebStackBaseOffset);'

          # Diagnostic invariants: raw route publication only in guest-stack paths, flush on host return,
          # and logging hard caps. No GuestContext/ASM layout changes are allowed by the whitelist.
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce.h" | grep -Fq 'm_windows_diag_veh_seq'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce.h" | grep -Fq 'm_windows_diag_break_seq'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp" | grep -Fq 'NCE_D2_CTX_RETURN'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp" | grep -Fq 'NCE_D2_CTX_INVALID_GUEST_PC'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp" | grep -Fq 'WindowsNceDiagRoute::VehAccessViolation'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp" | grep -Fq 'WindowsNceDiagRoute::BreakRedirect'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp" | grep -Fq 'm_windows_diag_return_logs < 128'
          git -C "$SOURCE" show "$GITHUB_SHA:src/common/host_memory.cpp" | grep -Fq 'exact_placeholder_count <= 16'
          git -C "$SOURCE" show "$GITHUB_SHA:src/common/host_memory.cpp" | grep -Fq '(exact_placeholder_count & (exact_placeholder_count - 1)) == 0'

          git -C "$SOURCE" diff "$BASE_SHA" "$GITHUB_SHA" --             src/core/arm/nce/arm_nce.h             src/core/arm/nce/arm_nce_windows.cpp             src/common/host_memory.cpp > "$PROV/D2_CONTEXT_OWNERSHIP_DIAG.diff"

          printf 'BASE_SHA=%s\nDIAG_SHA=%s\nSOURCE_MODE=exact Git object\nHYPOTHESIS=host execution state may be misclassified and saved into GuestContext on a VEH or cross-thread-break route\nSCOPE=fixed provenance slots + safe host-return flush + V18 log de-spam only\nCLOSED_REGRESSIONS=not rerun\nISOLATION_DIR=build/validation/%s/%s\n'             "$BASE_SHA" "$GITHUB_SHA" "$GITHUB_SHA" "$TEST_NAME" > "$PROV/BUILD_INFO.txt"

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: ${{ env.CI_REF }}
          path: build/validation/${{ github.sha }}/d2-context-ownership/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: false
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure diagnostic Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-context-ownership/source
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'arm_nce_windows.cpp' build/compile_commands.json
          grep -Fq 'host_memory.cpp' build/compile_commands.json
          printf 'CONFIGURE_COMMAND=./.ci/build/configure.sh -DCCACHE_PATH=sccache\nNCE_COMPILE_GUARD=HAS_NCE=1\n' >> ../provenance/BUILD_INFO.txt

      - name: Build full Windows ARM64 Eden diagnostic
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-context-ownership/source
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          printf 'FULL_BUILD_COMMAND=cmake --build build\n' >> ../provenance/BUILD_INFO.txt

      - name: Package Windows ARM64 Eden diagnostic
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-context-ownership/source
        env:
          ARTIFACT_REF: nce-d2-context-ownership-d56f2177
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          printf 'PACKAGE_COMMAND=./.ci/package/windows.sh\nARTIFACT_REF=nce-d2-context-ownership-d56f2177\n' >> ../provenance/BUILD_INFO.txt

      - name: Prepare diagnostic upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged Eden artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash
          "PACKAGE_FILE=$($files[0].Name)" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          "PACKAGE_SHA256=$hash" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')

      - name: Upload diagnostic package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-D2-CONTEXT-OWNERSHIP-DIAG
          path: build/validation/${{ github.sha }}/d2-context-ownership/upload/*
          if-no-files-found: error
          retention-days: 14
