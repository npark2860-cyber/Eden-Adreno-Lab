name: Probe IMP-008D D1 Data Fault Skip Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008d-windows-nce-data-fault-runtime
    paths:
      - '.github/workflows/probe-imp-008d-d1-data-fault-skip-arm64.yml'
      - 'probes/windows-arm64-nce-fault-d1/**'

permissions:
  contents: read

jobs:
  d1-data-fault-skip-runtime:
    runs-on: windows-11-arm
    timeout-minutes: 120

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout IMP-008D branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Checkout fixed dc95-era Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Verify D1 scope contract
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          probe='probes/windows-arm64-nce-fault-d1/data_fault_skip_runtime.cpp'
          test -f "$probe"
          grep -Fq 'Settings::CpuBackend::Nce' "$probe"
          grep -Fq 'Settings::SetNceEnabled(true)' "$probe"
          grep -Fq 'KProcess::Create(kernel)' "$probe"
          grep -Fq 'process->LoadFromMetadata' "$probe"
          grep -Fq 'KThread::InitializeDummyThread' "$probe"
          grep -Fq 'process->GetArmInterface(0)' "$probe"
          grep -Fq 'Core::NCE::Patcher' "$probe"
          grep -Fq 'GuestLdrX3X2 = 0xF9400043U' "$probe"
          grep -Fq 'GuestSvc33 = 0xD4000661U' "$probe"
          grep -Fq 'StackPages = 16' "$probe"
          grep -Fq 'AddVectoredExceptionHandler(1, &D1ObservationVeh)' "$probe"
          grep -Fq 'EXCEPTION_ACCESS_VIOLATION' "$probe"
          grep -Fq 'Core::HaltReason::SupervisorCall' "$probe"
          grep -Fq 'ReadPhysicalX18()' "$probe"
          grep -Fq 'arm->RunThread(thread)' "$probe"
          grep -Fq 'WriteFile(' "$probe"
          if grep -Fq 'InvalidateNCE(' "$probe"; then
            echo 'D1 must not directly exercise or modify InvalidateNCE' >&2
            exit 61
          fi
          if grep -Fq 'dynamic_cast<' "$probe"; then
            echo 'D1 must preserve normal -fno-rtti product contract' >&2
            exit 62
          fi
          if grep -Fq 'IMP008D_D1_EXCEPTION_CODE=' "$probe"; then
            echo 'D1 runtime AV observer must not use stderr formatting' >&2
            exit 63
          fi
          echo 'IMP008D_D1_SCOPE_SOURCE=PASS'

      - name: Apply bounded D1 exception-sequence diagnostic
        shell: pwsh
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'probes/windows-arm64-nce-fault-d1/data_fault_skip_runtime.cpp'
          $text = [System.IO.File]::ReadAllText($path).Replace("`r`n", "`n")

          $defsPattern = '(?s)constexpr u32 D1ObservationVersion = 1;\n\nstruct D1FirstExceptionRecord \{.*?\nD1FirstExceptionRecord g_first_exception_record\{\};'
          $defsReplacement = @'
          constexpr u32 D1ObservationVersion = 2;
          constexpr u32 D1ObservationMaxRecords = 16;

          struct D1ExceptionRecord {
              u64 magic;
              u32 version;
              u32 sequence;
              u32 exception_code;
              u32 parameter_count;
              u64 exception_address;
              u64 pc;
              u64 sp;
              u64 info0;
              u64 info1;
          };
          static_assert(sizeof(D1ExceptionRecord) == 64);

          HANDLE g_observation_file = INVALID_HANDLE_VALUE;
          std::atomic<u32> g_observation_sequence{};
          D1ExceptionRecord g_exception_records[D1ObservationMaxRecords]{};
          '@.Replace("`r`n", "`n").Trim()
          $defsMatches = [regex]::Matches($text, $defsPattern).Count
          if ($defsMatches -ne 1) {
            throw "D1 sequence definitions match count was $defsMatches, expected 1"
          }
          $text = [regex]::Replace($text, $defsPattern, $defsReplacement, 1)

          $observerPattern = '(?s)    u32 observation_expected = 0;\n    if \(g_observation_seen\.compare_exchange_strong\(observation_expected, 1,.*?\n    \}\n\n    if \(record\.ExceptionCode'
          $observerReplacement = @'
              const u32 sequence = g_observation_sequence.fetch_add(1, std::memory_order_acq_rel);
              g_observation_seen.store(1, std::memory_order_release);
              if (sequence < D1ObservationMaxRecords) {
                  auto& observed = g_exception_records[sequence];
                  observed.magic = D1ObservationMagic;
                  observed.version = D1ObservationVersion;
                  observed.sequence = sequence;
                  observed.exception_code = static_cast<u32>(record.ExceptionCode);
                  observed.parameter_count = static_cast<u32>(record.NumberParameters);
                  observed.exception_address = reinterpret_cast<u64>(record.ExceptionAddress);
                  observed.pc = static_cast<u64>(exception->ContextRecord->Pc);
                  observed.sp = static_cast<u64>(exception->ContextRecord->Sp);
                  observed.info0 =
                      record.NumberParameters >= 1 ? static_cast<u64>(record.ExceptionInformation[0]) : 0;
                  observed.info1 =
                      record.NumberParameters >= 2 ? static_cast<u64>(record.ExceptionInformation[1]) : 0;

                  DWORD bytes_written{};
                  WriteFile(g_observation_file, &observed, static_cast<DWORD>(sizeof(observed)),
                            &bytes_written, nullptr);
              }

              if (record.ExceptionCode
          '@.Replace("`r`n", "`n").TrimEnd()
          $observerMatches = [regex]::Matches($text, $observerPattern).Count
          if ($observerMatches -ne 1) {
            throw "D1 observer body match count was $observerMatches, expected 1"
          }
          $text = [regex]::Replace($text, $observerPattern, $observerReplacement, 1)

          $resetOld = '    g_first_exception_record = {};'
          $resetNew = '    g_observation_sequence.store(0, std::memory_order_release);'
          if (($text.IndexOf($resetOld, [System.StringComparison]::Ordinal)) -lt 0) {
            throw 'D1 first-record reset was not found exactly where expected'
          }
          $text = $text.Replace($resetOld, $resetNew)

          $oldName = 'imp008d-d1-first-exception.bin'
          $newName = 'imp008d-d1-exception-sequence.bin'
          $nameMatches = ([regex]::Matches($text, [regex]::Escape($oldName))).Count
          if ($nameMatches -ne 1) {
            throw "D1 raw filename match count was $nameMatches, expected 1"
          }
          $text = $text.Replace($oldName, $newName)

          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

          if (-not (Select-String -Path $path -SimpleMatch 'D1ObservationMaxRecords = 16' -Quiet)) {
            throw 'D1 bounded record count was not installed'
          }
          if (-not (Select-String -Path $path -SimpleMatch 'g_observation_sequence.fetch_add' -Quiet)) {
            throw 'D1 sequence counter was not installed'
          }
          if (-not (Select-String -Path $path -SimpleMatch 'imp008d-d1-exception-sequence.bin' -Quiet)) {
            throw 'D1 sequence raw filename was not installed'
          }
          if (Select-String -Path $path -SimpleMatch 'imp008d-d1-first-exception.bin' -Quiet) {
            throw 'D1 first-exception filename remains after sequence patch'
          }
          if (Select-String -Path $path -SimpleMatch 'IMP008D_D1_EXCEPTION_CODE=' -Quiet) {
            throw 'D1 runtime observer stderr formatting reappeared'
          }
          if (-not (Select-String -Path $path -SimpleMatch 'WriteFile(g_observation_file' -Quiet)) {
            throw 'D1 raw WriteFile observer was unexpectedly removed'
          }
          Write-Host 'IMP008D_D1_BOUNDED_SEQUENCE_PATCH=PASS'

      - name: Add D1 target to checkout only
        shell: bash
        working-directory: eden
        run: |
          cat >> src/yuzu_cmd/CMakeLists.txt <<'CMAKE'

          # IMP-008D D1 CI-only executable. Reuse the normal Eden CLI product dependency contract.
          file(WRITE "${CMAKE_BINARY_DIR}/imp008d_d1_vma.cpp"
              "#define VMA_IMPLEMENTATION\n#include \"video_core/vulkan_common/vma.h\"\n")
          add_executable(imp008d_d1_data_fault_skip
              ${CMAKE_SOURCE_DIR}/probes/windows-arm64-nce-fault-d1/data_fault_skip_runtime.cpp
              ${CMAKE_BINARY_DIR}/imp008d_d1_vma.cpp)
          target_include_directories(imp008d_d1_data_fault_skip PRIVATE ${CMAKE_SOURCE_DIR}/src)
          target_link_libraries(imp008d_d1_data_fault_skip PRIVATE
              common core input_common frontend_common video_core merry::oaknut)
          target_link_libraries(imp008d_d1_data_fault_skip PRIVATE ${PLATFORM_LIBRARIES} Threads::Threads)
          CMAKE
          echo 'IMP008D_D1_TARGET_WIRING=PASS'

      - name: Set up normal Eden CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure normal Windows ARM64 product build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'arm_nce_windows.cpp' build/compile_commands.json
          grep -Fq 'windows-arm64-nce-fault-d1/data_fault_skip_runtime.cpp' build/compile_commands.json
          grep -Fq 'windows_nce_entry.obj' build/build.ninja
          grep -Fq -- '-fno-rtti' build/compile_commands.json
          echo 'IMP008D_D1_NORMAL_CONFIGURE=PASS'

      - name: Build and run D1 product-linked executable
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build --target imp008d_d1_data_fault_skip --parallel
          exe="$(find build -type f -name 'imp008d_d1_data_fault_skip.exe' -print -quit)"
          test -n "$exe"
          echo "IMP008D_D1_EXECUTABLE=$exe"
          winexe="$(cygpath -w "$exe")"
          winout="$(cygpath -w imp008d-d1.out.log)"
          winerr="$(cygpath -w imp008d-d1.err.log)"
          set +e
          powershell.exe -NoProfile -NonInteractive -Command "& {
            \$ErrorActionPreference = 'Stop'
            try {
              \$psi = New-Object System.Diagnostics.ProcessStartInfo
              \$psi.FileName = '$winexe'
              \$psi.UseShellExecute = \$false
              \$psi.CreateNoWindow = \$true
              \$psi.RedirectStandardOutput = \$true
              \$psi.RedirectStandardError = \$true
              \$p = New-Object System.Diagnostics.Process
              \$p.StartInfo = \$psi
              if (-not \$p.Start()) {
                throw 'System.Diagnostics.Process.Start returned false'
              }
              \$stdoutTask = \$p.StandardOutput.ReadToEndAsync()
              \$stderrTask = \$p.StandardError.ReadToEndAsync()
              if (-not \$p.WaitForExit(30000)) {
                Write-Host 'IMP008D_D1_PROCESS_TIMEOUT=FAIL'
                \$p.Kill()
                \$p.WaitForExit()
                exit 124
              }
              \$p.WaitForExit()
              [System.IO.File]::WriteAllText('$winout', \$stdoutTask.Result)
              [System.IO.File]::WriteAllText('$winerr', \$stderrTask.Result)
              \$nativeExit = [int]\$p.ExitCode
              Write-Host ('IMP008D_D1_PROCESS_EXIT=' + \$nativeExit)
              Write-Host ('IMP008D_D1_PROCESS_EXIT_HEX=0x{0:X8}' -f (\$nativeExit -band 0xffffffff))
              if (\$nativeExit -eq 0) { exit 0 }
              exit 1
            } catch {
              Write-Host ('IMP008D_D1_LAUNCH_EXCEPTION=' + \$_.Exception.Message)
              Write-Host ('IMP008D_D1_LAUNCH_HRESULT=0x{0:X8}' -f (\$_.Exception.HResult -band 0xffffffff))
              if (\$_.Exception.InnerException) {
                Write-Host ('IMP008D_D1_LAUNCH_INNER=' + \$_.Exception.InnerException.Message)
              }
              exit 125
            }
          }"
          rc=$?
          set -e
          cat imp008d-d1.out.log 2>/dev/null || true
          cat imp008d-d1.err.log >&2 2>/dev/null || true
          : > imp008d-d1-sequence.log
          if test -f imp008d-d1-exception-sequence.bin; then
            winobs="$(cygpath -w imp008d-d1-exception-sequence.bin)"
            powershell.exe -NoProfile -NonInteractive -Command "& {
              \$b = [System.IO.File]::ReadAllBytes('$winobs')
              \$recordSize = 64
              \$count = [int][Math]::Floor(\$b.Length / \$recordSize)
              Write-Host ('IMP008D_D1_SEQ_SIZE=' + \$b.Length)
              Write-Host ('IMP008D_D1_SEQ_COUNT=' + \$count)
              Write-Host ('IMP008D_D1_SEQ_TRAILING_BYTES=' + (\$b.Length % \$recordSize))
              for (\$i = 0; \$i -lt \$count; \$i++) {
                \$o = \$i * \$recordSize
                Write-Host ('IMP008D_D1_SEQ_{0:D2}_MAGIC=0x{1:X16}' -f \$i, [BitConverter]::ToUInt64(\$b, \$o + 0))
                Write-Host ('IMP008D_D1_SEQ_{0:D2}_VERSION={1}' -f \$i, [BitConverter]::ToUInt32(\$b, \$o + 8))
                Write-Host ('IMP008D_D1_SEQ_{0:D2}_INDEX={1}' -f \$i, [BitConverter]::ToUInt32(\$b, \$o + 12))
                Write-Host ('IMP008D_D1_SEQ_{0:D2}_CODE=0x{1:X8}' -f \$i, [BitConverter]::ToUInt32(\$b, \$o + 16))
                Write-Host ('IMP008D_D1_SEQ_{0:D2}_PARAMS={1}' -f \$i, [BitConverter]::ToUInt32(\$b, \$o + 20))
                Write-Host ('IMP008D_D1_SEQ_{0:D2}_ADDRESS=0x{1:X16}' -f \$i, [BitConverter]::ToUInt64(\$b, \$o + 24))
                Write-Host ('IMP008D_D1_SEQ_{0:D2}_PC=0x{1:X16}' -f \$i, [BitConverter]::ToUInt64(\$b, \$o + 32))
                Write-Host ('IMP008D_D1_SEQ_{0:D2}_SP=0x{1:X16}' -f \$i, [BitConverter]::ToUInt64(\$b, \$o + 40))
                Write-Host ('IMP008D_D1_SEQ_{0:D2}_INFO0=0x{1:X16}' -f \$i, [BitConverter]::ToUInt64(\$b, \$o + 48))
                Write-Host ('IMP008D_D1_SEQ_{0:D2}_INFO1=0x{1:X16}' -f \$i, [BitConverter]::ToUInt64(\$b, \$o + 56))
              }
            }" | tee imp008d-d1-sequence.log
          else
            echo 'IMP008D_D1_SEQ_FILE=ABSENT' | tee imp008d-d1-sequence.log
          fi
          echo "IMP008D_D1_LAUNCH_RC=$rc"
          test "$rc" -eq 0
          grep -Fq 'IMP008D_D1_REAL_APPLICATION_PROCESS=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_REAL_KTHREAD=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_NCE_SELECTED=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_GUEST_UNMAPPED_TARGET=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_READ_AV_PREFLIGHT=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_PHYSICAL_X18_TEB_BEFORE=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_RUNTHREAD_RETURNED=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_DATA_AV=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_PC_NE_FAULT=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_SUPERVISOR_CALL_RETURN=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_SKIP_PC_EXACT=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_X3_SENTINEL=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_CONTEXT_COHERENT=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_PHYSICAL_X18_TEB_AFTER=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_GATE=PASS' imp008d-d1.out.log
          grep -Fq 'IMP008D_D1_SEQ_COUNT=1' imp008d-d1-sequence.log || true
          grep -Fq 'IMP008D_D1_SEQ_00_CODE=0xC0000005' imp008d-d1-sequence.log
          grep -Fq 'IMP008D_D1_SEQ_00_PARAMS=2' imp008d-d1-sequence.log
          grep -Fq 'IMP008D_D1_SEQ_00_INFO0=0x0000000000000000' imp008d-d1-sequence.log
          grep -Fq 'IMP008D_D1_SVC_NUMBER=0x33' imp008d-d1.err.log
