name: Build Windows ARM64 NCE D2 breakpoint debug-event provenance

on:
  push:
    branches:
      - diag/windows-nce-d2-breakpoint-debug-event-2f0d41b
    paths:
      - .github/diagnostics/d2-breakpoint-debug-event-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-d2-breakpoint-debug-event-2f0d41b
  cancel-in-progress: false

env:
  BASE_SHA: 2f0d41b173b4f9ae0d4e0b96cb61402c9ea5cd0e
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: d2-breakpoint-debug-event

jobs:
  build-package:
    name: Windows ARM64 NCE D2 breakpoint debug-event provenance
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact diagnostic Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/d2-breakpoint-debug-event/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify debugger-watchdog-only scope
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$SOURCE" merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          git -C "$SOURCE" diff --check "$BASE_SHA" "$GITHUB_SHA"

          CHANGED="$(git -C "$SOURCE" diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(src/yuzu/main\.cpp|\.github/workflows/build-windows-arm64-nce-d2-breakpoint-debug-event-2f0d41b\.yml|\.github/diagnostics/d2-breakpoint-debug-event-trigger\.txt)$' || true)"
          test -z "$UNEXPECTED"

          # Runtime/NCE implementation is frozen exactly at the 8ec479cd base.
          test -z "$(git -C "$SOURCE" diff "$BASE_SHA" "$GITHUB_SHA" --             src/core/arm/nce             src/common/host_memory.cpp             src/common/host_memory.h             src/common/host_memory_windows_lease.h             src/core/hle/kernel/physical_core.cpp             src/core/hle/kernel/physical_core.h)"

          SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/yuzu/main.cpp")"
          printf '%s\n' "$SRC" | grep -Fq 'NCE_D2_FASTFAIL_DEBUG'
          printf '%s\n' "$SRC" | grep -Fq 'DebugActiveProcess(parent_pid)'
          printf '%s\n' "$SRC" | grep -Fq 'WaitForDebugEvent(&event, INFINITE)'
          printf '%s\n' "$SRC" | grep -Fq 'DBG_EXCEPTION_NOT_HANDLED'
          printf '%s\n' "$SRC" | grep -Fq 'D2FastFailExceptionCode = 0xC0000409'
          printf '%s\n' "$SRC" | grep -Fq 'record.ExceptionInformation[0]'
          printf '%s\n' "$SRC" | grep -Fq 'context.X[18]'
          printf '%s\n' "$SRC" | grep -Fq 'ReadProcessMemory'
          printf '%s\n' "$SRC" | grep -Fq 'stack_base='
          printf '%s\n' "$SRC" | grep -Fq 'stack_limit='
          printf '%s\n' "$SRC" | grep -Fq 'ResolveD2FastFailModule'
          printf '%s\n' "$SRC" | grep -Fq 'pc_module='
          printf '%s\n' "$SRC" | grep -Fq 'frame_lr_module='
          printf '%s\n' "$SRC" | grep -Fq 'instruction_minus4='
          printf '%s\n' "$SRC" | grep -Fq 'instruction_plus4='
          printf '%s\n' "$SRC" | grep -Fq 'x0=0x%016llX'
          printf '%s\n' "$SRC" | grep -Fq '0x0000FFFFFFFFFFFFULL'
          printf '%s\n' "$SRC" | grep -Fq 'frame_lr_resolved='
          printf '%s\n' "$SRC" | grep -Fq 'frame_lr_pac_stripped='
          printf '%s\n' "$SRC" | grep -Fq 'NCE_D2_BREAKPOINT_DEBUG_EVENT'
          printf '%s\n' "$SRC" | grep -Fq 'consumed_as_attach='
          printf '%s\n' "$SRC" | grep -Fq 'breakpoint_sequence'
          printf '%s\n' "$SRC" | grep -Fq 'instruction_exception='
          printf '%s\n' "$SRC" | grep -Fq 'bcr7='

          git -C "$SOURCE" diff "$BASE_SHA" "$GITHUB_SHA" -- src/yuzu/main.cpp             > "$PROV/D2_BREAKPOINT_DEBUG_EVENT.diff"

          printf 'BASE_SHA=%s\nDIAG_SHA=%s\nSOURCE_MODE=exact Git object\nHYPOTHESIS=2f0d41b reproduced unmatched EXCEPTION_BREAKPOINT at non-BRK HostStackBridge with all BCR/BVR zero; capture the Windows debugger event before VEH\nSCOPE=out-of-process breakpoint debug-event provenance only; NCE/runtime frozen at base\nCAPTURE=all EXCEPTION_BREAKPOINT debug events: sequence/attach-consume flag + ExceptionRecord + PC/SP/LR/X18 + instructions/modules + BCR/BVR\n'             "$BASE_SHA" "$GITHUB_SHA" > "$PROV/BUILD_INFO.txt"

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: ${{ env.CI_REF }}
          path: build/validation/${{ github.sha }}/d2-breakpoint-debug-event/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: false
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-breakpoint-debug-event/source
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json

      - name: Build full Windows ARM64 Eden diagnostic
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-breakpoint-debug-event/source
        run: |
          set -euo pipefail
          cmake --build build

      - name: Package Windows ARM64 Eden diagnostic
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-breakpoint-debug-event/source
        env:
          ARTIFACT_REF: nce-d2-breakpoint-debug-event-2f0d41b
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh

      - name: Prepare upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force

      - name: Upload diagnostic package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-D2-BREAKPOINT-DEBUG-EVENT
          path: build/validation/${{ github.sha }}/d2-breakpoint-debug-event/upload/*
          if-no-files-found: error
          retention-days: 14
