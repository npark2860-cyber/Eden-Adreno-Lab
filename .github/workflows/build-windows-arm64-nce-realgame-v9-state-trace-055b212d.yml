name: Build Windows ARM64 NCE real-game V9 state trace 055b212d

on:
  workflow_dispatch:
  push:
    branches:
      - fix/windows-nce-realgame-regression-v9-state-trace-055b212d
    paths:
      - .github/workflows/build-windows-arm64-nce-realgame-v9-state-trace-055b212d.yml
      - .github/diagnostics/apply-windows-nce-realgame-v9-state-trace.py

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-realgame-v9-state-trace-055b212d
  cancel-in-progress: false

env:
  SOURCE_SHA: 055b212df86dbfc18257b127ee5a0cbfda8ff861
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: realgame-v9-state-trace-055b212d
  V6_SCRIPT_PATH: .github/diagnostics/apply-windows-nce-realgame-v6-minimal.py
  V7_SCRIPT_PATH: .github/diagnostics/apply-windows-nce-realgame-v7-veh-lease.py
  V8_SCRIPT_PATH: .github/diagnostics/apply-windows-nce-realgame-v8-post-stacklimit.py
  V9_SCRIPT_PATH: .github/diagnostics/apply-windows-nce-realgame-v9-state-trace.py
  TRANSITION_SCRIPT_PATH: .github/diagnostics/apply-windows-nce-stacktop-transition-ab.py
  V4_SCRIPT_PATH: .github/diagnostics/apply-windows-nce-transition-breadcrumb-v4.py

jobs:
  build-package:
    name: Windows ARM64 NCE real-game V9 state trace package
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout diagnostic control Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/realgame-v9-state-trace-055b212d/control
          fetch-depth: 0

      - name: Checkout exact frozen production source
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: 055b212df86dbfc18257b127ee5a0cbfda8ff861
          path: build/validation/${{ github.sha }}/realgame-v9-state-trace-055b212d/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify Git-object provenance and apply V9 transforms
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          CONTROL="$ROOT/control"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$CONTROL" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=no)"

          for p in "$V6_SCRIPT_PATH" "$V7_SCRIPT_PATH" "$V8_SCRIPT_PATH" "$V9_SCRIPT_PATH" "$TRANSITION_SCRIPT_PATH" "$V4_SCRIPT_PATH"; do
            git -C "$CONTROL" show "$GITHUB_SHA:$p" > "$PROV/$(basename "$p").git-object"
          done
          git -C "$SOURCE" show "$SOURCE_SHA:src/core/arm/nce/arm_nce_windows.cpp" > "$PROV/arm_nce_windows.cpp.base.git-object"
          git -C "$SOURCE" show "$SOURCE_SHA:src/core/arm/nce/windows_nce_transition.cpp" > "$PROV/windows_nce_transition.cpp.base.git-object"
          git -C "$SOURCE" show "$SOURCE_SHA:src/core/arm/nce/windows_nce_transition.h" > "$PROV/windows_nce_transition.h.base.git-object"
          git -C "$SOURCE" show "$SOURCE_SHA:src/core/arm/nce/windows_nce_entry.asm" > "$PROV/windows_nce_entry.asm.base.git-object"
          git -C "$SOURCE" show "$SOURCE_SHA:src/core/arm/nce/windows_x18_fallback_runner.cpp" > "$PROV/windows_x18_fallback_runner.cpp.base.git-object"

          python "$PROV/$(basename "$V6_SCRIPT_PATH").git-object" "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          python "$PROV/$(basename "$TRANSITION_SCRIPT_PATH").git-object" "$SOURCE/src/core/arm/nce/windows_nce_transition.cpp"
          python "$PROV/$(basename "$V4_SCRIPT_PATH").git-object" "$SOURCE/src/core/arm/nce/windows_nce_transition.cpp"
          python "$PROV/$(basename "$V7_SCRIPT_PATH").git-object" "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          python "$PROV/$(basename "$V8_SCRIPT_PATH").git-object" \
            "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp" \
            "$SOURCE/src/core/arm/nce/windows_nce_transition.h" \
            "$SOURCE/src/core/arm/nce/windows_nce_entry.asm"
          python "$PROV/$(basename "$V9_SCRIPT_PATH").git-object" \
            "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp" \
            "$SOURCE/src/core/arm/nce/windows_x18_fallback_runner.cpp"

          git -C "$SOURCE" diff --check
          grep -Fq 'guest_sp_value <= allocation_base || guest_sp_value > allocation_end' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'guest->sp <= allocation_base || guest->sp > allocation_end' "$SOURCE/src/core/arm/nce/windows_nce_transition.cpp"
          grep -Fq 'guest_stack_limit' "$SOURCE/src/core/arm/nce/windows_nce_transition.h"
          grep -Fq 'str     x30, [x18, #16]' "$SOURCE/src/core/arm/nce/windows_nce_entry.asm"
          grep -Fq 'NCE_V9_FAULT' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'NCE_V9_X18_BEFORE' "$SOURCE/src/core/arm/nce/windows_x18_fallback_runner.cpp"
          grep -Fq 'NCE_V9_X18_AFTER' "$SOURCE/src/core/arm/nce/windows_x18_fallback_runner.cpp"
          if grep -Fq 'NCE_REALGAME_DIAG_TEB' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"; then
            echo 'Unexpected V2 telemetry remained in V9 source' >&2
            exit 1
          fi

          git -C "$SOURCE" diff -- src/core/arm/nce/arm_nce_windows.cpp > "$PROV/arm_nce_windows.cpp.v9.diff"
          git -C "$SOURCE" diff -- src/core/arm/nce/windows_nce_transition.cpp > "$PROV/windows_nce_transition.cpp.v9.diff"
          git -C "$SOURCE" diff -- src/core/arm/nce/windows_nce_transition.h > "$PROV/windows_nce_transition.h.v9.diff"
          git -C "$SOURCE" diff -- src/core/arm/nce/windows_nce_entry.asm > "$PROV/windows_nce_entry.asm.v9.diff"
          git -C "$SOURCE" diff -- src/core/arm/nce/windows_x18_fallback_runner.cpp > "$PROV/windows_x18_fallback_runner.cpp.v9.diff"

          printf 'SOURCE_SHA=%s\nDIAG_COMMIT_SHA=%s\nSOURCE_MODE=frozen Git object + V6/V7 diagnostics + V8 StackLimit fix + V9 host-safe state trace only\nISOLATION_DIR=build/validation/%s/%s\n' \
            "$SOURCE_SHA" "$GITHUB_SHA" "$GITHUB_SHA" "$TEST_NAME" > "$PROV/BUILD_INFO.txt"
          echo 'REALGAME_V9_GIT_OBJECT_GUARD=PASS'

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: build/validation/${{ github.sha }}/realgame-v9-state-trace-055b212d/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure V9 Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/realgame-v9-state-trace-055b212d/source
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          printf 'CONFIGURE_COMMAND=./.ci/build/configure.sh -DCCACHE_PATH=sccache\nNCE_COMPILE_GUARD=HAS_NCE=1\n' >> ../provenance/BUILD_INFO.txt
          echo 'REALGAME_V9_CONFIGURE=PASS'

      - name: Build full Windows ARM64 Eden V9 package
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/realgame-v9-state-trace-055b212d/source
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          printf 'BUILD_COMMAND=cmake --build build\n' >> ../provenance/BUILD_INFO.txt
          echo 'REALGAME_V9_BUILD=PASS'

      - name: Package Windows ARM64 Eden V9
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/realgame-v9-state-trace-055b212d/source
        env:
          ARTIFACT_REF: nce-realgame-v9-state-trace-055b212d
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          printf 'PACKAGE_COMMAND=./.ci/package/windows.sh\nARTIFACT_REF=nce-realgame-v9-state-trace-055b212d\n' >> ../provenance/BUILD_INFO.txt
          echo 'REALGAME_V9_PACKAGE=PASS'

      - name: Prepare V9 upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged Eden artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash
          "PACKAGE_FILE=$($files[0].Name)" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          "PACKAGE_SHA256=$hash" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          Get-Content (Join-Path $upload 'BUILD_INFO.txt')

      - name: Upload real-game V9 package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-REALGAME-V9-STATE-TRACE-055b212d
          path: build/validation/${{ github.sha }}/realgame-v9-state-trace-055b212d/upload/*
          if-no-files-found: error
          retention-days: 14
