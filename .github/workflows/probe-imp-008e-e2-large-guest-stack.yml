name: Probe IMP-008E E2 Large Guest Stack

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008e-e2-large-guest-stack.yml

permissions:
  contents: read

jobs:
  build-e2-hosted:
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO
    steps:
      - name: Checkout exact IMP-008E state
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Checkout fixed dc95-era Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Verify production and E2 baseline
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          base='712b8baff2a60ace56ffb11807d346baaec4ceb7'
          probe='probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp'
          git cat-file -e "$base^{commit}"
          if ! git diff --quiet "$base" HEAD -- src/common src/core src/video_core CMakeLists.txt; then
            echo 'IMP008E_E2_STACK_PRODUCTION_BASELINE=FAIL' >&2
            git diff --stat "$base" HEAD -- src/common src/core src/video_core CMakeLists.txt >&2
            exit 71
          fi
          test "$(git hash-object "$probe")" = 'ad61af60011578e8aeaeb34154a71f1c97909bc0'
          echo 'IMP008E_E2_STACK_PRODUCTION_BASELINE=PASS'
          echo 'IMP008E_E2_STACK_PROBE_BASELINE=PASS'

      - name: Add E2 target to checkout only
        shell: bash
        working-directory: eden
        run: |
          cat >> src/yuzu_cmd/CMakeLists.txt <<'CMAKE'

          file(WRITE "${CMAKE_BINARY_DIR}/imp008e_e2_vma.cpp"
              "#define VMA_IMPLEMENTATION\n#include \"video_core/vulkan_common/vma.h\"\n")
          add_executable(imp008e_e2_rasterizer_cached_retry
              ${CMAKE_SOURCE_DIR}/probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp
              ${CMAKE_BINARY_DIR}/imp008e_e2_vma.cpp)
          target_include_directories(imp008e_e2_rasterizer_cached_retry PRIVATE ${CMAKE_SOURCE_DIR}/src)
          target_link_libraries(imp008e_e2_rasterizer_cached_retry PRIVATE
              common core input_common frontend_common video_core merry::oaknut)
          target_link_libraries(imp008e_e2_rasterizer_cached_retry PRIVATE
              ${PLATFORM_LIBRARIES} Threads::Threads user32)
          CMAKE
          echo 'IMP008E_E2_STACK_TARGET_WIRING=PASS'

      - name: Enable renderer diagnostics checkout only
        shell: pwsh
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp'
          $text = [System.IO.File]::ReadAllText($path)
          $oldInclude = '#include "common/settings.h"'
          $newInclude = "#include `"common/logging.h`"`r`n#include `"common/settings.h`""
          if (-not $text.Contains($oldInclude)) { throw 'logging include anchor missing' }
          $text = $text.Replace($oldInclude, $newInclude)
          $oldMain = '    Trace("IMP008E_E2_MAIN_ENTER");'
          $newMain = "    Common::Log::Initialize();`r`n    Common::Log::SetColorConsoleBackendEnabled(false);`r`n    Common::Log::Start();`r`n    Trace(`"IMP008E_E2_MAIN_ENTER`" );"
          if (-not $text.Contains($oldMain)) { throw 'logging main anchor missing' }
          $text = $text.Replace($oldMain, $newMain)
          $oldLoad = "    const Core::SystemResultStatus load_result =`r`n        system.Load(window, nro_path.string(), load_parameters);"
          if (-not $text.Contains($oldLoad)) {
            $oldLoad = "    const Core::SystemResultStatus load_result =`n        system.Load(window, nro_path.string(), load_parameters);"
          }
          if (-not $text.Contains($oldLoad)) { throw 'logging stop anchor missing' }
          $text = $text.Replace($oldLoad, $oldLoad + "`r`n    Common::Log::Stop();`r`n    Trace(`"IMP008E_E2_RENDERER_DIAGNOSTICS_FLUSHED`" );")
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          Write-Host 'IMP008E_E2_STACK_RENDERER_DIAGNOSTICS=PASS'

      - name: Hold CPU manager barrier checkout only
        shell: pwsh
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp'
          $text = [System.IO.File]::ReadAllText($path)
          $old = '    system.GetCpuManager().OnGpuReady();'
          $new = '    Trace("IMP008E_E2_CPU_MANAGER_BARRIER_HELD");'
          if (([regex]::Matches($text, [regex]::Escape($old))).Count -ne 1) { throw 'OnGpuReady anchor mismatch' }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          Write-Host 'IMP008E_E2_STACK_BARRIER_PATCH=PASS'

      - name: Increase only synthetic guest stack headroom checkout only
        shell: pwsh
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp'
          $text = [System.IO.File]::ReadAllText($path)
          $old = 'constexpr std::size_t DataPages = 18;'
          $new = 'constexpr std::size_t DataPages = 1024; // 4 MiB synthetic image/guest-stack headroom isolation'
          if (([regex]::Matches($text, [regex]::Escape($old))).Count -ne 1) { throw 'DataPages anchor mismatch' }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          Write-Host 'IMP008E_E2_STACK_HEADROOM_4M=PASS'

      - name: Verify checkout-only causal delta
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          git diff -- src/core/arm/nce/arm_nce_windows.cpp | tee /tmp/production.diff
          test ! -s /tmp/production.diff
          grep -Fq 'constexpr std::size_t DataPages = 1024;' probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp
          grep -Fq 'IMP008E_E2_CPU_MANAGER_BARRIER_HELD' probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp
          echo 'IMP008E_E2_STACK_CAUSAL_DELTA=PASS'

      - name: Set up normal Eden CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure normal Windows ARM64 product build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp' build/compile_commands.json
          echo 'IMP008E_E2_STACK_NORMAL_CONFIGURE=PASS'

      - name: Build large-stack E2 executable
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build --target imp008e_e2_rasterizer_cached_retry --parallel > imp008e-e2-build.log 2>&1
          cat imp008e-e2-build.log
          exe="$(find build -type f -name 'imp008e_e2_rasterizer_cached_retry.exe' -print -quit)"
          test -n "$exe"
          mkdir -p e2-artifact
          cp "$exe" e2-artifact/
          sha256sum e2-artifact/imp008e_e2_rasterizer_cached_retry.exe | tee e2-artifact/imp008e-e2.exe.sha256
          git rev-parse HEAD > e2-artifact/imp008e-e2.source-sha.txt
          echo 'IMP008E_E2_STACK_BUILD=PASS'

      - name: Upload exact large-stack E2 executable
        uses: actions/upload-artifact@v4
        with:
          name: imp008e-e2-large-stack-${{ github.sha }}
          path: |
            eden/e2-artifact/imp008e_e2_rasterizer_cached_retry.exe
            eden/e2-artifact/imp008e-e2.exe.sha256
            eden/e2-artifact/imp008e-e2.source-sha.txt
            eden/imp008e-e2-build.log
          if-no-files-found: error
          retention-days: 7

  run-e2-self-hosted:
    needs: build-e2-hosted
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 20
    steps:
      - name: Download hosted large-stack executable
        uses: actions/download-artifact@v5
        with:
          name: imp008e-e2-large-stack-${{ github.sha }}
          path: e2

      - name: Verify physical runner and artifact
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'ARM64') { throw 'Physical ARM64 runner boundary mismatch' }
          $exe = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e_e2_rasterizer_cached_retry.exe' | Select-Object -First 1
          $shaFile = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e-e2.source-sha.txt' | Select-Object -First 1
          if ($null -eq $exe -or $null -eq $shaFile) { throw 'Artifact incomplete' }
          $sourceSha = [System.IO.File]::ReadAllText($shaFile.FullName).Trim()
          if ($sourceSha -ne '${{ github.sha }}') { throw "Artifact source SHA mismatch: $sourceSha" }
          Write-Host "IMP008E_E2_STACK_RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "IMP008E_E2_STACK_EXE_SHA256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          Write-Host 'IMP008E_E2_STACK_ARTIFACT_BOUNDARY=PASS'

      - name: Run large-stack E2 on physical Adreno
        id: runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workdir = (Get-Location).Path
          $exe = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e_e2_rasterizer_cached_retry.exe' | Select-Object -First 1
          $outPath = Join-Path $workdir 'imp008e-e2.out.log'
          $errPath = Join-Path $workdir 'imp008e-e2.err.log'
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $workdir -PassThru -NoNewWindow -RedirectStandardOutput $outPath -RedirectStandardError $errPath
          $timedOut = -not $p.WaitForExit(300000)
          if ($timedOut) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $hex = '0x0000007C'
          } else {
            $p.WaitForExit(); $p.Refresh()
            $signed = [int]$p.ExitCode
            $unsigned = [BitConverter]::ToUInt32([BitConverter]::GetBytes($signed), 0)
            $hex = '0x{0:X8}' -f $unsigned
          }
          if (Test-Path $outPath) { Get-Content $outPath }
          if (Test-Path $errPath) { Get-Content $errPath | ForEach-Object { [Console]::Error.WriteLine($_) } }
          $out = if (Test-Path $outPath) { [System.IO.File]::ReadAllText($outPath) } else { '' }
          $required = @(
            'IMP008E_E2_CPU_MANAGER_BARRIER_HELD=PASS',
            'IMP008E_E2_REAL_CACHE_NOACCESS=PASS',
            'IMP008E_E2_RUNTHREAD_RETURNED=PASS',
            'IMP008E_E2_DATA_AV_EXACT=PASS',
            'IMP008E_E2_PRODUCTION_RETRY_STATE=PASS',
            'IMP008E_E2_POST_RETURN_RW=PASS',
            'IMP008E_E2_SUPERVISOR_CALL_RETURN=PASS',
            'IMP008E_E2_REEXECUTED_VALUE_EXACT=PASS',
            'IMP008E_E2_POST_SVC_PC_EXACT=PASS',
            'IMP008E_E2_PHYSICAL_X18_TEB_AFTER=PASS',
            'IMP008E_E2_GATE=PASS'
          )
          $gate = $true
          foreach ($marker in $required) { if (-not $out.Contains($marker)) { $gate = $false; Write-Host "IMP008E_E2_STACK_MISSING=$marker" } }
          Write-Host "IMP008E_E2_STACK_NATIVE_HEX=$hex"
          if ($gate) {
            Write-Host 'IMP008E_E2_STACK_CLASSIFICATION=GATE_PASS'
            "gate=pass" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host 'IMP008E_E2_STACK_CLASSIFICATION=GATE_INCOMPLETE'
            "gate=fail" >> $env:GITHUB_OUTPUT
          }

      - name: Debug failed large-stack runtime for exact exception exit
        if: steps.runtime.outputs.gate != 'pass'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e_e2_rasterizer_cached_retry.exe' | Select-Object -First 1
          Add-Type -Language CSharp -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class NativeDebugLargeStack {
              const uint DEBUG_ONLY_THIS_PROCESS=2, EXCEPTION_DEBUG_EVENT=1, EXIT_PROCESS_DEBUG_EVENT=5;
              const uint DBG_CONTINUE=0x00010002, DBG_EXCEPTION_NOT_HANDLED=0x80010001;
              const uint EXCEPTION_BREAKPOINT=0x80000003, EXCEPTION_ACCESS_VIOLATION=0xC0000005, EXCEPTION_STACK_OVERFLOW=0xC00000FD;
              [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)] struct STARTUPINFO { public uint cb; public string a,b,c; public uint d,e,f,g,h,i,j,k; public ushort l,m; public IntPtr n,o,p,q; }
              [StructLayout(LayoutKind.Sequential)] struct PROCESS_INFORMATION { public IntPtr hProcess,hThread; public uint pid,tid; }
              [DllImport("kernel32.dll",CharSet=CharSet.Unicode,SetLastError=true)] static extern bool CreateProcessW(string app,StringBuilder cmd,IntPtr pa,IntPtr ta,bool inherit,uint flags,IntPtr env,string cwd,ref STARTUPINFO si,out PROCESS_INFORMATION pi);
              [DllImport("kernel32.dll",SetLastError=true)] static extern bool WaitForDebugEvent(IntPtr ev,uint ms);
              [DllImport("kernel32.dll",SetLastError=true)] static extern bool ContinueDebugEvent(uint pid,uint tid,uint status);
              [DllImport("kernel32.dll",SetLastError=true)] static extern bool TerminateProcess(IntPtr p,uint code);
              [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr h);
              public static int Run(string exe) {
                  STARTUPINFO si=new STARTUPINFO(); si.cb=(uint)Marshal.SizeOf(typeof(STARTUPINFO)); PROCESS_INFORMATION pi;
                  var cmd=new StringBuilder("\""+exe+"\"");
                  if(!CreateProcessW(exe,cmd,IntPtr.Zero,IntPtr.Zero,false,DEBUG_ONLY_THIS_PROCESS,IntPtr.Zero,System.IO.Path.GetDirectoryName(exe),ref si,out pi)) throw new Win32Exception(Marshal.GetLastWin32Error());
                  IntPtr ev=Marshal.AllocHGlobal(512); int seq=0, av=0, so=0; uint exit=0xFFFFFFFF;
                  try { for(;;) { for(int x=0;x<512;x++) Marshal.WriteByte(ev,x,0); if(!WaitForDebugEvent(ev,300000)){TerminateProcess(pi.hProcess,124);return 2;} uint ec=(uint)Marshal.ReadInt32(ev,0), pid=(uint)Marshal.ReadInt32(ev,4), tid=(uint)Marshal.ReadInt32(ev,8), cs=DBG_CONTINUE;
                      if(ec==EXCEPTION_DEBUG_EVENT){uint code=(uint)Marshal.ReadInt32(ev,16); long addr=Marshal.ReadInt64(ev,32); seq++; Console.WriteLine("IMP008E_E2_STACKDBG_RAW_SEQ_"+seq+" CODE=0x"+code.ToString("X8")+" ADDRESS=0x"+addr.ToString("X")); if(code==EXCEPTION_ACCESS_VIOLATION){av++;cs=DBG_EXCEPTION_NOT_HANDLED;} else if(code==EXCEPTION_STACK_OVERFLOW){so++;cs=DBG_EXCEPTION_NOT_HANDLED;} else if(code==EXCEPTION_BREAKPOINT){cs=DBG_CONTINUE;} else cs=DBG_EXCEPTION_NOT_HANDLED;}
                      else if(ec==EXIT_PROCESS_DEBUG_EVENT){exit=(uint)Marshal.ReadInt32(ev,16); Console.WriteLine("IMP008E_E2_STACKDBG_PROCESS_EXIT=0x"+exit.ToString("X8")); ContinueDebugEvent(pid,tid,DBG_CONTINUE); break;}
                      if(!ContinueDebugEvent(pid,tid,cs)){TerminateProcess(pi.hProcess,125);return 3;}
                  }} finally {Marshal.FreeHGlobal(ev);if(pi.hThread!=IntPtr.Zero)CloseHandle(pi.hThread);if(pi.hProcess!=IntPtr.Zero)CloseHandle(pi.hProcess);} Console.WriteLine("IMP008E_E2_STACKDBG_AV_COUNT="+av);Console.WriteLine("IMP008E_E2_STACKDBG_STACK_OVERFLOW_COUNT="+so); return so>0||exit==EXCEPTION_STACK_OVERFLOW?10:11;
              }
          }
          '@
          $rc=[NativeDebugLargeStack]::Run($exe.FullName)
          Write-Host "IMP008E_E2_STACKDBG_WRAPPER_RC=$rc"
          if($rc -eq 10){throw 'Large guest stack still reaches stack overflow'}
          throw "Large guest stack gate incomplete without stack overflow; debugger RC=$rc"

      - name: Persist large-stack runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imp008e-e2-large-stack-runtime-${{ github.run_id }}
          path: |
            imp008e-e2.out.log
            imp008e-e2.err.log
          if-no-files-found: warn
