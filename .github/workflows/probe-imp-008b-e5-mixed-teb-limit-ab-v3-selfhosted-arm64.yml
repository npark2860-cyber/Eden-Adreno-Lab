name: Probe IMP-008B E5 Mixed TEB Limit A/B V3

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-e5-mixed-teb-limit-ab-v3-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp-008b-e5-mixed-teb-limit-ab-v3
  cancel-in-progress: false

jobs:
  e5-mixed-teb-limit-ab-v3:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 15
    steps:
      - name: Compile retained A/B and run E5 once
        shell: powershell
        run: |
          $script=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          Invoke-Expression $script

      - name: Upload mixed TEB V3 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-mixed-teb-limit-ab-v3
          path: |
            eden/imp008b-e5-mixed-teb-v3-link.log
            eden/imp008b-e5-mixed-teb-v3.log
            eden/imp008b-e5-mixed-teb-v3.out.log
            eden/imp008b-e5-mixed-teb-v3.err.log
            eden/imp008b-e5-mixed-teb-v3.rc
          if-no-files-found: warn
