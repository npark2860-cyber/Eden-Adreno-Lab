name: TEMP IMP-008E immutable exact validation carrier

on:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-e5-captured-context-ab-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: temp-imp008e-immutable-exact-validation-carrier
  cancel-in-progress: false

jobs:
  validate:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 20
    steps:
      - name: Build immutable probes with exact promoted core
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $retained='38ffd8f36f797c487e3e88ec7dbe4cac327a2c31'
          $source='055b212df86dbfc18257b127ee5a0cbfda8ff861'
          if((git -C eden rev-parse HEAD).Trim() -ne $retained){throw 'unexpected retained HEAD'}
          $coreDir='eden/build/imp008e_exact_055b212d'
          $runtime='eden/build/imp008e_exact_runtime_055b212d'
          foreach($p in @("$coreDir/arm_nce_windows.cpp.obj","$coreDir/windows_nce_transition.cpp.obj","$coreDir/windows_nce_entry.obj")){if(-not(Test-Path $p)){throw "exact core object missing: $p"}}
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $rr=(Resolve-Path $runtime).Path
          function Export-File([string]$sha,[string]$repoPath,[string]$dst){
            $lines=& git -C eden show "${sha}:$repoPath"
            if($LASTEXITCODE-ne 0){throw "git show failed: $repoPath"}
            [IO.File]::WriteAllText($dst,(($lines -join "`n")+"`n"),[Text.UTF8Encoding]::new($false))
          }
          $d1=Join-Path $rr 'd1_immutable.cpp'
          $e5=Join-Path $rr 'e5_immutable.cpp'
          Export-File $retained 'probes/windows-arm64-nce-fault-d1/data_fault_skip_runtime.cpp' $d1
          Export-File $retained 'probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp' $e5
          $d1Text=[IO.File]::ReadAllText($d1)
          $needle='if (getter_literal_matches == 0) {'
          if(-not $d1Text.Contains($needle)){throw 'D1 compatibility anchor missing'}
          $d1Text=$d1Text.Replace($needle,'if (false && getter_literal_matches == 0) { // current patcher compatibility')
          [IO.File]::WriteAllText($d1,$d1Text,[Text.UTF8Encoding]::new($false))
          if(([IO.File]::ReadAllText($e5)).Contains('DumpImp008bE5FullContextSnapshots')){throw 'immutable E5 contaminated'}
          $e2='eden/build/e2_pagetable_stack_query_v1/rasterizer_cached_retry_pagetable_stack.cpp'
          if(-not(Test-Path $e2)){throw 'E2 source missing'}

          Push-Location eden/build
          try {
            $commands=& 'C:\msys64\usr\bin\ninja.exe' -t commands imp008b_e5_x18_runtime
            if($LASTEXITCODE-ne 0){throw "ninja commands rc=$LASTEXITCODE"}
            $hits=@($commands|Where-Object{(($_ -replace '\\','/')) -match " -c '?C:/.*?/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant\.cpp'?$"})
            if($hits.Count-ne 1){throw "compile template count=$($hits.Count)"}
            $template=[string]$hits[0]
            $oldObj='src/yuzu_cmd/CMakeFiles/imp008b_e5_x18_runtime.dir/__/__/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp.obj'
            function Normalize([string]$s){
              $s=$s.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64').Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64').Replace('C:\msys64\clangarm64\bin\sccache.exe ','').Replace('C:/msys64/clangarm64/bin/sccache.exe ','')
              return [regex]::Replace($s,"'(C:/[^']+)'",'$1')
            }
            function Compile-One([string]$src,[string]$obj,[string]$dep){
              $c=$template.Replace($oldObj,$obj)
              $c=[regex]::Replace($c,'-MF\s+\S+\.obj\.d',('-MF '+$dep))
              $srcAbs=((Resolve-Path $src).Path -replace '\\','/')
              $c=[regex]::Replace($c,"-c\s+'?C:/[^']*?/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant\.cpp'?",('-c '+$srcAbs))
              $c=Normalize $c
              & $env:ComSpec /D /S /C $c
              if($LASTEXITCODE-ne 0){throw "compile failed rc=$LASTEXITCODE src=$src"}
            }
            $d1Obj='imp008e_exact_runtime_055b212d/d1_immutable.cpp.obj'
            $e5Obj='imp008e_exact_runtime_055b212d/e5_immutable.cpp.obj'
            $e2Obj='imp008e_exact_runtime_055b212d/e2_immutable.cpp.obj'
            Compile-One 'imp008e_exact_runtime_055b212d/d1_immutable.cpp' $d1Obj 'imp008e_exact_runtime_055b212d\d1_immutable.cpp.obj.d'
            Compile-One 'imp008e_exact_runtime_055b212d/e5_immutable.cpp' $e5Obj 'imp008e_exact_runtime_055b212d\e5_immutable.cpp.obj.d'
            Compile-One 'e2_pagetable_stack_query_v1/rasterizer_cached_retry_pagetable_stack.cpp' $e2Obj 'imp008e_exact_runtime_055b212d\e2_immutable.cpp.obj.d'

            $links=@($commands|Where-Object{$_ -match '-o bin\\imp008b_e5_x18_runtime\.exe'})
            if($links.Count-ne 1){throw "link template count=$($links.Count)"}
            $base=[string]$links[0]
            $core='imp008e_exact_055b212d/arm_nce_windows.cpp.obj imp008e_exact_055b212d/windows_nce_transition.cpp.obj imp008e_exact_055b212d/windows_nce_entry.obj src/core/libcore.a'
            function Link-One([string]$obj,[string]$exe,[string]$lib){
              $l=$base.Replace($oldObj,$obj).Replace('bin\imp008b_e5_x18_runtime.exe',('bin\'+$exe)).Replace('src\yuzu_cmd\libimp008b_e5_x18_runtime.a',('src\yuzu_cmd\'+$lib))
              $l=$l.Replace('src/core/libcore.a',$core)
              $l=Normalize $l
              & $env:ComSpec /D /S /C $l
              if($LASTEXITCODE-ne 0){throw "link failed rc=$LASTEXITCODE exe=$exe"}
            }
            Link-One $d1Obj 'imp008d_d1_exact_immutable.exe' 'libimp008d_d1_exact_immutable.a'
            Link-One $e5Obj 'imp008b_e5_exact_immutable.exe' 'libimp008b_e5_exact_immutable.a'
            Link-One $e2Obj 'imp008e_e2_exact_immutable.exe' 'libimp008e_e2_exact_immutable.a'
          } finally {Pop-Location}
          Write-Host 'IMP008E_IMMUTABLE_EXACT_BUILD=PASS'

      - name: Run exact gates repeatedly
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $eden=(Resolve-Path eden).Path
          function Run-One([string]$label,[string]$exe,[int]$timeout,[string[]]$markers){
            $psi=New-Object Diagnostics.ProcessStartInfo
            $psi.FileName=(Resolve-Path $exe).Path; $psi.WorkingDirectory=$eden; $psi.UseShellExecute=$false; $psi.RedirectStandardOutput=$true; $psi.RedirectStandardError=$true
            $p=New-Object Diagnostics.Process; $p.StartInfo=$psi; [void]$p.Start(); $ot=$p.StandardOutput.ReadToEndAsync(); $et=$p.StandardError.ReadToEndAsync(); $timed=-not $p.WaitForExit($timeout); if($timed){$p.Kill();$p.WaitForExit()}
            $log=$ot.Result+$et.Result; $rc=if($timed){124}else{$p.ExitCode}
            [IO.File]::WriteAllText((Join-Path $eden ("imp008e-final-"+$label+".log")),$log)
            Write-Host "IMP008E_FINAL_${label}_RC=$rc"
            if($rc-ne 0){Write-Host $log; throw "$label rc=$rc"}
            foreach($m in $markers){if(-not $log.Contains($m)){Write-Host $log; throw "$label missing $m"}}
            Write-Host "IMP008E_FINAL_${label}=PASS"
          }
          $d1=@('IMP008D_D1_GATE=PASS','IMP008B_GENERIC_STACK_TOP=PASS')
          $e5=@('IMP008B_E5_GATE=PASS','IMP008B_GENERIC_STACK_TOP=PASS')
          $e2=@('IMP008E_E2_GUEST_STACK_QUERY=PASS','IMP008E_E2_DATA_AV_EXACT=PASS','IMP008E_E2_REEXECUTED_VALUE_EXACT=PASS','IMP008E_E2_CONTEXT_COHERENT=PASS','IMP008E_E2_PHYSICAL_X18_TEB_AFTER=PASS','IMP008E_E2_GATE=PASS','IMP008B_GENERIC_STACK_TOP=PASS')
          for($i=1;$i-le 3;$i++){Run-One "D1_$i" 'eden/build/bin/imp008d_d1_exact_immutable.exe' 30000 $d1}
          for($i=1;$i-le 4;$i++){Run-One "E5_$i" 'eden/build/bin/imp008b_e5_exact_immutable.exe' 30000 $e5}
          for($i=1;$i-le 8;$i++){Run-One "E2_$i" 'eden/build/bin/imp008e_e2_exact_immutable.exe' 60000 $e2}
          Write-Host 'IMP008E_FINAL_EXACT_D1_E5_E2_SERIAL_GATE=PASS'
