name: Build Windows ARM64 NCE V71 stack lease rollover c49942e8

on:
  push:
    branches:
      - fix/windows-nce-v71-stack-lease-rollover-c49942e8
    paths:
      - .github/diagnostics/v71-stack-lease-rollover-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-v71-stack-lease-rollover-c49942e8
  cancel-in-progress: false

env:
  V70_BASE_SHA: c49942e825128baa2526fe88c2ace2b26f350d46
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: v71-stack-lease-rollover

jobs:
  build-package:
    name: Windows ARM64 NCE V71 stack lease rollover
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact V71 Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/v71-stack-lease-rollover/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify V71 provenance and single-variable scope
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$SOURCE" merge-base --is-ancestor "$V70_BASE_SHA" "$GITHUB_SHA"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=no)"
          git -C "$SOURCE" diff --check "$V70_BASE_SHA" "$GITHUB_SHA"

          CHANGED="$(git -C "$SOURCE" diff --name-only "$V70_BASE_SHA" "$GITHUB_SHA")"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(src/core/arm/nce/arm_nce_windows\.cpp|\.github/workflows/build-windows-arm64-nce-v71-stack-lease-rollover-c49942e8\.yml|\.github/diagnostics/v71-stack-lease-rollover-trigger\.txt)$' || true)"
          test -z "$UNEXPECTED"

          grep -Fq 'active_lease_owns_sp' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'stack_lease->Restore()' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'stack_lease.reset()' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'DCCIVAC{inst}.Verify()' "$SOURCE/src/core/arm/nce/patcher.cpp"
          grep -Fq 'V70_BREAKPOINT' "$SOURCE/src/yuzu/main.cpp"

          git -C "$SOURCE" diff "$V70_BASE_SHA" "$GITHUB_SHA" --             src/core/arm/nce/arm_nce_windows.cpp > "$PROV/V71_STACK_LEASE_ROLLOVER.diff"
          printf 'V70_BASE_SHA=%s\nV71_SHA=%s\nSOURCE_MODE=exact tested V70 + private stack lease rollover only\nEVIDENCE=natural WER dump PID 26000 C0000409 subcode 7; ordinary log terminal error shows active private stack lease no longer owns guest SP\nDUMP_CURRENT_GUEST_SP=0x00000020870C6D20\nDUMP_ACTIVE_LEASE_BASE=0x000000208EB10000\nDUMP_ACTIVE_LEASE_LENGTH=0x30000\nISOLATION_DIR=build/validation/%s/%s\n'             "$V70_BASE_SHA" "$GITHUB_SHA" "$GITHUB_SHA" "$TEST_NAME" > "$PROV/BUILD_INFO.txt"

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: build/validation/${{ github.sha }}/v71-stack-lease-rollover/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: false
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure V71 Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v71-stack-lease-rollover/source
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          printf 'CONFIGURE_COMMAND=./.ci/build/configure.sh -DCCACHE_PATH=sccache\nNCE_COMPILE_GUARD=HAS_NCE=1\n' >> ../provenance/BUILD_INFO.txt

      - name: Build full Windows ARM64 Eden V71
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v71-stack-lease-rollover/source
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          printf 'BUILD_COMMAND=cmake --build build\n' >> ../provenance/BUILD_INFO.txt

      - name: Package Windows ARM64 Eden V71
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v71-stack-lease-rollover/source
        env:
          ARTIFACT_REF: nce-v71-stack-lease-rollover-c49942e8
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          printf 'PACKAGE_COMMAND=./.ci/package/windows.sh\nARTIFACT_REF=nce-v71-stack-lease-rollover-c49942e8\n' >> ../provenance/BUILD_INFO.txt

      - name: Prepare V71 upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged Eden artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash
          "PACKAGE_FILE=$($files[0].Name)" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          "PACKAGE_SHA256=$hash" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')

      - name: Upload V71 package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-V71-STACK-LEASE-ROLLOVER-c49942e8
          path: build/validation/${{ github.sha }}/v71-stack-lease-rollover/upload/*
          if-no-files-found: error
          retention-days: 14
