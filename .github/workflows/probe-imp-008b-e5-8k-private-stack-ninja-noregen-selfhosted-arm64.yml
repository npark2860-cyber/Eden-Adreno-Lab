name: Probe IMP-008B E5 Direct Command Extraction

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-e5-8k-private-stack-ninja-noregen-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp-008b-e5-direct-command-extraction
  cancel-in-progress: false

jobs:
  e5-direct-command-extraction:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 30
    steps:
      - name: Verify retained E5 8K A-B workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'eden/.git')) { throw 'retained eden checkout missing' }
          $head = (git -C eden rev-parse HEAD).Trim()
          if ($head -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31') { throw "unexpected retained head $head" }
          $probe = 'eden/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp'
          $transition = 'eden/src/core/arm/nce/windows_nce_transition.cpp'
          $runtime = 'eden/src/core/arm/nce/arm_nce_windows.cpp'
          $build = 'eden/build/build.ninja'
          $rules = 'eden/build/CMakeFiles/rules.ninja'
          foreach ($p in @($probe,$transition,$runtime,$build,$rules)) {
            if (-not (Test-Path $p)) { throw "required retained file missing: $p" }
          }
          if (-not (Select-String -Path $probe -SimpleMatch 'IMP008B_E5_8K_GUEST_STACK=PASS' -Quiet)) { throw '8K guest stack patch missing' }
          if (-not (Select-String -Path $transition -SimpleMatch 'IMP008B_E5_8K_STACK_READY=PASS' -Quiet)) { throw '8K transition patch missing' }
          if (-not (Select-String -Path $runtime -SimpleMatch 'IMP008B_E5_GENERIC_VEH_ENTER=PASS' -Quiet)) { throw 'generic VEH observer missing' }
          if (-not (Select-String -Path $runtime -SimpleMatch 'IMP008B_E5_X18_VEH_ENTER=PASS' -Quiet)) { throw 'x18 VEH observer missing' }
          Write-Host 'IMP008B_E5_DIRECT_EXTRACT_WORKSPACE=PASS'

      - name: Set up minimal MSYS2 Ninja tooling
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          cache: false
          install: >-
            ninja

      - name: Snapshot retained Ninja graph hashes
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          sha256sum build/build.ninja build/CMakeFiles/rules.ninja > imp008b-e5-direct-before.sha256
          cat imp008b-e5-direct-before.sha256
          echo 'IMP008B_E5_DIRECT_HASH_BEFORE=PASS'

      - name: Extract target commands with Ninja tool mode only
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          ninja -C build -t commands imp008b_e5_x18_runtime > imp008b-e5-direct-commands.txt
          ninja -C build -t compdb > imp008b-e5-direct-compdb.json
          ninja -C build -t query imp008b_e5_x18_runtime > imp008b-e5-direct-query.txt
          test -s imp008b-e5-direct-commands.txt
          test -s imp008b-e5-direct-compdb.json
          test -s imp008b-e5-direct-query.txt
          echo '=== DIRTY SOURCE COMMAND HITS ==='
          grep -nE 'x18_runtime_invariant\.cpp|windows_nce_transition\.cpp|arm_nce_windows\.cpp' imp008b-e5-direct-commands.txt || true
          echo '=== FINAL TARGET HITS ==='
          grep -nE 'imp008b_e5_x18_runtime(\.exe)?' imp008b-e5-direct-commands.txt || true
          echo '=== TARGET QUERY ==='
          cat imp008b-e5-direct-query.txt
          echo 'IMP008B_E5_DIRECT_TOOL_EXTRACT=PASS'

      - name: Prove Ninja tool mode did not mutate graph
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          sha256sum build/build.ninja build/CMakeFiles/rules.ninja > imp008b-e5-direct-after.sha256
          diff -u imp008b-e5-direct-before.sha256 imp008b-e5-direct-after.sha256
          echo 'IMP008B_E5_DIRECT_GRAPH_UNCHANGED=PASS'

      - name: Summarize direct command candidates
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          total=$(wc -l < imp008b-e5-direct-commands.txt)
          dirty=$(grep -Ec 'x18_runtime_invariant\.cpp|windows_nce_transition\.cpp|arm_nce_windows\.cpp' imp008b-e5-direct-commands.txt || true)
          target=$(grep -Ec 'imp008b_e5_x18_runtime(\.exe)?' imp008b-e5-direct-commands.txt || true)
          echo "IMP008B_E5_DIRECT_COMMAND_COUNT=$total"
          echo "IMP008B_E5_DIRECT_DIRTY_COMPILE_HITS=$dirty"
          echo "IMP008B_E5_DIRECT_TARGET_HITS=$target"
          test "$dirty" -ge 3
          test "$target" -ge 1
          echo 'IMP008B_E5_DIRECT_COMMAND_CANDIDATES=PASS'

      - name: Upload extraction logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-direct-command-extraction
          path: |
            eden/imp008b-e5-direct-before.sha256
            eden/imp008b-e5-direct-after.sha256
            eden/imp008b-e5-direct-commands.txt
            eden/imp008b-e5-direct-compdb.json
            eden/imp008b-e5-direct-query.txt
          if-no-files-found: warn
