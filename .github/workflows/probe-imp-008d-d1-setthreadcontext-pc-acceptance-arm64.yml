name: Probe IMP-008D D1 SetThreadContext PC Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008d-windows-nce-data-fault-runtime
    paths:
      - '.github/workflows/probe-imp-008d-d1-setthreadcontext-pc-acceptance-arm64.yml'

permissions:
  contents: read

jobs:
  d1-setthreadcontext-pc-acceptance:
    runs-on: windows-11-arm
    timeout-minutes: 120

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout IMP-008D branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Checkout fixed dc95-era Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Add D1 target to checkout only
        shell: bash
        working-directory: eden
        run: |
          cat >> src/yuzu_cmd/CMakeLists.txt <<'CMAKE'

          file(WRITE "${CMAKE_BINARY_DIR}/imp008d_d1_vma.cpp"
              "#define VMA_IMPLEMENTATION\n#include \"video_core/vulkan_common/vma.h\"\n")
          add_executable(imp008d_d1_data_fault_skip
              ${CMAKE_SOURCE_DIR}/probes/windows-arm64-nce-fault-d1/data_fault_skip_runtime.cpp
              ${CMAKE_BINARY_DIR}/imp008d_d1_vma.cpp)
          target_include_directories(imp008d_d1_data_fault_skip PRIVATE ${CMAKE_SOURCE_DIR}/src)
          target_link_libraries(imp008d_d1_data_fault_skip PRIVATE
              common core input_common frontend_common video_core merry::oaknut)
          target_link_libraries(imp008d_d1_data_fault_skip PRIVATE ${PLATFORM_LIBRARIES} Threads::Threads)
          CMAKE
          echo 'IMP008D_D1_TARGET_WIRING=PASS'

      - name: Set up normal Eden CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure normal Windows ARM64 product build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'arm_nce_windows.cpp' build/compile_commands.json
          echo 'IMP008D_D1_NORMAL_CONFIGURE=PASS'

      - name: Build D1 diagnostic executable
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build --target imp008d_d1_data_fault_skip --parallel > imp008d-d1-build.log 2>&1
          cat imp008d-d1-build.log
          echo 'IMP008D_D1_BUILD=PASS'

      - name: Build checkout-only SetThreadContext PC acceptance observer
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cat > imp008d-d1-setthreadcontext-pc-observer.cpp <<'CPP'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>

          #include <cstdint>
          #include <cstdio>
          #include <string>
          #include <vector>

          namespace {

          std::wstring ReadEnv(const wchar_t* name) {
              const DWORD size = GetEnvironmentVariableW(name, nullptr, 0);
              if (size == 0) {
                  return {};
              }
              std::vector<wchar_t> buffer(size);
              if (GetEnvironmentVariableW(name, buffer.data(), size) == 0) {
                  return {};
              }
              return std::wstring(buffer.data());
          }

          void LogContext(FILE* log, const char* tag, const CONTEXT& context) {
              std::fprintf(log,
                           "%s FLAGS=0x%08lX PC=0x%llX SP=0x%llX X18=0x%llX CPSR=0x%08lX\n",
                           tag,
                           static_cast<unsigned long>(context.ContextFlags),
                           static_cast<unsigned long long>(context.Pc),
                           static_cast<unsigned long long>(context.Sp),
                           static_cast<unsigned long long>(context.X[18]),
                           static_cast<unsigned long>(context.Cpsr));
          }

          } // namespace

          int wmain() {
              const std::wstring target = ReadEnv(L"D1_TARGET_WIN");
              const std::wstring workdir = ReadEnv(L"D1_WORKDIR_WIN");
              if (target.empty() || workdir.empty()) {
                  return 70;
              }

              FILE* log = std::fopen("imp008d-d1-setthreadcontext-pc.log", "wb");
              if (log == nullptr) {
                  return 71;
              }

              std::wstring command = L"\"" + target + L"\"";
              std::vector<wchar_t> command_line(command.begin(), command.end());
              command_line.push_back(L'\0');

              STARTUPINFOW startup{};
              startup.cb = sizeof(startup);
              PROCESS_INFORMATION process{};
              const DWORD create_flags = DEBUG_ONLY_THIS_PROCESS | CREATE_SUSPENDED;
              if (!CreateProcessW(target.c_str(), command_line.data(), nullptr, nullptr, TRUE,
                                  create_flags, nullptr, workdir.c_str(), &startup, &process)) {
                  std::fprintf(log, "IMP008D_D1_STC_CREATE_PROCESS=FAIL ERROR=%lu\n",
                               static_cast<unsigned long>(GetLastError()));
                  std::fclose(log);
                  return 72;
              }

              if (ResumeThread(process.hThread) == static_cast<DWORD>(-1)) {
                  std::fprintf(log, "IMP008D_D1_STC_RESUME=FAIL ERROR=%lu\n",
                               static_cast<unsigned long>(GetLastError()));
                  TerminateProcess(process.hProcess, 73);
                  CloseHandle(process.hThread);
                  CloseHandle(process.hProcess);
                  std::fclose(log);
                  return 73;
              }

              bool saw_read_av = false;
              bool got_context = false;
              bool control_ok = false;
              bool test_ok = false;
              bool readback_ok = false;
              bool readback_pc_exact = false;
              DWORD control_error = 0;
              DWORD test_error = 0;
              DWORD readback_error = 0;
              DWORD target_exit = STILL_ACTIVE;
              unsigned exception_index = 0;

              for (;;) {
                  DEBUG_EVENT event{};
                  if (!WaitForDebugEvent(&event, INFINITE)) {
                      std::fprintf(log, "IMP008D_D1_STC_WAIT_DEBUG_EVENT=FAIL ERROR=%lu\n",
                                   static_cast<unsigned long>(GetLastError()));
                      TerminateProcess(process.hProcess, 74);
                      target_exit = 74;
                      break;
                  }

                  DWORD continue_status = DBG_CONTINUE;

                  if (event.dwDebugEventCode == CREATE_PROCESS_DEBUG_EVENT) {
                      std::fprintf(log, "IMP008D_D1_STC_DEBUG_CREATE_PROCESS=PASS TID=%lu\n",
                                   static_cast<unsigned long>(event.dwThreadId));
                      if (event.u.CreateProcessInfo.hFile != nullptr) {
                          CloseHandle(event.u.CreateProcessInfo.hFile);
                      }
                  } else if (event.dwDebugEventCode == LOAD_DLL_DEBUG_EVENT) {
                      if (event.u.LoadDll.hFile != nullptr) {
                          CloseHandle(event.u.LoadDll.hFile);
                      }
                  } else if (event.dwDebugEventCode == EXCEPTION_DEBUG_EVENT) {
                      const auto& ex = event.u.Exception;
                      ++exception_index;
                      std::fprintf(log,
                                   "IMP008D_D1_STC_EXCEPTION INDEX=%u FIRST=%lu CODE=0x%08lX ADDRESS=%p PARAMS=%lu\n",
                                   exception_index,
                                   static_cast<unsigned long>(ex.dwFirstChance),
                                   static_cast<unsigned long>(ex.ExceptionRecord.ExceptionCode),
                                   ex.ExceptionRecord.ExceptionAddress,
                                   static_cast<unsigned long>(ex.ExceptionRecord.NumberParameters));

                      if (ex.ExceptionRecord.ExceptionCode == EXCEPTION_BREAKPOINT) {
                          continue_status = DBG_CONTINUE;
                      } else if (!saw_read_av && ex.dwFirstChance != 0 &&
                                 ex.ExceptionRecord.ExceptionCode == EXCEPTION_ACCESS_VIOLATION &&
                                 ex.ExceptionRecord.NumberParameters >= 2 &&
                                 ex.ExceptionRecord.ExceptionInformation[0] == 0) {
                          saw_read_av = true;
                          std::fprintf(log,
                                       "IMP008D_D1_STC_INTENDED_READ_AV=PASS TARGET=0x%llX\n",
                                       static_cast<unsigned long long>(
                                           ex.ExceptionRecord.ExceptionInformation[1]));

                          HANDLE thread = OpenThread(THREAD_GET_CONTEXT | THREAD_SET_CONTEXT |
                                                         THREAD_QUERY_INFORMATION,
                                                     FALSE, event.dwThreadId);
                          if (thread == nullptr) {
                              std::fprintf(log, "IMP008D_D1_STC_OPEN_THREAD=FAIL ERROR=%lu\n",
                                           static_cast<unsigned long>(GetLastError()));
                              continue_status = DBG_EXCEPTION_NOT_HANDLED;
                          } else {
                              CONTEXT original{};
                              original.ContextFlags = CONTEXT_CONTROL | CONTEXT_INTEGER |
                                                      CONTEXT_FLOATING_POINT;
                              if (!GetThreadContext(thread, &original)) {
                                  std::fprintf(log, "IMP008D_D1_STC_GET_CONTEXT=FAIL ERROR=%lu\n",
                                               static_cast<unsigned long>(GetLastError()));
                                  continue_status = DBG_EXCEPTION_NOT_HANDLED;
                              } else {
                                  got_context = true;
                                  LogContext(log, "IMP008D_D1_STC_CONTEXT_ORIGINAL", original);

                                  CONTEXT control = original;
                                  SetLastError(ERROR_SUCCESS);
                                  control_ok = SetThreadContext(thread, &control) != FALSE;
                                  control_error = control_ok ? ERROR_SUCCESS : GetLastError();
                                  std::fprintf(log,
                                               "IMP008D_D1_STC_CONTROL=%s ERROR=%lu PC=0x%llX\n",
                                               control_ok ? "PASS" : "FAIL",
                                               static_cast<unsigned long>(control_error),
                                               static_cast<unsigned long long>(control.Pc));

                                  if (control_ok) {
                                      CONTEXT test = original;
                                      test.Pc += sizeof(std::uint32_t);
                                      SetLastError(ERROR_SUCCESS);
                                      test_ok = SetThreadContext(thread, &test) != FALSE;
                                      test_error = test_ok ? ERROR_SUCCESS : GetLastError();
                                      std::fprintf(log,
                                                   "IMP008D_D1_STC_TEST_PC_PLUS4=%s ERROR=%lu FROM=0x%llX TO=0x%llX\n",
                                                   test_ok ? "PASS" : "FAIL",
                                                   static_cast<unsigned long>(test_error),
                                                   static_cast<unsigned long long>(original.Pc),
                                                   static_cast<unsigned long long>(test.Pc));

                                      if (test_ok) {
                                          CONTEXT readback{};
                                          readback.ContextFlags = original.ContextFlags;
                                          readback_ok = GetThreadContext(thread, &readback) != FALSE;
                                          readback_error = readback_ok ? ERROR_SUCCESS : GetLastError();
                                          if (readback_ok) {
                                              LogContext(log, "IMP008D_D1_STC_CONTEXT_READBACK", readback);
                                              readback_pc_exact = readback.Pc == test.Pc;
                                              std::fprintf(log,
                                                           "IMP008D_D1_STC_READBACK_PC_PLUS4=%s EXPECT=0x%llX ACTUAL=0x%llX\n",
                                                           readback_pc_exact ? "PASS" : "FAIL",
                                                           static_cast<unsigned long long>(test.Pc),
                                                           static_cast<unsigned long long>(readback.Pc));
                                          } else {
                                              std::fprintf(log,
                                                           "IMP008D_D1_STC_READBACK=FAIL ERROR=%lu\n",
                                                           static_cast<unsigned long>(readback_error));
                                          }
                                      }
                                  }

                                  if (control_ok && test_ok && readback_ok && readback_pc_exact) {
                                      std::fprintf(log,
                                                   "IMP008D_D1_STC_PC_ACCEPTANCE=PASS\n");
                                      continue_status = DBG_CONTINUE;
                                  } else if (control_ok && !test_ok) {
                                      std::fprintf(log,
                                                   "IMP008D_D1_STC_PC_ACCEPTANCE=REJECTED_BY_SETTHREADCONTEXT\n");
                                      continue_status = DBG_EXCEPTION_NOT_HANDLED;
                                  } else if (!control_ok) {
                                      std::fprintf(log,
                                                   "IMP008D_D1_STC_PC_ACCEPTANCE=CONTROL_REJECTED\n");
                                      continue_status = DBG_EXCEPTION_NOT_HANDLED;
                                  } else {
                                      std::fprintf(log,
                                                   "IMP008D_D1_STC_PC_ACCEPTANCE=READBACK_INCONCLUSIVE\n");
                                      continue_status = DBG_EXCEPTION_NOT_HANDLED;
                                  }
                              }
                              CloseHandle(thread);
                          }
                      } else {
                          if (ex.ExceptionRecord.NumberParameters > 0) {
                              for (DWORD i = 0; i < ex.ExceptionRecord.NumberParameters; ++i) {
                                  std::fprintf(log,
                                               "IMP008D_D1_STC_EXCEPTION_PARAM INDEX=%u N=%lu VALUE=0x%llX\n",
                                               exception_index,
                                               static_cast<unsigned long>(i),
                                               static_cast<unsigned long long>(
                                                   ex.ExceptionRecord.ExceptionInformation[i]));
                              }
                          }
                          continue_status = DBG_EXCEPTION_NOT_HANDLED;
                      }
                  } else if (event.dwDebugEventCode == EXIT_PROCESS_DEBUG_EVENT) {
                      target_exit = event.u.ExitProcess.dwExitCode;
                      std::fprintf(log, "IMP008D_D1_STC_TARGET_EXIT=0x%08lX\n",
                                   static_cast<unsigned long>(target_exit));
                  }

                  if (!ContinueDebugEvent(event.dwProcessId, event.dwThreadId, continue_status)) {
                      std::fprintf(log, "IMP008D_D1_STC_CONTINUE_DEBUG_EVENT=FAIL ERROR=%lu\n",
                                   static_cast<unsigned long>(GetLastError()));
                      TerminateProcess(process.hProcess, 75);
                      target_exit = 75;
                      break;
                  }

                  if (event.dwDebugEventCode == EXIT_PROCESS_DEBUG_EVENT) {
                      break;
                  }
              }

              std::fprintf(log,
                           "IMP008D_D1_STC_SUMMARY SAW_AV=%u GOT_CONTEXT=%u CONTROL=%u CONTROL_ERROR=%lu TEST=%u TEST_ERROR=%lu READBACK=%u READBACK_ERROR=%lu READBACK_PC_EXACT=%u EXIT=0x%08lX\n",
                           saw_read_av ? 1U : 0U,
                           got_context ? 1U : 0U,
                           control_ok ? 1U : 0U,
                           static_cast<unsigned long>(control_error),
                           test_ok ? 1U : 0U,
                           static_cast<unsigned long>(test_error),
                           readback_ok ? 1U : 0U,
                           static_cast<unsigned long>(readback_error),
                           readback_pc_exact ? 1U : 0U,
                           static_cast<unsigned long>(target_exit));
              std::fprintf(log, "IMP008D_D1_STC_OBSERVER_DONE=PASS\n");
              std::fflush(log);

              CloseHandle(process.hThread);
              CloseHandle(process.hProcess);
              std::fclose(log);

              if (!saw_read_av || !got_context) {
                  return 80;
              }
              return 0;
          }
          CPP
          clang++ -std=c++20 -O2 -Wall -Wextra -municode imp008d-d1-setthreadcontext-pc-observer.cpp \
            -o imp008d-d1-setthreadcontext-pc-observer.exe
          test -f imp008d-d1-setthreadcontext-pc-observer.exe
          echo 'IMP008D_D1_STC_OBSERVER_BUILD=PASS'

      - name: Run D1 under SetThreadContext PC acceptance observer
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          exe="$(find build -type f -name 'imp008d_d1_data_fault_skip.exe' -print -quit)"
          test -n "$exe"
          export D1_TARGET_WIN="$(cygpath -aw "$exe")"
          export D1_WORKDIR_WIN="$(cygpath -aw .)"
          set +e
          ./imp008d-d1-setthreadcontext-pc-observer.exe > imp008d-d1.out.log 2> imp008d-d1.err.log
          observer_rc=$?
          set -e
          printf '%s\n' "$observer_rc" > imp008d-d1-setthreadcontext-pc-observer.rc
          cat imp008d-d1.out.log || true
          cat imp008d-d1.err.log >&2 || true
          cat imp008d-d1-setthreadcontext-pc.log || true
          echo "IMP008D_D1_STC_OBSERVER_EXIT=$observer_rc"
          test "$observer_rc" -eq 0
          echo 'IMP008D_D1_STC_RUNTIME_CAPTURE=PASS'

      - name: Classify D1 SetThreadContext PC acceptance
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          grep -Fq 'IMP008D_D1_STC_OBSERVER_DONE=PASS' imp008d-d1-setthreadcontext-pc.log
          grep -F 'IMP008D_D1_STC_CONTEXT_ORIGINAL' imp008d-d1-setthreadcontext-pc.log || true
          grep -F 'IMP008D_D1_STC_CONTROL=' imp008d-d1-setthreadcontext-pc.log || true
          grep -F 'IMP008D_D1_STC_TEST_PC_PLUS4=' imp008d-d1-setthreadcontext-pc.log || true
          grep -F 'IMP008D_D1_STC_CONTEXT_READBACK' imp008d-d1-setthreadcontext-pc.log || true
          grep -F 'IMP008D_D1_STC_READBACK_PC_PLUS4=' imp008d-d1-setthreadcontext-pc.log || true
          grep -F 'IMP008D_D1_STC_PC_ACCEPTANCE=' imp008d-d1-setthreadcontext-pc.log || true
          grep -F 'IMP008D_D1_STC_TARGET_EXIT=' imp008d-d1-setthreadcontext-pc.log || true
          grep -F 'IMP008D_D1_STC_SUMMARY ' imp008d-d1-setthreadcontext-pc.log || true

          if grep -Fq 'IMP008D_D1_STC_PC_ACCEPTANCE=PASS' imp008d-d1-setthreadcontext-pc.log; then
            echo 'IMP008D_D1_STC_CLASSIFICATION=PC_PLUS4_ACCEPTED'
          elif grep -Fq 'IMP008D_D1_STC_PC_ACCEPTANCE=REJECTED_BY_SETTHREADCONTEXT' imp008d-d1-setthreadcontext-pc.log; then
            echo 'IMP008D_D1_STC_CLASSIFICATION=PC_PLUS4_REJECTED'
          elif grep -Fq 'IMP008D_D1_STC_PC_ACCEPTANCE=CONTROL_REJECTED' imp008d-d1-setthreadcontext-pc.log; then
            echo 'IMP008D_D1_STC_CLASSIFICATION=CONTROL_INVALID'
          else
            echo 'IMP008D_D1_STC_CLASSIFICATION=INCONCLUSIVE'
          fi
          exit 1

      - name: Persist D1 SetThreadContext PC acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imp008d-d1-setthreadcontext-pc-acceptance-${{ github.run_id }}
          path: |
            eden/imp008d-d1-build.log
            eden/imp008d-d1.out.log
            eden/imp008d-d1.err.log
            eden/imp008d-d1-setthreadcontext-pc.log
            eden/imp008d-d1-setthreadcontext-pc-observer.rc
            eden/imp008d-d1-first-exception.bin
          if-no-files-found: warn
