name: Probe IMP-008B E5 Final AV Detail

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-e5-final-av-detail-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp-008b-e5-final-av-detail
  cancel-in-progress: false

jobs:
  e5-final-av-detail:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 15
    steps:
      - name: Verify retained V3 state
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Test-Path 'eden/.git')) { throw 'retained eden checkout missing' }
          $head=(git -C eden rev-parse HEAD).Trim()
          if ($head -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31') { throw "unexpected retained head $head" }
          $transition=[IO.File]::ReadAllText((Resolve-Path 'eden/src/core/arm/nce/windows_nce_transition.cpp'))
          $probe=[IO.File]::ReadAllText((Resolve-Path 'eden/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp'))
          if (-not $transition.Contains('Imp008bE5CaptureFullContext(context);')) { throw 'V3 non-CRT capture missing' }
          if (-not $probe.Contains('IMP008B_E5_FULLCTX_SAFE_DUMP_CALL_V3')) { throw 'V3 safe dump missing' }
          Remove-Item 'eden/imp008b-e5-avdetail.log','eden/imp008b-e5-avdetail.out.log','eden/imp008b-e5-avdetail.err.log','eden/imp008b-e5-avdetail.rc','eden/imp008b-e5-avdetail-link.log','eden/imp008b-e5-avdetail-commands.txt','eden/imp008b-e5-avdetail-disasm.txt','eden/imp008b-e5-avdetail-peheaders.txt' -Force -ErrorAction SilentlyContinue
          Write-Host ('IMP008B_E5_AVDETAIL_RETAINED_HEAD=' + $head)
          Write-Host ('IMP008B_E5_AVDETAIL_DIRTY_ENTRIES=' + @((git -C eden status --short)).Count)
          Write-Host 'IMP008B_E5_AVDETAIL_RETAINED_STATE=PASS'

      - name: Add final AV record and host-context diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path=(Resolve-Path 'eden/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp').Path
          $text=[IO.File]::ReadAllText($path)
          if ($text.Contains('IMP008B_E5_AVDETAIL_V1')) { throw 'AV detail diagnostic already applied' }

          $recordAnchor='    const auto* const record = exception->ExceptionRecord;'
          if (([regex]::Matches($text,[regex]::Escape($recordAnchor))).Count -ne 1) { throw 'record anchor mismatch' }
          $detail=@'
    // IMP008B_E5_AVDETAIL_V1
    std::fprintf(stderr, "IMP008B_E5_EXCEPTION_NUMBER_PARAMETERS=%lu\n",
                 static_cast<unsigned long>(record->NumberParameters));
    for (ULONG i = 0; i < record->NumberParameters && i < EXCEPTION_MAXIMUM_PARAMETERS; ++i) {
        std::fprintf(stderr, "IMP008B_E5_EXCEPTION_INFORMATION_%lu=0x%llX\n",
                     static_cast<unsigned long>(i),
                     static_cast<unsigned long long>(record->ExceptionInformation[i]));
    }
#if defined(_M_ARM64) || defined(__aarch64__)
    if (exception->ContextRecord != nullptr) {
        const auto* const avctx = reinterpret_cast<const ARM64_NT_CONTEXT*>(exception->ContextRecord);
        std::fprintf(stderr,
                     "IMP008B_E5_AVCTX FLAGS=0x%08lX CPSR=0x%08lX SP=0x%llX PC=0x%llX\n",
                     static_cast<unsigned long>(avctx->ContextFlags),
                     static_cast<unsigned long>(avctx->Cpsr),
                     static_cast<unsigned long long>(avctx->Sp),
                     static_cast<unsigned long long>(avctx->Pc));
        for (std::size_t i = 0; i < 31; ++i) {
            std::fprintf(stderr, "IMP008B_E5_AVCTX_X%02llu=0x%016llX\n",
                         static_cast<unsigned long long>(i),
                         static_cast<unsigned long long>(avctx->X[i]));
        }
    }
#endif
'@
          $text=$text.Replace($recordAnchor,$recordAnchor+"`n"+$detail)

          $vehAnchor='    Trace("IMP008B_E5_VEH_INSTALLED");'
          if (([regex]::Matches($text,[regex]::Escape($vehAnchor))).Count -ne 1) { throw 'VEH installed anchor mismatch' }
          $moduleLog=@'
    const HMODULE imp008b_e5_ucrtbase = GetModuleHandleW(L"ucrtbase.dll");
    std::fprintf(stderr, "IMP008B_E5_UCRTBASE_BASE=%p\n", imp008b_e5_ucrtbase);
    std::fflush(stderr);
'@
          $text=$text.Replace($vehAnchor,$vehAnchor+"`n"+$moduleLog)
          $utf8=New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($path,$text,$utf8)
          $verify=[IO.File]::ReadAllText($path)
          if (([regex]::Matches($verify,'IMP008B_E5_AVDETAIL_V1')).Count -ne 1) { throw 'AV detail marker mismatch' }
          if (-not $verify.Contains('IMP008B_E5_UCRTBASE_BASE=')) { throw 'ucrtbase base marker missing' }
          Write-Host 'IMP008B_E5_AVDETAIL_PATCH=PASS'

      - name: Extract direct commands read-only
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference='Stop'
          $commands=& 'C:\msys64\usr\bin\ninja.exe' -C build -t commands imp008b_e5_x18_runtime
          if ($LASTEXITCODE -ne 0) { throw "ninja tool-mode rc=$LASTEXITCODE" }
          [IO.File]::WriteAllLines((Join-Path (Get-Location) 'imp008b-e5-avdetail-commands.txt'),[string[]]$commands)
          Write-Host 'IMP008B_E5_AVDETAIL_COMMANDS=PASS'

      - name: Compile E5 probe object only
        shell: powershell
        working-directory: eden/build
        run: |
          $ErrorActionPreference='Stop'
          $lines=@(Get-Content '../imp008b-e5-avdetail-commands.txt')
          $hits=@($lines | Where-Object { (($_ -replace '\\','/')) -match " -c '?C:/.*?/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant\.cpp'?$" })
          if ($hits.Count -ne 1) { throw "E5 probe command count=$($hits.Count)" }
          $cmd=[string]$hits[0]
          $cmd=$cmd.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64')
          $cmd=$cmd.Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64')
          $cmd=$cmd.Replace('C:\msys64\clangarm64\bin\sccache.exe ','')
          $cmd=$cmd.Replace('C:/msys64/clangarm64/bin/sccache.exe ','')
          $cmd=[regex]::Replace($cmd,"'(C:/[^']+)'",'$1')
          & $env:ComSpec /D /S /C $cmd
          $rc=$LASTEXITCODE
          Write-Host "IMP008B_E5_AVDETAIL_COMPILE_RC=$rc"
          if ($rc -ne 0) { throw "E5 probe compile failed rc=$rc" }

      - name: Link E5 runtime
        shell: powershell
        working-directory: eden/build
        run: |
          $ErrorActionPreference='Stop'
          $lines=@(Get-Content '../imp008b-e5-avdetail-commands.txt')
          $hits=@($lines | Where-Object { $_ -match '-o bin\\imp008b_e5_x18_runtime\.exe' })
          if ($hits.Count -ne 1) { throw "link command count=$($hits.Count)" }
          $cmd=[string]$hits[0]
          $cmd=$cmd.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64')
          $cmd=$cmd.Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64')
          & $env:ComSpec /D /S /C $cmd 2>&1 | Tee-Object -FilePath '../imp008b-e5-avdetail-link.log'
          $rc=$LASTEXITCODE
          Write-Host "IMP008B_E5_AVDETAIL_LINK_RC=$rc"
          if ($rc -ne 0) { throw "link failed rc=$rc" }

      - name: Run E5 diagnostic exactly once
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference='Stop'
          $psi=New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName=(Resolve-Path 'build/bin/imp008b_e5_x18_runtime.exe').Path
          $psi.WorkingDirectory=(Get-Location).Path
          $psi.UseShellExecute=$false
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          $p=New-Object System.Diagnostics.Process
          $p.StartInfo=$psi
          if (-not $p.Start()) { throw 'runtime start failed' }
          $ot=$p.StandardOutput.ReadToEndAsync(); $et=$p.StandardError.ReadToEndAsync()
          $timeout=-not $p.WaitForExit(30000)
          if ($timeout) { $p.Kill(); $p.WaitForExit() }
          $out=$ot.Result; $err=$et.Result
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'imp008b-e5-avdetail.out.log'),$out)
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'imp008b-e5-avdetail.err.log'),$err)
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'imp008b-e5-avdetail.log'),$out+$err)
          if ($timeout) { $rc=124 } else { $rc=$p.ExitCode }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'imp008b-e5-avdetail.rc'),[string]$rc)
          Write-Host $out
          Write-Host $err
          Write-Host ('IMP008B_E5_AVDETAIL_RUNTIME_RC={0} (0x{1:X8})' -f $rc,($rc -band 0xffffffffL))

      - name: Resolve RVA and disassemble local ucrtbase
        if: always()
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference='Continue'
          if (-not (Test-Path 'imp008b-e5-avdetail.log')) { Write-Host 'IMP008B_E5_AVDETAIL_RUNTIME=NOT_REACHED'; exit 0 }
          $text=Get-Content 'imp008b-e5-avdetail.log' -Raw
          $baseMatch=[regex]::Match($text,'IMP008B_E5_UCRTBASE_BASE=0x([0-9A-Fa-f]+)')
          $faultMatch=[regex]::Match($text,'IMP008B_E5_EXCEPTION_ADDRESS=(?:0x)?([0-9A-Fa-f]+)')
          if (-not $baseMatch.Success -or -not $faultMatch.Success) {
            Write-Host 'IMP008B_E5_AVDETAIL_RVA=UNAVAILABLE'
            exit 0
          }
          $loadedBase=[Convert]::ToUInt64($baseMatch.Groups[1].Value,16)
          $fault=[Convert]::ToUInt64($faultMatch.Groups[1].Value,16)
          $rva=$fault-$loadedBase
          Write-Host ('IMP008B_E5_AVDETAIL_LOADED_BASE=0x{0:X}' -f $loadedBase)
          Write-Host ('IMP008B_E5_AVDETAIL_FAULT=0x{0:X}' -f $fault)
          Write-Host ('IMP008B_E5_AVDETAIL_RVA=0x{0:X}' -f $rva)

          $dll="$env:WINDIR\System32\ucrtbase.dll"
          $readobj='C:\msys64\clangarm64\bin\llvm-readobj.exe'
          $objdump='C:\msys64\clangarm64\bin\llvm-objdump.exe'
          if (-not (Test-Path $dll) -or -not (Test-Path $readobj) -or -not (Test-Path $objdump)) {
            Write-Host 'IMP008B_E5_AVDETAIL_DISASM_TOOLS=MISSING'
            exit 0
          }
          $headers=@(& $readobj --file-headers $dll)
          [IO.File]::WriteAllLines((Join-Path (Get-Location) 'imp008b-e5-avdetail-peheaders.txt'),[string[]]$headers)
          $imageLine=$headers | Where-Object { $_ -match 'ImageBase:' } | Select-Object -First 1
          if (-not $imageLine) { Write-Host 'IMP008B_E5_AVDETAIL_IMAGEBASE=UNAVAILABLE'; exit 0 }
          $imageMatch=[regex]::Match($imageLine,'ImageBase:\s*0x([0-9A-Fa-f]+)')
          if (-not $imageMatch.Success) { Write-Host ('IMP008B_E5_AVDETAIL_IMAGEBASE_LINE=' + $imageLine); exit 0 }
          $imageBase=[Convert]::ToUInt64($imageMatch.Groups[1].Value,16)
          $target=$imageBase+$rva
          $start=$target-0x40
          $stop=$target+0x44
          Write-Host ('IMP008B_E5_AVDETAIL_PE_IMAGEBASE=0x{0:X}' -f $imageBase)
          Write-Host ('IMP008B_E5_AVDETAIL_PE_TARGET_VMA=0x{0:X}' -f $target)
          $disasm=@(& $objdump -d ("--start-address=0x{0:X}" -f $start) ("--stop-address=0x{0:X}" -f $stop) $dll 2>&1)
          [IO.File]::WriteAllLines((Join-Path (Get-Location) 'imp008b-e5-avdetail-disasm.txt'),[string[]]$disasm)
          Write-Host 'IMP008B_E5_AVDETAIL_DISASM_BEGIN'
          $disasm | ForEach-Object { Write-Host $_ }
          Write-Host 'IMP008B_E5_AVDETAIL_DISASM_END'

      - name: Summarize AV detail
        if: always()
        shell: powershell
        working-directory: eden
        run: |
          if (-not (Test-Path 'imp008b-e5-avdetail.log')) { exit 0 }
          Get-Content 'imp008b-e5-avdetail.log' | Select-String -Pattern 'IMP008B_E5_EXCEPTION_(CODE|FLAGS|ADDRESS|NUMBER_PARAMETERS|INFORMATION_)|IMP008B_E5_AVCTX|IMP008B_E5_UCRTBASE_BASE|IMP008B_E2_RESTORE_CONTEXT|IMP008B_E2_BEFORE_NT_CONTINUE|IMP008B_E5_RUNTHREAD_RETURNED|IMP008B_E5_SVC_NUMBER'
          if (Test-Path 'imp008b-e5-avdetail.rc') { Write-Host ('IMP008B_E5_AVDETAIL_RAW_RC=' + (Get-Content 'imp008b-e5-avdetail.rc' -Raw).Trim()) }

      - name: Upload AV detail diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-final-av-detail
          path: |
            eden/imp008b-e5-avdetail-commands.txt
            eden/imp008b-e5-avdetail-link.log
            eden/imp008b-e5-avdetail.log
            eden/imp008b-e5-avdetail.out.log
            eden/imp008b-e5-avdetail.err.log
            eden/imp008b-e5-avdetail.rc
            eden/imp008b-e5-avdetail-peheaders.txt
            eden/imp008b-e5-avdetail-disasm.txt
          if-no-files-found: warn
