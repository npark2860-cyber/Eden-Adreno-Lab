name: Build Windows ARM64 NCE real-game diagnostics V5 055b212d

on:
  workflow_dispatch:
  push:
    branches:
      - fix/windows-nce-realgame-regression-055b212d
    paths:
      - .github/workflows/build-windows-arm64-nce-realgame-diag-v5-055b212d.yml
      - .github/diagnostics/apply-windows-nce-early-breadcrumb-v5.py

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-realgame-diag-v5-055b212d
  cancel-in-progress: false

env:
  SOURCE_SHA: 055b212df86dbfc18257b127ee5a0cbfda8ff861
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: realgame-diag-v5-055b212d
  TELEMETRY_SCRIPT_PATH: .github/diagnostics/apply-windows-nce-realgame-telemetry.py
  TRANSITION_SCRIPT_PATH: .github/diagnostics/apply-windows-nce-stacktop-transition-ab.py
  V4_BREADCRUMB_SCRIPT_PATH: .github/diagnostics/apply-windows-nce-transition-breadcrumb-v4.py
  V5_EARLY_SCRIPT_PATH: .github/diagnostics/apply-windows-nce-early-breadcrumb-v5.py

jobs:
  build-package:
    name: Windows ARM64 NCE real-game diagnostic V5 package
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout diagnostic control Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/realgame-diag-v5-055b212d/control
          fetch-depth: 0

      - name: Checkout exact frozen production source
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: 055b212df86dbfc18257b127ee5a0cbfda8ff861
          path: build/validation/${{ github.sha }}/realgame-diag-v5-055b212d/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify Git-object provenance and apply diagnostic V5 transforms
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          CONTROL="$ROOT/control"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$CONTROL" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=no)"

          git -C "$CONTROL" show "$GITHUB_SHA:$TELEMETRY_SCRIPT_PATH" > "$PROV/apply-windows-nce-realgame-telemetry.py.git-object"
          git -C "$CONTROL" show "$GITHUB_SHA:$TRANSITION_SCRIPT_PATH" > "$PROV/apply-windows-nce-stacktop-transition-ab.py.git-object"
          git -C "$CONTROL" show "$GITHUB_SHA:$V4_BREADCRUMB_SCRIPT_PATH" > "$PROV/apply-windows-nce-transition-breadcrumb-v4.py.git-object"
          git -C "$CONTROL" show "$GITHUB_SHA:$V5_EARLY_SCRIPT_PATH" > "$PROV/apply-windows-nce-early-breadcrumb-v5.py.git-object"
          git -C "$SOURCE" show "$SOURCE_SHA:src/core/arm/nce/arm_nce_windows.cpp" > "$PROV/arm_nce_windows.cpp.base.git-object"
          git -C "$SOURCE" show "$SOURCE_SHA:src/core/arm/nce/windows_nce_transition.cpp" > "$PROV/windows_nce_transition.cpp.base.git-object"

          python "$PROV/apply-windows-nce-realgame-telemetry.py.git-object" "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          python "$PROV/apply-windows-nce-stacktop-transition-ab.py.git-object" "$SOURCE/src/core/arm/nce/windows_nce_transition.cpp"
          python "$PROV/apply-windows-nce-transition-breadcrumb-v4.py.git-object" "$SOURCE/src/core/arm/nce/windows_nce_transition.cpp"
          python "$PROV/apply-windows-nce-early-breadcrumb-v5.py.git-object" "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"

          git -C "$SOURCE" diff --check
          grep -Fq 'REALGAME_EARLY_BREADCRUMB_V5=PASS' "$PROV/apply-windows-nce-early-breadcrumb-v5.py.git-object"
          grep -Fq 'eden_nce_v5_early.log' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'ARMNCE_CONSTRUCTOR' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'RUNTHREAD_ENTER' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'BEFORE_STACK_LEASE' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'AFTER_STACK_LEASE' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'BEFORE_TEB_INSTALL' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'AFTER_TEB_INSTALL' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'BEFORE_ENTER_GUEST_CONTEXT' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'BEFORE_ENTER_GUEST_POST' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'RESTORE_ENTER' "$SOURCE/src/core/arm/nce/windows_nce_transition.cpp"
          grep -Fq 'guest->sp > allocation_end' "$SOURCE/src/core/arm/nce/windows_nce_transition.cpp"

          git -C "$SOURCE" diff -- src/core/arm/nce/arm_nce_windows.cpp > "$PROV/arm_nce_windows.cpp.telemetry-early-v5.diff"
          git -C "$SOURCE" diff -- src/core/arm/nce/windows_nce_transition.cpp > "$PROV/windows_nce_transition.cpp.stacktop-breadcrumb-v4.diff"

          printf 'SOURCE_SHA=%s\nDIAG_COMMIT_SHA=%s\nSOURCE_REPOSITORY=%s\nSOURCE_MODE=frozen Git object plus telemetry/stack-top/V4-transition/V5-early Git-object transforms\nISOLATION_DIR=build/validation/%s/%s\nV5_TEMP_FILE=%%TEMP%%\\eden_nce_v5_early.log\nV5_CWD_FILE=eden_nce_v5_early.log\n' \
            "$SOURCE_SHA" "$GITHUB_SHA" 'npark2860-cyber/Eden-Adreno-Lab' "$GITHUB_SHA" "$TEST_NAME" > "$PROV/BUILD_INFO.txt"
          echo 'REALGAME_DIAG_V5_GIT_OBJECT_GUARD=PASS'

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: build/validation/${{ github.sha }}/realgame-diag-v5-055b212d/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure diagnostic V5 Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/realgame-diag-v5-055b212d/source
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          printf 'CONFIGURE_COMMAND=./.ci/build/configure.sh -DCCACHE_PATH=sccache\nNCE_COMPILE_GUARD=HAS_NCE=1\n' >> ../provenance/BUILD_INFO.txt
          echo 'REALGAME_DIAG_V5_CONFIGURE=PASS'

      - name: Build full Windows ARM64 Eden diagnostic V5 package
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/realgame-diag-v5-055b212d/source
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          printf 'BUILD_COMMAND=cmake --build build\n' >> ../provenance/BUILD_INFO.txt
          echo 'REALGAME_DIAG_V5_BUILD=PASS'

      - name: Package Windows ARM64 Eden diagnostics V5
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/realgame-diag-v5-055b212d/source
        env:
          ARTIFACT_REF: nce-realgame-diag-v5-055b212d
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          printf 'PACKAGE_COMMAND=./.ci/package/windows.sh\nARTIFACT_REF=nce-realgame-diag-v5-055b212d\n' >> ../provenance/BUILD_INFO.txt
          echo 'REALGAME_DIAG_V5_PACKAGE=PASS'

      - name: Prepare diagnostic V5 upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged Eden artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov 'BUILD_INFO.txt') $upload -Force
          Copy-Item (Join-Path $prov 'apply-windows-nce-realgame-telemetry.py.git-object') $upload -Force
          Copy-Item (Join-Path $prov 'apply-windows-nce-stacktop-transition-ab.py.git-object') $upload -Force
          Copy-Item (Join-Path $prov 'apply-windows-nce-transition-breadcrumb-v4.py.git-object') $upload -Force
          Copy-Item (Join-Path $prov 'apply-windows-nce-early-breadcrumb-v5.py.git-object') $upload -Force
          Copy-Item (Join-Path $prov 'arm_nce_windows.cpp.telemetry-early-v5.diff') $upload -Force
          Copy-Item (Join-Path $prov 'windows_nce_transition.cpp.stacktop-breadcrumb-v4.diff') $upload -Force
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash
          "PACKAGE_FILE=$($files[0].Name)" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          "PACKAGE_SHA256=$hash" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          Get-Content (Join-Path $upload 'BUILD_INFO.txt')

      - name: Upload real-game diagnostic V5 package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-REALGAME-DIAG-V5-055b212d
          path: build/validation/${{ github.sha }}/realgame-diag-v5-055b212d/upload/*
          if-no-files-found: error
          retention-days: 14
