name: Probe IMP-008E E2 RunThread Private Stack Lease Scope V6

on:
  workflow_dispatch:
  push:
    branches: [exp/imp-008e-windows-nce-rasterizer-recovery-runtime]
    paths:
      - .github/workflows/probe-imp008e-e2-runthread-private-stack-lease-scope-v6-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp008e-e2-runthread-private-stack-lease-scope-v6
  cancel-in-progress: false

jobs:
  e2-runthread-private-stack-lease-scope-v6:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 8
    steps:
      - name: Execute RunThread-scope lease probe
        shell: powershell
        run: |
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            'UyBCRUdJTj0kYmVnaW4gUkVVU0U9JHJldXNlIEVORD0kZW5kIgogIGV4aXQgMAp9CldyaXRlLUhvc3QgIklNUDAwOEVfRTJfUlVOVEhSRUFEX1BSSVZBVEVfU1RBQ0tfTEVBU0VfU0NPUEVfVjY9RkFJTCBCRUdJTj0kYmVnaW4gUkVVU0U9JHJldXNlIEVORD0kZW5kIFJDPSRyYyIKZXhpdCAxCg=='
          )
          $payload=$parts -join ''
          if($payload.Length -ne 12124){throw "payload length mismatch $($payload.Length)"}
          $bytes=[Convert]::FromBase64String($payload)
          $sha=[BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($bytes)).Replace('-','').ToLowerInvariant()
          if($sha -ne 'ea24c581d65a309586f86b8f6855f2da23a07fb535fd92886bb23e67ff5bfeb3'){throw "payload sha mismatch $sha"}
          $script=[Text.Encoding]::UTF8.GetString($bytes)
          $scriptPath=Join-Path $env:RUNNER_TEMP 'imp008e-scope-v6.ps1'
          [IO.File]::WriteAllText($scriptPath,$script,[Text.UTF8Encoding]::new($false))
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $scriptPath
          exit $LASTEXITCODE
