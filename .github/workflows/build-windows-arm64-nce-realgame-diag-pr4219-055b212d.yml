name: Build Windows ARM64 NCE real-game diagnostics PR4219 055b212d

on:
  workflow_dispatch:
  push:
    branches:
      - ab/pr4219-realgame-diag-055b212d
    paths:
      - .github/workflows/build-windows-arm64-nce-realgame-diag-pr4219-055b212d.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-realgame-diag-pr4219-055b212d
  cancel-in-progress: false

env:
  SOURCE_SHA: 055b212df86dbfc18257b127ee5a0cbfda8ff861
  PR4219_SHA: 5f142c7926d0c7fcbbd0ce30794d72f638a43b2a
  PR4219_PARENT: c5f6f1ca5eaf16ff84aee7987c0c8d37a1d9d2b2
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: realgame-diag-pr4219-055b212d
  SCRIPT_PATH: .github/diagnostics/apply-windows-nce-realgame-telemetry.py
  HOST_MEMORY_SCRIPT_PATH: .github/diagnostics/apply-pr4219-host-memory-windows.py

jobs:
  build-package:
    name: Windows ARM64 NCE PR4219 A/B diagnostic package
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout diagnostic control Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/realgame-diag-pr4219-055b212d/control
          fetch-depth: 0

      - name: Checkout exact frozen production source
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: 055b212df86dbfc18257b127ee5a0cbfda8ff861
          path: build/validation/${{ github.sha }}/realgame-diag-pr4219-055b212d/source
          fetch-depth: 0
          submodules: recursive

      - name: Checkout exact upstream PR4219 Git object
        uses: actions/checkout@v7
        with:
          repository: eden-emulator/mirror
          ref: 5f142c7926d0c7fcbbd0ce30794d72f638a43b2a
          path: build/validation/${{ github.sha }}/realgame-diag-pr4219-055b212d/upstream4219
          fetch-depth: 2

      - name: Verify provenance and apply PR4219 with NCE HostMemory merge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          CONTROL="$ROOT/control"
          SOURCE="$ROOT/source"
          UPSTREAM="$ROOT/upstream4219"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$CONTROL" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C "$UPSTREAM" rev-parse HEAD)" = "$PR4219_SHA"
          test "$(git -C "$UPSTREAM" rev-parse HEAD^)" = "$PR4219_PARENT"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=no)"

          git -C "$UPSTREAM" show --format= --binary --full-index "$PR4219_SHA" > "$PROV/pr4219.git-object.patch"
          git -C "$SOURCE" apply --check --exclude=src/common/host_memory.cpp "$PROV/pr4219.git-object.patch"
          git -C "$SOURCE" apply --exclude=src/common/host_memory.cpp "$PROV/pr4219.git-object.patch"

          git -C "$CONTROL" show "$GITHUB_SHA:$HOST_MEMORY_SCRIPT_PATH" > "$PROV/apply-pr4219-host-memory-windows.py.git-object"
          git -C "$SOURCE" show "$SOURCE_SHA:src/common/host_memory.cpp" > "$PROV/host_memory.cpp.base.git-object"
          python "$PROV/apply-pr4219-host-memory-windows.py.git-object" "$SOURCE/src/common/host_memory.cpp"

          git -C "$SOURCE" diff --check
          grep -Fq 'SparseLargeVector' "$SOURCE/src/common/page_table.h"
          grep -Fq 'bool fallback_buffer{false}' "$SOURCE/src/common/host_memory.h"
          grep -Fq 'void* Allocate(size_t size)' "$SOURCE/src/common/host_memory.cpp"
          git -C "$SOURCE" diff > "$PROV/pr4219.applied.diff"

          git -C "$CONTROL" show "$GITHUB_SHA:$SCRIPT_PATH" > "$PROV/apply-windows-nce-realgame-telemetry.py.git-object"
          git -C "$SOURCE" show "$SOURCE_SHA:src/core/arm/nce/arm_nce_windows.cpp" > "$PROV/arm_nce_windows.cpp.base.git-object"
          python "$PROV/apply-windows-nce-realgame-telemetry.py.git-object" "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          git -C "$SOURCE" diff --check
          grep -Fq 'NCE_REALGAME_DIAG_FASTMEM' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'NCE_REALGAME_DIAG_STACK' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'NCE_REALGAME_DIAG_FAULT' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          git -C "$SOURCE" diff -- src/core/arm/nce/arm_nce_windows.cpp > "$PROV/arm_nce_windows.cpp.telemetry.diff"

          printf 'SOURCE_SHA=%s\nPR4219_SHA=%s\nPR4219_PARENT=%s\nDIAG_COMMIT_SHA=%s\nSOURCE_REPOSITORY=%s\nUPSTREAM_REPOSITORY=%s\nSOURCE_MODE=frozen Git object plus exact PR4219 Git-object diff with HostMemory NCE-preserving transform plus telemetry-transform Git object\nISOLATION_DIR=build/validation/%s/%s\nSCRIPT_PATH=%s\nHOST_MEMORY_SCRIPT_PATH=%s\n' \
            "$SOURCE_SHA" "$PR4219_SHA" "$PR4219_PARENT" "$GITHUB_SHA" 'npark2860-cyber/Eden-Adreno-Lab' 'eden-emulator/mirror' "$GITHUB_SHA" "$TEST_NAME" "$SCRIPT_PATH" "$HOST_MEMORY_SCRIPT_PATH" > "$PROV/BUILD_INFO.txt"
          echo 'PR4219_REALGAME_DIAG_GIT_OBJECT_GUARD=PASS'

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: build/validation/${{ github.sha }}/realgame-diag-pr4219-055b212d/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure PR4219 diagnostic Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/realgame-diag-pr4219-055b212d/source
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          printf 'CONFIGURE_COMMAND=./.ci/build/configure.sh -DCCACHE_PATH=sccache\nNCE_COMPILE_GUARD=HAS_NCE=1\n' >> ../provenance/BUILD_INFO.txt
          echo 'PR4219_REALGAME_DIAG_CONFIGURE=PASS'

      - name: Build full Windows ARM64 Eden PR4219 diagnostic package
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/realgame-diag-pr4219-055b212d/source
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          printf 'BUILD_COMMAND=cmake --build build\n' >> ../provenance/BUILD_INFO.txt
          echo 'PR4219_REALGAME_DIAG_BUILD=PASS'

      - name: Package Windows ARM64 Eden PR4219 diagnostics
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/realgame-diag-pr4219-055b212d/source
        env:
          ARTIFACT_REF: nce-realgame-diag-pr4219-055b212d
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          printf 'PACKAGE_COMMAND=./.ci/package/windows.sh\nARTIFACT_REF=nce-realgame-diag-pr4219-055b212d\n' >> ../provenance/BUILD_INFO.txt
          echo 'PR4219_REALGAME_DIAG_PACKAGE=PASS'

      - name: Prepare diagnostic upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged Eden artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov 'BUILD_INFO.txt') $upload -Force
          Copy-Item (Join-Path $prov 'pr4219.git-object.patch') $upload -Force
          Copy-Item (Join-Path $prov 'pr4219.applied.diff') $upload -Force
          Copy-Item (Join-Path $prov 'apply-pr4219-host-memory-windows.py.git-object') $upload -Force
          Copy-Item (Join-Path $prov 'apply-windows-nce-realgame-telemetry.py.git-object') $upload -Force
          Copy-Item (Join-Path $prov 'arm_nce_windows.cpp.telemetry.diff') $upload -Force
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash
          "PACKAGE_FILE=$($files[0].Name)" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          "PACKAGE_SHA256=$hash" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          Get-Content (Join-Path $upload 'BUILD_INFO.txt')

      - name: Upload PR4219 real-game diagnostic package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-REALGAME-DIAG-PR4219-055b212d
          path: build/validation/${{ github.sha }}/realgame-diag-pr4219-055b212d/upload/*
          if-no-files-found: error
          retention-days: 14
