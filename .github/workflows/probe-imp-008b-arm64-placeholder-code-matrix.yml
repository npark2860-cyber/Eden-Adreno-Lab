name: Probe IMP-008B ARM64 Placeholder Code Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-arm64-placeholder-code-matrix.yml

permissions:
  contents: read

jobs:
  placeholder-code-matrix:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 15
    steps:
      - name: Build native ARM64 code-VAD probe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <winternl.h>
          #include <cstdint>
          #include <cstdio>
          #include <string>
          #ifndef MEM_RESERVE_PLACEHOLDER
          #define MEM_RESERVE_PLACEHOLDER 0x00040000
          #endif
          #ifndef MEM_REPLACE_PLACEHOLDER
          #define MEM_REPLACE_PLACEHOLDER 0x00004000
          #endif
          #ifndef MEM_PRESERVE_PLACEHOLDER
          #define MEM_PRESERVE_PLACEHOLDER 0x00000002
          #endif
          using NtContinueFn = LONG (NTAPI*)(PCONTEXT, BOOLEAN);
          using VirtualAlloc2Fn = PVOID (WINAPI*)(HANDLE,PVOID,SIZE_T,ULONG,ULONG,MEM_EXTENDED_PARAMETER*,ULONG);
          using MapViewOfFile3Fn = PVOID (WINAPI*)(HANDLE,HANDLE,PVOID,ULONG64,SIZE_T,ULONG,ULONG,MEM_EXTENDED_PARAMETER*,ULONG);
          using UnmapViewOfFile2Fn = BOOL (WINAPI*)(HANDLE,PVOID,ULONG);
          using ExitProcessFn = VOID (WINAPI*)(UINT);
          static ExitProcessFn g_exit{};
          static LONG CALLBACK Veh(PEXCEPTION_POINTERS ep) noexcept {
              if (!ep || !ep->ExceptionRecord || !ep->ContextRecord || !g_exit) return EXCEPTION_CONTINUE_SEARCH;
              ep->ContextRecord->Pc = reinterpret_cast<DWORD64>(g_exit);
              ep->ContextRecord->X0 = ep->ExceptionRecord->ExceptionCode == EXCEPTION_BREAKPOINT ? 42u : 43u;
              return EXCEPTION_CONTINUE_EXECUTION;
          }
          static void Dump(const char* tag, void* p) {
              MEMORY_BASIC_INFORMATION m{}; VirtualQuery(p,&m,sizeof(m));
              std::printf("IMP008B_CODE_%s ADDR=%p BASE=%p ALLOC=%p SIZE=0x%llX STATE=0x%lX PROTECT=0x%lX TYPE=0x%lX\n",
                  tag,p,m.BaseAddress,m.AllocationBase,(unsigned long long)m.RegionSize,(unsigned long)m.State,(unsigned long)m.Protect,(unsigned long)m.Type);
              std::fflush(stdout);
          }
          int main(int argc, char** argv) {
              if (argc != 2) return 2;
              HANDLE proc=GetCurrentProcess(); HMODULE kb=GetModuleHandleW(L"kernelbase.dll"); HMODULE nt=GetModuleHandleW(L"ntdll.dll");
              auto va2=reinterpret_cast<VirtualAlloc2Fn>(GetProcAddress(kb,"VirtualAlloc2"));
              auto map3=reinterpret_cast<MapViewOfFile3Fn>(GetProcAddress(kb,"MapViewOfFile3"));
              auto unmap2=reinterpret_cast<UnmapViewOfFile2Fn>(GetProcAddress(kb,"UnmapViewOfFile2"));
              auto ntc=reinterpret_cast<NtContinueFn>(GetProcAddress(nt,"NtContinue"));
              g_exit=reinterpret_cast<ExitProcessFn>(GetProcAddress(GetModuleHandleW(L"kernel32.dll"),"ExitProcess"));
              if(!va2||!map3||!unmap2||!ntc||!g_exit||!AddVectoredExceptionHandler(1,Veh)) return 3;
              auto* arena=static_cast<std::uint8_t*>(va2(proc,nullptr,0x10000,MEM_RESERVE|MEM_RESERVE_PLACEHOLDER,PAGE_NOACCESS,nullptr,0));
              if(!arena||!VirtualFreeEx(proc,arena,0x1000,MEM_RELEASE|MEM_PRESERVE_PLACEHOLDER)) return 4;
              HANDLE sec=CreateFileMappingW(INVALID_HANDLE_VALUE,nullptr,PAGE_EXECUTE_READWRITE,0,0x1000,nullptr); if(!sec) return 5;
              void* mapped=map3(sec,proc,arena,0,0x1000,MEM_REPLACE_PLACEHOLDER,PAGE_EXECUTE_READWRITE,nullptr,0); if(mapped!=arena) return 6;
              auto* words=reinterpret_cast<std::uint32_t*>(arena); words[0]=0xD43E0000u; words[1]=0xD65F03C0u;
              FlushInstructionCache(proc,arena,8); DWORD old{}; if(!VirtualProtect(arena,0x1000,PAGE_EXECUTE_READ,&old)) return 7;
              Dump("PLACEHOLDER",arena);
              const std::string mode=argv[1];
              if(mode=="private-code") {
                  if(!unmap2(proc,arena,MEM_PRESERVE_PLACEHOLDER)) return 8;
                  void* p=va2(proc,arena,0x1000,MEM_RESERVE|MEM_COMMIT|MEM_REPLACE_PLACEHOLDER,PAGE_READWRITE,nullptr,0); if(p!=arena) return 9;
                  words=reinterpret_cast<std::uint32_t*>(arena); words[0]=0xD43E0000u; words[1]=0xD65F03C0u;
                  FlushInstructionCache(proc,arena,8); if(!VirtualProtect(arena,0x1000,PAGE_EXECUTE_READ,&old)) return 10;
                  Dump("PRIVATE",arena);
              }
              auto* stack=static_cast<std::uint8_t*>(VirtualAlloc(nullptr,0x10000,MEM_RESERVE|MEM_COMMIT,PAGE_READWRITE)); if(!stack) return 11;
              CONTEXT ctx{}; RtlCaptureContext(&ctx); ctx.ContextFlags=CONTEXT_FULL; ctx.Pc=reinterpret_cast<DWORD64>(arena); ctx.Sp=(reinterpret_cast<DWORD64>(stack+0x10000-0x20))&~0xFULL;
              Dump("STACK",reinterpret_cast<void*>(ctx.Sp)); std::printf("IMP008B_CODE_BEFORE_NT MODE=%s PC=0x%llX SP=0x%llX\n",mode.c_str(),(unsigned long long)ctx.Pc,(unsigned long long)ctx.Sp); std::fflush(stdout);
              auto* tib=reinterpret_cast<NT_TIB*>(NtCurrentTeb()); tib->StackLimit=stack; tib->StackBase=stack+0x10000;
              const LONG st=ntc(&ctx,FALSE); ExitProcess(0x80u | (static_cast<unsigned long>(st)&0x7Fu));
          }
          '@ | Set-Content arm64_placeholder_code_probe.cpp -Encoding utf8
          $vsdev=Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\*\Community\Common7\Tools\VsDevCmd.bat" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $vsdev){throw 'VsDevCmd missing'}
          $cmd='"'+$vsdev.FullName+'" -arch=arm64 -host_arch=arm64 >nul && cl.exe /nologo /std:c++20 /O2 /EHsc arm64_placeholder_code_probe.cpp /Fe:arm64_placeholder_code_probe.exe'
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){throw "compile rc=$LASTEXITCODE"}
          Write-Host 'IMP008B_CODE_BUILD=PASS'

      - name: Run code VAD matrix
        shell: powershell
        run: |
          $rows=@()
          foreach($case in @('placeholder-code','private-code')){
            $psi=New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName=(Resolve-Path '.\arm64_placeholder_code_probe.exe').Path; $psi.Arguments=$case; $psi.UseShellExecute=$false; $psi.RedirectStandardOutput=$true; $psi.RedirectStandardError=$true
            $p=New-Object System.Diagnostics.Process; $p.StartInfo=$psi; [void]$p.Start(); $out=$p.StandardOutput.ReadToEnd(); $err=$p.StandardError.ReadToEnd(); $p.WaitForExit(); if($out){Write-Host $out}; if($err){Write-Host $err}; $line="IMP008B_CODE_CASE=$case EXIT_SIGNED=$($p.ExitCode)"; Write-Host $line; $rows+=$line
          }
          $rows | Set-Content imp008b-placeholder-code-matrix.log -Encoding utf8

      - name: Classify
        shell: powershell
        run: |
          Get-Content imp008b-placeholder-code-matrix.log
          foreach($case in @('placeholder-code','private-code')){ $ok=Select-String imp008b-placeholder-code-matrix.log -SimpleMatch "IMP008B_CODE_CASE=$case EXIT_SIGNED=42" -Quiet; if($ok){Write-Host "IMP008B_CODE_CLASS=$case VEH_PASS"}else{Write-Host "IMP008B_CODE_CLASS=$case VEH_FAIL"} }
