name: TEMP Dispatch X1 Exclusive PC Runtime Once

on:
  push:
    branches:
      - exp/x1-arm64-exclusive-pc-attribution
    paths:
      - .github/workflows/dispatch-x1-exclusive-pc-runtime-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch persistent ARM64 workflow exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-dc95-x1-address-arbiter-attribution.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"
