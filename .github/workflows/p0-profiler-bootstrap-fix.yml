name: Fix P0 Profiler Bootstrap

on:
  push:
    branches:
      - lab/p0-adreno-profiler
    paths:
      - .github/workflows/p0-profiler-bootstrap-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/p0-adreno-profiler
      - name: Fix bootstrap context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/p0-profiler-bootstrap.yml')
          text = p.read_text(encoding='utf-8')
          old = "'    deferred_clear.framebuffer = {};\\n\\n    std::array<VkClearValue, 9> clear_values{};'"
          new = "'    deferred_clear = {};\\n\\n    std::array<VkClearValue, 9> clear_values{};'"
          if old not in text:
              raise RuntimeError('deferred clear bootstrap needle not found')
          text = text.replace(old, new, 1)
          text = text.replace("    if: github.actor != 'github-actions[bot]'\n", '', 1)
          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/p0-profiler-bootstrap-fix.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/p0-profiler-bootstrap.yml .github/workflows/p0-profiler-bootstrap-fix.yml
          git commit -m "chore: repair P0 profiler bootstrap [skip ci]"
          git push origin HEAD:lab/p0-adreno-profiler
