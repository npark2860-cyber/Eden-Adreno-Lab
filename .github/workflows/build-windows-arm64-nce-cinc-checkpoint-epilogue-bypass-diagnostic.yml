name: Build Windows ARM64 NCE CINC Checkpoint Epilogue Bypass Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/build-windows-arm64-nce-cinc-checkpoint-epilogue-bypass-diagnostic.yml
      - tools/nce_diag/apply_cinc_checkpoint_epilogue_bypass.py

permissions:
  contents: read

concurrency:
  group: windows-arm64-nce-cinc-checkpoint-epilogue-bypass-diagnostic
  cancel-in-progress: false

jobs:
  build-package:
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO
      PROD_SHA: e9665e6457ba163f91a42d804862acac0d486378

    steps:
      - uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Verify diagnostic baseline
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          git cat-file -e "$PROD_SHA^{commit}"
          git diff --quiet "$PROD_SHA" HEAD -- src/common src/core src/video_core CMakeLists.txt
          test -f tools/nce_diag/apply_cinc_checkpoint_epilogue_bypass.py
          test -f .github/workflows/build-windows-arm64-nce-teb-bidirectional-return-validation.yml
          test -f .github/workflows/build-windows-arm64-nce-unknown-exception-diagnostic.yml
          test -f .github/workflows/build-windows-arm64-nce-reentry-breadcrumb-diagnostic.yml
          echo 'NCE_CINC_CHECKPOINT_EPILOGUE_BYPASS_GUARD=PASS'

      - name: Apply checkpoint epilogue diagnostic
        shell: pwsh
        working-directory: eden
        run: |
          python tools/nce_diag/apply_cinc_checkpoint_epilogue_bypass.py
          if ($LASTEXITCODE -ne 0) { throw 'checkpoint epilogue diagnostic injection failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'checkpoint epilogue diagnostic diff check failed' }
          if (-not (Select-String -Path 'src/core/arm/nce/arm_nce_windows.cpp' -Pattern 'IMP008_CINC_WITNESS_EPILOGUE_APPLIED' -SimpleMatch -Quiet)) { throw 'missing witness marker' }
          if (-not (Select-String -Path 'src/core/arm/nce/arm_nce_windows.cpp' -Pattern 'IMP008_CINC_CHECKPOINT_EPILOGUE_BYPASS' -SimpleMatch -Quiet)) { throw 'missing checkpoint bypass marker' }
          if (-not (Select-String -Path 'src/core/arm/nce/arm_nce_windows.cpp' -Pattern 'IMP008_CINC_CHECKPOINT_EPILOGUE_APPLIED' -SimpleMatch -Quiet)) { throw 'missing checkpoint applied marker' }
          if (-not (Select-String -Path 'src/core/arm/nce/arm_nce_windows.cpp' -Pattern 'm_guest_ctx.sp = cinc_checkpoint_sp + 0x190;' -SimpleMatch -Quiet)) { throw 'missing checkpoint SP update' }
          Write-Output 'NCE_CINC_CHECKPOINT_EPILOGUE_BYPASS_PATCH=PASS'

      - uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed CI scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 GUI build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'IMP008_CINC_CHECKPOINT_EPILOGUE_APPLIED' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'IMP008_REENTRY_BREADCRUMB_PRE' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'IMP008_UNKNOWN_GUEST_EXCEPTION' src/core/arm/nce/arm_nce_windows.cpp
          echo 'NCE_CINC_CHECKPOINT_EPILOGUE_BYPASS_CONFIGURE=PASS'

      - name: Build full Windows ARM64 Eden GUI
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          echo 'NCE_CINC_CHECKPOINT_EPILOGUE_BYPASS_BUILD=PASS'

      - name: Package Windows ARM64 Eden
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: nce-cinc-checkpoint-epilogue-bypass-${{ github.sha }}
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          echo 'NCE_CINC_CHECKPOINT_EPILOGUE_BYPASS_PACKAGE=PASS'

      - name: Prepare upload
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path eden/artifacts -File)
          if ($files.Count -ne 1) { throw "Expected one package; found $($files.Count)" }
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item $files[0].FullName upload/ -Force

      - uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-CINC-CHECKPOINT-EPILOGUE-BYPASS-${{ github.sha }}
          archive: false
          path: upload/*
          retention-days: 14
