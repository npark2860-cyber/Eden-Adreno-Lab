name: Dispatch dc95 X1 Waker Stage J Once

on:
  push:
    branches:
      - exp/x1-waker-stage-j-caller-depth
    paths:
      - .github/workflows/dispatch-dc95-x1-waker-stage-j-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Stage J exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/build-dc95-x1-address-arbiter-attribution.yml/dispatches" \
            -d '{"ref":"exp/x1-waker-stage-j-caller-depth"}'
