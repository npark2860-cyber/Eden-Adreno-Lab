name: Build Windows ARM64 NCE V49 exit watchdog 1b8eee8d

on:
  push:
    branches:
      - diag/windows-nce-realgame-v49-exit-watchdog-1b8eee8d
    paths:
      - .github/diagnostics/v49-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-v49-exit-watchdog-1b8eee8d
  cancel-in-progress: false

env:
  CANDIDATE_BASE_SHA: 1b8eee8d8951d43d98761d979f7ea83bb903bd2c
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: v49-exit-watchdog

jobs:
  build-package:
    name: Windows ARM64 NCE V49 exit watchdog
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact V49 Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/v49-exit-watchdog/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify V49 provenance and scope
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$SOURCE" merge-base --is-ancestor "$CANDIDATE_BASE_SHA" "$GITHUB_SHA"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=no)"
          git -C "$SOURCE" diff --check "$CANDIDATE_BASE_SHA" "$GITHUB_SHA"

          CHANGED="$(git -C "$SOURCE" diff --name-only "$CANDIDATE_BASE_SHA" "$GITHUB_SHA")"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(src/yuzu/main.cpp|\.github/workflows/build-windows-arm64-nce-v49-exit-watchdog-1b8eee8d.yml|\.github/diagnostics/v49-trigger.txt)$' || true)"
          test -z "$UNEXPECTED"

          test -z "$(git -C "$SOURCE" diff "$CANDIDATE_BASE_SHA" "$GITHUB_SHA" -- src/core/arm/nce src/common/host_memory.cpp src/common/host_memory.h src/common/host_memory_windows_lease.h)"
          grep -Fq 'V49_WATCHDOG_READY' "$SOURCE/src/yuzu/main.cpp"
          grep -Fq 'V49_WATCHDOG_EXIT' "$SOURCE/src/yuzu/main.cpp"
          grep -Fq 'eden_nce_v49_exit_watchdog.log' "$SOURCE/src/yuzu/main.cpp"
          grep -Fq -- '--nce-v49-watchdog' "$SOURCE/src/yuzu/main.cpp"

          git -C "$SOURCE" diff "$CANDIDATE_BASE_SHA" "$GITHUB_SHA" -- src/yuzu/main.cpp > "$PROV/main.cpp.v49.diff"
          printf 'CANDIDATE_BASE_SHA=%s\nV49_SHA=%s\nSOURCE_MODE=production candidate + out-of-process exit-code watchdog only\nV49_TEMP_FILE=%%TEMP%%\\eden_nce_v49_exit_watchdog.log\nISOLATION_DIR=build/validation/%s/%s\n'             "$CANDIDATE_BASE_SHA" "$GITHUB_SHA" "$GITHUB_SHA" "$TEST_NAME" > "$PROV/BUILD_INFO.txt"

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: build/validation/${{ github.sha }}/v49-exit-watchdog/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure V49 Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v49-exit-watchdog/source
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          printf 'CONFIGURE_COMMAND=./.ci/build/configure.sh -DCCACHE_PATH=sccache\nNCE_COMPILE_GUARD=HAS_NCE=1\n' >> ../provenance/BUILD_INFO.txt

      - name: Build full Windows ARM64 Eden V49 package
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v49-exit-watchdog/source
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          printf 'BUILD_COMMAND=cmake --build build\n' >> ../provenance/BUILD_INFO.txt

      - name: Package Windows ARM64 Eden V49
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v49-exit-watchdog/source
        env:
          ARTIFACT_REF: nce-v49-exit-watchdog-1b8eee8d
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          printf 'PACKAGE_COMMAND=./.ci/package/windows.sh\nARTIFACT_REF=nce-v49-exit-watchdog-1b8eee8d\n' >> ../provenance/BUILD_INFO.txt

      - name: Prepare V49 upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged Eden artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash
          "PACKAGE_FILE=$($files[0].Name)" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          "PACKAGE_SHA256=$hash" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')

      - name: Upload V49 package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-V49-EXIT-WATCHDOG-1b8eee8d
          path: build/validation/${{ github.sha }}/v49-exit-watchdog/upload/*
          if-no-files-found: error
          retention-days: 14
