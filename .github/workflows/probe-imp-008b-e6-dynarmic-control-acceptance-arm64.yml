name: Probe IMP-008B E6 Dynarmic Control Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008b-clean-recovery
    paths:
      - '.github/workflows/probe-imp-008b-e6-dynarmic-control-acceptance-arm64.yml'
      - 'probes/windows-arm64-nce-runthread-e6/**'

permissions:
  contents: read

jobs:
  e6-dynarmic-control-acceptance:
    runs-on: windows-11-arm
    timeout-minutes: 120

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout clean IMP-008B recovery branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Checkout fixed dc95-era Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Verify E6 scope contract
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          probe='probes/windows-arm64-nce-runthread-e6/dynarmic_control_acceptance.cpp'
          grep -Fq 'Settings::CpuBackend::Dynarmic' "$probe"
          grep -Fq 'Settings::SetNceEnabled(true)' "$probe"
          grep -Fq 'Settings::IsNceEnabled()' "$probe"
          grep -Fq 'KProcess::Create(kernel)' "$probe"
          grep -Fq 'process->LoadFromMetadata' "$probe"
          grep -Fq 'process->IsApplication()' "$probe"
          grep -Fq 'process->Is64Bit()' "$probe"
          grep -Fq 'process->GetArmInterface(0)' "$probe"
          grep -Fq 'dynamic_cast<Core::ArmDynarmic64*>' "$probe"
          grep -Fq 'dynamic_cast<Core::ArmNce*>' "$probe"
          if grep -Fq 'RunThread(' "$probe"; then
            echo 'E6 control acceptance must not execute RunThread' >&2
            exit 61
          fi
          echo 'IMP008B_E6_SCOPE_SOURCE=PASS'

      - name: Add E6 target to checkout only
        shell: bash
        working-directory: eden
        run: |
          cat >> src/yuzu_cmd/CMakeLists.txt <<'CMAKE'

          # IMP-008B E6 CI-only executable. Reuse the normal Eden CLI product dependency contract.
          file(WRITE "${CMAKE_BINARY_DIR}/imp008b_e6_vma.cpp"
              "#define VMA_IMPLEMENTATION\n#include \"video_core/vulkan_common/vma.h\"\n")
          add_executable(imp008b_e6_dynarmic_control
              ${CMAKE_SOURCE_DIR}/probes/windows-arm64-nce-runthread-e6/dynarmic_control_acceptance.cpp
              ${CMAKE_BINARY_DIR}/imp008b_e6_vma.cpp)
          target_include_directories(imp008b_e6_dynarmic_control PRIVATE ${CMAKE_SOURCE_DIR}/src)
          target_link_libraries(imp008b_e6_dynarmic_control PRIVATE
              common core input_common frontend_common video_core merry::oaknut)
          target_link_libraries(imp008b_e6_dynarmic_control PRIVATE ${PLATFORM_LIBRARIES} Threads::Threads)
          CMAKE
          echo 'IMP008B_E6_TARGET_WIRING=PASS'

      - name: Set up normal Eden CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure normal Windows ARM64 product build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'arm_nce_windows.cpp' build/compile_commands.json
          grep -Fq 'arm_dynarmic_64.cpp' build/compile_commands.json
          grep -Fq 'windows-arm64-nce-runthread-e6/dynarmic_control_acceptance.cpp' build/compile_commands.json
          echo 'IMP008B_E6_NORMAL_CONFIGURE=PASS'

      - name: Build and run E6 product-linked executable
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build --target imp008b_e6_dynarmic_control --parallel
          exe="$(find build -type f -name 'imp008b_e6_dynarmic_control.exe' -print -quit)"
          test -n "$exe"
          echo "IMP008B_E6_EXECUTABLE=$exe"
          winexe="$(cygpath -w "$exe")"
          winout="$(cygpath -w imp008b-e6.out.log)"
          winerr="$(cygpath -w imp008b-e6.err.log)"
          set +e
          powershell.exe -NoProfile -NonInteractive -Command "& {
            \$ErrorActionPreference = 'Stop'
            try {
              \$p = Start-Process -FilePath '$winexe' -NoNewWindow -PassThru -RedirectStandardOutput '$winout' -RedirectStandardError '$winerr'
              if (-not \$p.WaitForExit(30000)) {
                Write-Host 'IMP008B_E6_PROCESS_TIMEOUT=FAIL'
                Stop-Process -Id \$p.Id -Force -ErrorAction SilentlyContinue
                exit 124
              }
              \$p.Refresh()
              Write-Host ('IMP008B_E6_PROCESS_EXIT=' + \$p.ExitCode)
              exit \$p.ExitCode
            } catch {
              Write-Host ('IMP008B_E6_LAUNCH_EXCEPTION=' + \$_.Exception.Message)
              Write-Host ('IMP008B_E6_LAUNCH_HRESULT=0x{0:X8}' -f (\$_.Exception.HResult -band 0xffffffff))
              if (\$_.Exception.InnerException) {
                Write-Host ('IMP008B_E6_LAUNCH_INNER=' + \$_.Exception.InnerException.Message)
              }
              exit 125
            }
          }"
          rc=$?
          set -e
          cat imp008b-e6.out.log 2>/dev/null || true
          cat imp008b-e6.err.log >&2 2>/dev/null || true
          echo "IMP008B_E6_LAUNCH_RC=$rc"
          test "$rc" -eq 0
          cp imp008b-e6.out.log imp008b-e6.log
          grep -Fq 'IMP008B_E6_DYNARMIC_SELECTED=PASS' imp008b-e6.log
          grep -Fq 'IMP008B_E6_NCE_DISABLED=PASS' imp008b-e6.log
          grep -Fq 'IMP008B_E6_REAL_APPLICATION_PROCESS=PASS' imp008b-e6.log
          grep -Fq 'IMP008B_E6_64BIT_PROCESS=PASS' imp008b-e6.log
          grep -Fq 'IMP008B_E6_PROCESS_OWNED_INTERFACE=PASS' imp008b-e6.log
          grep -Fq 'IMP008B_E6_DYNARMIC64_BACKEND=PASS' imp008b-e6.log
          grep -Fq 'IMP008B_E6_NOT_NCE_BACKEND=PASS' imp008b-e6.log
          grep -Fq 'IMP008B_E6_AARCH64_BACKEND=PASS' imp008b-e6.log
          grep -Fq 'IMP008B_E6_GATE=PASS' imp008b-e6.log
