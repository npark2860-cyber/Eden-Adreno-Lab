name: Build Windows ARM64 NCE production candidate x18 055b212d

on:
  push:
    branches:
      - prod/windows-nce-x18-fallback-candidate-055b212d
    paths:
      - src/common/host_memory.cpp
      - src/common/host_memory.h
      - src/common/host_memory_windows_lease.h
      - src/core/arm/nce/arm_nce_windows.cpp
      - src/core/arm/nce/windows_nce_transition.cpp
      - .github/workflows/build-windows-arm64-nce-production-candidate-x18-055b212d.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-production-candidate-x18-055b212d
  cancel-in-progress: false

env:
  SOURCE_BASE_SHA: 055b212df86dbfc18257b127ee5a0cbfda8ff861
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: production-candidate-x18

jobs:
  build-package:
    name: Windows ARM64 NCE production candidate x18
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact production-candidate Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/production-candidate-x18/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify production-candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$SOURCE" rev-parse "$GITHUB_SHA^")" = "$SOURCE_BASE_SHA"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=no)"

          git -C "$SOURCE" diff --check "$SOURCE_BASE_SHA" "$GITHUB_SHA"
          git -C "$SOURCE" diff --stat "$SOURCE_BASE_SHA" "$GITHUB_SHA" > "$PROV/DIFF_STAT.txt"
          git -C "$SOURCE" diff "$SOURCE_BASE_SHA" "$GITHUB_SHA" --             src/common/host_memory.cpp             src/common/host_memory.h             src/common/host_memory_windows_lease.h             src/core/arm/nce/arm_nce_windows.cpp             src/core/arm/nce/windows_nce_transition.cpp > "$PROV/PRODUCTION_CANDIDATE.diff"

          grep -Fq 'context.X[18] = reinterpret_cast<u64>(NtCurrentTeb());' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'NCE::WindowsNceTransition::ContinueContext(context);' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'NCE_V16_FALLBACK_STACK_SYNC' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'NCE_V18_SPLIT_NOOP_EXACT_PLACEHOLDER' "$SOURCE/src/common/host_memory.cpp"
          grep -Fq 'guest_sp_value > allocation_end' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'guest->sp <= allocation_base || guest->sp > allocation_end' "$SOURCE/src/core/arm/nce/windows_nce_transition.cpp"

          if grep -E -q 'V43_|V44_|V45_|V46_|eden_nce_v4[3-6]'             "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"             "$SOURCE/src/core/arm/nce/windows_nce_transition.cpp"             "$SOURCE/src/core/arm/nce/windows_nce_entry.asm"; then
            echo 'V43-V46 diagnostic marker leaked into production candidate' >&2
            exit 1
          fi

          python - "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp" <<'PY'
          from pathlib import Path
          import sys
          s = Path(sys.argv[1]).read_text(encoding="utf-8")
          old = """        if (redirected) {
              return EXCEPTION_CONTINUE_EXECUTION;
          }
          """
          assert old not in s, "old x18 VEH resume path still present"
          assert s.count("context.X[18] = reinterpret_cast<u64>(NtCurrentTeb());") == 1
          PY

          printf 'SOURCE_BASE_SHA=%s\nCANDIDATE_SHA=%s\nSOURCE_MODE=direct production-candidate source commit; closed V16/V18/V26/V27 composition + generic x18 live-TEB direct NtContinue; no V43-V46 diagnostics\nISOLATION_DIR=build/validation/%s/%s\n'             "$SOURCE_BASE_SHA" "$GITHUB_SHA" "$GITHUB_SHA" "$TEST_NAME" > "$PROV/BUILD_INFO.txt"

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: build/validation/${{ github.sha }}/production-candidate-x18/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 NCE production candidate
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/production-candidate-x18/source
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          printf 'CONFIGURE_COMMAND=./.ci/build/configure.sh -DCCACHE_PATH=sccache\nNCE_COMPILE_GUARD=HAS_NCE=1\n' >> ../provenance/BUILD_INFO.txt

      - name: Build full Windows ARM64 Eden production candidate
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/production-candidate-x18/source
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          printf 'BUILD_COMMAND=cmake --build build\n' >> ../provenance/BUILD_INFO.txt

      - name: Package Windows ARM64 Eden production candidate
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/production-candidate-x18/source
        env:
          ARTIFACT_REF: nce-production-candidate-x18-055b212d
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          printf 'PACKAGE_COMMAND=./.ci/package/windows.sh\nARTIFACT_REF=nce-production-candidate-x18-055b212d\n' >> ../provenance/BUILD_INFO.txt

      - name: Prepare production-candidate upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged Eden artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash
          "PACKAGE_FILE=$($files[0].Name)" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          "PACKAGE_SHA256=$hash" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')

      - name: Upload production-candidate package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-PRODUCTION-CANDIDATE-X18-055b212d
          path: build/validation/${{ github.sha }}/production-candidate-x18/upload/*
          if-no-files-found: error
          retention-days: 14
