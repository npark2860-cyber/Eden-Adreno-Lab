name: Build Windows ARM64 NCE Real-Game Diagnostics v2

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/build-windows-arm64-nce-realgame-diag-v2.yml

permissions:
  contents: read

concurrency:
  group: windows-arm64-nce-realgame-diag-v2
  cancel-in-progress: false

jobs:
  build-package:
    name: Windows ARM64 NCE real-game diagnostic package v2
    runs-on: windows-11-arm
    timeout-minutes: 180

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO
      PROD_SHA: 1572c8c55508d67d4423e025ec30ad7f3d2f9291

    steps:
      - name: Checkout validated Eden NCE branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Verify production-equivalent source
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          git cat-file -e "$PROD_SHA^{commit}"
          git diff --quiet "$PROD_SHA" HEAD -- src/common src/core src/video_core CMakeLists.txt
          grep -Fq 'Settings::IsNceEnabled()' src/core/hle/kernel/k_process.cpp
          grep -Fq 'std::make_unique<Core::ArmNce>' src/core/hle/kernel/k_process.cpp
          grep -Fq 'std::make_unique<Core::ArmDynarmic64>' src/core/hle/kernel/k_process.cpp
          echo "NCE_REALGAME_DIAG_V2_SOURCE_SHA=$(git rev-parse HEAD)"
          echo 'NCE_REALGAME_DIAG_V2_SOURCE_GUARD=PASS'

      - name: Inject validation-only NCE diagnostics before toolchain setup
        shell: pwsh
        working-directory: eden
        run: |
          python --version
          @'
          from pathlib import Path

          path = Path("src/core/arm/nce/arm_nce_windows.cpp")
          text = path.read_text(encoding="utf-8")

          def replace_once(label, old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "preexisting-prefetch",
              """HaltReason ArmNce::RunThread(Kernel::KThread* thread) {\n    HaltReason hr = static_cast<HaltReason>(m_guest_ctx.esr_el1.exchange(0));\n    if (True(hr)) {\n        return hr;\n    }\n""",
              """HaltReason ArmNce::RunThread(Kernel::KThread* thread) {\n    HaltReason hr = static_cast<HaltReason>(m_guest_ctx.esr_el1.exchange(0));\n    if (True(hr)) {\n        if (True(hr & HaltReason::PrefetchAbort)) {\n            LOG_ERROR(Core_ARM, \"IMP008_REALGAME_DIAG PREEXISTING_PREFETCH core={} hr=0x{:X} pc=0x{:016X} sp=0x{:016X}\",\n                      m_core_index, static_cast<u64>(hr), m_guest_ctx.pc, m_guest_ctx.sp);\n        }\n        return hr;\n    }\n""")

          replace_once(
              "teb-fail",
              """        if (!InstallGuestTebStackBounds(m_guest_ctx.sp, teb_stack_bounds)) {\n            NCE::CurrentNceContext::Clear();\n""",
              """        if (!InstallGuestTebStackBounds(m_guest_ctx.sp, teb_stack_bounds)) {\n            LOG_ERROR(Core_ARM, \"IMP008_REALGAME_DIAG TEB_FAIL core={} pc=0x{:016X} sp=0x{:016X}\",\n                      m_core_index, m_guest_ctx.pc, m_guest_ctx.sp);\n            NCE::CurrentNceContext::Clear();\n""")

          replace_once(
              "entry-capture",
              """        if (const auto it = post_handlers.find(m_guest_ctx.pc); it != post_handlers.end()) {\n""",
              """        const u64 diag_entry_pc = m_guest_ctx.pc;\n        const u64 diag_entry_sp = m_guest_ctx.sp;\n        if (const auto it = post_handlers.find(m_guest_ctx.pc); it != post_handlers.end()) {\n""")

          replace_once(
              "guest-return",
              """        RestoreHostTebStackBounds(teb_stack_bounds);\n        NCE::CurrentNceContext::Clear();\n\n        if (m_windows_pending_nce_fault) {\n""",
              """        RestoreHostTebStackBounds(teb_stack_bounds);\n        NCE::CurrentNceContext::Clear();\n\n        if (True(hr & HaltReason::PrefetchAbort) || m_windows_pending_nce_fault) {\n            LOG_ERROR(Core_ARM, \"IMP008_REALGAME_DIAG GUEST_RETURN core={} hr=0x{:X} pending={} entry_pc=0x{:016X} entry_sp=0x{:016X} return_pc=0x{:016X} return_sp=0x{:016X}\",\n                      m_core_index, static_cast<u64>(hr), m_windows_pending_nce_fault ? 1 : 0,\n                      diag_entry_pc, diag_entry_sp, m_guest_ctx.pc, m_guest_ctx.sp);\n        }\n\n        if (m_windows_pending_nce_fault) {\n""")

          replace_once(
              "veh-av",
              """        const auto fault_address = reinterpret_cast<u64>(\n            NCE::WindowsExceptionContext::GetFaultAddress(*exception->ExceptionRecord));\n""",
              """        const auto fault_address = reinterpret_cast<u64>(\n            NCE::WindowsExceptionContext::GetFaultAddress(*exception->ExceptionRecord));\n        LOG_ERROR(Core_ARM, \"IMP008_REALGAME_DIAG VEH_AV code=0x{:08X} pc=0x{:016X} sp=0x{:016X} fault=0x{:016X}\",\n                  static_cast<u32>(exception->ExceptionRecord->ExceptionCode), context.Pc,\n                  context.Sp, fault_address);\n""")

          replace_once(
              "pending-before",
              """            if (process->GetMemory().InvalidateNCE(Common::ProcessAddress{pending_fault_page},\n""",
              """            LOG_ERROR(Core_ARM, \"IMP008_REALGAME_DIAG PENDING_FAULT core={} fault=0x{:016X} page=0x{:016X} guest_pc=0x{:016X}\",\n                      m_core_index, pending_fault_address, pending_fault_page, m_guest_ctx.pc);\n            if (process->GetMemory().InvalidateNCE(Common::ProcessAddress{pending_fault_page},\n""")

          replace_once(
              "invalidate-ok",
              """                                                   Memory::YUZU_PAGESIZE)) {\n                continue;\n            }\n\n            if (m_guest_ctx.pc != pending_fault_address) {\n""",
              """                                                   Memory::YUZU_PAGESIZE)) {\n                LOG_ERROR(Core_ARM, \"IMP008_REALGAME_DIAG INVALIDATE_OK core={} page=0x{:016X}\",\n                          m_core_index, pending_fault_page);\n                continue;\n            }\n\n            LOG_ERROR(Core_ARM, \"IMP008_REALGAME_DIAG INVALIDATE_FAIL core={} page=0x{:016X}\",\n                      m_core_index, pending_fault_page);\n            if (m_guest_ctx.pc != pending_fault_address) {\n""")

          replace_once(
              "pending-fatal",
              """            if (m_guest_ctx.pc != pending_fault_address) {\n                m_guest_ctx.pc += sizeof(u32);\n                continue;\n            }\n\n            hr = HaltReason::PrefetchAbort;\n""",
              """            if (m_guest_ctx.pc != pending_fault_address) {\n                LOG_ERROR(Core_ARM, \"IMP008_REALGAME_DIAG FAILED_DATA_SKIP core={} guest_pc=0x{:016X} fault=0x{:016X}\",\n                          m_core_index, m_guest_ctx.pc, pending_fault_address);\n                m_guest_ctx.pc += sizeof(u32);\n                continue;\n            }\n\n            LOG_ERROR(Core_ARM, \"IMP008_REALGAME_DIAG PENDING_FAULT_FATAL core={} pc=0x{:016X} fault=0x{:016X}\",\n                      m_core_index, m_guest_ctx.pc, pending_fault_address);\n            hr = HaltReason::PrefetchAbort;\n""")

          replace_once(
              "fallback-unhandled",
              """        if (!fallback.handled) {\n            break;\n        }\n""",
              """        if (!fallback.handled) {\n            if (True(hr & HaltReason::PrefetchAbort)) {\n                LOG_ERROR(Core_ARM, \"IMP008_REALGAME_DIAG UNHANDLED_PREFETCH core={} hr=0x{:X} pc=0x{:016X} sp=0x{:016X}\",\n                          m_core_index, static_cast<u64>(hr), m_guest_ctx.pc, m_guest_ctx.sp);\n            }\n            break;\n        }\n""")

          replace_once(
              "final-prefetch",
              """    m_guest_ctx.tpidr_el0 = final_tpidr_el0;\n\n    return hr;\n}\n\nHaltReason ArmNce::StepThread""",
              """    m_guest_ctx.tpidr_el0 = final_tpidr_el0;\n\n    if (True(hr & HaltReason::PrefetchAbort)) {\n        LOG_ERROR(Core_ARM, \"IMP008_REALGAME_DIAG FINAL_PREFETCH core={} hr=0x{:X} pc=0x{:016X} sp=0x{:016X}\",\n                  m_core_index, static_cast<u64>(hr), m_guest_ctx.pc, m_guest_ctx.sp);\n    }\n    return hr;\n}\n\nHaltReason ArmNce::StepThread""")

          path.write_text(text, encoding="utf-8")

          markers = [
              "PREEXISTING_PREFETCH", "TEB_FAIL", "GUEST_RETURN", "VEH_AV",
              "PENDING_FAULT", "INVALIDATE_OK", "INVALIDATE_FAIL",
              "FAILED_DATA_SKIP", "PENDING_FAULT_FATAL", "UNHANDLED_PREFETCH", "FINAL_PREFETCH",
          ]
          for marker in markers:
              if f"IMP008_REALGAME_DIAG {marker}" not in text:
                  raise SystemExit(f"missing injected marker: {marker}")
          print("NCE_REALGAME_DIAG_V2_INJECTION=PASS")
          '@ | python -
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          Write-Host 'NCE_REALGAME_DIAG_V2_PATCH=PASS'

      - name: Checkout fixed dc95-era Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Set up normal Eden CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 GUI build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'arm_nce_windows.cpp' build/compile_commands.json
          grep -Fq 'IMP008_REALGAME_DIAG' src/core/arm/nce/arm_nce_windows.cpp
          echo 'NCE_REALGAME_DIAG_V2_CONFIGURE=PASS'

      - name: Build full Windows ARM64 Eden GUI
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe || {
            echo 'GUI executable not found after full build' >&2
            find build -maxdepth 4 -iname '*.exe' -print
            exit 41
          }
          echo 'NCE_REALGAME_DIAG_V2_BUILD=PASS'

      - name: Package Windows ARM64 Eden
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: nce-realgame-diag-v2-${{ github.sha }}
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          find artifacts -maxdepth 2 -type f -print
          echo 'NCE_REALGAME_DIAG_V2_PACKAGE=PASS'

      - name: Verify single-file package upload boundary
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path eden/artifacts -File)
          Write-Host "Package files found: $($files.Count)"
          $files | ForEach-Object { Write-Host $_.FullName }
          if ($files.Count -ne 1) {
            throw "Expected exactly one packaged file; found $($files.Count)"
          }
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item -LiteralPath $files[0].FullName -Destination upload/ -Force
          $upload = @(Get-ChildItem -Path upload -File)
          if ($upload.Count -ne 1) { throw "Expected exactly one upload file; found $($upload.Count)" }
          Write-Host 'NCE_REALGAME_DIAG_V2_SINGLE_FILE_UPLOAD_BOUNDARY=PASS'

      - name: Upload Windows ARM64 NCE real-game diagnostic package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-REALGAME-DIAG-V2-${{ github.sha }}
          archive: false
          path: upload/*
          if-no-files-found: error
          retention-days: 14
