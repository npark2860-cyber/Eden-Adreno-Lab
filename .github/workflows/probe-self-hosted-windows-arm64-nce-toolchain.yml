name: Probe Self-Hosted Windows ARM64 NCE Toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-self-hosted-windows-arm64-nce-toolchain.yml

permissions:
  contents: read

concurrency:
  group: probe-self-hosted-windows-arm64-nce-toolchain
  cancel-in-progress: false

jobs:
  configure:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 120
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout Eden branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'eden/.ci') {
            Remove-Item 'eden/.ci' -Recurse -Force
          }
          Copy-Item 'ci/.ci' 'eden/.ci' -Recurse -Force
          Write-Output 'SELF_HOSTED_CI_SCRIPT_INSTALL=PASS'

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 NCE
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'arm_nce_windows.cpp' build/compile_commands.json
          echo 'SELF_HOSTED_WINDOWS_ARM64_NCE_CONFIGURE=PASS'

      - name: Report native toolchain
        shell: msys2 {0}
        run: |
          set -euo pipefail
          uname -a
          clang --version
          cmake --version
          ninja --version
          python --version
          echo 'SELF_HOSTED_WINDOWS_ARM64_NCE_TOOLCHAIN=PASS'
