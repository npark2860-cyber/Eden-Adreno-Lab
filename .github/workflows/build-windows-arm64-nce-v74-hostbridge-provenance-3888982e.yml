name: Build Windows ARM64 NCE V74 HostBridge provenance 3888982e

on:
  push:
    branches:
      - diag/windows-nce-v74-hostbridge-provenance-3888982e
    paths:
      - .github/diagnostics/v74-hostbridge-provenance-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-v74-hostbridge-provenance-3888982e
  cancel-in-progress: false

env:
  V73_BASE_SHA: 3888982e8d9b58ab3139f224e60e5ed724b4bec5
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: v74-hostbridge-provenance

jobs:
  build-package:
    name: Windows ARM64 NCE V74 HostBridge provenance
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact V74 Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/v74-hostbridge-provenance/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify V74 provenance and diagnostic-only scope
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$SOURCE" merge-base --is-ancestor "$V73_BASE_SHA" "$GITHUB_SHA"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=no)"
          git -C "$SOURCE" diff --check "$V73_BASE_SHA" "$GITHUB_SHA"

          CHANGED="$(git -C "$SOURCE" diff --name-only "$V73_BASE_SHA" "$GITHUB_SHA")"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(src/core/arm/nce/arm_nce_windows\.cpp|src/core/arm/nce/windows_nce_entry\.asm|\.github/workflows/build-windows-arm64-nce-v74-hostbridge-provenance-3888982e\.yml|\.github/diagnostics/v74-hostbridge-provenance-trigger\.txt)
          test -z "$UNEXPECTED"

          grep -Fq 'V74ProvenanceMagicBase' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'WindowsNceV74HostStackBridge' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'WindowsNceV74HostReturnProbe' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'WindowsNceV74HostStackBridge PROC' "$SOURCE/src/core/arm/nce/windows_nce_entry.asm"
          grep -Fq 'mov     x19, x1' "$SOURCE/src/core/arm/nce/windows_nce_entry.asm"
          grep -Fq 'mov     x28, x30' "$SOURCE/src/core/arm/nce/windows_nce_entry.asm"
          grep -Fq 'active_lease_owns_sp' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"

          git -C "$SOURCE" diff "$V73_BASE_SHA" "$GITHUB_SHA" -- src/core/arm/nce/arm_nce_windows.cpp src/core/arm/nce/windows_nce_entry.asm > "$PROV/V74_HOSTBRIDGE_PROVENANCE.diff"
          printf 'V73_BASE_SHA=%s\nV74_SHA=%s\nSOURCE_MODE=exact tested V73 + AV-only HostBridge provenance capture\nEVIDENCE=natural dumps PID 16500 and 27292 on the V73 binary reproduce C0000005 execute AV at address 0 with PC=0 SP=0 TEB StackBase=0 StackLimit=0 and x1-x17 zero; V74 observes writer-vs-consumer provenance without changing lease, x18 fallback, scheduler or Dynarmic behavior\nISOLATION_DIR=build/validation/%s/%s\n'             "$V73_BASE_SHA" "$GITHUB_SHA" "$GITHUB_SHA" "$TEST_NAME" > "$PROV/BUILD_INFO.txt"

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: build/validation/${{ github.sha }}/v74-hostbridge-provenance/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: false
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure V74 Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v74-hostbridge-provenance/source
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          printf 'CONFIGURE_COMMAND=./.ci/build/configure.sh -DCCACHE_PATH=sccache\nNCE_COMPILE_GUARD=HAS_NCE=1\n' >> ../provenance/BUILD_INFO.txt

      - name: Build full Windows ARM64 Eden V74
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v74-hostbridge-provenance/source
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          printf 'BUILD_COMMAND=cmake --build build\n' >> ../provenance/BUILD_INFO.txt

      - name: Package Windows ARM64 Eden V74
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v74-hostbridge-provenance/source
        env:
          ARTIFACT_REF: nce-v74-hostbridge-provenance-3888982e
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          printf 'PACKAGE_COMMAND=./.ci/package/windows.sh\nARTIFACT_REF=nce-v74-hostbridge-provenance-3888982e\n' >> ../provenance/BUILD_INFO.txt

      - name: Prepare V74 upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged Eden artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash
          "PACKAGE_FILE=$($files[0].Name)" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          "PACKAGE_SHA256=$hash" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')

      - name: Upload V74 package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-V74-HOSTBRIDGE-PROVENANCE-3888982e
          path: build/validation/${{ github.sha }}/v74-hostbridge-provenance/upload/*
          if-no-files-found: error
          retention-days: 14
