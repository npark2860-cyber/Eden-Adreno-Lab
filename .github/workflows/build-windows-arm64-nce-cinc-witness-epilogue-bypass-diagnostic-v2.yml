name: Build Windows ARM64 NCE CINC Witness Epilogue Bypass Diagnostic V2

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/build-windows-arm64-nce-cinc-witness-epilogue-bypass-diagnostic-v2.yml

permissions:
  contents: read

concurrency:
  group: windows-arm64-nce-cinc-witness-epilogue-bypass-diagnostic-v2
  cancel-in-progress: false

jobs:
  build-package:
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO
      PROD_SHA: e9665e6457ba163f91a42d804862acac0d486378
      V3_WORKFLOW: .github/workflows/build-windows-arm64-nce-teb-bidirectional-return-validation.yml
      UNKNOWN_WORKFLOW: .github/workflows/build-windows-arm64-nce-unknown-exception-diagnostic.yml
      BREADCRUMB_WORKFLOW: .github/workflows/build-windows-arm64-nce-reentry-breadcrumb-diagnostic.yml

    steps:
      - uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Verify diagnostic baseline
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          git cat-file -e "$PROD_SHA^{commit}"
          git diff --quiet "$PROD_SHA" HEAD -- src/common src/core src/video_core CMakeLists.txt
          test -f "$V3_WORKFLOW"
          test -f "$UNKNOWN_WORKFLOW"
          test -f "$BREADCRUMB_WORKFLOW"
          grep -Fq 'IMP008_CINC_STACK_LR' "$BREADCRUMB_WORKFLOW"
          echo 'NCE_CINC_WITNESS_EPILOGUE_BYPASS_GUARD=PASS'

      - name: Replay validated V3 and unknown observer
        shell: pwsh
        working-directory: eden
        run: |
          @'
          from pathlib import Path
          import textwrap

          def replay(path, section=None):
              text = Path(path).read_text(encoding="utf-8")
              if section is not None:
                  text = text[text.index(section):]
              start_marker = "          @'\n"
              end_marker = "\n          '@ | python -"
              start = text.index(start_marker) + len(start_marker)
              end = text.index(end_marker, start)
              script = textwrap.dedent(text[start:end])
              exec(compile(script, f"<{path}>", "exec"), {})

          replay(".github/workflows/build-windows-arm64-nce-teb-bidirectional-return-validation.yml")
          replay(".github/workflows/build-windows-arm64-nce-unknown-exception-diagnostic.yml",
                 "      - name: Inject unknown guest exception observer")
          print("NCE_CINC_WITNESS_EPILOGUE_BASE_REPLAY=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'base diagnostic replay failed' }

      - name: Replay validated breadcrumb instrumentation
        shell: pwsh
        working-directory: eden
        run: |
          @'
          from pathlib import Path
          import textwrap

          path = Path(".github/workflows/build-windows-arm64-nce-reentry-breadcrumb-diagnostic.yml")
          text = path.read_text(encoding="utf-8")
          section = "      - name: Inject host-stack exception observer and reentry breadcrumbs"
          text = text[text.index(section):]
          start_marker = "          @'\n"
          end_marker = "\n          '@ | python -"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          script = textwrap.dedent(text[start:end])
          exec(compile(script, "<validated-breadcrumb-injection>", "exec"), {})
          print("NCE_CINC_WITNESS_EPILOGUE_BREADCRUMB_REPLAY=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'breadcrumb replay failed' }

      - name: Bypass only terminal witness epilogue in GuestContext
        shell: pwsh
        working-directory: eden
        run: |
          @'
          from pathlib import Path

          path = Path("src/core/arm/nce/arm_nce_windows.cpp")
          text = path.read_text(encoding="utf-8")

          old = """        if (breadcrumb_index == 30 && breadcrumb_post && m_guest_ctx.svc == 0x27U &&\n            m_guest_ctx.sp != 0) {\n            static u64 cinc_saved_lr{};\n            cinc_saved_lr = 0xFFFFFFFFFFFFFFFFULL;\n            const bool cinc_saved_lr_read = process->GetMemory().ReadBlock(\n                Common::ProcessAddress{m_guest_ctx.sp + 8}, &cinc_saved_lr, sizeof(cinc_saved_lr));\n            LOG_ERROR(Core_ARM,\n                      \"IMP008_CINC_STACK_LR n={} sp={:016X} read={} saved_lr={:016X} x30={:016X}\",\n                      breadcrumb_index, m_guest_ctx.sp, cinc_saved_lr_read, cinc_saved_lr,\n                      m_guest_ctx.cpu_registers[30]);\n        }\n"""

          new = """        if (breadcrumb_index == 30 && breadcrumb_post && m_guest_ctx.svc == 0x27U &&\n            m_guest_ctx.sp != 0) {\n            const u64 cinc_witness_sp = m_guest_ctx.sp;\n            std::array<u64, 2> cinc_witness_frame{};\n            const bool cinc_witness_read = process->GetMemory().ReadBlock(\n                Common::ProcessAddress{cinc_witness_sp}, cinc_witness_frame.data(),\n                sizeof(cinc_witness_frame));\n            const u64 cinc_saved_x19 = cinc_witness_frame[0];\n            const u64 cinc_saved_lr = cinc_witness_frame[1];\n            LOG_ERROR(Core_ARM,\n                      \"IMP008_CINC_WITNESS_EPILOGUE_BYPASS n={} sp={:016X} read={} saved_x19={:016X} saved_lr={:016X} old_x30={:016X}\",\n                      breadcrumb_index, cinc_witness_sp, cinc_witness_read, cinc_saved_x19,\n                      cinc_saved_lr, m_guest_ctx.cpu_registers[30]);\n            if (cinc_witness_read) {\n                // Diagnostic-only host equivalent of guest module+0x10D8..+0x10E0:\n                //   ldr x30,[sp,#0x8]; ldr x19,[sp],#0x10; ret\n                // Keep GuestContext::pc at module+0x7708 so the validated generated post-handler\n                // and guest RET stub still execute. The RET now targets saved LR module+0x1F40.\n                m_guest_ctx.cpu_registers[19] = cinc_saved_x19;\n                m_guest_ctx.cpu_registers[30] = cinc_saved_lr;\n                m_guest_ctx.sp = cinc_witness_sp + 0x10;\n                LOG_ERROR(Core_ARM,\n                          \"IMP008_CINC_WITNESS_EPILOGUE_APPLIED n={} new_sp={:016X} new_x19={:016X} new_x30={:016X}\",\n                          breadcrumb_index, m_guest_ctx.sp, m_guest_ctx.cpu_registers[19],\n                          m_guest_ctx.cpu_registers[30]);\n            }\n        }\n"""

          if text.count(old) != 1:
              raise SystemExit(f"witness epilogue anchor count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("NCE_CINC_WITNESS_EPILOGUE_BYPASS_INJECTION=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'witness epilogue bypass injection failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'witness epilogue bypass diff check failed' }
          if (-not (Select-String -Path 'src/core/arm/nce/arm_nce_windows.cpp' -Pattern 'IMP008_CINC_WITNESS_EPILOGUE_BYPASS' -SimpleMatch -Quiet)) {
              throw 'missing witness epilogue bypass marker'
          }
          if (-not (Select-String -Path 'src/core/arm/nce/arm_nce_windows.cpp' -Pattern 'm_guest_ctx.cpu_registers[19] = cinc_saved_x19;' -SimpleMatch -Quiet)) {
              throw 'missing x19 host-equivalent update'
          }
          if (-not (Select-String -Path 'src/core/arm/nce/arm_nce_windows.cpp' -Pattern 'm_guest_ctx.cpu_registers[30] = cinc_saved_lr;' -SimpleMatch -Quiet)) {
              throw 'missing x30 host-equivalent update'
          }
          if (-not (Select-String -Path 'src/core/arm/nce/arm_nce_windows.cpp' -Pattern 'm_guest_ctx.sp = cinc_witness_sp + 0x10;' -SimpleMatch -Quiet)) {
              throw 'missing SP host-equivalent update'
          }
          echo 'NCE_CINC_WITNESS_EPILOGUE_BYPASS_PATCH=PASS'

      - uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed CI scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 GUI build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'IMP008_CINC_WITNESS_EPILOGUE_BYPASS' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'IMP008_REENTRY_BREADCRUMB_PRE' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'IMP008_UNKNOWN_GUEST_EXCEPTION' src/core/arm/nce/arm_nce_windows.cpp
          echo 'NCE_CINC_WITNESS_EPILOGUE_BYPASS_CONFIGURE=PASS'

      - name: Build full Windows ARM64 Eden GUI
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          echo 'NCE_CINC_WITNESS_EPILOGUE_BYPASS_BUILD=PASS'

      - name: Package Windows ARM64 Eden
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: nce-cinc-witness-epilogue-bypass-${{ github.sha }}
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          echo 'NCE_CINC_WITNESS_EPILOGUE_BYPASS_PACKAGE=PASS'

      - name: Prepare upload
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path eden/artifacts -File)
          if ($files.Count -ne 1) { throw "Expected one package; found $($files.Count)" }
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item $files[0].FullName upload/ -Force

      - uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-CINC-WITNESS-EPILOGUE-BYPASS-${{ github.sha }}
          archive: false
          path: upload/*
          retention-days: 14
