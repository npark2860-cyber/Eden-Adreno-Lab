name: Probe IMP-008E E2 CPU Barrier Isolation

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008e-e2-cpu-barrier-isolation.yml

permissions:
  contents: read

jobs:
  build-e2-hosted:
    runs-on: windows-11-arm
    timeout-minutes: 120

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact IMP-008E state
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Checkout fixed dc95-era Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Verify E2 probe-only scope
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          base='712b8baff2a60ace56ffb11807d346baaec4ceb7'
          probe='probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp'
          git cat-file -e "$base^{commit}"
          if ! git diff --quiet "$base" HEAD -- src/common src/core src/video_core CMakeLists.txt; then
            echo 'IMP008E_E2_BARRIER_PRODUCTION_SCOPE=FAIL' >&2
            git diff --stat "$base" HEAD -- src/common src/core src/video_core CMakeLists.txt >&2
            exit 71
          fi
          test -f "$probe"
          test "$(git hash-object "$probe")" = 'ad61af60011578e8aeaeb34154a71f1c97909bc0'
          if grep -Fq 'UpdatePagesCachedCount' "$probe"; then
            echo 'IMP008E_E2_BARRIER_MANUAL_CACHED_COUNT=FAIL' >&2
            exit 72
          fi
          echo "IMP008E_E2_BARRIER_BUILD_SHA=$(git rev-parse HEAD)"
          echo 'IMP008E_E2_BARRIER_PRODUCTION_SCOPE=PASS'
          echo 'IMP008E_E2_BARRIER_PROBE_BLOB=PASS'

      - name: Add E2 target to checkout only
        shell: bash
        working-directory: eden
        run: |
          cat >> src/yuzu_cmd/CMakeLists.txt <<'CMAKE'

          file(WRITE "${CMAKE_BINARY_DIR}/imp008e_e2_vma.cpp"
              "#define VMA_IMPLEMENTATION\n#include \"video_core/vulkan_common/vma.h\"\n")
          add_executable(imp008e_e2_rasterizer_cached_retry
              ${CMAKE_SOURCE_DIR}/probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp
              ${CMAKE_BINARY_DIR}/imp008e_e2_vma.cpp)
          target_include_directories(imp008e_e2_rasterizer_cached_retry PRIVATE ${CMAKE_SOURCE_DIR}/src)
          target_link_libraries(imp008e_e2_rasterizer_cached_retry PRIVATE
              common core input_common frontend_common video_core merry::oaknut)
          target_link_libraries(imp008e_e2_rasterizer_cached_retry PRIVATE
              ${PLATFORM_LIBRARIES} Threads::Threads user32)
          CMAKE
          echo 'IMP008E_E2_BARRIER_TARGET_WIRING=PASS'

      - name: Enable E2 renderer diagnostics checkout only
        shell: pwsh
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp'
          $text = [System.IO.File]::ReadAllText($path)
          $oldInclude = '#include "common/settings.h"'
          $newInclude = "#include `"common/logging.h`"`r`n#include `"common/settings.h`""
          if (-not $text.Contains($oldInclude)) { throw 'logging include anchor missing' }
          $text = $text.Replace($oldInclude, $newInclude)

          $oldMain = '    Trace("IMP008E_E2_MAIN_ENTER");'
          $newMain = "    Common::Log::Initialize();`r`n    Common::Log::SetColorConsoleBackendEnabled(false);`r`n    Common::Log::Start();`r`n    Trace(`"IMP008E_E2_MAIN_ENTER`" );"
          if (-not $text.Contains($oldMain)) { throw 'logging main anchor missing' }
          $text = $text.Replace($oldMain, $newMain)

          $oldLoad = "    const Core::SystemResultStatus load_result =`r`n        system.Load(window, nro_path.string(), load_parameters);"
          if (-not $text.Contains($oldLoad)) {
            $oldLoad = "    const Core::SystemResultStatus load_result =`n        system.Load(window, nro_path.string(), load_parameters);"
          }
          if (-not $text.Contains($oldLoad)) { throw 'logging stop anchor missing' }
          $newLoad = $oldLoad + "`r`n    Common::Log::Stop();`r`n    Trace(`"IMP008E_E2_RENDERER_DIAGNOSTICS_FLUSHED`" );"
          $text = $text.Replace($oldLoad, $newLoad)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          Write-Host 'IMP008E_E2_BARRIER_RENDERER_DIAGNOSTICS_PATCH=PASS'

      - name: Hold CPU manager barrier for manual RunThread isolation
        shell: pwsh
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'probes/windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp'
          $text = [System.IO.File]::ReadAllText($path)
          $old = '    system.GetCpuManager().OnGpuReady();'
          $new = '    Trace("IMP008E_E2_CPU_MANAGER_BARRIER_HELD");'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected one OnGpuReady anchor, found $count" }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          Write-Host 'IMP008E_E2_CPU_MANAGER_BARRIER_ISOLATION_PATCH=PASS'

      - name: Set up normal Eden CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure normal Windows ARM64 product build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'arm_nce_windows.cpp' build/compile_commands.json
          grep -Fq 'gpu_device_memory_manager.cpp' build/compile_commands.json
          grep -Fq 'vk_rasterizer.cpp' build/compile_commands.json
          grep -Fq 'windows-arm64-nce-rasterizer-e2/rasterizer_cached_retry.cpp' build/compile_commands.json
          echo 'IMP008E_E2_BARRIER_NORMAL_CONFIGURE=PASS'

      - name: Build E2 production-linked executable
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build --target imp008e_e2_rasterizer_cached_retry --parallel > imp008e-e2-build.log 2>&1
          cat imp008e-e2-build.log
          exe="$(find build -type f -name 'imp008e_e2_rasterizer_cached_retry.exe' -print -quit)"
          test -n "$exe"
          mkdir -p e2-artifact
          cp "$exe" e2-artifact/
          sha256sum e2-artifact/imp008e_e2_rasterizer_cached_retry.exe | tee e2-artifact/imp008e-e2.exe.sha256
          git rev-parse HEAD > e2-artifact/imp008e-e2.source-sha.txt
          echo 'IMP008E_E2_BARRIER_BUILD=PASS'

      - name: Upload exact E2 executable
        uses: actions/upload-artifact@v4
        with:
          name: imp008e-e2-barrier-isolation-${{ github.sha }}
          path: |
            eden/e2-artifact/imp008e_e2_rasterizer_cached_retry.exe
            eden/e2-artifact/imp008e-e2.exe.sha256
            eden/e2-artifact/imp008e-e2.source-sha.txt
            eden/imp008e-e2-build.log
          if-no-files-found: error
          retention-days: 7

  run-e2-self-hosted:
    needs: build-e2-hosted
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 20

    steps:
      - name: Download exact hosted-built E2 executable
        uses: actions/download-artifact@v5
        with:
          name: imp008e-e2-barrier-isolation-${{ github.sha }}
          path: e2

      - name: Verify physical runner and exact artifact
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw "Expected RUNNER_OS=Windows, got $env:RUNNER_OS" }
          if ($env:RUNNER_ARCH -ne 'ARM64') { throw "Expected RUNNER_ARCH=ARM64, got $env:RUNNER_ARCH" }
          $exe = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e_e2_rasterizer_cached_retry.exe' | Select-Object -First 1
          $shaFile = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e-e2.source-sha.txt' | Select-Object -First 1
          if ($null -eq $exe -or $null -eq $shaFile) { throw 'E2 artifact incomplete' }
          $sourceSha = [System.IO.File]::ReadAllText($shaFile.FullName).Trim()
          if ($sourceSha -ne '${{ github.sha }}') { throw "Artifact source SHA mismatch: $sourceSha" }
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash
          Write-Host "IMP008E_E2_BARRIER_RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "IMP008E_E2_BARRIER_RUNNER_OS=$env:RUNNER_OS"
          Write-Host "IMP008E_E2_BARRIER_RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "IMP008E_E2_BARRIER_SOURCE_SHA=$sourceSha"
          Write-Host "IMP008E_E2_BARRIER_EXE_SHA256=$hash"
          Write-Host 'IMP008E_E2_BARRIER_ARTIFACT_BOUNDARY=PASS'

      - name: Run isolated E2 on physical Adreno
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workdir = (Get-Location).Path
          $exe = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e_e2_rasterizer_cached_retry.exe' | Select-Object -First 1
          if ($null -eq $exe) { throw 'E2 executable not found' }

          $outPath = Join-Path $workdir 'imp008e-e2.out.log'
          $errPath = Join-Path $workdir 'imp008e-e2.err.log'
          $rcPath = Join-Path $workdir 'imp008e-e2.rc'
          $rcHexPath = Join-Path $workdir 'imp008e-e2.rc.hex'

          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $workdir `
              -PassThru -NoNewWindow `
              -RedirectStandardOutput $outPath `
              -RedirectStandardError $errPath
          $timedOut = -not $p.WaitForExit(300000)
          if ($timedOut) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $signed = 124
            $hex = '0x0000007C'
            Write-Host 'IMP008E_E2_BARRIER_NATIVE_TIMEOUT=PASS'
          } else {
            $signed = [int]$p.ExitCode
            $unsigned = [BitConverter]::ToUInt32([BitConverter]::GetBytes($signed), 0)
            $hex = '0x{0:X8}' -f $unsigned
          }

          [System.IO.File]::WriteAllText($rcPath, "$signed`n", [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText($rcHexPath, "$hex`n", [System.Text.UTF8Encoding]::new($false))
          if (Test-Path $outPath) { Get-Content $outPath }
          if (Test-Path $errPath) { Get-Content $errPath | ForEach-Object { [Console]::Error.WriteLine($_) } }
          Write-Host "IMP008E_E2_BARRIER_NATIVE_EXIT_SIGNED=$signed"
          Write-Host "IMP008E_E2_BARRIER_NATIVE_EXIT_HEX=$hex"
          Write-Host 'IMP008E_E2_BARRIER_RUNTIME_CAPTURE=PASS'

      - name: Classify isolated E2 physical runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = [System.IO.File]::ReadAllText('imp008e-e2.rc').Trim()
          $hex = [System.IO.File]::ReadAllText('imp008e-e2.rc.hex').Trim()
          $out = if (Test-Path 'imp008e-e2.out.log') { [System.IO.File]::ReadAllText('imp008e-e2.out.log') } else { '' }
          $err = if (Test-Path 'imp008e-e2.err.log') { [System.IO.File]::ReadAllText('imp008e-e2.err.log') } else { '' }

          Write-Host "IMP008E_E2_BARRIER_CLASSIFY_NATIVE_RC=$signed"
          Write-Host "IMP008E_E2_BARRIER_CLASSIFY_NATIVE_RC_HEX=$hex"
          Write-Host "IMP008E_E2_BARRIER_SECOND_RESTORE_PRESENT=$($err.Split('IMP008B_E2_RESTORE_ENTER=PASS').Count -gt 2)"

          $required = @(
            'IMP008E_E2_CPU_MANAGER_BARRIER_HELD=PASS',
            'IMP008E_E2_REAL_SYSTEM_LOAD=PASS',
            'IMP008E_E2_REAL_RASTERIZER=PASS',
            'IMP008E_E2_REAL_CACHE_NOACCESS=PASS',
            'IMP008E_E2_DATA_AV_EXACT=PASS',
            'IMP008E_E2_PRODUCTION_RETRY_STATE=PASS',
            'IMP008E_E2_POST_RETURN_RW=PASS',
            'IMP008E_E2_REEXECUTED_VALUE_EXACT=PASS',
            'IMP008E_E2_SUPERVISOR_CALL_RETURN=PASS',
            'IMP008E_E2_POST_SVC_PC_EXACT=PASS',
            'IMP008E_E2_PHYSICAL_X18_TEB_AFTER=PASS',
            'IMP008E_E2_GATE=PASS'
          )

          if ($hex -eq '0x00000000') {
            foreach ($marker in $required) {
              if (-not $out.Contains($marker)) { throw "Missing PASS marker: $marker" }
            }
            if (-not $err.Contains('IMP008E_E2_DATA_AV ')) { throw 'Missing DATA_AV diagnostic' }
            if (-not $err.Contains('IMP008E_E2_CONTINUE_STATE')) { throw 'Missing CONTINUE_STATE diagnostic' }
            if (-not $err.Contains('RW=1 PC_UNCHANGED=1')) { throw 'Missing exact continuation state' }
            Write-Host 'IMP008E_E2_BARRIER_CLASSIFICATION=GATE_PASS'
            exit 0
          }

          $cacheReady = $out.Contains('IMP008E_E2_REAL_CACHE_NOACCESS=PASS')
          $avReady = $err.Contains('IMP008E_E2_DATA_AV ')
          $continueReady = $err.Contains('IMP008E_E2_CONTINUE_STATE') -and $err.Contains('RW=1 PC_UNCHANGED=1')
          Write-Host "IMP008E_E2_BARRIER_CACHE_READY=$cacheReady"
          Write-Host "IMP008E_E2_BARRIER_AV_READY=$avReady"
          Write-Host "IMP008E_E2_BARRIER_CONTINUE_READY=$continueReady"
          Write-Host 'IMP008E_E2_BARRIER_CLASSIFICATION=GATE_FAIL'
          exit 1

      - name: Persist isolated E2 physical runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imp008e-e2-barrier-runtime-${{ github.run_id }}
          path: |
            imp008e-e2.out.log
            imp008e-e2.err.log
            imp008e-e2.rc
            imp008e-e2.rc.hex
          if-no-files-found: warn