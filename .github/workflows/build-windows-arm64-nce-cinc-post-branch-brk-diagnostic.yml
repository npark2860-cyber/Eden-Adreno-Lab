name: Build Windows ARM64 NCE CINC Post-Branch BRK Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/build-windows-arm64-nce-cinc-post-branch-brk-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: windows-arm64-nce-cinc-post-branch-brk-diagnostic
  cancel-in-progress: false

jobs:
  build-package:
    name: Windows ARM64 NCE CINC post-branch BRK diagnostic package
    runs-on: windows-11-arm
    timeout-minutes: 180

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO
      PROD_SHA: e9665e6457ba163f91a42d804862acac0d486378
      V3_WORKFLOW: .github/workflows/build-windows-arm64-nce-teb-bidirectional-return-validation.yml
      UNKNOWN_WORKFLOW: .github/workflows/build-windows-arm64-nce-unknown-exception-diagnostic.yml
      BREADCRUMB_WORKFLOW: .github/workflows/build-windows-arm64-nce-reentry-breadcrumb-diagnostic.yml

    steps:
      - name: Checkout Eden NCE branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Verify diagnostic baseline
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          git cat-file -e "$PROD_SHA^{commit}"
          git diff --quiet "$PROD_SHA" HEAD -- src/common src/core src/video_core CMakeLists.txt
          test -f "$V3_WORKFLOW"
          test -f "$UNKNOWN_WORKFLOW"
          test -f "$BREADCRUMB_WORKFLOW"
          grep -Fq 'guest.nzcv = context.Cpsr & 0xF0000000U;' src/core/arm/nce/windows_exception_context.h
          grep -Fq 'IMP008_REENTRY_BREADCRUMB_PRE' "$BREADCRUMB_WORKFLOW"
          echo 'NCE_CINC_POST_BRANCH_BRK_GUARD=PASS'

      - name: Replay validated V3 and unknown observer
        shell: pwsh
        working-directory: eden
        run: |
          @'
          from pathlib import Path
          import textwrap

          def replay(path, section=None):
              text = Path(path).read_text(encoding="utf-8")
              if section is not None:
                  text = text[text.index(section):]
              start_marker = "          @'\n"
              end_marker = "\n          '@ | python -"
              start = text.index(start_marker) + len(start_marker)
              end = text.index(end_marker, start)
              script = textwrap.dedent(text[start:end])
              exec(compile(script, f"<{path}>", "exec"), {})

          replay(".github/workflows/build-windows-arm64-nce-teb-bidirectional-return-validation.yml")
          replay(".github/workflows/build-windows-arm64-nce-unknown-exception-diagnostic.yml",
                 "      - name: Inject unknown guest exception observer")
          print("NCE_CINC_POST_BRANCH_BRK_BASE_REPLAY=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'base diagnostic replay failed' }

      - name: Replay breadcrumb and inject terminal post-handler BRK
        shell: pwsh
        working-directory: eden
        run: |
          @'
          from pathlib import Path
          import textwrap

          workflow_path = Path(".github/workflows/build-windows-arm64-nce-reentry-breadcrumb-diagnostic.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          section = "      - name: Inject host-stack exception observer and reentry breadcrumbs"
          workflow = workflow[workflow.index(section):]
          start_marker = "          @'\n"
          end_marker = "\n          '@ | python -"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, "<validated-breadcrumb-injection>", "exec"), {})

          patcher_path = Path("src/core/arm/nce/patcher.cpp")
          patcher = patcher_path.read_text(encoding="utf-8")
          patcher_old = """    this->UnlockContext(cg);\n    cg.LDR(X16, X17, offsetof(GuestContext, cpu_registers) + sizeof(u64) * 16);\n    cg.LDR(X17, X17, offsetof(GuestContext, cpu_registers) + sizeof(u64) * 17);\n\n    if (is_pre)\n"""
          patcher_new = """    this->UnlockContext(cg);\n    cg.LDR(X16, X17, offsetof(GuestContext, cpu_registers) + sizeof(u64) * 16);\n    cg.LDR(X17, X17, offsetof(GuestContext, cpu_registers) + sizeof(u64) * 17);\n\n    // Diagnostic-only: trap immediately before the direct branch for the NCE-DIAG\n    // svcOutputDebugString post-SVC destination (module + 0x7708). BRK #0x0E27.\n    if (svc_id == 0x27U && module_dest == 0x7708U) {\n        cg.dw(0xD421C4E0U);\n    }\n\n    if (is_pre)\n"""
          if patcher.count(patcher_old) != 1:
              raise SystemExit(f"post-handler branch anchor count={patcher.count(patcher_old)}")
          patcher_path.write_text(patcher.replace(patcher_old, patcher_new, 1), encoding="utf-8")

          arm_path = Path("src/core/arm/nce/arm_nce_windows.cpp")
          arm = arm_path.read_text(encoding="utf-8")
          arm_old = """        params->lock.store(SpinLockUnlocked, std::memory_order_release);\n        return EXCEPTION_CONTINUE_SEARCH;\n    }\n\n    if (NCE::WindowsExceptionContext::IsAccessViolation(*exception->ExceptionRecord)) {\n"""
          arm_new = """        params->lock.store(SpinLockUnlocked, std::memory_order_release);\n        return EXCEPTION_CONTINUE_SEARCH;\n    }\n\n    // Diagnostic-only BRK emitted by the svc 0x27 / module+0x7708 generated post-handler.\n    // Observe the real CPU register state at the final generated-code boundary, then skip the\n    // BRK and continue into the original direct branch without modifying guest registers.\n    const u64 diagnostic_break_pc =\n        reinterpret_cast<u64>(exception->ExceptionRecord->ExceptionAddress);\n    if (exception->ExceptionRecord->ExceptionCode == EXCEPTION_BREAKPOINT &&\n        NCE::WindowsPatchCodeMetadata::Contains(diagnostic_break_pc,\n                                                process->GetPostHandlers())) {\n        static std::atomic_uint32_t cinc_post_branch_probe_count{0};\n        const u32 probe_index =\n            cinc_post_branch_probe_count.fetch_add(1, std::memory_order_relaxed);\n        LOG_ERROR(Core_ARM,\n                  \"IMP008_CINC_POST_BRANCH_BRK n={} site={:016X} context_pc={:016X} sp={:016X} x16={:016X} x17={:016X} x30={:016X}\",\n                  probe_index, diagnostic_break_pc, context.Pc, context.Sp, context.X[16],\n                  context.X[17], context.X[30]);\n        context.Pc = diagnostic_break_pc + sizeof(u32);\n        return EXCEPTION_CONTINUE_EXECUTION;\n    }\n\n    if (NCE::WindowsExceptionContext::IsAccessViolation(*exception->ExceptionRecord)) {\n"""
          if arm.count(arm_old) != 1:
              raise SystemExit(f"VEH breakpoint anchor count={arm.count(arm_old)}")
          arm_path.write_text(arm.replace(arm_old, arm_new, 1), encoding="utf-8")

          print("NCE_CINC_POST_BRANCH_BRK_INJECTION=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'post-branch BRK diagnostic injection failed' }

      - name: Validate diagnostic injection
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'svc_id == 0x27U && module_dest == 0x7708U' src/core/arm/nce/patcher.cpp
          grep -Fq 'cg.dw(0xD421C4E0U);' src/core/arm/nce/patcher.cpp
          grep -Fq 'IMP008_CINC_POST_BRANCH_BRK' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'diagnostic_break_pc + sizeof(u32)' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'IMP008_REENTRY_BREADCRUMB_PRE' src/core/arm/nce/arm_nce_windows.cpp
          echo 'NCE_CINC_POST_BRANCH_BRK_PATCH=PASS'

      - name: Checkout fixed CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed CI scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 GUI build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'IMP008_CINC_POST_BRANCH_BRK' src/core/arm/nce/arm_nce_windows.cpp
          echo 'NCE_CINC_POST_BRANCH_BRK_CONFIGURE=PASS'

      - name: Build full Windows ARM64 Eden GUI
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          echo 'NCE_CINC_POST_BRANCH_BRK_BUILD=PASS'

      - name: Package Windows ARM64 Eden
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: nce-cinc-post-branch-brk-${{ github.sha }}
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          echo 'NCE_CINC_POST_BRANCH_BRK_PACKAGE=PASS'

      - name: Prepare upload
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path eden/artifacts -File)
          if ($files.Count -ne 1) { throw "Expected one package; found $($files.Count)" }
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item $files[0].FullName upload/ -Force

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-CINC-POST-BRANCH-BRK-${{ github.sha }}
          archive: false
          path: upload/*
          if-no-files-found: error
          retention-days: 14
