name: Build Windows ARM64 NCE D2 StackTop Allocation Bound Validation

on:
  push:
    branches:
      - fix/windows-nce-d2-stacktop-allocation-bound-3c4b56c3
    paths:
      - .github/diagnostics/d2-breakpoint-debug-event-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-d2-stacktop-lease-query-validation
  cancel-in-progress: false

env:
  BASE_SHA: 3c4b56c3b043ea80ff054b9b56a5de3b0b678ae3
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: d2-stacktop-lease-query

jobs:
  build-package:
    name: Windows ARM64 NCE D2 StackTop allocation bound validation
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact validation Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/d2-stacktop-lease-query/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify one-variable StackTop runtime scope
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$SOURCE" merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          git -C "$SOURCE" diff --check "$BASE_SHA" "$GITHUB_SHA"

          CHANGED="$(git -C "$SOURCE" diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(src/core/arm/nce/arm_nce_windows\.cpp|\.github/diagnostics/d2-breakpoint-debug-event-trigger\.txt|\.github/workflows/build-windows-arm64-nce-d2-breakpoint-debug-event-2f0d41b\.yml|\.github/workflows/build-windows-arm64-nce-d2-stacktop-lease-query-validation\.yml)$' || true)"
          test -z "$UNEXPECTED"

          RUNTIME_CHANGED="$(git -C "$SOURCE" diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- src/core/arm/nce src/common/host_memory.cpp src/common/host_memory.h src/common/host_memory_windows_lease.h src/core/hle/kernel/physical_core.cpp src/core/hle/kernel/physical_core.h)"
          test "$RUNTIME_CHANGED" = "src/core/arm/nce/arm_nce_windows.cpp"

          read ADDED DELETED FILEPATH <<<"$(git -C "$SOURCE" diff --numstat "$BASE_SHA" "$GITHUB_SHA" -- src/core/arm/nce/arm_nce_windows.cpp)"
          test "$ADDED" = "1"
          test "$DELETED" = "1"
          test "$FILEPATH" = "src/core/arm/nce/arm_nce_windows.cpp"

          RUNTIME_DIFF="$(git -C "$SOURCE" diff --unified=0 "$BASE_SHA" "$GITHUB_SHA" -- src/core/arm/nce/arm_nce_windows.cpp)"
          grep -Fq -- '-    if (stack_end <= stack_base || guest_sp <= stack_base || guest_sp >= stack_end ||' <<<"$RUNTIME_DIFF"
          grep -Fq -- '+    if (stack_end <= stack_base || guest_sp <= stack_base || guest_sp > stack_end ||' <<<"$RUNTIME_DIFF"

          SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp")"
          grep -Fq 'Kernel::KProcessAddress{guest_sp - 1});' <<<"$SRC"
          grep -Fq 'guest_sp <= stack_base || guest_sp > stack_end' <<<"$SRC"

          printf 'BASE_SHA=%s\nVALIDATION_SHA=%s\nSOURCE_MODE=exact Git object\nHYPOTHESIS=after SP-1 page-table classification fix, exact StackTop still fails the later private-lease allocation guard because guest_sp == stack_end is rejected by >=\nSCOPE=one-variable runtime validation: allocation upper bound guest_sp >= stack_end -> guest_sp > stack_end\n' "$BASE_SHA" "$GITHUB_SHA" > "$PROV/BUILD_INFO.txt"

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: ${{ env.CI_REF }}
          path: build/validation/${{ github.sha }}/d2-stacktop-lease-query/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 base
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          cache: false

      - name: Install CLANGARM64 toolchain from pinned direct mirrors
        shell: msys2 {0}
        run: |
          set -euo pipefail

          # Do not use mirror.msys2.org (redirector) or ftp2.osuosl.org here.
          # Both repeatedly hit pacman's low-speed timeout on the hosted ARM64 runner.
          cat > /etc/pacman.d/mirrorlist.mingw <<'EOF'
          Server = https://repo.msys2.org/mingw/$repo/
          Server = https://mirror.yandex.ru/mirrors/msys2/mingw/$repo/
          Server = https://mirror.accum.se/mirror/msys2.org/mingw/$repo/
          Server = https://ftp.nluug.nl/pub/os/windows/msys2/builds/mingw/$repo/
          EOF

          cat > /etc/pacman.d/mirrorlist.msys <<'EOF'
          Server = https://repo.msys2.org/msys/$arch/
          Server = https://mirror.yandex.ru/mirrors/msys2/msys/$arch/
          Server = https://mirror.accum.se/mirror/msys2.org/msys/$arch/
          Server = https://ftp.nluug.nl/pub/os/windows/msys2/builds/msys/$arch/
          EOF

          # Large clang/llvm payloads can briefly fall below libalpm's default
          # low-speed threshold on hosted ARM64. Keep overall job timeout as the
          # hard bound instead of aborting after ten slow seconds.
          if ! grep -Eq '^[[:space:]]*DisableDownloadTimeout([[:space:]]|$)' /etc/pacman.conf; then
            printf '\nDisableDownloadTimeout\n' >> /etc/pacman.conf
          fi

          pacman --noconfirm -Syy
          pacman --noconfirm -S --needed --overwrite '*' \
            git make autoconf libtool automake-wrapper patch jq pactoys ninja

          pacboy --noconfirm -S --needed \
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p \
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p \
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p \
            libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-stacktop-lease-query/source
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'arm_nce_windows.cpp' build/compile_commands.json

      - name: Build full Windows ARM64 Eden validation
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-stacktop-lease-query/source
        run: |
          set -euo pipefail
          cmake --build build

      - name: Package Windows ARM64 Eden validation
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-stacktop-lease-query/source
        env:
          ARTIFACT_REF: nce-d2-stacktop-lease-query
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh

      - name: Prepare upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force

      - name: Upload StackTop validation package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-D2-STACKTOP-ALLOCATION-BOUND
          path: build/validation/${{ github.sha }}/d2-stacktop-lease-query/upload/*
          if-no-files-found: error
          retention-days: 14
