name: Inspect IMP-008B E5 Dirty TEB Transition

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/inspect-imp-008b-e5-dirty-teb-transition-selfhosted-arm64.yml

permissions:
  contents: read

jobs:
  inspect-dirty-teb-transition:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 5
    steps:
      - name: Print retained dirty transition around TEB handoff
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'eden/.git')) { throw 'retained eden checkout missing' }
          $head = (git -C eden rev-parse HEAD).Trim()
          if ($head -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31') { throw "unexpected retained head $head" }
          $path = (Resolve-Path 'eden/src/core/arm/nce/windows_nce_transition.cpp').Path
          $text = [IO.File]::ReadAllText($path)
          $marker = $text.IndexOf('IMP008B_E5_NT_RESOLVED_BEFORE_TEB=PASS')
          if ($marker -lt 0) { throw 'TEB transition marker missing' }
          $start = [Math]::Max(0,$marker-3000)
          $length = [Math]::Min(7000,$text.Length-$start)
          Write-Host 'IMP008B_E5_DIRTY_TEB_TRANSITION_BEGIN'
          Write-Host $text.Substring($start,$length)
          Write-Host 'IMP008B_E5_DIRTY_TEB_TRANSITION_END'
