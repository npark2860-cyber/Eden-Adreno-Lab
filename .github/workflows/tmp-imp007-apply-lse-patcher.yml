name: Temporary IMP-007 LSE Patcher Wiring

on:
  push:
    branches:
      - exp/imp-007-windows-x18-exclusive-lse
    paths:
      - .github/workflows/tmp-imp007-apply-lse-patcher.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/imp-007-windows-x18-exclusive-lse
      - name: Apply bounded LSE production wiring
        run: python scripts/tmp_imp007_apply_lse_patcher.py
      - name: Commit wiring
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/core/arm/nce/patcher.cpp
          git config user.name "npark2860-cyber"
          git config user.email "npark2860@gmail.com"
          git add src/core/arm/nce/patcher.cpp
          git commit -m "nce: wire bounded Windows x18 LSE trampoline"
          git push origin HEAD:exp/imp-007-windows-x18-exclusive-lse
