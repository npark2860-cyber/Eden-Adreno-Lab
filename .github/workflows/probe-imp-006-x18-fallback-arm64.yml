name: Probe IMP-006 X18 Fallback ARM64

on:
  push:
    branches:
      - exp/imp-006-windows-nonexclusive-x18-fallback
    paths:
      - src/core/arm/nce/x18_fallback.h
      - src/core/arm/nce/x18_fallback.cpp
      - src/core/arm/nce/x18_classifier.cpp
      - src/core/arm/nce/x18_site_patcher.h
      - src/core/arm/nce/x18_site_patcher.cpp
      - src/core/arm/nce/windows_x18_fallback_trap.h
      - src/core/arm/nce/windows_x18_fallback_trap.cpp
      - src/core/arm/dynarmic/arm_dynarmic_64.h
      - probes/windows-arm64-x18-classifier/**
      - .github/workflows/probe-imp-006-x18-fallback-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-x18-fallback:
    runs-on: windows-11-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CLANGARM64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          pacboy: >-
            clang:p boost:p fmt:p unordered_dense:p

      - name: Compile actual Eden x18 fallback substrate
        shell: msys2 {0}
        run: |
          set -euo pipefail
          COMMON_FLAGS=(
            -std=c++20
            -Wall -Wextra
            -D_WIN32 -D_WIN64 -DARCHITECTURE_arm64 -DHAS_NCE
            -Isrc -Isrc/dynarmic/src
          )
          clang++ "${COMMON_FLAGS[@]}" \
            -c src/core/arm/nce/x18_classifier.cpp \
            -o x18_classifier.o
          clang++ "${COMMON_FLAGS[@]}" \
            -c src/core/arm/nce/x18_fallback.cpp \
            -o x18_fallback.o
          clang++ "${COMMON_FLAGS[@]}" \
            -c src/core/arm/nce/x18_site_patcher.cpp \
            -o x18_site_patcher.o
          clang++ "${COMMON_FLAGS[@]}" \
            -c src/core/arm/nce/windows_x18_fallback_trap.cpp \
            -o windows_x18_fallback_trap.o
          test -s x18_classifier.o
          test -s x18_fallback.o
          test -s x18_site_patcher.o
          test -s windows_x18_fallback_trap.o
          echo "X18_CLASSIFIER_COMPILE=PASS"
          echo "X18_FALLBACK_COMPILE=PASS"
          echo "X18_SITE_PATCHER_COMPILE=PASS"
          echo "WINDOWS_X18_TRAP_COMPILE=PASS"

      - name: Build and run representative x18 classifier smoke
        shell: msys2 {0}
        run: |
          set -euo pipefail
          DYN=src/dynarmic/src/dynarmic
          cat > classifier_link_stubs.cpp <<'EOF'
          #include <cstdlib>
          #include "common/logging.h"

          void AssertFailSoftImpl() {}
          [[noreturn]] void AssertFatalImpl() { std::abort(); }

          namespace Common::Log {
          void FmtLogMessageImpl(Class, Level, const char*, unsigned int, const char*,
                                 fmt::string_view, const fmt::format_args&) {}
          } // namespace Common::Log
          EOF
          clang++ \
            -std=c++20 -O2 -ffunction-sections -fdata-sections \
            -D_WIN32 -D_WIN64 -DARCHITECTURE_arm64 -DHAS_NCE -DNDEBUG \
            -Isrc -Isrc/dynarmic/src \
            probes/windows-arm64-x18-classifier/classifier_smoke.cpp \
            classifier_link_stubs.cpp \
            src/core/arm/nce/x18_classifier.cpp \
            src/core/arm/nce/x18_site_patcher.cpp \
            $DYN/frontend/A64/translate/a64_translate.cpp \
            $DYN/frontend/A64/a64_location_descriptor.cpp \
            $DYN/frontend/A64/a64_types.cpp \
            $DYN/frontend/A32/a32_types.cpp \
            $DYN/frontend/imm.cpp \
            $DYN/ir/basic_block.cpp \
            $DYN/ir/location_descriptor.cpp \
            $DYN/ir/microinstruction.cpp \
            $DYN/ir/opcodes.cpp \
            $DYN/ir/type.cpp \
            $DYN/ir/value.cpp \
            -Wl,--gc-sections -lfmt \
            -o x18_classifier_smoke.exe
          ./x18_classifier_smoke.exe
