name: Probe IMP-006 X18 Fallback ARM64

on:
  push:
    branches:
      - exp/imp-006-windows-nonexclusive-x18-fallback
    paths:
      - src/core/arm/nce/x18_fallback.h
      - src/core/arm/nce/x18_fallback.cpp
      - src/core/arm/nce/x18_classifier.cpp
      - .github/workflows/probe-imp-006-x18-fallback-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-x18-fallback:
    runs-on: windows-11-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CLANGARM64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          pacboy: >-
            clang:p boost:p fmt:p unordered_dense:p

      - name: Compile actual Eden x18 classifier and fallback bridge
        shell: msys2 {0}
        run: |
          set -euo pipefail
          COMMON_FLAGS=(
            -std=c++20
            -Wall -Wextra
            -D_WIN32 -D_WIN64 -DARCHITECTURE_arm64 -DHAS_NCE
            -Isrc -Isrc/dynarmic/src
          )
          clang++ "${COMMON_FLAGS[@]}" \
            -c src/core/arm/nce/x18_classifier.cpp \
            -o x18_classifier.o
          clang++ "${COMMON_FLAGS[@]}" \
            -c src/core/arm/nce/x18_fallback.cpp \
            -o x18_fallback.o
          test -s x18_classifier.o
          test -s x18_fallback.o
          echo "X18_CLASSIFIER_COMPILE=PASS"
          echo "X18_FALLBACK_COMPILE=PASS"
