name: Build Windows ARM64 NCE SVC21 Invalid Handle Provenance Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/build-windows-arm64-nce-svc21-invalid-handle-provenance-diag.yml

permissions:
  contents: read

concurrency:
  group: windows-arm64-nce-svc21-invalid-handle-provenance-diag
  cancel-in-progress: false

jobs:
  build-package:
    name: Windows ARM64 NCE SVC21 invalid-handle provenance diagnostic package
    runs-on: windows-11-arm
    timeout-minutes: 180

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO
      PROD_SHA: 1572c8c55508d67d4423e025ec30ad7f3d2f9291

    steps:
      - name: Checkout validated Eden NCE branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Verify production-equivalent source
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          git cat-file -e "$PROD_SHA^{commit}"
          git diff --quiet "$PROD_SHA" HEAD -- src/common src/core src/video_core CMakeLists.txt
          grep -Fq 'guest_sp_value <= allocation_base || guest_sp_value >= allocation_end' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'tib->StackLimit = reinterpret_cast<void*>(allocation_base);' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'tib->StackBase = reinterpret_cast<void*>(allocation_end);' src/core/arm/nce/arm_nce_windows.cpp
          echo 'NCE_SVC21_INVALID_HANDLE_PROVENANCE_SOURCE_GUARD=PASS'

      - name: Inject validation-only SVC21 invalid-handle provenance diagnostics
        shell: pwsh
        working-directory: eden
        run: |
          @'
          from pathlib import Path

          path = Path("src/core/arm/nce/arm_nce_windows.cpp")
          text = path.read_text(encoding="utf-8")

          def replace_once(label, old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              text = text.replace(old, new, 1)

          old_range = (
              "    const auto guest_sp_value = static_cast<std::uintptr_t>(guest_sp);\n"
              "    if (guest_sp_value <= allocation_base || guest_sp_value >= allocation_end) {\n"
              "        return false;\n"
              "    }\n"
          )
          new_range = old_range.replace(">= allocation_end", "> allocation_end")
          replace_once("range", old_range, new_range)

          old_teb = (
              "    auto* const tib = reinterpret_cast<NT_TIB*>(NtCurrentTeb());\n"
              "    bounds.tib = tib;\n"
              "    bounds.host_stack_base = tib->StackBase;\n"
              "    bounds.host_stack_limit = tib->StackLimit;\n"
              "    tib->StackLimit = reinterpret_cast<void*>(allocation_base);\n"
              "    tib->StackBase = reinterpret_cast<void*>(allocation_end);\n"
              "    return true;\n"
          )
          new_teb = (
              "    auto* const tib = reinterpret_cast<NT_TIB*>(NtCurrentTeb());\n"
              "    bounds.tib = tib;\n"
              "    bounds.host_stack_base = tib->StackBase;\n"
              "    bounds.host_stack_limit = tib->StackLimit;\n"
              "    static std::atomic<u32> diag_teb_counter{0};\n"
              "    if (diag_teb_counter.fetch_add(1, std::memory_order_relaxed) == 0) {\n"
              "        LOG_ERROR(Core_ARM,\n"
              "                  \"IMP008_REALGAME_DIAG TEB_PREENTRY_BYPASS guest_sp=0x{:016X} allocation_base=0x{:016X} allocation_end=0x{:016X}\",\n"
              "                  guest_sp, static_cast<u64>(allocation_base), static_cast<u64>(allocation_end));\n"
              "    }\n"
              "    return true;\n"
          )
          replace_once("teb-write", old_teb, new_teb)

          old_guest_return = (
              "        if (const auto it = post_handlers.find(m_guest_ctx.pc); it != post_handlers.end()) {\n"
              "            hr = static_cast<HaltReason>(NCE::WindowsNceEnterGuest(\n"
              "                &m_guest_ctx, reinterpret_cast<const void*>(it->second)));\n"
              "        } else {\n"
              "            hr = static_cast<HaltReason>(NCE::WindowsNceEnterGuestContext(&m_guest_ctx));\n"
              "        }\n"
              "\n"
              "        RestoreHostTebStackBounds(teb_stack_bounds);\n"
          )

          new_guest_return = (
              "        if (const auto it = post_handlers.find(m_guest_ctx.pc); it != post_handlers.end()) {\n"
              "            hr = static_cast<HaltReason>(NCE::WindowsNceEnterGuest(\n"
              "                &m_guest_ctx, reinterpret_cast<const void*>(it->second)));\n"
              "        } else {\n"
              "            hr = static_cast<HaltReason>(NCE::WindowsNceEnterGuestContext(&m_guest_ctx));\n"
              "        }\n"
              "\n"
              "        if (static_cast<u64>(hr) == static_cast<u64>(HaltReason::SupervisorCall) &&\n"
              "            m_guest_ctx.svc == 0x21 && m_guest_ctx.cpu_registers[0] == 0x20) {\n"
              "            static std::atomic<u32> diag_invalid_handle_counter{0};\n"
              "            const u32 diag_occurrence = diag_invalid_handle_counter.fetch_add(1, std::memory_order_relaxed);\n"
              "            if (diag_occurrence < 4) {\n"
              "                const u32 raw_handle = static_cast<u32>(m_guest_ctx.cpu_registers[0]);\n"
              "                const u32 handle_index = raw_handle & 0x7FFFu;\n"
              "                const u32 handle_linear_id = (raw_handle >> 15) & 0x7FFFu;\n"
              "                auto& handle_table = process->GetHandleTable();\n"
              "                Kernel::Handle slot_handle{};\n"
              "                auto slot_object = handle_table.GetObjectByIndex(m_system.Kernel(), &slot_handle, handle_index);\n"
              "                const bool slot_present = slot_object.IsNotNull();\n"
              "\n"
              "                const u64 fp = m_guest_ctx.cpu_registers[29];\n"
              "                u64 frame[8]{};\n"
              "                const bool frame_ok = fp != 0 && process->GetMemory().ReadBlock(\n"
              "                    Common::ProcessAddress{fp}, frame, sizeof(frame));\n"
              "                const u64 parent_fp = frame_ok ? frame[0] : 0;\n"
              "                const u64 parent_lr = frame_ok ? frame[1] : 0;\n"
              "\n"
              "                u32 parent_code[64]{};\n"
              "                const u64 parent_code_base = parent_lr >= 0x80 ? parent_lr - 0x80 : parent_lr;\n"
              "                const bool parent_code_ok = parent_lr != 0 && process->GetMemory().ReadBlock(\n"
              "                    Common::ProcessAddress{parent_code_base}, parent_code, sizeof(parent_code));\n"
              "\n"
              "                u64 parent_frame[8]{};\n"
              "                const bool parent_frame_ok = parent_fp != 0 && process->GetMemory().ReadBlock(\n"
              "                    Common::ProcessAddress{parent_fp}, parent_frame, sizeof(parent_frame));\n"
              "                const u64 grand_lr = parent_frame_ok ? parent_frame[1] : 0;\n"
              "                u32 grand_code[32]{};\n"
              "                const u64 grand_code_base = grand_lr >= 0x40 ? grand_lr - 0x40 : grand_lr;\n"
              "                const bool grand_code_ok = grand_lr != 0 && process->GetMemory().ReadBlock(\n"
              "                    Common::ProcessAddress{grand_code_base}, grand_code, sizeof(grand_code));\n"
              "\n"
              "                LOG_ERROR(Core_ARM,\n"
              "                          \"IMP008_REALGAME_DIAG SVC21_INVALID_HANDLE raw=0x{:08X} index={} linear_id={} table_count={} slot_present={} slot_handle=0x{:08X}\",\n"
              "                          raw_handle, handle_index, handle_linear_id, handle_table.GetCount(),\n"
              "                          slot_present, slot_handle);\n"
              "                LOG_ERROR(Core_ARM,\n"
              "                          \"IMP008_REALGAME_DIAG SVC21_FRAME ok={} fp=0x{:016X} parent_fp=0x{:016X} parent_lr=0x{:016X} q02={:016X} q03={:016X} q04={:016X} q05={:016X} q06={:016X} q07={:016X}\",\n"
              "                          frame_ok, fp, parent_fp, parent_lr, frame[2], frame[3], frame[4], frame[5], frame[6], frame[7]);\n"
              "                LOG_ERROR(Core_ARM,\n"
              "                          \"IMP008_REALGAME_DIAG SVC21_PARENT_FRAME ok={} base=0x{:016X} q00={:016X} q01={:016X} q02={:016X} q03={:016X} q04={:016X} q05={:016X} q06={:016X} q07={:016X}\",\n"
              "                          parent_frame_ok, parent_fp, parent_frame[0], parent_frame[1], parent_frame[2],\n"
              "                          parent_frame[3], parent_frame[4], parent_frame[5], parent_frame[6], parent_frame[7]);\n"
              "                for (u32 chunk = 0; chunk < 8; ++chunk) {\n"
              "                    const u32 i = chunk * 8;\n"
              "                    LOG_ERROR(Core_ARM,\n"
              "                              \"IMP008_REALGAME_DIAG SVC21_PARENT_CODE ok={} chunk={} base=0x{:016X} w00={:08X} w01={:08X} w02={:08X} w03={:08X} w04={:08X} w05={:08X} w06={:08X} w07={:08X}\",\n"
              "                              parent_code_ok, chunk, parent_code_base + static_cast<u64>(i) * sizeof(u32),\n"
              "                              parent_code[i], parent_code[i + 1], parent_code[i + 2], parent_code[i + 3],\n"
              "                              parent_code[i + 4], parent_code[i + 5], parent_code[i + 6], parent_code[i + 7]);\n"
              "                }\n"
              "                for (u32 chunk = 0; chunk < 4; ++chunk) {\n"
              "                    const u32 i = chunk * 8;\n"
              "                    LOG_ERROR(Core_ARM,\n"
              "                              \"IMP008_REALGAME_DIAG SVC21_GRAND_CODE ok={} chunk={} base=0x{:016X} w00={:08X} w01={:08X} w02={:08X} w03={:08X} w04={:08X} w05={:08X} w06={:08X} w07={:08X}\",\n"
              "                              grand_code_ok, chunk, grand_code_base + static_cast<u64>(i) * sizeof(u32),\n"
              "                              grand_code[i], grand_code[i + 1], grand_code[i + 2], grand_code[i + 3],\n"
              "                              grand_code[i + 4], grand_code[i + 5], grand_code[i + 6], grand_code[i + 7]);\n"
              "                }\n"
              "            }\n"
              "        }\n"
              "\n"
              "        RestoreHostTebStackBounds(teb_stack_bounds);\n"
          )
          replace_once("guest-return", old_guest_return, new_guest_return)

          path.write_text(text, encoding="utf-8")

          for marker in [
              "TEB_PREENTRY_BYPASS",
              "SVC21_INVALID_HANDLE",
              "SVC21_FRAME",
              "SVC21_PARENT_FRAME",
              "SVC21_PARENT_CODE",
              "SVC21_GRAND_CODE",
          ]:
              if f"IMP008_REALGAME_DIAG {marker}" not in text:
                  raise SystemExit(f"missing marker {marker}")
          if "guest_sp_value >= allocation_end" in text:
              raise SystemExit("old inclusive upper-bound rejection still present")
          if "tib->StackLimit = reinterpret_cast<void*>(allocation_base);" in text:
              raise SystemExit("guest TEB StackLimit overwrite still present")
          if "tib->StackBase = reinterpret_cast<void*>(allocation_end);" in text:
              raise SystemExit("guest TEB StackBase overwrite still present")
          print("NCE_SVC21_INVALID_HANDLE_PROVENANCE_DIAG_INJECTION=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'SVC21 invalid-handle provenance diagnostic injection failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          Write-Host 'NCE_SVC21_INVALID_HANDLE_PROVENANCE_DIAG_PATCH=PASS'

      - name: Checkout fixed dc95-era Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Set up normal Eden CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 GUI build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'IMP008_REALGAME_DIAG SVC21_INVALID_HANDLE' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'IMP008_REALGAME_DIAG SVC21_PARENT_CODE' src/core/arm/nce/arm_nce_windows.cpp
          echo 'NCE_SVC21_INVALID_HANDLE_PROVENANCE_DIAG_CONFIGURE=PASS'

      - name: Build full Windows ARM64 Eden GUI
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe || {
            echo 'GUI executable not found after full build' >&2
            find build -maxdepth 4 -iname '*.exe' -print
            exit 41
          }
          echo 'NCE_SVC21_INVALID_HANDLE_PROVENANCE_DIAG_BUILD=PASS'

      - name: Package Windows ARM64 Eden
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: nce-svc21-invalid-handle-provenance-${{ github.sha }}
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          find artifacts -maxdepth 2 -type f -print
          echo 'NCE_SVC21_INVALID_HANDLE_PROVENANCE_DIAG_PACKAGE=PASS'

      - name: Verify single-file package upload boundary
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path eden/artifacts -File)
          Write-Host "Package files found: $($files.Count)"
          $files | ForEach-Object { Write-Host $_.FullName }
          if ($files.Count -ne 1) { throw "Expected exactly one packaged file; found $($files.Count)" }
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item -LiteralPath $files[0].FullName -Destination upload/ -Force
          $upload = @(Get-ChildItem -Path upload -File)
          if ($upload.Count -ne 1) { throw "Expected exactly one upload file; found $($upload.Count)" }
          Write-Host 'NCE_SVC21_INVALID_HANDLE_PROVENANCE_DIAG_SINGLE_FILE_UPLOAD_BOUNDARY=PASS'

      - name: Upload Windows ARM64 NCE SVC21 invalid-handle provenance diagnostic package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-SVC21-INVALID-HANDLE-${{ github.sha }}
          archive: false
          path: upload/*
          if-no-files-found: error
          retention-days: 14
