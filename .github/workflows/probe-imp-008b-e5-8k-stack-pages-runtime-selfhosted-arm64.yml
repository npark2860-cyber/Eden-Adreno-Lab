name: Snapshot IMP-008B E5 Retained VEH Source

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-e5-8k-stack-pages-runtime-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: snapshot-imp-008b-e5-retained-veh
  cancel-in-progress: false

jobs:
  snapshot-retained-veh:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 5
    steps:
      - name: Snapshot retained E5 source without mutation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'eden/.git')) { throw 'retained eden checkout missing' }
          $head = (git -C eden rev-parse HEAD).Trim()
          if ($head -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31') { throw "unexpected retained head $head" }
          $probe = 'eden/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp'
          $transition = 'eden/src/core/arm/nce/windows_nce_transition.cpp'
          $armnce = 'eden/src/core/arm/nce/arm_nce_windows.cpp'
          foreach ($p in @($probe,$transition,$armnce)) { if (-not (Test-Path $p)) { throw "retained source missing: $p" } }
          New-Item -ItemType Directory -Force 'retained-e5-snapshot' | Out-Null
          Copy-Item $probe 'retained-e5-snapshot/x18_runtime_invariant.cpp'
          Copy-Item $transition 'retained-e5-snapshot/windows_nce_transition.cpp'
          Copy-Item $armnce 'retained-e5-snapshot/arm_nce_windows.cpp'
          git -C eden status --short | Out-File -Encoding ascii 'retained-e5-snapshot/git-status.txt'
          git -C eden diff -- probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp src/core/arm/nce/windows_nce_transition.cpp src/core/arm/nce/arm_nce_windows.cpp | Out-File -Encoding utf8 'retained-e5-snapshot/retained-e5.diff'
          $all = [IO.File]::ReadAllText((Resolve-Path $probe)) + [IO.File]::ReadAllText((Resolve-Path $armnce))
          Write-Host ('IMP008B_E5_SNAPSHOT_GENERIC_ENTER=' + $all.Contains('IMP008B_E5_GENERIC_VEH_ENTER=PASS'))
          Write-Host ('IMP008B_E5_SNAPSHOT_GENERIC_STATE=' + $all.Contains('IMP008B_E5_GENERIC_VEH_STATE'))
          Write-Host ('IMP008B_E5_SNAPSHOT_X18_ENTER=' + $all.Contains('IMP008B_E5_X18_VEH_ENTER=PASS'))
          Write-Host 'IMP008B_E5_RETAINED_SNAPSHOT=PASS'

      - name: Upload retained E5 source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: retained-e5-veh-source
          path: retained-e5-snapshot
          if-no-files-found: error
