name: Build Windows ARM64 NCE D2 TEB coherence 95a8e5a1

on:
  push:
    branches:
      - fix/windows-nce-d2-teb-coherence-95a8e5a1
    paths:
      - .github/diagnostics/d2-teb-coherence-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-d2-teb-coherence-95a8e5a1
  cancel-in-progress: false

env:
  BASE_SHA: 95a8e5a1e2cd55e19fea5c11979aa0f5173d57e6
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: d2-teb-coherence

jobs:
  validate-build-package:
    name: Windows ARM64 NCE D2 TEB coherence
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact D2 Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/d2-teb-coherence/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact D2 scope and transition ordering
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$SOURCE" merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=no)"
          git -C "$SOURCE" diff --check "$BASE_SHA" "$GITHUB_SHA"

          CHANGED="$(git -C "$SOURCE" diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(src/core/arm/nce/guest_context\.h|src/core/arm/nce/arm_nce_windows\.cpp|src/core/arm/nce/windows_nce_entry\.asm|src/core/arm/nce/patcher\.cpp|probes/windows-arm64-nce-d2-teb/svc_teb_roundtrip\.cpp|\.github/workflows/build-windows-arm64-nce-d2-teb-coherence-95a8e5a1\.yml|\.github/diagnostics/d2-teb-coherence-trigger\.txt)$' || true)"
          test -z "$UNEXPECTED"

          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/guest_context.h" | grep -Fq 'windows_guest_stack_base'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/guest_context.h" | grep -Fq 'windows_host_stack_limit'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp" | grep -Fq 'guest.windows_guest_stack_limit'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp" | grep -Fq 'tib->StackBase = reinterpret_cast<void*>(allocation_end);'
          ! git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp" | grep -Fq 'tib->StackLimit = reinterpret_cast<void*>(allocation_base);'

          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/patcher.cpp" | grep -Fq 'Keep the canonical architectural NZCV bits coherent'
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/arm_nce_windows.cpp" | grep -Fq 'm_guest_ctx.nzcv = ctx.pstate & 0xF0000000U;'

          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/windows_nce_entry.asm" > "$ROOT/entry.asm"
          git -C "$SOURCE" show "$GITHUB_SHA:src/core/arm/nce/patcher.cpp" > "$ROOT/patcher.cpp"
          python - "$ROOT/entry.asm" "$ROOT/patcher.cpp" <<'PY'
          from pathlib import Path
          import sys
          asm = Path(sys.argv[1]).read_text(encoding='utf-8')
          cpp = Path(sys.argv[2]).read_text(encoding='utf-8')
          guest_store = 'stp     x14, x15, [x18, #WindowsTebStackBase]'
          guest_sp = 'mov     sp, x30'
          host_store = 'cg.STP(X3, X4, X18, WindowsTebStackBaseOffset);'
          host_sp = 'cg.MOV(SP, X2);'
          if asm.count(guest_store) != 1 or asm.count(guest_sp) < 1:
              raise SystemExit('guest handoff anchors missing')
          if asm.index(guest_store) > asm.index(guest_sp):
              raise SystemExit('guest TEB pair is not published before guest SP')
          section = cpp[cpp.index('// D2: x1 points at GuestContext::host_ctx.'):]
          if section.count(host_store) != 1 or section.count(host_sp) < 1:
              raise SystemExit('host handoff anchors missing')
          if section.index(host_store) > section.index(host_sp):
              raise SystemExit('host TEB pair is not published before host SP')
          print('IMP008_D2_SOURCE_ORDERING=PASS')
          PY

          git -C "$SOURCE" diff "$BASE_SHA" "$GITHUB_SHA" --             src/core/arm/nce/guest_context.h             src/core/arm/nce/arm_nce_windows.cpp             src/core/arm/nce/windows_nce_entry.asm             src/core/arm/nce/patcher.cpp > "$PROV/D2_TEB_PRODUCTION.diff"
          git -C "$SOURCE" show "$GITHUB_SHA:probes/windows-arm64-nce-d2-teb/svc_teb_roundtrip.cpp" > "$PROV/D2_TEB_PROBE_SOURCE.cpp"
          printf 'BASE_SHA=%s\nD2_SHA=%s\nSOURCE_MODE=exact Git object\nHYPOTHESIS=post-SVC SP ownership and TEB StackBase/StackLimit must transition as one leaf contract in both directions\nREGRESSION=separate guest stack -> capture guest TEB pair at first guest instruction -> SVC host return pair -> generated post-SVC reentry -> second host return pair\nISOLATION_DIR=build/validation/%s/%s\n' "$BASE_SHA" "$GITHUB_SHA" "$GITHUB_SHA" "$TEST_NAME" > "$PROV/BUILD_INFO.txt"

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: ${{ env.CI_REF }}
          path: build/validation/${{ github.sha }}/d2-teb-coherence/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Add D2 regression target to isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          cat >> "$SOURCE/src/yuzu_cmd/CMakeLists.txt" <<'CMAKE'

          # D2 TEB coherence regression target. Added only after exact Git-object provenance checks.
          file(WRITE "${CMAKE_BINARY_DIR}/imp008_d2_teb_vma.cpp"
              "#define VMA_IMPLEMENTATION\n#include \"video_core/vulkan_common/vma.h\"\n")
          add_executable(imp008_d2_teb
              ${CMAKE_SOURCE_DIR}/probes/windows-arm64-nce-d2-teb/svc_teb_roundtrip.cpp
              ${CMAKE_BINARY_DIR}/imp008_d2_teb_vma.cpp)
          target_include_directories(imp008_d2_teb PRIVATE ${CMAKE_SOURCE_DIR}/src)
          target_link_libraries(imp008_d2_teb PRIVATE
              common core input_common frontend_common video_core merry::oaknut)
          target_link_libraries(imp008_d2_teb PRIVATE ${PLATFORM_LIBRARIES} Threads::Threads)
          CMAKE
          printf 'VALIDATION_CMAKE_WIRING=src/yuzu_cmd/CMakeLists.txt working-tree append after provenance verification\n' >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: false
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure D2 Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-teb-coherence/source
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'arm_nce_windows.cpp' build/compile_commands.json
          grep -Fq 'windows-arm64-nce-d2-teb/svc_teb_roundtrip.cpp' build/compile_commands.json
          printf 'CONFIGURE_COMMAND=./.ci/build/configure.sh -DCCACHE_PATH=sccache\nNCE_COMPILE_GUARD=HAS_NCE=1\n' >> ../provenance/BUILD_INFO.txt

      - name: Build and run D2 TEB regression
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-teb-coherence/source
        run: |
          set -euo pipefail
          cmake --build build --target imp008_d2_teb --parallel
          exe="$(find build -type f -name 'imp008_d2_teb.exe' -print -quit)"
          test -n "$exe"
          winexe="$(cygpath -w "$exe")"
          winout="$(cygpath -w ../d2-teb.out.log)"
          winerr="$(cygpath -w ../d2-teb.err.log)"
          export D2_EXE="$winexe"
          export D2_OUT="$winout"
          export D2_ERR="$winerr"
          set +e
          powershell.exe -NoProfile -NonInteractive -Command '$ErrorActionPreference = "Stop"; $p = Start-Process -FilePath $env:D2_EXE -NoNewWindow -Wait -PassThru -RedirectStandardOutput $env:D2_OUT -RedirectStandardError $env:D2_ERR; Write-Host ("IMP008_D2_TEB_PROCESS_EXIT=" + $p.ExitCode); exit $p.ExitCode'
          rc=$?
          set -e
          cat ../d2-teb.out.log 2>/dev/null || true
          cat ../d2-teb.err.log >&2 2>/dev/null || true
          test "$rc" -eq 0
          grep -Fq 'IMP008_D2_GUEST_TEB_ENTRY_PAIR=PASS' ../d2-teb.out.log
          grep -Fq 'IMP008_D2_FIRST_HOST_RETURN_PAIR=PASS' ../d2-teb.out.log
          grep -Fq 'IMP008_D2_POST_SVC_REENTRY=PASS' ../d2-teb.out.log
          grep -Fq 'IMP008_D2_SECOND_HOST_RETURN_PAIR=PASS' ../d2-teb.out.log
          grep -Fq 'IMP008_D2_TEB_COHERENCE_GATE=PASS' ../d2-teb.out.log
          cp ../d2-teb.out.log ../provenance/
          cp ../d2-teb.err.log ../provenance/
          printf 'D2_TEB_REGRESSION=PASS\n' >> ../provenance/BUILD_INFO.txt

      - name: Build full Windows ARM64 Eden after D2 regression
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-teb-coherence/source
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          printf 'FULL_BUILD_COMMAND=cmake --build build\n' >> ../provenance/BUILD_INFO.txt

      - name: Package Windows ARM64 Eden D2
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-teb-coherence/source
        env:
          ARTIFACT_REF: nce-d2-teb-coherence-95a8e5a1
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          printf 'PACKAGE_COMMAND=./.ci/package/windows.sh\nARTIFACT_REF=nce-d2-teb-coherence-95a8e5a1\n' >> ../provenance/BUILD_INFO.txt

      - name: Prepare D2 upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged Eden artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash
          "PACKAGE_FILE=$($files[0].Name)" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          "PACKAGE_SHA256=$hash" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')

      - name: Upload D2 validated package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-D2-TEB-COHERENCE-95a8e5a1
          path: build/validation/${{ github.sha }}/d2-teb-coherence/upload/*
          if-no-files-found: error
          retention-days: 14
