name: Build Windows ARM64 NCE X18 NZCV Carry Validation

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/build-windows-arm64-nce-x18-nzcv-carry-validation.yml

permissions:
  contents: read

concurrency:
  group: windows-arm64-nce-x18-nzcv-carry-validation
  cancel-in-progress: false

jobs:
  build-package:
    name: Windows ARM64 NCE x18 NZCV carry validation package
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO
      PROD_SHA: 1572c8c55508d67d4423e025ec30ad7f3d2f9291

    steps:
      - name: Checkout validated Eden NCE branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Verify production-equivalent source
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          git cat-file -e "$PROD_SHA^{commit}"
          git diff --quiet "$PROD_SHA" HEAD -- src/common src/core src/video_core CMakeLists.txt
          echo 'X18_NZCV_CARRY_SOURCE_GUARD=PASS'

      - name: Reuse parser diagnostics and sync captured NZCV
        shell: pwsh
        working-directory: eden
        run: |
          @'
          from pathlib import Path

          wf = Path('.github/workflows/build-windows-arm64-nce-svc21-getservice-parser-select-diag.yml').read_text(encoding='utf-8')
          begin = "          @'\n"
          end = "\n          '@ | python -"
          s = wf.index(begin) + len(begin)
          e = wf.index(end, s)
          src = '\n'.join(line[10:] if line.startswith('          ') else line for line in wf[s:e].splitlines())
          exec(compile(src, 'validated-parser-select-diagnostics', 'exec'), {})

          p = Path('src/core/arm/nce/windows_exception_context.h')
          t = p.read_text(encoding='utf-8')
          old = '        guest.pstate = context.Cpsr;\n        guest.fpcr = context.Fpcr;\n'
          new = '        guest.pstate = context.Cpsr;\n        guest.nzcv = context.Cpsr & 0xF0000000U;\n        guest.fpcr = context.Fpcr;\n'
          if t.count(old) != 1:
              raise SystemExit(f'NZCV sync anchor count={t.count(old)}')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          if 'guest.nzcv = context.Cpsr & 0xF0000000U;' not in t:
              raise SystemExit('NZCV sync missing')
          print('X18_NZCV_CARRY_INJECTION=PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'x18 NZCV carry validation injection failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          Write-Host 'X18_NZCV_CARRY_PATCH=PASS'

      - name: Checkout fixed CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed CI scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 GUI build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'guest.nzcv = context.Cpsr & 0xF0000000U;' src/core/arm/nce/windows_exception_context.h
          echo 'X18_NZCV_CARRY_CONFIGURE=PASS'

      - name: Build full Windows ARM64 Eden GUI
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          echo 'X18_NZCV_CARRY_BUILD=PASS'

      - name: Package Windows ARM64 Eden
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: nce-x18-nzcv-carry-${{ github.sha }}
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          echo 'X18_NZCV_CARRY_PACKAGE=PASS'

      - name: Prepare upload
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path eden/artifacts -File)
          if ($files.Count -ne 1) { throw "Expected one package; found $($files.Count)" }
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item $files[0].FullName upload/ -Force

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-X18-NZCV-CARRY-${{ github.sha }}
          archive: false
          path: upload/*
          if-no-files-found: error
          retention-days: 14
