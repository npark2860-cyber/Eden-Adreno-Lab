name: Probe IMP-008E E2 Direct NtContinue V2 Debugger Reuse

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008e-e2-direct-v2-debugger-reuse.yml

permissions:
  actions: read
  contents: read

jobs:
  debug-e2-self-hosted:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 20
    steps:
      - name: Reuse exact direct-NtContinue V2 artifact
        uses: actions/download-artifact@v5
        with:
          name: imp008e-e2-success-direct-v2-f90089b96dc6735f00639218c73201762afc6126
          path: e2
          repository: npark2860-cyber/Eden-Adreno-Lab
          run-id: 34420324290
          github-token: ${{ github.token }}

      - name: Verify physical runner and reused artifact
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'ARM64') {
            throw "Expected physical Windows ARM64 runner, got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          $exe = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e_e2_rasterizer_cached_retry.exe' | Select-Object -First 1
          $shaFile = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e-e2.source-sha.txt' | Select-Object -First 1
          if ($null -eq $exe -or $null -eq $shaFile) { throw 'Reused direct V2 artifact incomplete' }
          $sourceSha = [System.IO.File]::ReadAllText($shaFile.FullName).Trim()
          if ($sourceSha -ne 'f90089b96dc6735f00639218c73201762afc6126') {
            throw "Unexpected artifact source SHA: $sourceSha"
          }
          Write-Host "IMP008E_E2_DIRECTDBG_RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "IMP008E_E2_DIRECTDBG_SOURCE_SHA=$sourceSha"
          Write-Host "IMP008E_E2_DIRECTDBG_EXE_SHA256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          Write-Host 'IMP008E_E2_DIRECTDBG_ARTIFACT_BOUNDARY=PASS'

      - name: Capture first-chance exception sequence and real exit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e_e2_rasterizer_cached_retry.exe' | Select-Object -First 1
          if ($null -eq $exe) { throw 'E2 executable missing' }

          Add-Type -Language CSharp -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class NativeDebugDirectV2 {
              const uint DEBUG_ONLY_THIS_PROCESS = 0x00000002;
              const uint EXCEPTION_DEBUG_EVENT = 1;
              const uint EXIT_PROCESS_DEBUG_EVENT = 5;
              const uint DBG_CONTINUE = 0x00010002;
              const uint DBG_EXCEPTION_NOT_HANDLED = 0x80010001;
              const uint EXCEPTION_ACCESS_VIOLATION = 0xC0000005;
              const uint EXCEPTION_BREAKPOINT = 0x80000003;
              const uint EXCEPTION_STACK_OVERFLOW = 0xC00000FD;

              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              struct STARTUPINFO {
                  public uint cb;
                  public string lpReserved;
                  public string lpDesktop;
                  public string lpTitle;
                  public uint dwX;
                  public uint dwY;
                  public uint dwXSize;
                  public uint dwYSize;
                  public uint dwXCountChars;
                  public uint dwYCountChars;
                  public uint dwFillAttribute;
                  public uint dwFlags;
                  public ushort wShowWindow;
                  public ushort cbReserved2;
                  public IntPtr lpReserved2;
                  public IntPtr hStdInput;
                  public IntPtr hStdOutput;
                  public IntPtr hStdError;
              }

              [StructLayout(LayoutKind.Sequential)]
              struct PROCESS_INFORMATION {
                  public IntPtr hProcess;
                  public IntPtr hThread;
                  public uint dwProcessId;
                  public uint dwThreadId;
              }

              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              static extern bool CreateProcessW(string lpApplicationName, StringBuilder lpCommandLine,
                  IntPtr lpProcessAttributes, IntPtr lpThreadAttributes, bool bInheritHandles,
                  uint dwCreationFlags, IntPtr lpEnvironment, string lpCurrentDirectory,
                  ref STARTUPINFO lpStartupInfo, out PROCESS_INFORMATION lpProcessInformation);

              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool WaitForDebugEvent(IntPtr lpDebugEvent, uint dwMilliseconds);

              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool ContinueDebugEvent(uint dwProcessId, uint dwThreadId, uint dwContinueStatus);

              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool TerminateProcess(IntPtr hProcess, uint uExitCode);

              [DllImport("kernel32.dll")]
              static extern bool CloseHandle(IntPtr hObject);

              public static int Run(string exePath) {
                  STARTUPINFO si = new STARTUPINFO();
                  si.cb = (uint)Marshal.SizeOf(typeof(STARTUPINFO));
                  PROCESS_INFORMATION pi;
                  var command = new StringBuilder("\"" + exePath + "\"");
                  string cwd = System.IO.Path.GetDirectoryName(exePath);
                  if (!CreateProcessW(exePath, command, IntPtr.Zero, IntPtr.Zero, false,
                                      DEBUG_ONLY_THIS_PROCESS, IntPtr.Zero, cwd, ref si, out pi)) {
                      throw new Win32Exception(Marshal.GetLastWin32Error(), "CreateProcessW failed");
                  }

                  IntPtr ev = Marshal.AllocHGlobal(512);
                  int seq = 0;
                  int avCount = 0;
                  int stackOverflowCount = 0;
                  uint processExit = 0xFFFFFFFF;
                  try {
                      for (;;) {
                          for (int i = 0; i < 512; i++) Marshal.WriteByte(ev, i, 0);
                          if (!WaitForDebugEvent(ev, 300000)) {
                              Console.WriteLine("IMP008E_E2_DIRECTDBG_WAIT=FAIL ERROR=" + Marshal.GetLastWin32Error());
                              TerminateProcess(pi.hProcess, 124);
                              return 2;
                          }

                          uint eventCode = unchecked((uint)Marshal.ReadInt32(ev, 0));
                          uint pid = unchecked((uint)Marshal.ReadInt32(ev, 4));
                          uint tid = unchecked((uint)Marshal.ReadInt32(ev, 8));
                          uint continueStatus = DBG_CONTINUE;

                          if (eventCode == EXCEPTION_DEBUG_EVENT) {
                              uint code = unchecked((uint)Marshal.ReadInt32(ev, 16));
                              long address = Marshal.ReadInt64(ev, 32);
                              seq++;
                              Console.WriteLine("IMP008E_E2_DIRECTDBG_RAW_SEQ_" + seq +
                                  " CODE=0x" + code.ToString("X8") +
                                  " ADDRESS=0x" + address.ToString("X"));

                              if (code == EXCEPTION_ACCESS_VIOLATION) {
                                  avCount++;
                                  Console.WriteLine("IMP008E_E2_DIRECTDBG_AV_" + avCount + "_PC=0x" + address.ToString("X"));
                                  continueStatus = DBG_EXCEPTION_NOT_HANDLED;
                              } else if (code == EXCEPTION_STACK_OVERFLOW) {
                                  stackOverflowCount++;
                                  Console.WriteLine("IMP008E_E2_DIRECTDBG_STACK_OVERFLOW_" + stackOverflowCount + "_PC=0x" + address.ToString("X"));
                                  continueStatus = DBG_EXCEPTION_NOT_HANDLED;
                              } else if (code == EXCEPTION_BREAKPOINT) {
                                  // Consume process/debugger initialization breakpoints only.
                                  continueStatus = DBG_CONTINUE;
                              } else {
                                  continueStatus = DBG_EXCEPTION_NOT_HANDLED;
                              }
                          } else if (eventCode == EXIT_PROCESS_DEBUG_EVENT) {
                              processExit = unchecked((uint)Marshal.ReadInt32(ev, 16));
                              Console.WriteLine("IMP008E_E2_DIRECTDBG_PROCESS_EXIT=0x" + processExit.ToString("X8"));
                              ContinueDebugEvent(pid, tid, DBG_CONTINUE);
                              break;
                          }

                          if (!ContinueDebugEvent(pid, tid, continueStatus)) {
                              Console.WriteLine("IMP008E_E2_DIRECTDBG_CONTINUE=FAIL ERROR=" + Marshal.GetLastWin32Error());
                              TerminateProcess(pi.hProcess, 125);
                              return 3;
                          }
                      }
                  } finally {
                      Marshal.FreeHGlobal(ev);
                      if (pi.hThread != IntPtr.Zero) CloseHandle(pi.hThread);
                      if (pi.hProcess != IntPtr.Zero) CloseHandle(pi.hProcess);
                  }

                  Console.WriteLine("IMP008E_E2_DIRECTDBG_AV_COUNT=" + avCount);
                  Console.WriteLine("IMP008E_E2_DIRECTDBG_STACK_OVERFLOW_COUNT=" + stackOverflowCount);
                  if (stackOverflowCount > 0 || processExit == EXCEPTION_STACK_OVERFLOW) {
                      Console.WriteLine("IMP008E_E2_DIRECTDBG_CLASSIFICATION=STACK_OVERFLOW_CONFIRMED");
                      return 10;
                  }
                  if (avCount > 0 && processExit == 0) {
                      Console.WriteLine("IMP008E_E2_DIRECTDBG_CLASSIFICATION=AV_WITH_CLEAN_EXIT_NO_RETURN_MARKERS");
                      return 11;
                  }
                  Console.WriteLine("IMP008E_E2_DIRECTDBG_CLASSIFICATION=OTHER_EXIT_0x" + processExit.ToString("X8"));
                  return 12;
              }
          }
          '@

          $rc = [NativeDebugDirectV2]::Run($exe.FullName)
          Write-Host "IMP008E_E2_DIRECTDBG_WRAPPER_RC=$rc"
          if ($rc -eq 10) { throw 'Direct NtContinue still reaches stack overflow' }
          if ($rc -eq 11) { throw 'Direct NtContinue exits cleanly without RunThread-return markers; continuation remains unproven' }
          if ($rc -ne 0) { throw "Debugger classification unresolved with RC=$rc" }
