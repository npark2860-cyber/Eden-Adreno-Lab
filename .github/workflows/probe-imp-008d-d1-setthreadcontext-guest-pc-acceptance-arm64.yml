name: Probe IMP-008D D1 Guest PC SetThreadContext Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008d-windows-nce-data-fault-runtime
    paths:
      - '.github/workflows/probe-imp-008d-d1-setthreadcontext-guest-pc-acceptance-arm64.yml'

permissions:
  contents: read

jobs:
  d1-setthreadcontext-guest-pc-acceptance:
    runs-on: windows-11-arm
    timeout-minutes: 120

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout IMP-008D branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Checkout fixed dc95-era Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Add D1 target to checkout only
        shell: bash
        working-directory: eden
        run: |
          cat >> src/yuzu_cmd/CMakeLists.txt <<'CMAKE'

          file(WRITE "${CMAKE_BINARY_DIR}/imp008d_d1_vma.cpp"
              "#define VMA_IMPLEMENTATION\n#include \"video_core/vulkan_common/vma.h\"\n")
          add_executable(imp008d_d1_data_fault_skip
              ${CMAKE_SOURCE_DIR}/probes/windows-arm64-nce-fault-d1/data_fault_skip_runtime.cpp
              ${CMAKE_BINARY_DIR}/imp008d_d1_vma.cpp)
          target_include_directories(imp008d_d1_data_fault_skip PRIVATE ${CMAKE_SOURCE_DIR}/src)
          target_link_libraries(imp008d_d1_data_fault_skip PRIVATE
              common core input_common frontend_common video_core merry::oaknut)
          target_link_libraries(imp008d_d1_data_fault_skip PRIVATE ${PLATFORM_LIBRARIES} Threads::Threads)
          CMAKE
          echo 'IMP008D_D1_TARGET_WIRING=PASS'

      - name: Set up normal Eden CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure normal Windows ARM64 product build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'arm_nce_windows.cpp' build/compile_commands.json
          echo 'IMP008D_D1_NORMAL_CONFIGURE=PASS'

      - name: Build D1 diagnostic executable
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build --target imp008d_d1_data_fault_skip --parallel > imp008d-d1-build.log 2>&1
          cat imp008d-d1-build.log
          echo 'IMP008D_D1_BUILD=PASS'

      - name: Build guest-only SetThreadContext observer
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cat > imp008d-d1-stc-guest-observer.cpp <<'CPP'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>

          #include <cstdint>
          #include <cstdio>
          #include <string>
          #include <vector>

          namespace {
          constexpr std::uintptr_t kGuestFaultPc = 0x1080000024ULL;
          constexpr std::uintptr_t kExpectedResumePc = 0x1080000028ULL;
          constexpr std::uintptr_t kFaultTarget = 0x1080100000ULL;

          std::wstring ReadEnv(const wchar_t* name) {
              const DWORD size = GetEnvironmentVariableW(name, nullptr, 0);
              if (size == 0) return {};
              std::vector<wchar_t> buffer(size);
              if (GetEnvironmentVariableW(name, buffer.data(), size) == 0) return {};
              return std::wstring(buffer.data());
          }

          void LogContext(FILE* log, const char* tag, const CONTEXT& c) {
              std::fprintf(log,
                           "%s FLAGS=0x%08lX PC=0x%llX SP=0x%llX X18=0x%llX CPSR=0x%08lX\n",
                           tag,
                           static_cast<unsigned long>(c.ContextFlags),
                           static_cast<unsigned long long>(c.Pc),
                           static_cast<unsigned long long>(c.Sp),
                           static_cast<unsigned long long>(c.X[18]),
                           static_cast<unsigned long>(c.Cpsr));
          }
          } // namespace

          int wmain() {
              const std::wstring target = ReadEnv(L"D1_TARGET_WIN");
              const std::wstring workdir = ReadEnv(L"D1_WORKDIR_WIN");
              if (target.empty() || workdir.empty()) return 70;

              FILE* log = std::fopen("imp008d-d1-stc-guest.log", "wb");
              if (!log) return 71;

              std::wstring command = L"\"" + target + L"\"";
              std::vector<wchar_t> command_line(command.begin(), command.end());
              command_line.push_back(L'\0');

              STARTUPINFOW si{};
              si.cb = sizeof(si);
              PROCESS_INFORMATION pi{};
              if (!CreateProcessW(target.c_str(), command_line.data(), nullptr, nullptr, TRUE,
                                  DEBUG_ONLY_THIS_PROCESS | CREATE_SUSPENDED,
                                  nullptr, workdir.c_str(), &si, &pi)) {
                  std::fprintf(log, "IMP008D_D1_STC_GUEST_CREATE=FAIL ERROR=%lu\n",
                               static_cast<unsigned long>(GetLastError()));
                  std::fclose(log);
                  return 72;
              }
              if (ResumeThread(pi.hThread) == static_cast<DWORD>(-1)) {
                  std::fprintf(log, "IMP008D_D1_STC_GUEST_RESUME=FAIL ERROR=%lu\n",
                               static_cast<unsigned long>(GetLastError()));
                  TerminateProcess(pi.hProcess, 73);
                  CloseHandle(pi.hThread);
                  CloseHandle(pi.hProcess);
                  std::fclose(log);
                  return 73;
              }

              bool saw_preflight = false;
              bool saw_guest_av = false;
              bool control_ok = false;
              bool test_ok = false;
              bool readback_ok = false;
              bool readback_exact = false;
              DWORD control_error = 0;
              DWORD test_error = 0;
              DWORD readback_error = 0;
              DWORD target_exit = STILL_ACTIVE;
              unsigned exception_index = 0;

              for (;;) {
                  DEBUG_EVENT event{};
                  if (!WaitForDebugEvent(&event, INFINITE)) {
                      std::fprintf(log, "IMP008D_D1_STC_GUEST_WAIT=FAIL ERROR=%lu\n",
                                   static_cast<unsigned long>(GetLastError()));
                      TerminateProcess(pi.hProcess, 74);
                      target_exit = 74;
                      break;
                  }

                  DWORD status = DBG_CONTINUE;
                  if (event.dwDebugEventCode == CREATE_PROCESS_DEBUG_EVENT) {
                      if (event.u.CreateProcessInfo.hFile) CloseHandle(event.u.CreateProcessInfo.hFile);
                  } else if (event.dwDebugEventCode == LOAD_DLL_DEBUG_EVENT) {
                      if (event.u.LoadDll.hFile) CloseHandle(event.u.LoadDll.hFile);
                  } else if (event.dwDebugEventCode == EXCEPTION_DEBUG_EVENT) {
                      const auto& ex = event.u.Exception;
                      ++exception_index;
                      const std::uintptr_t exception_pc =
                          reinterpret_cast<std::uintptr_t>(ex.ExceptionRecord.ExceptionAddress);
                      const bool read_av = ex.dwFirstChance != 0 &&
                                           ex.ExceptionRecord.ExceptionCode == EXCEPTION_ACCESS_VIOLATION &&
                                           ex.ExceptionRecord.NumberParameters >= 2 &&
                                           ex.ExceptionRecord.ExceptionInformation[0] == 0;
                      const std::uintptr_t access_target = read_av
                          ? static_cast<std::uintptr_t>(ex.ExceptionRecord.ExceptionInformation[1])
                          : 0;

                      std::fprintf(log,
                                   "IMP008D_D1_STC_GUEST_EXCEPTION INDEX=%u FIRST=%lu CODE=0x%08lX PC=0x%llX TARGET=0x%llX\n",
                                   exception_index,
                                   static_cast<unsigned long>(ex.dwFirstChance),
                                   static_cast<unsigned long>(ex.ExceptionRecord.ExceptionCode),
                                   static_cast<unsigned long long>(exception_pc),
                                   static_cast<unsigned long long>(access_target));

                      if (ex.ExceptionRecord.ExceptionCode == EXCEPTION_BREAKPOINT) {
                          status = DBG_CONTINUE;
                      } else if (read_av && access_target == kFaultTarget &&
                                 exception_pc != kGuestFaultPc) {
                          saw_preflight = true;
                          std::fprintf(log,
                                       "IMP008D_D1_STC_GUEST_PREFLIGHT_AV=PASS PC=0x%llX TARGET=0x%llX\n",
                                       static_cast<unsigned long long>(exception_pc),
                                       static_cast<unsigned long long>(access_target));
                          status = DBG_EXCEPTION_NOT_HANDLED;
                      } else if (!saw_guest_av && read_av && access_target == kFaultTarget &&
                                 exception_pc == kGuestFaultPc) {
                          saw_guest_av = true;
                          std::fprintf(log,
                                       "IMP008D_D1_STC_GUEST_INTENDED_AV=PASS PC=0x%llX TARGET=0x%llX\n",
                                       static_cast<unsigned long long>(exception_pc),
                                       static_cast<unsigned long long>(access_target));

                          HANDLE thread = OpenThread(THREAD_GET_CONTEXT | THREAD_SET_CONTEXT |
                                                         THREAD_QUERY_INFORMATION,
                                                     FALSE, event.dwThreadId);
                          if (!thread) {
                              std::fprintf(log, "IMP008D_D1_STC_GUEST_OPEN_THREAD=FAIL ERROR=%lu\n",
                                           static_cast<unsigned long>(GetLastError()));
                              status = DBG_EXCEPTION_NOT_HANDLED;
                          } else {
                              CONTEXT original{};
                              original.ContextFlags = CONTEXT_CONTROL | CONTEXT_INTEGER |
                                                      CONTEXT_FLOATING_POINT;
                              if (!GetThreadContext(thread, &original)) {
                                  std::fprintf(log, "IMP008D_D1_STC_GUEST_GET_CONTEXT=FAIL ERROR=%lu\n",
                                               static_cast<unsigned long>(GetLastError()));
                                  status = DBG_EXCEPTION_NOT_HANDLED;
                              } else {
                                  LogContext(log, "IMP008D_D1_STC_GUEST_CONTEXT_ORIGINAL", original);

                                  CONTEXT control = original;
                                  SetLastError(ERROR_SUCCESS);
                                  control_ok = SetThreadContext(thread, &control) != FALSE;
                                  control_error = control_ok ? ERROR_SUCCESS : GetLastError();
                                  std::fprintf(log,
                                               "IMP008D_D1_STC_GUEST_CONTROL=%s ERROR=%lu PC=0x%llX\n",
                                               control_ok ? "PASS" : "FAIL",
                                               static_cast<unsigned long>(control_error),
                                               static_cast<unsigned long long>(control.Pc));

                                  if (control_ok) {
                                      CONTEXT test = original;
                                      test.Pc = kExpectedResumePc;
                                      SetLastError(ERROR_SUCCESS);
                                      test_ok = SetThreadContext(thread, &test) != FALSE;
                                      test_error = test_ok ? ERROR_SUCCESS : GetLastError();
                                      std::fprintf(log,
                                                   "IMP008D_D1_STC_GUEST_TEST_PC_PLUS4=%s ERROR=%lu FROM=0x%llX TO=0x%llX\n",
                                                   test_ok ? "PASS" : "FAIL",
                                                   static_cast<unsigned long>(test_error),
                                                   static_cast<unsigned long long>(original.Pc),
                                                   static_cast<unsigned long long>(test.Pc));

                                      if (test_ok) {
                                          CONTEXT readback{};
                                          readback.ContextFlags = original.ContextFlags;
                                          readback_ok = GetThreadContext(thread, &readback) != FALSE;
                                          readback_error = readback_ok ? ERROR_SUCCESS : GetLastError();
                                          if (readback_ok) {
                                              LogContext(log, "IMP008D_D1_STC_GUEST_CONTEXT_READBACK", readback);
                                              readback_exact = readback.Pc == kExpectedResumePc;
                                              std::fprintf(log,
                                                           "IMP008D_D1_STC_GUEST_READBACK_PC_PLUS4=%s EXPECT=0x%llX ACTUAL=0x%llX\n",
                                                           readback_exact ? "PASS" : "FAIL",
                                                           static_cast<unsigned long long>(kExpectedResumePc),
                                                           static_cast<unsigned long long>(readback.Pc));
                                          }
                                      }
                                  }

                                  if (control_ok && test_ok && readback_ok && readback_exact) {
                                      std::fprintf(log, "IMP008D_D1_STC_GUEST_PC_ACCEPTANCE=PASS\n");
                                      status = DBG_CONTINUE;
                                  } else if (control_ok && !test_ok) {
                                      std::fprintf(log, "IMP008D_D1_STC_GUEST_PC_ACCEPTANCE=REJECTED_BY_SETTHREADCONTEXT\n");
                                      status = DBG_EXCEPTION_NOT_HANDLED;
                                  } else if (!control_ok) {
                                      std::fprintf(log, "IMP008D_D1_STC_GUEST_PC_ACCEPTANCE=CONTROL_REJECTED\n");
                                      status = DBG_EXCEPTION_NOT_HANDLED;
                                  } else {
                                      std::fprintf(log, "IMP008D_D1_STC_GUEST_PC_ACCEPTANCE=READBACK_INCONCLUSIVE\n");
                                      status = DBG_EXCEPTION_NOT_HANDLED;
                                  }
                              }
                              CloseHandle(thread);
                          }
                      } else {
                          if (ex.ExceptionRecord.NumberParameters > 0) {
                              for (DWORD i = 0; i < ex.ExceptionRecord.NumberParameters; ++i) {
                                  std::fprintf(log,
                                               "IMP008D_D1_STC_GUEST_EXCEPTION_PARAM INDEX=%u N=%lu VALUE=0x%llX\n",
                                               exception_index,
                                               static_cast<unsigned long>(i),
                                               static_cast<unsigned long long>(ex.ExceptionRecord.ExceptionInformation[i]));
                              }
                          }
                          status = DBG_EXCEPTION_NOT_HANDLED;
                      }
                  } else if (event.dwDebugEventCode == EXIT_PROCESS_DEBUG_EVENT) {
                      target_exit = event.u.ExitProcess.dwExitCode;
                      std::fprintf(log, "IMP008D_D1_STC_GUEST_TARGET_EXIT=0x%08lX\n",
                                   static_cast<unsigned long>(target_exit));
                  }

                  if (!ContinueDebugEvent(event.dwProcessId, event.dwThreadId, status)) {
                      std::fprintf(log, "IMP008D_D1_STC_GUEST_CONTINUE=FAIL ERROR=%lu\n",
                                   static_cast<unsigned long>(GetLastError()));
                      TerminateProcess(pi.hProcess, 75);
                      target_exit = 75;
                      break;
                  }
                  if (event.dwDebugEventCode == EXIT_PROCESS_DEBUG_EVENT) break;
              }

              std::fprintf(log,
                           "IMP008D_D1_STC_GUEST_SUMMARY PREFLIGHT=%u GUEST_AV=%u CONTROL=%u CONTROL_ERROR=%lu TEST=%u TEST_ERROR=%lu READBACK=%u READBACK_ERROR=%lu READBACK_PC_EXACT=%u EXIT=0x%08lX\n",
                           saw_preflight ? 1U : 0U,
                           saw_guest_av ? 1U : 0U,
                           control_ok ? 1U : 0U,
                           static_cast<unsigned long>(control_error),
                           test_ok ? 1U : 0U,
                           static_cast<unsigned long>(test_error),
                           readback_ok ? 1U : 0U,
                           static_cast<unsigned long>(readback_error),
                           readback_exact ? 1U : 0U,
                           static_cast<unsigned long>(target_exit));
              std::fprintf(log, "IMP008D_D1_STC_GUEST_OBSERVER_DONE=PASS\n");
              std::fflush(log);
              CloseHandle(pi.hThread);
              CloseHandle(pi.hProcess);
              std::fclose(log);

              return (saw_preflight && saw_guest_av) ? 0 : 76;
          }
          CPP
          clang++ -std=c++20 -O2 -Wall -Wextra -municode imp008d-d1-stc-guest-observer.cpp \
            -o imp008d-d1-stc-guest-observer.exe
          test -f imp008d-d1-stc-guest-observer.exe
          echo 'IMP008D_D1_STC_GUEST_OBSERVER_BUILD=PASS'

      - name: Run guest-only SetThreadContext acceptance probe
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          exe="$(find build -type f -name 'imp008d_d1_data_fault_skip.exe' -print -quit)"
          test -n "$exe"
          export D1_TARGET_WIN="$(cygpath -aw "$exe")"
          export D1_WORKDIR_WIN="$(cygpath -aw .)"
          set +e
          ./imp008d-d1-stc-guest-observer.exe > imp008d-d1.out.log 2> imp008d-d1.err.log
          observer_rc=$?
          set -e
          printf '%s\n' "$observer_rc" > imp008d-d1-stc-guest-observer.rc
          cat imp008d-d1.out.log || true
          cat imp008d-d1.err.log >&2 || true
          cat imp008d-d1-stc-guest.log || true
          echo "IMP008D_D1_STC_GUEST_OBSERVER_EXIT=$observer_rc"
          test "$observer_rc" -eq 0
          echo 'IMP008D_D1_STC_GUEST_RUNTIME_CAPTURE=PASS'

      - name: Classify guest PC SetThreadContext acceptance
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          grep -Fq 'IMP008D_D1_STC_GUEST_PREFLIGHT_AV=PASS' imp008d-d1-stc-guest.log
          grep -Fq 'IMP008D_D1_STC_GUEST_INTENDED_AV=PASS PC=0x1080000024 TARGET=0x1080100000' imp008d-d1-stc-guest.log
          summary="$(grep -F 'IMP008D_D1_STC_GUEST_SUMMARY' imp008d-d1-stc-guest.log | tail -n 1)"
          echo "$summary"
          if grep -Fq 'IMP008D_D1_STC_GUEST_PC_ACCEPTANCE=PASS' imp008d-d1-stc-guest.log; then
            grep -Fq 'IMP008D_D1_STC_GUEST_READBACK_PC_PLUS4=PASS EXPECT=0x1080000028 ACTUAL=0x1080000028' imp008d-d1-stc-guest.log
            echo 'IMP008D_D1_STC_GUEST_CLASSIFICATION=PC_PLUS4_ACCEPTED'
          elif grep -Fq 'IMP008D_D1_STC_GUEST_PC_ACCEPTANCE=REJECTED_BY_SETTHREADCONTEXT' imp008d-d1-stc-guest.log; then
            echo 'IMP008D_D1_STC_GUEST_CLASSIFICATION=PC_PLUS4_REJECTED'
          elif grep -Fq 'IMP008D_D1_STC_GUEST_PC_ACCEPTANCE=CONTROL_REJECTED' imp008d-d1-stc-guest.log; then
            echo 'IMP008D_D1_STC_GUEST_CLASSIFICATION=CONTROL_REJECTED'
          else
            echo 'IMP008D_D1_STC_GUEST_CLASSIFICATION=INCONCLUSIVE'
            exit 1
          fi
          echo 'IMP008D_D1_STC_GUEST_CLASSIFIER=PASS'

      - name: Persist guest PC SetThreadContext logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imp008d-d1-setthreadcontext-guest-pc-${{ github.run_id }}
          path: |
            eden/imp008d-d1-build.log
            eden/imp008d-d1.out.log
            eden/imp008d-d1.err.log
            eden/imp008d-d1-stc-guest.log
            eden/imp008d-d1-stc-guest-observer.rc
            eden/imp008d-d1-first-exception.bin
          if-no-files-found: warn
