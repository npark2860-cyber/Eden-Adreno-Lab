name: Build Windows ARM64 NCE SVC21 Second Call Outparam Branch Trap Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/build-windows-arm64-nce-svc21-second-call-outparam-branch-trap-diag.yml

permissions:
  contents: read

concurrency:
  group: windows-arm64-nce-svc21-second-call-outparam-branch-trap-diag
  cancel-in-progress: false

jobs:
  build-package:
    name: Windows ARM64 NCE SVC21 second-call outparam branch-trap diagnostic package
    runs-on: windows-11-arm
    timeout-minutes: 180

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO
      PROD_SHA: 1572c8c55508d67d4423e025ec30ad7f3d2f9291

    steps:
      - name: Checkout validated Eden NCE branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Verify production-equivalent source
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          git cat-file -e "$PROD_SHA^{commit}"
          git diff --quiet "$PROD_SHA" HEAD -- src/common src/core src/video_core CMakeLists.txt
          grep -Fq 'guest_sp_value <= allocation_base || guest_sp_value >= allocation_end' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'tib->StackLimit = reinterpret_cast<void*>(allocation_base);' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'tib->StackBase = reinterpret_cast<void*>(allocation_end);' src/core/arm/nce/arm_nce_windows.cpp
          echo 'NCE_SVC21_SECOND_CALL_OUTPARAM_BRANCH_TRAP_SOURCE_GUARD=PASS'

      - name: Reuse validated provenance injection and add one-shot wrapper branch trap
        shell: pwsh
        working-directory: eden
        run: |
          @'
          from pathlib import Path

          workflow = Path(".github/workflows/build-windows-arm64-nce-svc21-second-call-provenance-diag.yml").read_text(encoding="utf-8")
          begin_marker = "          @'\n"
          end_marker = "\n          '@ | python -"
          start = workflow.index(begin_marker) + len(begin_marker)
          end = workflow.index(end_marker, start)
          script_lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script_lines)
          exec(compile(script, "validated-second-call-provenance-injection", "exec"), {})

          path = Path("src/core/arm/nce/arm_nce_windows.cpp")
          text = path.read_text(encoding="utf-8")

          def replace_once(label, old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              text = text.replace(old, new, 1)

          state_anchor = "    static thread_local bool diag_pending_after_hle{false};\n"
          state_add = state_anchor + "\n".join([
              '    static thread_local bool diag_outparam_branch_trap_armed{false};',
              '    static thread_local bool diag_outparam_branch_trap_attempted{false};',
              '    static thread_local u64 diag_outparam_branch_trap_pc{};',
              '    static thread_local u32 diag_outparam_branch_original{};',
              '',
          ])
          replace_once("trap-state", state_anchor, state_add)

          clear_anchor = "        diag_pending_after_hle = false;\n"
          install = "\n".join([
              '        if (diag_pending_occurrence == 0 && !diag_outparam_branch_trap_attempted) {',
              '            diag_outparam_branch_trap_attempted = true;',
              '            constexpr u64 DiagWrapperCbzDeltaFromSvc = 0x198AC;',
              '            const u64 diag_candidate = m_guest_ctx.pc >= DiagWrapperCbzDeltaFromSvc',
              '                ? m_guest_ctx.pc - DiagWrapperCbzDeltaFromSvc : 0;',
              '            u32 diag_signature[3]{};',
              '            const bool diag_signature_ok = diag_candidate >= sizeof(u32) &&',
              '                process->GetMemory().ReadBlock(',
              '                    Common::ProcessAddress{diag_candidate - sizeof(u32)},',
              '                    diag_signature, sizeof(diag_signature));',
              '            const bool diag_signature_match = diag_signature_ok &&',
              '                diag_signature[0] == 0x9407FA3Au &&',
              '                diag_signature[1] == 0xB4000140u &&',
              '                diag_signature[2] == 0xF9400008u;',
              '            LOG_ERROR(Core_ARM,',
              '                      "IMP008_REALGAME_DIAG SVC21_OUTPARAM_BRANCH_TRAP_INSTALL candidate=0x{:016X} sig_ok={} sig_match={} prev={:08X} original={:08X} next={:08X}",',
              '                      diag_candidate, diag_signature_ok, diag_signature_match,',
              '                      diag_signature[0], diag_signature[1], diag_signature[2]);',
              '            if (diag_signature_match) {',
              '                auto& diag_metadata = process->GetPostHandlers();',
              '                const u64 diag_key = NCE::X18SitePatcher::MetadataKey(diag_candidate);',
              '                if (diag_metadata.find(diag_key) == diag_metadata.end()) {',
              '                    void* const diag_code = reinterpret_cast<void*>(diag_candidate);',
              '                    DWORD diag_old_protect{};',
              '                    const BOOL diag_protect_ok = VirtualProtect(',
              '                        diag_code, sizeof(u32), PAGE_EXECUTE_READWRITE, &diag_old_protect);',
              '                    if (diag_protect_ok) {',
              '                        *reinterpret_cast<volatile u32*>(diag_code) =',
              '                            NCE::X18SitePatcher::BreakpointInstruction;',
              '                        const BOOL diag_flush_ok = FlushInstructionCache(',
              '                            GetCurrentProcess(), diag_code, sizeof(u32));',
              '                        DWORD diag_restore_dummy{};',
              '                        const BOOL diag_restore_protect_ok = VirtualProtect(',
              '                            diag_code, sizeof(u32), diag_old_protect, &diag_restore_dummy);',
              '                        if (diag_flush_ok && diag_restore_protect_ok) {',
              '                            diag_metadata.insert_or_assign(',
              '                                diag_key, NCE::X18SitePatcher::MetadataValue(diag_signature[1]));',
              '                            diag_outparam_branch_trap_pc = diag_candidate;',
              '                            diag_outparam_branch_original = diag_signature[1];',
              '                            diag_outparam_branch_trap_armed = true;',
              '                            LOG_ERROR(Core_ARM,',
              '                                      "IMP008_REALGAME_DIAG SVC21_OUTPARAM_BRANCH_TRAP_ARMED pc=0x{:016X} original={:08X}",',
              '                                      diag_candidate, diag_signature[1]);',
              '                        } else {',
              '                            LOG_ERROR(Core_ARM,',
              '                                      "IMP008_REALGAME_DIAG SVC21_OUTPARAM_BRANCH_TRAP_PATCH_FAIL flush={} restore_protect={}",',
              '                                      diag_flush_ok, diag_restore_protect_ok);',
              '                        }',
              '                    } else {',
              '                        LOG_ERROR(Core_ARM,',
              '                                  "IMP008_REALGAME_DIAG SVC21_OUTPARAM_BRANCH_TRAP_PROTECT_FAIL error={}",',
              '                                  GetLastError());',
              '                    }',
              '                } else {',
              '                    LOG_ERROR(Core_ARM,',
              '                              "IMP008_REALGAME_DIAG SVC21_OUTPARAM_BRANCH_TRAP_METADATA_COLLISION pc=0x{:016X}",',
              '                              diag_candidate);',
              '                }',
              '            }',
              '        }',
              '',
          ]) + clear_anchor
          replace_once("trap-install", clear_anchor, install)

          fault_anchor = "        if (m_windows_pending_nce_fault) {\n"
          handler = "\n".join([
              '        if (diag_outparam_branch_trap_armed &&',
              '            static_cast<u64>(hr) == NCE::WindowsX18FallbackTrap::ReturnMarker &&',
              '            m_guest_ctx.pc == diag_outparam_branch_trap_pc) {',
              '            const u64 diag_lookup_result = m_guest_ctx.cpu_registers[0];',
              '            const u64 diag_source = m_guest_ctx.cpu_registers[19];',
              '            const u64 diag_out = m_guest_ctx.cpu_registers[20];',
              '            u32 diag_out_value{};',
              '            const bool diag_out_ok = diag_out != 0 && process->GetMemory().ReadBlock(',
              '                Common::ProcessAddress{diag_out}, &diag_out_value, sizeof(diag_out_value));',
              '            u64 diag_source_q[4]{};',
              '            const bool diag_source_ok = diag_source != 0 && process->GetMemory().ReadBlock(',
              '                Common::ProcessAddress{diag_source}, diag_source_q, sizeof(diag_source_q));',
              '            const std::string diag_source_text = diag_source != 0',
              '                ? process->GetMemory().ReadCString(Common::ProcessAddress{diag_source}, 64)',
              '                : std::string{};',
              '            u64 diag_vtable{};',
              '            u64 diag_method{};',
              '            bool diag_vtable_ok{};',
              '            bool diag_method_ok{};',
              '            u64 diag_object_q[4]{};',
              '            bool diag_object_ok{};',
              '            u32 diag_method_code[16]{};',
              '            bool diag_method_code_ok{};',
              '            if (diag_lookup_result != 0) {',
              '                diag_object_ok = process->GetMemory().ReadBlock(',
              '                    Common::ProcessAddress{diag_lookup_result}, diag_object_q, sizeof(diag_object_q));',
              '                diag_vtable_ok = process->GetMemory().ReadBlock(',
              '                    Common::ProcessAddress{diag_lookup_result}, &diag_vtable, sizeof(diag_vtable));',
              '                diag_method_ok = diag_vtable_ok && diag_vtable != 0 &&',
              '                    process->GetMemory().ReadBlock(',
              '                        Common::ProcessAddress{diag_vtable + 0x28}, &diag_method, sizeof(diag_method));',
              '                diag_method_code_ok = diag_method_ok && diag_method != 0 &&',
              '                    process->GetMemory().ReadBlock(',
              '                        Common::ProcessAddress{diag_method}, diag_method_code, sizeof(diag_method_code));',
              '            }',
              '            LOG_ERROR(Core_ARM,',
              '                      "IMP008_REALGAME_DIAG SVC21_OUTPARAM_BRANCH_OBSERVED pc=0x{:016X} lookup_result=0x{:016X} branch={} source=0x{:016X} out=0x{:016X} out_ok={} out_value=0x{:08X} source_ok={} source_text={}",',
              '                      diag_outparam_branch_trap_pc, diag_lookup_result,',
              '                      diag_lookup_result != 0 ? "NONNULL" : "NULL_FALLBACK",',
              '                      diag_source, diag_out, diag_out_ok, diag_out_value,',
              '                      diag_source_ok, diag_source_text);',
              '            LOG_ERROR(Core_ARM,',
              '                      "IMP008_REALGAME_DIAG SVC21_OUTPARAM_BRANCH_SOURCE q00={:016X} q01={:016X} q02={:016X} q03={:016X}",',
              '                      diag_source_q[0], diag_source_q[1], diag_source_q[2], diag_source_q[3]);',
              '            LOG_ERROR(Core_ARM,',
              '                      "IMP008_REALGAME_DIAG SVC21_OUTPARAM_BRANCH_TARGET object_ok={} vtable_ok={} vtable=0x{:016X} method_ok={} method=0x{:016X} oq00={:016X} oq01={:016X} oq02={:016X} oq03={:016X}",',
              '                      diag_object_ok, diag_vtable_ok, diag_vtable, diag_method_ok, diag_method,',
              '                      diag_object_q[0], diag_object_q[1], diag_object_q[2], diag_object_q[3]);',
              '            LOG_ERROR(Core_ARM,',
              '                      "IMP008_REALGAME_DIAG SVC21_OUTPARAM_BRANCH_METHOD_CODE ok={} base=0x{:016X} w00={:08X} w01={:08X} w02={:08X} w03={:08X} w04={:08X} w05={:08X} w06={:08X} w07={:08X} w08={:08X} w09={:08X} w10={:08X} w11={:08X} w12={:08X} w13={:08X} w14={:08X} w15={:08X}",',
              '                      diag_method_code_ok, diag_method,',
              '                      diag_method_code[0], diag_method_code[1], diag_method_code[2], diag_method_code[3],',
              '                      diag_method_code[4], diag_method_code[5], diag_method_code[6], diag_method_code[7],',
              '                      diag_method_code[8], diag_method_code[9], diag_method_code[10], diag_method_code[11],',
              '                      diag_method_code[12], diag_method_code[13], diag_method_code[14], diag_method_code[15]);',
              '            void* const diag_code = reinterpret_cast<void*>(diag_outparam_branch_trap_pc);',
              '            DWORD diag_old_protect{};',
              '            const BOOL diag_protect_ok = VirtualProtect(',
              '                diag_code, sizeof(u32), PAGE_EXECUTE_READWRITE, &diag_old_protect);',
              '            bool diag_restore_ok = false;',
              '            if (diag_protect_ok) {',
              '                *reinterpret_cast<volatile u32*>(diag_code) = diag_outparam_branch_original;',
              '                const BOOL diag_flush_ok = FlushInstructionCache(',
              '                    GetCurrentProcess(), diag_code, sizeof(u32));',
              '                DWORD diag_restore_dummy{};',
              '                const BOOL diag_restore_protect_ok = VirtualProtect(',
              '                    diag_code, sizeof(u32), diag_old_protect, &diag_restore_dummy);',
              '                diag_restore_ok = diag_flush_ok && diag_restore_protect_ok;',
              '            }',
              '            process->GetPostHandlers().erase(',
              '                NCE::X18SitePatcher::MetadataKey(diag_outparam_branch_trap_pc));',
              '            const u32 diag_original = diag_outparam_branch_original;',
              '            s64 diag_imm19 = static_cast<s64>((diag_original >> 5) & 0x7FFFFu);',
              '            if ((diag_imm19 & (1ll << 18)) != 0) {',
              '                diag_imm19 -= (1ll << 19);',
              '            }',
              '            const u64 diag_fallthrough = diag_outparam_branch_trap_pc + sizeof(u32);',
              '            const u64 diag_taken = static_cast<u64>(',
              '                static_cast<s64>(diag_outparam_branch_trap_pc) + diag_imm19 * 4);',
              '            const u64 diag_resume_pc = diag_lookup_result == 0 ? diag_taken : diag_fallthrough;',
              '            LOG_ERROR(Core_ARM,',
              '                      "IMP008_REALGAME_DIAG SVC21_OUTPARAM_BRANCH_RESUME restore_ok={} zero={} fallthrough=0x{:016X} taken=0x{:016X} resume=0x{:016X}",',
              '                      diag_restore_ok, diag_lookup_result == 0,',
              '                      diag_fallthrough, diag_taken, diag_resume_pc);',
              '            diag_outparam_branch_trap_armed = false;',
              '            diag_outparam_branch_trap_pc = 0;',
              '            diag_outparam_branch_original = 0;',
              '            if (!diag_restore_ok) {',
              '                hr = HaltReason::PrefetchAbort;',
              '                break;',
              '            }',
              '            m_guest_ctx.pc = diag_resume_pc;',
              '            continue;',
              '        }',
              '',
          ]) + fault_anchor
          replace_once("trap-handler", fault_anchor, handler)

          path.write_text(text, encoding="utf-8")
          for marker in [
              "SVC21_AFTER_HLE_RETURN",
              "SVC21_OUTPARAM_BRANCH_TRAP_INSTALL",
              "SVC21_OUTPARAM_BRANCH_TRAP_ARMED",
              "SVC21_OUTPARAM_BRANCH_OBSERVED",
              "SVC21_OUTPARAM_BRANCH_TARGET",
              "SVC21_OUTPARAM_BRANCH_RESUME",
          ]:
              if f"IMP008_REALGAME_DIAG {marker}" not in text:
                  raise SystemExit(f"missing marker {marker}")
          print("NCE_SVC21_SECOND_CALL_OUTPARAM_BRANCH_TRAP_INJECTION=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'SVC21 second-call outparam branch-trap injection failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          Write-Host 'NCE_SVC21_SECOND_CALL_OUTPARAM_BRANCH_TRAP_PATCH=PASS'

      - name: Checkout fixed dc95-era Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Set up normal Eden CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 GUI build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'IMP008_REALGAME_DIAG SVC21_OUTPARAM_BRANCH_OBSERVED' src/core/arm/nce/arm_nce_windows.cpp
          echo 'NCE_SVC21_SECOND_CALL_OUTPARAM_BRANCH_TRAP_CONFIGURE=PASS'

      - name: Build full Windows ARM64 Eden GUI
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe || {
            echo 'GUI executable not found after full build' >&2
            find build -maxdepth 4 -iname '*.exe' -print
            exit 41
          }
          echo 'NCE_SVC21_SECOND_CALL_OUTPARAM_BRANCH_TRAP_BUILD=PASS'

      - name: Package Windows ARM64 Eden
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: nce-svc21-second-call-outparam-branch-trap-${{ github.sha }}
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          find artifacts -maxdepth 2 -type f -print
          echo 'NCE_SVC21_SECOND_CALL_OUTPARAM_BRANCH_TRAP_PACKAGE=PASS'

      - name: Verify single-file package upload boundary
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path eden/artifacts -File)
          Write-Host "Package files found: $($files.Count)"
          $files | ForEach-Object { Write-Host $_.FullName }
          if ($files.Count -ne 1) { throw "Expected exactly one packaged file; found $($files.Count)" }
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item -LiteralPath $files[0].FullName -Destination upload/ -Force
          $upload = @(Get-ChildItem -Path upload -File)
          if ($upload.Count -ne 1) { throw "Expected exactly one upload file; found $($upload.Count)" }
          Write-Host 'NCE_SVC21_SECOND_CALL_OUTPARAM_BRANCH_TRAP_SINGLE_FILE_UPLOAD_BOUNDARY=PASS'

      - name: Upload Windows ARM64 NCE SVC21 second-call outparam branch-trap diagnostic package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-SVC21-SECOND-CALL-OUTPARAM-BRANCH-TRAP-${{ github.sha }}
          archive: false
          path: upload/*
          if-no-files-found: error
          retention-days: 14
