name: Validate P0.2 Windows ARM64

on:
  push:
    branches:
      - lab/validate-p0-2-win-arm64
  workflow_dispatch:

jobs:
  video-core-arm64:
    name: video_core / Windows ARM64 clang-cl
    runs-on: windows-11-arm
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC ARM64 environment
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: arm64

      - name: Install LLVM/Clang
        uses: Nerixyz/install-llvm-action@feat/new-llvm-versions
        with:
          version: "22.1.4"
          env: true

      - name: Tool versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          clang-cl --version

      - name: Install Vulkan SDK
        shell: powershell
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure minimal renderer build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DYUZU_TESTS=OFF `
            -DENABLE_QT=OFF `
            -DENABLE_OPENGL=OFF `
            -DYUZU_CMD=ON `
            -DENABLE_UPDATE_CHECKER=OFF `
            -DENABLE_WEB_SERVICE=OFF `
            -DUSE_DISCORD_PRESENCE=OFF `
            -DENABLE_LTO=OFF `
            -DYUZU_DISABLE_LLVM=ON `
            -DYUZU_USE_BUNDLED_FFMPEG=ON `
            -DYUZU_USE_BUNDLED_SDL3=ON `
            -DYUZU_USE_BUNDLED_OPENSSL=ON

      - name: Build video_core
        shell: pwsh
        run: cmake --build build --target video_core --parallel 4
