name: Probe IMP-008B E5 Host TEB Bounds Restore A-B

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-e5-8k-link-abi-repair-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp-008b-e5-host-teb-bounds-restore
  cancel-in-progress: false

jobs:
  e5-host-teb-bounds-restore:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 15
    steps:
      - name: Verify retained E5 and local ARM64 toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'eden/.git')) { throw 'retained eden checkout missing' }
          $head = (git -C eden rev-parse HEAD).Trim()
          if ($head -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31') { throw "unexpected retained head $head" }
          $transition = 'eden/src/core/arm/nce/windows_nce_transition.cpp'
          $armnce = 'eden/src/core/arm/nce/arm_nce_windows.cpp'
          $breakHeader = 'eden/src/core/arm/nce/windows_cross_thread_break.h'
          foreach ($p in @($transition,$armnce,$breakHeader)) {
            if (-not (Test-Path $p)) { throw "retained source missing: $p" }
          }
          $t = [IO.File]::ReadAllText((Resolve-Path $transition))
          $a = [IO.File]::ReadAllText((Resolve-Path $armnce))
          if (-not $t.Contains('IMP008B_E5_NT_RESOLVED_BEFORE_TEB=PASS')) { throw 'late TEB/direct NtContinue staging missing' }
          if (-not $a.Contains('IMP008B_E5_GENERIC_CRT_FREE_AB')) { throw 'generic VEH CRT-free state missing' }
          if (-not $a.Contains('IMP008B_E5_X18_CRT_FREE_AB')) { throw 'x18 VEH CRT-free state missing' }
          if (-not $a.Contains('return EXCEPTION_CONTINUE_EXECUTION;')) { throw 'continue-execution x18 return missing' }
          $clang = 'C:\msys64\clangarm64\bin\clang++.exe'
          $ninja = 'C:\msys64\usr\bin\ninja.exe'
          if (-not (Test-Path $clang)) { throw "local clang++ missing: $clang" }
          if (-not (Test-Path $ninja)) { throw "local ninja missing: $ninja" }
          & $clang --version | Select-Object -First 1
          & $ninja --version
          Write-Host 'IMP008B_E5_LOCAL_TOOLCHAIN=PASS'
          Remove-Item 'eden/imp008b-e5-hostteb.log','eden/imp008b-e5-hostteb.out.log','eden/imp008b-e5-hostteb.err.log','eden/imp008b-e5-hostteb.rc' -Force -ErrorAction SilentlyContinue
          Write-Host 'IMP008B_E5_HOST_TEB_RETAINED_STATE=PASS'

      - name: Expose captured host stack bounds and restore TEB after x18 redirect
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $headerPath = 'eden/src/core/arm/nce/windows_cross_thread_break.h'
          $armPath = 'eden/src/core/arm/nce/arm_nce_windows.cpp'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $header = [IO.File]::ReadAllText((Resolve-Path $headerPath))
          if (-not $header.Contains('IMP008B_E5_HOST_STACK_ACCESSORS_AB')) {
            $needle = '    [[nodiscard]] bool IsBound() const noexcept {'
            if (-not $header.Contains($needle)) { throw 'IsBound accessor anchor missing' }
            $insert = @(
              '    // IMP008B_E5_HOST_STACK_ACCESSORS_AB: expose host bounds captured before guest entry.',
              '    [[nodiscard]] std::uintptr_t HostStackLow() const noexcept {',
              '        return m_host_stack_low;',
              '    }',
              '',
              '    [[nodiscard]] std::uintptr_t HostStackHigh() const noexcept {',
              '        return m_host_stack_high;',
              '    }',
              '',
              '    [[nodiscard]] bool IsBound() const noexcept {'
            ) -join "`n"
            $header = $header.Replace($needle, $insert)
            [IO.File]::WriteAllText((Resolve-Path $headerPath), $header, $utf8)
          }
          $arm = [IO.File]::ReadAllText((Resolve-Path $armPath))
          if (-not $arm.Contains('IMP008B_E5_HOST_TEB_BOUNDS_AB')) {
            $pattern = '(?s)        if \(imp008b_e5_redirected\) \{\r?\n            return EXCEPTION_CONTINUE_EXECUTION;\r?\n        \}'
            $matches = [regex]::Matches($arm, $pattern)
            if ($matches.Count -ne 1) { throw "x18 continue-execution anchor count=$($matches.Count)" }
            $replacement = @(
              '        if (imp008b_e5_redirected) {',
              '            // IMP008B_E5_HOST_TEB_BOUNDS_AB: context now targets the saved host SP/PC.',
              '            // Match TEB stack bounds to that host context before dispatcher continuation.',
              '            auto* const teb = reinterpret_cast<NT_TIB*>(NtCurrentTeb());',
              '            teb->StackLimit =',
              '                reinterpret_cast<PVOID>(nce->m_windows_break->HostStackLow());',
              '            teb->StackBase =',
              '                reinterpret_cast<PVOID>(nce->m_windows_break->HostStackHigh());',
              '            return EXCEPTION_CONTINUE_EXECUTION;',
              '        }'
            ) -join "`n"
            $arm = [regex]::Replace($arm, $pattern, $replacement, 1)
            [IO.File]::WriteAllText((Resolve-Path $armPath), $arm, $utf8)
          }
          $headerCheck = [IO.File]::ReadAllText((Resolve-Path $headerPath))
          $armCheck = [IO.File]::ReadAllText((Resolve-Path $armPath))
          if (-not $headerCheck.Contains('IMP008B_E5_HOST_STACK_ACCESSORS_AB')) { throw 'host stack accessor patch missing' }
          if (-not $headerCheck.Contains('HostStackLow()') -or -not $headerCheck.Contains('HostStackHigh()')) { throw 'host stack accessors missing' }
          if (-not $armCheck.Contains('IMP008B_E5_HOST_TEB_BOUNDS_AB')) { throw 'host TEB restore patch missing' }
          if (-not $armCheck.Contains('teb->StackLimit') -or -not $armCheck.Contains('teb->StackBase')) { throw 'TEB bound stores missing' }
          if (-not $armCheck.Contains('return EXCEPTION_CONTINUE_EXECUTION;')) { throw 'continue-execution return lost' }
          if ($armCheck.Contains('IMP008B_E5_X18_VEH_ENTER=PASS') -or $armCheck.Contains('IMP008B_E5_X18_TRYREDIRECT=')) { throw 'x18 CRT diagnostics unexpectedly returned' }
          Write-Host 'IMP008B_E5_HOST_TEB_PATCH=PASS'

      - name: Extract direct commands with local Ninja without regeneration
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-Sha256([string]$path) {
            $sha = [Security.Cryptography.SHA256]::Create()
            try {
              $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path))
              return ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-','').ToLowerInvariant()
            } finally {
              $sha.Dispose()
            }
          }
          $beforeBuild = Get-Sha256 'build/build.ninja'
          $beforeRules = Get-Sha256 'build/CMakeFiles/rules.ninja'
          $ninja = 'C:\msys64\usr\bin\ninja.exe'
          $commands = & $ninja -C build -t commands imp008b_e5_x18_runtime
          if ($LASTEXITCODE -ne 0) { throw "ninja tool-mode failed rc=$LASTEXITCODE" }
          [IO.File]::WriteAllLines((Join-Path (Get-Location) 'imp008b-e5-hostteb-commands.txt'), [string[]]$commands)
          $afterBuild = Get-Sha256 'build/build.ninja'
          $afterRules = Get-Sha256 'build/CMakeFiles/rules.ninja'
          if ($beforeBuild -ne $afterBuild -or $beforeRules -ne $afterRules) { throw 'Ninja graph changed during tool-mode extraction' }
          Write-Host 'IMP008B_E5_HOST_TEB_GRAPH_UNCHANGED=PASS'

      - name: Direct compile with installed local CLANGARM64 toolchain
        shell: powershell
        working-directory: eden/build
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(Get-Content '../imp008b-e5-hostteb-commands.txt')
          function Get-One([string]$pattern, [string]$label) {
            $hits = @($lines | Where-Object { $_ -match $pattern })
            if ($hits.Count -ne 1) { throw "$label command count=$($hits.Count)" }
            return [string]$hits[0]
          }
          function Normalize-Local([string]$line) {
            $cmd = $line.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64', 'C:\msys64\clangarm64')
            $cmd = $cmd.Replace('C:/actions-runner/_work/_temp/msys64/clangarm64', 'C:/msys64/clangarm64')
            $cmd = [regex]::Replace($cmd, '^C:\\msys64\\clangarm64\\bin\\sccache\.exe\s+', '')
            $cmd = [regex]::Replace($cmd, "'(C:/[^']+)'", '$1')
            return $cmd
          }
          function Invoke-Direct([string]$label, [string]$line) {
            if ($line -match 'RERUN_CMAKE|regenerate-during-build') { throw "$label unexpectedly contains regeneration" }
            $cmd = Normalize-Local $line
            & $env:ComSpec /D /S /C $cmd
            $rc = $LASTEXITCODE
            Write-Host "IMP008B_E5_HOST_TEB_${label}_RC=$rc"
            if ($rc -ne 0) { throw "$label compile failed rc=$rc" }
          }
          Invoke-Direct 'ARMNCE' (Get-One " -c '?C:/[^']*/src/core/arm/nce/arm_nce_windows\.cpp'?$" 'ARMNCE')
          Invoke-Direct 'TRANSITION' (Get-One " -c '?C:/[^']*windows_nce_transition\.cpp'?$" 'TRANSITION')
          Invoke-Direct 'SERVICE' (Get-One " -c '?C:/[^']*/src/core/hle/service/service\.cpp'?$" 'SERVICE')
          Invoke-Direct 'NIFM' (Get-One " -c '?C:/[^']*/src/core/hle/service/nifm/nifm\.cpp'?$" 'NIFM')
          Invoke-Direct 'CONDITION' (Get-One " -c '?C:/[^']*/src/shader_recompiler/frontend/ir/condition\.cpp'?$" 'CONDITION')
          Write-Host 'IMP008B_E5_HOST_TEB_COMPILE=PASS'

      - name: Direct link with installed local CLANGARM64 toolchain
        shell: powershell
        working-directory: eden/build
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(Get-Content '../imp008b-e5-hostteb-commands.txt')
          $hits = @($lines | Where-Object { $_ -match '-o bin\\imp008b_e5_x18_runtime\.exe' })
          if ($hits.Count -ne 1) { throw "final link command count=$($hits.Count)" }
          $cmd = [string]$hits[0]
          $cmd = $cmd.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64', 'C:\msys64\clangarm64')
          $cmd = $cmd.Replace('C:/actions-runner/_work/_temp/msys64/clangarm64', 'C:/msys64/clangarm64')
          & $env:ComSpec /D /S /C $cmd 2>&1 | Tee-Object -FilePath '../imp008b-e5-hostteb-link.log'
          $rc = $LASTEXITCODE
          Write-Host "IMP008B_E5_HOST_TEB_LINK_RC=$rc"
          if ($rc -ne 0) { throw "direct link failed rc=$rc" }
          Write-Host 'IMP008B_E5_HOST_TEB_LINK=PASS'

      - name: Launch E5 host TEB bounds A-B directly on Windows
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'build/bin/imp008b_e5_x18_runtime.exe').Path
          $outPath = Join-Path (Get-Location) 'imp008b-e5-hostteb.out.log'
          $errPath = Join-Path (Get-Location) 'imp008b-e5-hostteb.err.log'
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.WorkingDirectory = (Get-Location).Path
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $process = New-Object System.Diagnostics.Process
          $process.StartInfo = $psi
          if (-not $process.Start()) { throw 'failed to start E5 runtime' }
          $outTask = $process.StandardOutput.ReadToEndAsync()
          $errTask = $process.StandardError.ReadToEndAsync()
          $timedOut = -not $process.WaitForExit(30000)
          if ($timedOut) {
            $process.Kill()
            $process.WaitForExit()
          }
          $stdout = $outTask.Result
          $stderr = $errTask.Result
          [IO.File]::WriteAllText($outPath, $stdout)
          [IO.File]::WriteAllText($errPath, $stderr)
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'imp008b-e5-hostteb.log'), $stdout + $stderr)
          if ($timedOut) { $rc = 124 } else { $rc = $process.ExitCode }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'imp008b-e5-hostteb.rc'), [string]$rc)
          Write-Host $stdout
          Write-Host $stderr
          $hex = '0x{0:X8}' -f ($rc -band 0xffffffffL)
          Write-Host "IMP008B_E5_HOST_TEB_RUNTIME_RC=$rc ($hex)"

      - name: Classify host TEB bounds boundary
        if: always()
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'imp008b-e5-hostteb.log')) {
            Write-Host 'IMP008B_E5_HOST_TEB_RUNTIME=NOT_REACHED'
            exit 0
          }
          Get-Content 'imp008b-e5-hostteb.log' | Select-String -Pattern 'IMP008B_E5_(8K_|NT_RESOLVED|RUNTHREAD_RETURNED|GUEST_X18_EXECUTED|SVC_RETURN|ARCH_CONTEXT|HALT_REASON|SVC_NUMBER|RETURN_CONTEXT|GATE)|IMP008B_E2_RESTORE_CONTEXT|IMP008B_E2_BEFORE_NT_CONTINUE'
          $ready = Select-String -Path 'imp008b-e5-hostteb.log' -SimpleMatch 'IMP008B_E5_8K_STACK_READY=PASS' -Quiet
          $beforeNt = Select-String -Path 'imp008b-e5-hostteb.log' -SimpleMatch 'IMP008B_E2_BEFORE_NT_CONTINUE=PASS' -Quiet
          $secondRestore = Select-String -Path 'imp008b-e5-hostteb.log' -Pattern 'IMP008B_E2_RESTORE_CONTEXT PC=0x[0-9A-Fa-f]*28 ' -Quiet
          $returned = Select-String -Path 'imp008b-e5-hostteb.log' -SimpleMatch 'IMP008B_E5_RUNTHREAD_RETURNED=PASS' -Quiet
          $svc = Select-String -Path 'imp008b-e5-hostteb.log' -SimpleMatch 'IMP008B_E5_SVC_NUMBER_RAW=0x00000055' -Quiet
          $x18result = Select-String -Path 'imp008b-e5-hostteb.log' -SimpleMatch 'IMP008B_E5_GUEST_X18_EXECUTED=PASS' -Quiet
          $gate = Select-String -Path 'imp008b-e5-hostteb.log' -SimpleMatch 'IMP008B_E5_GATE=PASS' -Quiet
          Write-Host ('IMP008B_E5_HOST_TEB_READY=' + $(if ($ready) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_HOST_TEB_BEFORE_NT=' + $(if ($beforeNt) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_HOST_TEB_SECOND_RESTORE=' + $(if ($secondRestore) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_HOST_TEB_RUNTHREAD_RETURNED=' + $(if ($returned) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_HOST_TEB_SVC55=' + $(if ($svc) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_HOST_TEB_X18_RESULT=' + $(if ($x18result) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_HOST_TEB_GATE=' + $(if ($gate) {'PASS'} else {'NO'}))
          if (Test-Path 'imp008b-e5-hostteb.rc') {
            Write-Host ('IMP008B_E5_HOST_TEB_RAW_RC=' + (Get-Content 'imp008b-e5-hostteb.rc' -Raw).Trim())
          }

      - name: Upload host TEB bounds diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-host-teb-bounds-restore
          path: |
            eden/imp008b-e5-hostteb-commands.txt
            eden/imp008b-e5-hostteb-link.log
            eden/imp008b-e5-hostteb.log
            eden/imp008b-e5-hostteb.out.log
            eden/imp008b-e5-hostteb.err.log
            eden/imp008b-e5-hostteb.rc
          if-no-files-found: warn
