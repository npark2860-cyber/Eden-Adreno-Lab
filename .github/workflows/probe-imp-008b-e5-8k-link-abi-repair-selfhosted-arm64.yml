name: Probe IMP-008B E5 8K Link ABI Repair Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-e5-8k-link-abi-repair-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp-008b-e5-8k-link-abi-repair-runtime
  cancel-in-progress: false

jobs:
  e5-8k-link-abi-repair-runtime:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 35
    steps:
      - name: Verify retained direct-build state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'eden/.git')) { throw 'retained eden checkout missing' }
          $head = (git -C eden rev-parse HEAD).Trim()
          if ($head -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31') { throw "unexpected retained head $head" }
          $transition = 'eden/src/core/arm/nce/windows_nce_transition.cpp'
          $check = [IO.File]::ReadAllText((Resolve-Path $transition))
          if (-not $check.Contains('IMP008B_E5_8K_STACK_READY=PASS')) { throw '8K transition marker missing' }
          if (-not $check.Contains('reinterpret_cast<NT_TIB*>(teb)->StackLimit')) { throw 'TEB StackLimit publication missing' }
          if (-not $check.Contains('reinterpret_cast<NT_TIB*>(teb)->StackBase')) { throw 'TEB StackBase publication missing' }
          Write-Host 'IMP008B_E5_ABI_REPAIR_RETAINED_STATE=PASS'

      - name: Keep allocation-base 8K bounds and stage NtContinue before TEB publish
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'eden/src/core/arm/nce/windows_nce_transition.cpp'
          $text = [IO.File]::ReadAllText((Resolve-Path $path))
          $text = $text.Replace('        stack_mbi.RegionSize < 0x2000) {', '        stack_mbi.AllocationBase == nullptr) {')
          $text = $text.Replace('reinterpret_cast<std::uint64_t>(stack_mbi.BaseAddress);', 'reinterpret_cast<std::uint64_t>(stack_mbi.AllocationBase);')
          $text = $text.Replace('stack_limit + static_cast<std::uint64_t>(stack_mbi.RegionSize);', 'stack_limit + 0x2000;')
          if (-not $text.Contains('IMP008B_E5_NT_RESOLVED_BEFORE_TEB=PASS')) {
            $needle = '    TraceVirtualMapping("RESTORE_SP", context.Sp);'
            $insert = @"
    TraceVirtualMapping("RESTORE_SP", context.Sp);

    using DirectNtContinueFn = LONG(NTAPI*)(PCONTEXT, BOOLEAN);
    const HMODULE direct_ntdll = GetModuleHandleW(L"ntdll.dll");
    const auto direct_nt_continue = direct_ntdll != nullptr
                                        ? reinterpret_cast<DirectNtContinueFn>(
                                              GetProcAddress(direct_ntdll, "NtContinue"))
                                        : nullptr;
    if (direct_nt_continue == nullptr) {
        std::abort();
    }
    std::fputs("IMP008B_E5_NT_RESOLVED_BEFORE_TEB=PASS\n", stderr);
    std::fflush(stderr);
"@
            if (-not $text.Contains($needle)) { throw 'RESTORE_SP trace anchor missing' }
            $text = $text.Replace($needle, $insert)
          }
          $limitLine = '    reinterpret_cast<NT_TIB*>(teb)->StackLimit = reinterpret_cast<PVOID>(stack_limit);'
          $baseLine = '    reinterpret_cast<NT_TIB*>(teb)->StackBase = reinterpret_cast<PVOID>(stack_base);'
          $text = $text.Replace($limitLine + "`r`n" + $baseLine + "`r`n", '')
          $text = $text.Replace($limitLine + "`n" + $baseLine + "`n", '')
          $callNeedle = '    WindowsNceTransition::ContinueContext(context);'
          if ($text.Contains($callNeedle)) {
            $directCall = @"
    reinterpret_cast<NT_TIB*>(teb)->StackLimit = reinterpret_cast<PVOID>(stack_limit);
    reinterpret_cast<NT_TIB*>(teb)->StackBase = reinterpret_cast<PVOID>(stack_base);
    direct_nt_continue(reinterpret_cast<PCONTEXT>(&context), FALSE);
    std::abort();
"@
            $text = $text.Replace($callNeedle, $directCall)
          }
          if (-not $text.Contains('direct_nt_continue(reinterpret_cast<PCONTEXT>(&context), FALSE);')) { throw 'direct NtContinue call missing' }
          $firstLimit = $text.IndexOf('reinterpret_cast<NT_TIB*>(teb)->StackLimit = reinterpret_cast<PVOID>(stack_limit);')
          $beforeNt = $text.IndexOf('IMP008B_E2_BEFORE_NT_CONTINUE=PASS')
          if ($firstLimit -lt 0 -or $beforeNt -lt 0 -or $firstLimit -lt $beforeNt) { throw 'TEB publish still occurs before final diagnostic host calls' }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText((Resolve-Path $path), $text, $utf8)
          Write-Host 'IMP008B_E5_DIRECT_NT_AFTER_TEB=PASS'

      - name: Set up minimal direct-link CLANGARM64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          cache: false
          install: >-
            ninja
          pacboy: >-
            clang:p lld:p sccache:p libusb:p zlib:p enet:p boost:p fmt:p lz4:p
            zstd:p opus:p libiconv:p

      - name: Extract commands without regeneration
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          before_build=$(sha256sum build/build.ninja | awk '{print $1}')
          before_rules=$(sha256sum build/CMakeFiles/rules.ninja | awk '{print $1}')
          ninja -C build -t commands imp008b_e5_x18_runtime > imp008b-e5-abi-commands.txt
          after_build=$(sha256sum build/build.ninja | awk '{print $1}')
          after_rules=$(sha256sum build/CMakeFiles/rules.ninja | awk '{print $1}')
          test "$before_build" = "$after_build"
          test "$before_rules" = "$after_rules"
          echo 'IMP008B_E5_ABI_REPAIR_GRAPH_UNCHANGED=PASS'

      - name: Compile transition and refresh fmt ABI stale objects
        shell: powershell
        working-directory: eden/build
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(Get-Content '../imp008b-e5-abi-commands.txt')
          function Get-One([string]$pattern, [string]$label) {
            $hits = @($lines | Where-Object { $_ -match $pattern })
            if ($hits.Count -ne 1) { throw "$label command count=$($hits.Count)" }
            return [string]$hits[0]
          }
          function Invoke-Direct([string]$label, [string]$line) {
            if ($line -match 'RERUN_CMAKE|regenerate-during-build') { throw "$label unexpectedly contains regeneration" }
            $cmd = [regex]::Replace($line, "'(C:/[^']+)'", '$1')
            & $env:ComSpec /D /S /C $cmd
            $rc = $LASTEXITCODE
            Write-Host "IMP008B_E5_ABI_${label}_RC=$rc"
            if ($rc -ne 0) { throw "$label refresh failed rc=$rc" }
          }
          Invoke-Direct 'TRANSITION' (Get-One " -c '?C:/[^']*windows_nce_transition\.cpp'?$" 'TRANSITION')
          Invoke-Direct 'SERVICE' (Get-One " -c '?C:/[^']*/src/core/hle/service/service\.cpp'?$" 'SERVICE')
          Invoke-Direct 'NIFM' (Get-One " -c '?C:/[^']*/src/core/hle/service/nifm/nifm\.cpp'?$" 'NIFM')
          Invoke-Direct 'CONDITION' (Get-One " -c '?C:/[^']*/src/shader_recompiler/frontend/ir/condition\.cpp'?$" 'CONDITION')
          Write-Host 'IMP008B_E5_FMT_ABI_REFRESH=PASS'

      - name: Direct link E5
        shell: powershell
        working-directory: eden/build
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(Get-Content '../imp008b-e5-abi-commands.txt')
          $hits = @($lines | Where-Object { $_ -match '-o bin\\imp008b_e5_x18_runtime\.exe' })
          if ($hits.Count -ne 1) { throw "final link command count=$($hits.Count)" }
          $cmd = [string]$hits[0]
          & $env:ComSpec /D /S /C $cmd 2>&1 | Tee-Object -FilePath '../imp008b-e5-abi-link.log'
          $rc = $LASTEXITCODE
          Write-Host "IMP008B_E5_ABI_LINK_RC=$rc"
          if ($rc -ne 0) { throw "direct link failed rc=$rc" }
          Write-Host 'IMP008B_E5_ABI_LINK=PASS'

      - name: Launch E5 8K private guest stack A-B
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -uo pipefail
          set +e
          timeout 30s build/bin/imp008b_e5_x18_runtime.exe > imp008b-e5-8k-abi.out.log 2> imp008b-e5-8k-abi.err.log
          rc=$?
          set -e
          printf '%s\n' "$rc" > imp008b-e5-8k-abi.rc
          cat imp008b-e5-8k-abi.out.log imp008b-e5-8k-abi.err.log > imp008b-e5-8k-abi.log 2>/dev/null || true
          cat imp008b-e5-8k-abi.log || true
          echo "IMP008B_E5_8K_ABI_RC=$rc"

      - name: Classify E5 8K stack boundary
        if: always()
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'imp008b-e5-8k-abi.log')) {
            Write-Host 'IMP008B_E5_8K_ABI_RUNTIME=NOT_REACHED'
            exit 0
          }
          Get-Content 'imp008b-e5-8k-abi.log' | Select-String -Pattern 'IMP008B_E5_(8K_|NT_RESOLVED|GENERIC_VEH_|X18_VEH_|X18_TRYREDIRECT|RUNTHREAD_RETURNED|GUEST_X18_EXECUTED|SVC_RETURN|ARCH_CONTEXT|HALT_REASON|SVC_NUMBER|RETURN_CONTEXT|GATE)|IMP008B_E2_RESTORE_CONTEXT|IMP008B_E2_BEFORE_NT_CONTINUE'
          $ready = Select-String -Path 'imp008b-e5-8k-abi.log' -SimpleMatch 'IMP008B_E5_8K_STACK_READY=PASS' -Quiet
          $beforeNt = Select-String -Path 'imp008b-e5-8k-abi.log' -SimpleMatch 'IMP008B_E2_BEFORE_NT_CONTINUE=PASS' -Quiet
          $generic = Select-String -Path 'imp008b-e5-8k-abi.log' -SimpleMatch 'IMP008B_E5_GENERIC_VEH_ENTER=PASS' -Quiet
          $x18 = Select-String -Path 'imp008b-e5-8k-abi.log' -SimpleMatch 'IMP008B_E5_X18_VEH_ENTER=PASS' -Quiet
          $secondRestore = Select-String -Path 'imp008b-e5-8k-abi.log' -Pattern 'IMP008B_E2_RESTORE_CONTEXT PC=0x[0-9A-Fa-f]*28 ' -Quiet
          $returned = Select-String -Path 'imp008b-e5-8k-abi.log' -SimpleMatch 'IMP008B_E5_RUNTHREAD_RETURNED=PASS' -Quiet
          $svc = Select-String -Path 'imp008b-e5-8k-abi.log' -SimpleMatch 'IMP008B_E5_SVC_NUMBER_RAW=0x00000055' -Quiet
          $x18result = Select-String -Path 'imp008b-e5-8k-abi.log' -SimpleMatch 'IMP008B_E5_GUEST_X18_EXECUTED=PASS' -Quiet
          $gate = Select-String -Path 'imp008b-e5-8k-abi.log' -SimpleMatch 'IMP008B_E5_GATE=PASS' -Quiet
          Write-Host ('IMP008B_E5_8K_READY=' + $(if ($ready) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_BEFORE_NT=' + $(if ($beforeNt) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_GENERIC_VEH=' + $(if ($generic) {'PASS'} else {'NO_ENTRY'}))
          Write-Host ('IMP008B_E5_8K_X18_VEH=' + $(if ($x18) {'PASS'} else {'NO_ENTRY'}))
          Write-Host ('IMP008B_E5_8K_SECOND_RESTORE=' + $(if ($secondRestore) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_RUNTHREAD_RETURNED=' + $(if ($returned) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_SVC55=' + $(if ($svc) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_X18_RESULT=' + $(if ($x18result) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_GATE=' + $(if ($gate) {'PASS'} else {'NO'}))

      - name: Upload ABI repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-8k-link-abi-repair-runtime
          path: |
            eden/imp008b-e5-abi-commands.txt
            eden/imp008b-e5-abi-link.log
            eden/imp008b-e5-8k-abi.log
            eden/imp008b-e5-8k-abi.out.log
            eden/imp008b-e5-8k-abi.err.log
            eden/imp008b-e5-8k-abi.rc
          if-no-files-found: warn
