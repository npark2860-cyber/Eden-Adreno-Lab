name: Build Windows ARM64 NCE V72 guest StackLimit before NtContinue f7907319

on:
  push:
    branches:
      - fix/windows-nce-v72-guest-stacklimit-before-ntcontinue-f7907319
    paths:
      - .github/diagnostics/v72-guest-stacklimit-before-ntcontinue-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-v72-guest-stacklimit-before-ntcontinue-f7907319
  cancel-in-progress: false

env:
  V71_BASE_SHA: f7907319a344a6b49e914830c7a91ce3df2ecafc
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: v72-guest-stacklimit-before-ntcontinue

jobs:
  build-package:
    name: Windows ARM64 NCE V72 guest StackLimit before NtContinue
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact V72 Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/v72-guest-stacklimit-before-ntcontinue/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify V72 provenance and single-variable scope
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$SOURCE" merge-base --is-ancestor "$V71_BASE_SHA" "$GITHUB_SHA"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=no)"
          git -C "$SOURCE" diff --check "$V71_BASE_SHA" "$GITHUB_SHA"

          CHANGED="$(git -C "$SOURCE" diff --name-only "$V71_BASE_SHA" "$GITHUB_SHA")"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(src/core/arm/nce/windows_nce_transition\.cpp|\.github/workflows/build-windows-arm64-nce-v72-guest-stacklimit-before-ntcontinue-f7907319\.yml|\.github/diagnostics/v72-guest-stacklimit-before-ntcontinue-trigger\.txt)$' || true)"
          test -z "$UNEXPECTED"

          grep -Fq 'FAST_FAIL_INVALID_SET_OF_CONTEXT' "$SOURCE/src/core/arm/nce/windows_nce_transition.cpp"
          grep -Fq 'NtCurrentTeb())->StackLimit' "$SOURCE/src/core/arm/nce/windows_nce_transition.cpp"
          grep -Fq 'active_lease_owns_sp' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'DCCIVAC{inst}.Verify()' "$SOURCE/src/core/arm/nce/patcher.cpp"
          grep -Fq 'V70_BREAKPOINT' "$SOURCE/src/yuzu/main.cpp"

          git -C "$SOURCE" diff "$V71_BASE_SHA" "$GITHUB_SHA" --             src/core/arm/nce/windows_nce_transition.cpp > "$PROV/V72_GUEST_STACKLIMIT_BEFORE_NTCONTINUE.diff"
          printf 'V71_BASE_SHA=%s\nV72_SHA=%s\nSOURCE_MODE=exact tested V71 + final-seam guest StackLimit publish only\nEVIDENCE=V71 Run3 PID 25952 WER C0000409 param0=0xD FAST_FAIL_INVALID_SET_OF_CONTEXT; PC in ntdll fast-fail; SP=0x20D0C927C0; TEB StackBase=0x20D0C93000; TEB StackLimit=0x299D9420004 mixed guest/host interval\nISOLATION_DIR=build/validation/%s/%s\n'             "$V71_BASE_SHA" "$GITHUB_SHA" "$GITHUB_SHA" "$TEST_NAME" > "$PROV/BUILD_INFO.txt"

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: build/validation/${{ github.sha }}/v72-guest-stacklimit-before-ntcontinue/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: false
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure V72 Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v72-guest-stacklimit-before-ntcontinue/source
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          printf 'CONFIGURE_COMMAND=./.ci/build/configure.sh -DCCACHE_PATH=sccache\nNCE_COMPILE_GUARD=HAS_NCE=1\n' >> ../provenance/BUILD_INFO.txt

      - name: Build full Windows ARM64 Eden V72
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v72-guest-stacklimit-before-ntcontinue/source
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          printf 'BUILD_COMMAND=cmake --build build\n' >> ../provenance/BUILD_INFO.txt

      - name: Package Windows ARM64 Eden V72
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v72-guest-stacklimit-before-ntcontinue/source
        env:
          ARTIFACT_REF: nce-v72-guest-stacklimit-before-ntcontinue-f7907319
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          printf 'PACKAGE_COMMAND=./.ci/package/windows.sh\nARTIFACT_REF=nce-v72-guest-stacklimit-before-ntcontinue-f7907319\n' >> ../provenance/BUILD_INFO.txt

      - name: Prepare V72 upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged Eden artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash
          "PACKAGE_FILE=$($files[0].Name)" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          "PACKAGE_SHA256=$hash" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')

      - name: Upload V72 package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-V72-GUEST-STACKLIMIT-BEFORE-NTCONTINUE-f7907319
          path: build/validation/${{ github.sha }}/v72-guest-stacklimit-before-ntcontinue/upload/*
          if-no-files-found: error
          retention-days: 14
