name: Probe IMP-008B E5 8K Private Stack Resume UTF8

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-e5-8k-private-stack-resume-utf8-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp-008b-e5-8k-private-stack-resume-utf8
  cancel-in-progress: false

jobs:
  e5-8k-private-stack-resume:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 60
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Verify retained 8K A-B workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'eden/.git')) { throw 'retained eden checkout missing' }
          $head = (git -C eden rev-parse HEAD).Trim()
          if ($head -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31') { throw "unexpected retained head $head" }
          $probe = 'eden/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp'
          $transition = 'eden/src/core/arm/nce/windows_nce_transition.cpp'
          $runtime = 'eden/src/core/arm/nce/arm_nce_windows.cpp'
          if (-not (Select-String -Path $probe -SimpleMatch 'IMP008B_E5_8K_GUEST_STACK=PASS' -Quiet)) { throw '8K guest stack patch missing' }
          if (-not (Select-String -Path $transition -SimpleMatch 'IMP008B_E5_8K_STACK_READY=PASS' -Quiet)) { throw '8K transition patch missing' }
          if (-not (Select-String -Path $runtime -SimpleMatch 'IMP008B_E5_GENERIC_VEH_ENTER=PASS' -Quiet)) { throw 'generic VEH observer missing' }
          if (-not (Select-String -Path $runtime -SimpleMatch 'IMP008B_E5_X18_VEH_ENTER=PASS' -Quiet)) { throw 'x18 VEH observer missing' }
          Write-Host 'IMP008B_E5_8K_RESUME_WORKSPACE=PASS'

      - name: Drop only stale httplib CPM cache
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'eden/.cache/cpm/httplib',
            'eden/build/_deps/httplib-src',
            'eden/build/_deps/httplib-subbuild'
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Remove-Item -Recurse -Force $p
              Write-Host "IMP008B_E5_8K_CACHE_REMOVED=$p"
            }
          }
          Write-Host 'IMP008B_E5_8K_CACHE_RESET=PASS'

      - name: Set up CLANGARM64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          cache: false
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p
            toolchain:p clang:p python-pip:p lld:p openssl:p boost:p fmt:p lz4:p
            nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p
            glslang:p enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p
            xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p libwebp:p
            libtiff:p brotli:p

      - name: Rebuild unchanged E5 8K A-B target
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8
          printf 'IMP008B_E5_8K_LOCALE=%s/%s\n' "$LANG" "$LC_ALL"
          cmake --build build --target imp008b_e5_x18_runtime --parallel
          test -f build/bin/imp008b_e5_x18_runtime.exe
          echo 'IMP008B_E5_8K_RESUME_BUILD=PASS'

      - name: Launch unchanged E5 8K private guest stack A-B
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -uo pipefail
          set +e
          timeout 30s build/bin/imp008b_e5_x18_runtime.exe > imp008b-e5-8k-resume.out.log 2> imp008b-e5-8k-resume.err.log
          rc=$?
          set -e
          printf '%s\n' "$rc" > imp008b-e5-8k-resume.rc
          cat imp008b-e5-8k-resume.out.log imp008b-e5-8k-resume.err.log > imp008b-e5-8k-resume.log 2>/dev/null || true
          cat imp008b-e5-8k-resume.log || true
          echo "IMP008B_E5_8K_RESUME_RC=$rc"

      - name: Classify E5 8K stack boundary
        if: always()
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'imp008b-e5-8k-resume.log')) { throw 'runtime log missing' }
          Get-Content 'imp008b-e5-8k-resume.log' | Select-String -Pattern 'IMP008B_E5_(8K_|GENERIC_VEH_|X18_VEH_|X18_TRYREDIRECT|RUNTHREAD_RETURNED|GUEST_X18_EXECUTED|SVC_RETURN|ARCH_CONTEXT|HALT_REASON|SVC_NUMBER|RETURN_CONTEXT|GATE)|IMP008B_E2_RESTORE_CONTEXT|IMP008B_E2_BEFORE_NT_CONTINUE'
          $ready = Select-String -Path 'imp008b-e5-8k-resume.log' -SimpleMatch 'IMP008B_E5_8K_STACK_READY=PASS' -Quiet
          $generic = Select-String -Path 'imp008b-e5-8k-resume.log' -SimpleMatch 'IMP008B_E5_GENERIC_VEH_ENTER=PASS' -Quiet
          $x18 = Select-String -Path 'imp008b-e5-8k-resume.log' -SimpleMatch 'IMP008B_E5_X18_VEH_ENTER=PASS' -Quiet
          $fallback = Select-String -Path 'imp008b-e5-8k-resume.log' -Pattern 'IMP008B_E5_X18_TRYREDIRECT.*PASS' -Quiet
          $secondRestore = Select-String -Path 'imp008b-e5-8k-resume.log' -Pattern 'IMP008B_E2_RESTORE_CONTEXT PC=0x[0-9A-Fa-f]*28 ' -Quiet
          $returned = Select-String -Path 'imp008b-e5-8k-resume.log' -SimpleMatch 'IMP008B_E5_RUNTHREAD_RETURNED=PASS' -Quiet
          $svc = Select-String -Path 'imp008b-e5-8k-resume.log' -SimpleMatch 'IMP008B_E5_SVC_NUMBER_RAW=0x00000055' -Quiet
          $x18result = Select-String -Path 'imp008b-e5-8k-resume.log' -SimpleMatch 'IMP008B_E5_GUEST_X18_EXECUTED=PASS' -Quiet
          $gate = Select-String -Path 'imp008b-e5-8k-resume.log' -SimpleMatch 'IMP008B_E5_GATE=PASS' -Quiet
          Write-Host ('IMP008B_E5_8K_READY=' + $(if ($ready) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_GENERIC_VEH=' + $(if ($generic) {'PASS'} else {'NO_ENTRY'}))
          Write-Host ('IMP008B_E5_8K_X18_VEH=' + $(if ($x18) {'PASS'} else {'NO_ENTRY'}))
          Write-Host ('IMP008B_E5_8K_FALLBACK=' + $(if ($fallback) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_SECOND_RESTORE=' + $(if ($secondRestore) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_RUNTHREAD_RETURNED=' + $(if ($returned) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_SVC55=' + $(if ($svc) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_X18_RESULT=' + $(if ($x18result) {'PASS'} else {'NO'}))
          Write-Host ('IMP008B_E5_8K_GATE=' + $(if ($gate) {'PASS'} else {'NO'}))

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-8k-private-stack-resume-utf8
          path: |
            eden/imp008b-e5-8k-resume.log
            eden/imp008b-e5-8k-resume.out.log
            eden/imp008b-e5-8k-resume.err.log
            eden/imp008b-e5-8k-resume.rc
          if-no-files-found: warn
