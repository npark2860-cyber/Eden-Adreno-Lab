name: Validate dc95 X1 Exclusive Caller

on:
  push:
    branches:
      - exp/x1-arm64-exclusive-caller-attribution
    paths:
      - '.github/workflows/validate-dc95-x1-exclusive-caller.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4
        with:
          path: lab
          fetch-depth: 0

      - name: Checkout exact dc95 source
        uses: actions/checkout@v4
        with:
          repository: eden-emulator/mirror
          ref: dc95cd09eea9749250fe31a3072684d341d19417
          path: eden
          fetch-depth: 0

      - name: Prepare exact-dc95 exclusive fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C eden rev-parse HEAD)" = "dc95cd09eea9749250fe31a3072684d341d19417"
          cp lab/src/core/x1_waker_stage_f_profiler.h eden/src/core/x1_waker_stage_f_profiler.h
          cp lab/src/core/x1_arm64_exclusive_profiler.h eden/src/core/x1_arm64_exclusive_profiler.h
          python - <<'PY'
          from pathlib import Path

          stage_f = Path('eden/src/core/x1_waker_stage_f_profiler.h')
          text = stage_f.read_text()
          enabled_anchor = '''    [[nodiscard]] bool Enabled() const noexcept {
        return enabled.load(std::memory_order_relaxed);
    }
'''
          if text.count(enabled_anchor) != 1:
              raise SystemExit('Stage F fixture accessor anchor mismatch')
          accessor = enabled_anchor + '''
    [[nodiscard]] s32 GetTrackedProducerIndex(u64 thread_id) const noexcept {
        if (!Enabled() || thread_id == 0) {
            return -1;
        }
        for (size_t i = 0; i < ProducerCount; ++i) {
            if (producers[i].thread_id.load(std::memory_order_acquire) == thread_id) {
                return static_cast<s32>(i);
            }
        }
        return -1;
    }
'''
          stage_f.write_text(text.replace(enabled_anchor, accessor, 1))

          rasterizer = Path('eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp')
          text = rasterizer.read_text()
          anchor = '#include "common/settings.h"\n'
          if text.count(anchor) != 1:
              raise SystemExit('rasterizer fixture include anchor mismatch')
          text = text.replace(anchor, anchor + '#include "core/x1_waker_stage_k_profiler.h"\n', 1)
          text += '''\n#if 0\nvoid X1ExclusiveStaticFixture() {\n    Core::X1WakerStageKProfiler::Get().Initialize(\n        device.GetDriverID() == VK_DRIVER_ID_QUALCOMM_PROPRIETARY);\n    Core::X1WakerStageEProfiler::Get().FrameEnd();\n    Core::X1WakerStageKProfiler::Get().FrameEnd();\n    Core::X1WakerStageJProfiler::Get().FrameEnd();\n    Core::X1WakerStageGProfiler::Get().FrameEnd();\n    Core::X1WakerStageFProfiler::Get().FrameEnd();\n}\n#endif\n'''
          rasterizer.write_text(text)

          loader = Path('eden/src/core/loader/deconstructed_rom_directory.cpp')
          text = loader.read_text()
          anchor = '#include "core/core.h"\n'
          if text.count(anchor) != 1:
              raise SystemExit('loader fixture include anchor mismatch')
          text = text.replace(anchor, anchor + '#include "core/x1_waker_stage_k_profiler.h"\n', 1)
          text += '''\n#if 0\nvoid X1LoaderStaticFixture() {\n        if (std::strcmp(module, "main") == 0) {\n            Core::X1WakerStageKProfiler::Get().RegisterMainModuleRange(load_addr, next_load_addr);\n        }\n}\n#endif\n'''
          loader.write_text(text)
          PY

      - name: Apply exclusive totals PC and caller transforms
        shell: bash
        run: |
          set -euo pipefail
          python lab/tools/adreno_lab/transplant_dc95_arm64_exclusive_callback_attribution.py eden
          python lab/tools/adreno_lab/transplant_dc95_arm64_exclusive_pc_attribution.py eden
          python lab/tools/adreno_lab/transplant_dc95_arm64_exclusive_caller_attribution.py eden

      - name: Verify observation-only invariants
        shell: bash
        run: |
          set -euo pipefail
          git -C eden diff --check
          python -m py_compile \
            lab/tools/adreno_lab/transplant_dc95_arm64_exclusive_callback_attribution.py \
            lab/tools/adreno_lab/transplant_dc95_arm64_exclusive_pc_attribution.py \
            lab/tools/adreno_lab/transplant_dc95_arm64_exclusive_caller_attribution.py \
            lab/tools/adreno_lab/transplant_dc95_waker_stage_k_grandparent_depth.py \
            lab/tools/adreno_lab/analyze_x1_arm64_exclusive_caller_attribution.py

          test "$(grep -c 'global_monitor->ReadAndMark<T>' eden/src/dynarmic/src/dynarmic/backend/arm64/a64_address_space.cpp)" = 1
          test "$(grep -c 'global_monitor->ReadAndMark<Vector>' eden/src/dynarmic/src/dynarmic/backend/arm64/a64_address_space.cpp)" = 1
          test "$(grep -c 'global_monitor->DoExclusiveOperation<T>' eden/src/dynarmic/src/dynarmic/backend/arm64/a64_address_space.cpp)" = 1
          test "$(grep -c 'global_monitor->DoExclusiveOperation<Vector>' eden/src/dynarmic/src/dynarmic/backend/arm64/a64_address_space.cpp)" = 1
          test "$(grep -c 'offsetof(A64JitState, sp)' eden/src/dynarmic/src/dynarmic/backend/arm64/emit_arm64_memory.cpp)" = 1
          test "$(grep -c 'RecordCallerSample' eden/src/core/arm/dynarmic/arm_dynarmic_64.cpp)" = 1
          test "$(grep -c 'IsTargetEnterPc' eden/src/core/arm/dynarmic/arm_dynarmic_64.cpp)" = 1
          test "$(grep -c 'IsValidVirtualAddressRange(caller_address, sizeof(u64))' eden/src/core/arm/dynarmic/arm_dynarmic_64.cpp)" = 1
          test "$(grep -c 'RegisterSdkModuleRange' eden/src/core/loader/deconstructed_rom_directory.cpp)" = 1
          test "$(grep -c '\[X1-XEXCLCALL\]' eden/src/core/x1_arm64_exclusive_caller_profiler.h)" = 2
          grep -q 'SampleRate = 64' eden/src/core/x1_arm64_exclusive_caller_profiler.h
          grep -q 'EnterLdaxrOffset = 0x131754' eden/src/core/x1_arm64_exclusive_caller_profiler.h
          grep -q 'LockMutexCallerLrStackOffset = 0x38' eden/src/core/x1_arm64_exclusive_caller_profiler.h
          test "$(grep -c 'load_exclusive_caller_impl' lab/tools/adreno_lab/transplant_dc95_waker_stage_k_grandparent_depth.py)" = 2
          test "$(grep -c 'exclusive_caller_impl.main()' lab/tools/adreno_lab/transplant_dc95_waker_stage_k_grandparent_depth.py)" = 1

          ! git -C eden diff | grep -E '^\+.*(SetPriority\(|SetCoreMask\(|Reschedule\(|YieldTo\(|sleep_for|sleep_until|QueueBuffer\(|swap_interval|gpu_fence_behavior)'
          echo 'PASS: exact dc95 exclusive caller attribution remains observation-only'
