name: One-shot dispatch X1 exclusive caller

on:
  push:
    branches:
      - exp/x1-arm64-exclusive-caller-attribution
    paths:
      - '.github/workflows/oneshot-dispatch-exclusive-caller.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exactly one persistent ARM64 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-dc95-x1-address-arbiter-attribution.yml \
            --repo "${{ github.repository }}" \
            --ref "exp/x1-arm64-exclusive-caller-attribution"
