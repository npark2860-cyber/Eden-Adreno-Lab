name: Diagnose prior Stage K ARM failure log once

on:
  push:
    branches:
      - exp/x1-waker-stage-k-grandparent-depth
    paths:
      - .github/workflows/diagnose-stage-k-old-arm-log-once.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Extract first compiler diagnostic from prior ARM job
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OLD_JOB_ID: "99499336423"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/jobs/${OLD_JOB_ID}/logs" \
            -o old-job.log
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('old-job.log').read_text(errors='replace')
          text = re.sub(r'\x1b\[[0-9;?]*[ -/]*[@-~]', '', text)
          lines = text.splitlines()
          patterns = (
              re.compile(r'\berror:', re.I),
              re.compile(r'\bfatal error:', re.I),
              re.compile(r'^FAILED:', re.I),
              re.compile(r'\[-Werror(?:[=,][^\]]*)?\]', re.I),
          )
          hits = [i for i, line in enumerate(lines) if any(p.search(line) for p in patterns)]
          if not hits:
              print('NO_COMPILER_DIAGNOSTIC_MATCH')
              for line in lines[-200:]:
                  print(line)
              raise SystemExit(1)
          i = hits[0]
          lo = max(0, i - 20)
          hi = min(len(lines), i + 41)
          print(f'FIRST_DIAGNOSTIC_LINE_INDEX={i}')
          print('--- FIRST DIAGNOSTIC CONTEXT BEGIN ---')
          for line in lines[lo:hi]:
              print(line)
          print('--- FIRST DIAGNOSTIC CONTEXT END ---')
          PY