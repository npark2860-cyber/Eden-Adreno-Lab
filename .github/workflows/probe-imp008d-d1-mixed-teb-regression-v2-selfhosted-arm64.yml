name: Probe IMP-008D D1 Mixed TEB Regression V2

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp008d-d1-mixed-teb-regression-v2-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp008d-d1-mixed-teb-regression-v2
  cancel-in-progress: false

jobs:
  d1-mixed-teb-regression-v2:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 15
    steps:
      - name: Prepare current-state D1 probe copy
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Test-Path 'eden/.git')) { throw 'retained eden checkout missing' }
          $head=(git -C eden rev-parse HEAD).Trim()
          if ($head -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31') { throw "unexpected retained head $head" }
          $transition=[IO.File]::ReadAllText((Resolve-Path 'eden/src/core/arm/nce/windows_nce_transition.cpp'))
          if (([regex]::Matches($transition,'IMP008B_E5_MIXED_TEB_LIMIT_AB')).Count -ne 1) { throw 'mixed TEB patch not retained exactly once' }
          if (-not $transition.Contains('StackLimit = host_stack_limit_before_guest;')) { throw 'host StackLimit A/B missing' }

          $src=(Resolve-Path 'eden/probes/windows-arm64-nce-fault-d1/data_fault_skip_runtime.cpp').Path
          $dst=(Join-Path (Resolve-Path 'eden').Path 'build/imp008d_d1_mixed_teb_v2.cpp')
          $text=[IO.File]::ReadAllText($src)
          $old=@'
    if (getter_literal_matches == 0) {
        process->Close(kernel);
        kernel.Shutdown();
        return Fail("IMP008D_D1_GENERATED_GETTER_REDIRECT");
    }

    // Patcher emits the shared save-context helper before load-context and module trampolines.
    // Redirect only the first getter literal, leaving every later generated helper untouched.
    Trace("IMP008D_D1_GENERATED_SAVE_GETTER_REDIRECT");
'@
          if (-not $text.Contains($old)) { throw 'stale getter diagnostic block not found exactly' }
          $new=@'
    if (getter_literal_matches == 0) {
        // Current retained Patcher no longer embeds this historical getter literal.
        // This was diagnostic-only and is not part of the D1 data-fault contract.
        Trace("IMP008D_D1_GENERATED_SAVE_GETTER_REDIRECT_NOT_REQUIRED");
    } else {
        Trace("IMP008D_D1_GENERATED_SAVE_GETTER_REDIRECT");
    }
'@
          $text=$text.Replace($old,$new)
          $utf8=New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($dst,$text,$utf8)
          Remove-Item 'eden/imp008d-d1-mixed-teb-v2.log','eden/imp008d-d1-mixed-teb-v2.out.log','eden/imp008d-d1-mixed-teb-v2.err.log','eden/imp008d-d1-mixed-teb-v2.rc','eden/imp008d-d1-mixed-teb-v2-link.log' -Force -ErrorAction SilentlyContinue
          Write-Host 'IMP008D_D1_MIXED_TEB_V2_PROBE_PREP=PASS'

      - name: Compile D1 probe copy
        shell: powershell
        working-directory: eden/build
        run: |
          $ErrorActionPreference='Stop'
          $commands=& 'C:\msys64\usr\bin\ninja.exe' -t commands imp008b_e5_x18_runtime
          if ($LASTEXITCODE -ne 0) { throw "ninja tool-mode rc=$LASTEXITCODE" }
          $hits=@($commands | Where-Object { (($_ -replace '\\','/')) -match " -c '?C:/.*?/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant\.cpp'?$" })
          if ($hits.Count -ne 1) { throw "E5 probe compile command count=$($hits.Count)" }
          $cmd=[string]$hits[0]
          $oldObj='src/yuzu_cmd/CMakeFiles/imp008b_e5_x18_runtime.dir/__/__/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp.obj'
          $newObj='src/yuzu_cmd/CMakeFiles/imp008d_d1_mixed_teb_v2.dir/data_fault_skip_runtime.cpp.obj'
          New-Item -ItemType Directory -Force 'src/yuzu_cmd/CMakeFiles/imp008d_d1_mixed_teb_v2.dir' | Out-Null
          $cmd=$cmd.Replace($oldObj,$newObj)
          $cmd=[regex]::Replace($cmd,'-MF\s+\S+\.obj\.d','-MF src\yuzu_cmd\CMakeFiles\imp008d_d1_mixed_teb_v2.dir\data_fault_skip_runtime.cpp.obj.d')
          $cmd=[regex]::Replace($cmd,"-c\s+'?C:/[^']*?/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant\.cpp'?",'-c C:/actions-runner/_work/Eden-Adreno-Lab/Eden-Adreno-Lab/eden/build/imp008d_d1_mixed_teb_v2.cpp')
          $cmd=$cmd.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64')
          $cmd=$cmd.Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64')
          $cmd=$cmd.Replace('C:\msys64\clangarm64\bin\sccache.exe ','')
          $cmd=$cmd.Replace('C:/msys64/clangarm64/bin/sccache.exe ','')
          $cmd=[regex]::Replace($cmd,"'(C:/[^']+)'",'$1')
          & $env:ComSpec /D /S /C $cmd
          $rc=$LASTEXITCODE
          Write-Host "IMP008D_D1_MIXED_TEB_V2_COMPILE_RC=$rc"
          if ($rc -ne 0) { throw "D1 compile failed rc=$rc" }

      - name: Link D1 using retained library closure
        shell: powershell
        working-directory: eden/build
        run: |
          $ErrorActionPreference='Stop'
          $commands=& 'C:\msys64\usr\bin\ninja.exe' -t commands imp008b_e5_x18_runtime
          $hits=@($commands | Where-Object { $_ -match '-o bin\\imp008b_e5_x18_runtime\.exe' })
          if ($hits.Count -ne 1) { throw "E5 link command count=$($hits.Count)" }
          $cmd=[string]$hits[0]
          $cmd=$cmd.Replace('src/yuzu_cmd/CMakeFiles/imp008b_e5_x18_runtime.dir/__/__/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp.obj','src/yuzu_cmd/CMakeFiles/imp008d_d1_mixed_teb_v2.dir/data_fault_skip_runtime.cpp.obj')
          $cmd=$cmd.Replace('bin\imp008b_e5_x18_runtime.exe','bin\imp008d_d1_mixed_teb_v2.exe')
          $cmd=$cmd.Replace('src\yuzu_cmd\libimp008b_e5_x18_runtime.a','src\yuzu_cmd\libimp008d_d1_mixed_teb_v2.a')
          $cmd=$cmd.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64')
          $cmd=$cmd.Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64')
          & $env:ComSpec /D /S /C $cmd 2>&1 | Tee-Object -FilePath '..\imp008d-d1-mixed-teb-v2-link.log'
          $rc=$LASTEXITCODE
          Write-Host "IMP008D_D1_MIXED_TEB_V2_LINK_RC=$rc"
          if ($rc -ne 0) { throw "D1 link failed rc=$rc" }

      - name: Run D1 data-fault regression exactly once
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference='Stop'
          $psi=New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName=(Resolve-Path 'build/bin/imp008d_d1_mixed_teb_v2.exe').Path
          $psi.WorkingDirectory=(Get-Location).Path
          $psi.UseShellExecute=$false
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          $p=New-Object System.Diagnostics.Process
          $p.StartInfo=$psi
          if (-not $p.Start()) { throw 'runtime start failed' }
          $ot=$p.StandardOutput.ReadToEndAsync()
          $et=$p.StandardError.ReadToEndAsync()
          $timeout=-not $p.WaitForExit(30000)
          if ($timeout) { $p.Kill(); $p.WaitForExit() }
          $out=$ot.Result
          $err=$et.Result
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'imp008d-d1-mixed-teb-v2.out.log'),$out)
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'imp008d-d1-mixed-teb-v2.err.log'),$err)
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'imp008d-d1-mixed-teb-v2.log'),$out+$err)
          if ($timeout) { $rc=124 } else { $rc=$p.ExitCode }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'imp008d-d1-mixed-teb-v2.rc'),[string]$rc)
          Write-Host $out
          Write-Host $err
          Write-Host ('IMP008D_D1_MIXED_TEB_V2_RUNTIME_RC={0} (0x{1:X8})' -f $rc,($rc -band 0xffffffffL))

      - name: Classify D1 V2 result
        if: always()
        shell: powershell
        run: |
          if (-not (Test-Path 'eden/imp008d-d1-mixed-teb-v2.log')) { Write-Host 'IMP008D_D1_MIXED_TEB_V2_RUNTIME=NOT_REACHED'; exit 0 }
          $text=Get-Content 'eden/imp008d-d1-mixed-teb-v2.log' -Raw
          Get-Content 'eden/imp008d-d1-mixed-teb-v2.log' | Select-String -Pattern 'IMP008D_D1_(GENERATED_SAVE_GETTER_REDIRECT|PRE_RUNTHREAD|RUNTHREAD_RETURNED|DATA_AV|SUPERVISOR_CALL_RETURN|SVC_NUMBER|SKIP_PC_EXACT|CONTEXT_COHERENT|PHYSICAL_X18_TEB_AFTER|GATE|FAIL)|IMP008B_E5_EXCEPTION_CODE|IMP008B_E2_RESTORE_CONTEXT'
          if ($text.Contains('IMP008D_D1_GATE=PASS')) {
            Write-Host 'IMP008D_D1_MIXED_TEB_V2_REGRESSION=PASS'
          } else {
            Write-Host 'IMP008D_D1_MIXED_TEB_V2_REGRESSION=FAIL_OR_INCOMPLETE'
          }
          if (Test-Path 'eden/imp008d-d1-mixed-teb-v2.rc') { Write-Host ('IMP008D_D1_MIXED_TEB_V2_RAW_RC=' + (Get-Content 'eden/imp008d-d1-mixed-teb-v2.rc' -Raw).Trim()) }

      - name: Upload D1 V2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imp008d-d1-mixed-teb-regression-v2
          path: |
            eden/imp008d-d1-mixed-teb-v2-link.log
            eden/imp008d-d1-mixed-teb-v2.log
            eden/imp008d-d1-mixed-teb-v2.out.log
            eden/imp008d-d1-mixed-teb-v2.err.log
            eden/imp008d-d1-mixed-teb-v2.rc
            eden/imp008d-d1-first-exception.bin
          if-no-files-found: warn
