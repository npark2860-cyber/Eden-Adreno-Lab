name: Probe IMP-008E E1 Rasterizer Cache Protection

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - '.github/workflows/probe-imp-008e-e1-rasterizer-cache-protection-arm64.yml'
      - 'probes/windows-arm64-nce-rasterizer-e1/cache_protection_cycle.cpp'

permissions:
  contents: read

jobs:
  e1-rasterizer-cache-protection:
    runs-on: windows-11-arm
    timeout-minutes: 120

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout IMP-008E branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Checkout fixed dc95-era Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Verify E1 probe-only scope
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          base='712b8baff2a60ace56ffb11807d346baaec4ceb7'
          git cat-file -e "$base^{commit}"
          if ! git diff --quiet "$base" HEAD -- src/common src/core src/video_core CMakeLists.txt; then
            echo 'IMP008E_E1_PRODUCTION_SCOPE=FAIL' >&2
            git diff --stat "$base" HEAD -- src/common src/core src/video_core CMakeLists.txt >&2
            exit 71
          fi
          probe='probes/windows-arm64-nce-rasterizer-e1/cache_protection_cycle.cpp'
          test -f "$probe"
          grep -Fq 'use_reactive_flushing.SetValue(true)' "$probe"
          grep -Fq 'MaxwellDeviceMemoryManager' "$probe"
          grep -Fq 'RegisterProcess(&process_memory)' "$probe"
          grep -Fq 'UpdatePagesCachedCount(DeviceAddress, PageSize, +1)' "$probe"
          grep -Fq 'UpdatePagesCachedCount(DeviceAddress, PageSize, -1)' "$probe"
          grep -Fq 'PAGE_NOACCESS' "$probe"
          grep -Fq 'PAGE_READWRITE' "$probe"
          grep -Fq 'IMP008E_E1_GATE' "$probe"
          echo 'IMP008E_E1_PRODUCTION_SCOPE=PASS'

      - name: Add E1 target to checkout only
        shell: bash
        working-directory: eden
        run: |
          cat >> src/yuzu_cmd/CMakeLists.txt <<'CMAKE'

          file(WRITE "${CMAKE_BINARY_DIR}/imp008e_e1_vma.cpp"
              "#define VMA_IMPLEMENTATION\n#include \"video_core/vulkan_common/vma.h\"\n")
          add_executable(imp008e_e1_rasterizer_cache_protection
              ${CMAKE_SOURCE_DIR}/probes/windows-arm64-nce-rasterizer-e1/cache_protection_cycle.cpp
              ${CMAKE_BINARY_DIR}/imp008e_e1_vma.cpp)
          target_include_directories(imp008e_e1_rasterizer_cache_protection PRIVATE ${CMAKE_SOURCE_DIR}/src)
          target_link_libraries(imp008e_e1_rasterizer_cache_protection PRIVATE
              common core input_common frontend_common video_core merry::oaknut)
          target_link_libraries(imp008e_e1_rasterizer_cache_protection PRIVATE
              ${PLATFORM_LIBRARIES} Threads::Threads)
          CMAKE
          echo 'IMP008E_E1_TARGET_WIRING=PASS'

      - name: Set up normal Eden CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure normal Windows ARM64 product build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'arm_nce_windows.cpp' build/compile_commands.json
          grep -Fq 'host_memory.cpp' build/compile_commands.json
          grep -Fq 'gpu_device_memory_manager.cpp' build/compile_commands.json
          grep -Fq 'windows-arm64-nce-rasterizer-e1/cache_protection_cycle.cpp' build/compile_commands.json
          echo 'IMP008E_E1_NORMAL_CONFIGURE=PASS'

      - name: Build E1 production-linked executable
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build --target imp008e_e1_rasterizer_cache_protection --parallel > imp008e-e1-build.log 2>&1
          cat imp008e-e1-build.log
          echo 'IMP008E_E1_BUILD=PASS'

      - name: Run E1 protection cycle with native exit capture
        shell: pwsh
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          $workdir = (Get-Location).Path
          $exe = Get-ChildItem -Path (Join-Path $workdir 'build') -Recurse -File -Filter 'imp008e_e1_rasterizer_cache_protection.exe' |
              Select-Object -First 1
          if ($null -eq $exe) {
            throw 'E1 executable not found'
          }

          $outPath = Join-Path $workdir 'imp008e-e1.out.log'
          $errPath = Join-Path $workdir 'imp008e-e1.err.log'
          $rcPath = Join-Path $workdir 'imp008e-e1.rc'
          $rcHexPath = Join-Path $workdir 'imp008e-e1.rc.hex'

          Write-Host "IMP008E_E1_NATIVE_EXE=$($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $workdir `
              -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $outPath `
              -RedirectStandardError $errPath

          $signed = [int]$p.ExitCode
          $unsigned = [BitConverter]::ToUInt32([BitConverter]::GetBytes($signed), 0)
          $hex = '0x{0:X8}' -f $unsigned
          [System.IO.File]::WriteAllText($rcPath, "$signed`n", [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText($rcHexPath, "$hex`n", [System.Text.UTF8Encoding]::new($false))

          if (Test-Path $outPath) { Get-Content $outPath }
          if (Test-Path $errPath) {
            Get-Content $errPath | ForEach-Object { [Console]::Error.WriteLine($_) }
          }
          Write-Host "IMP008E_E1_NATIVE_EXIT_SIGNED=$signed"
          Write-Host "IMP008E_E1_NATIVE_EXIT_HEX=$hex"
          Write-Host 'IMP008E_E1_RUNTIME_CAPTURE=PASS'

      - name: Classify E1 cache protection cycle
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          hex="$(tr -d '\r\n' < imp008e-e1.rc.hex)"
          echo "IMP008E_E1_CLASSIFY_NATIVE_RC_HEX=$hex"
          test "$hex" = '0x00000000'
          for marker in \
            IMP008E_E1_REAL_APPLICATION_PROCESS=PASS \
            IMP008E_E1_DIRECT_MAP=PASS \
            IMP008E_E1_DEVICE_PROCESS_REGISTERED=PASS \
            IMP008E_E1_DEVICE_MAPPING=PASS \
            IMP008E_E1_INITIAL_RW=PASS \
            IMP008E_E1_CACHE_APPLIED=PASS \
            IMP008E_E1_CACHED_NOACCESS=PASS \
            IMP008E_E1_CACHED_BACKING=PASS \
            IMP008E_E1_UNCACHE_APPLIED=PASS \
            IMP008E_E1_RECOVERED_RW=PASS \
            IMP008E_E1_READ_SENTINEL=PASS \
            IMP008E_E1_WRITE_READBACK=PASS \
            IMP008E_E1_GATE=PASS; do
            grep -Fq "$marker" imp008e-e1.out.log
          done
          grep -Fq 'IMP008E_E1_INITIAL_PROTECTION' imp008e-e1.err.log
          grep -Fq 'IMP008E_E1_CACHED_PROTECTION' imp008e-e1.err.log
          grep -Fq 'IMP008E_E1_RECOVERED_PROTECTION' imp008e-e1.err.log
          echo 'IMP008E_E1_CLASSIFICATION=GATE_PASS'

      - name: Persist IMP-008E E1 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imp008e-e1-rasterizer-cache-protection-${{ github.run_id }}
          path: |
            eden/imp008e-e1-build.log
            eden/imp008e-e1.out.log
            eden/imp008e-e1.err.log
            eden/imp008e-e1.rc
            eden/imp008e-e1.rc.hex
          if-no-files-found: warn
