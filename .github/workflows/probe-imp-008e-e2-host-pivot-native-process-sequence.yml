name: Probe IMP-008E E2 Host Pivot Native Process Sequence

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008e-e2-host-pivot-native-process-sequence.yml

permissions:
  actions: read
  contents: read

jobs:
  native-run-self-hosted:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 20
    steps:
      - name: Reuse exact direct-NtContinue artifact
        uses: actions/download-artifact@v5
        with:
          name: imp008e-e2-host-pivot-8fd5eb35084576fa87524e273133ab8284d75494
          path: e2
          repository: npark2860-cyber/Eden-Adreno-Lab
          run-id: 34435183862
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact artifact
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'ARM64') { throw 'Physical ARM64 runner boundary mismatch' }
          $exe = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e_e2_rasterizer_cached_retry.exe' | Select-Object -First 1
          $shaFile = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e-e2.source-sha.txt' | Select-Object -First 1
          if ($null -eq $exe -or $null -eq $shaFile) { throw 'Artifact incomplete' }
          $sourceSha = [System.IO.File]::ReadAllText($shaFile.FullName).Trim()
          $exeSha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          if ($sourceSha -ne '8fd5eb35084576fa87524e273133ab8284d75494') { throw "Unexpected source SHA: $sourceSha" }
          if ($exeSha -ne '76685085AD2564510D29B9941F8C23469A28902A3663DCB6B84AF2E8838DC89D') { throw "Unexpected exe SHA256: $exeSha" }
          Write-Host "IMP008E_E2_NATIVE_RUNNER=$env:RUNNER_NAME"
          Write-Host "IMP008E_E2_NATIVE_SOURCE_SHA=$sourceSha"
          Write-Host "IMP008E_E2_NATIVE_EXE_SHA256=$exeSha"
          Write-Host 'IMP008E_E2_NATIVE_ARTIFACT_BOUNDARY=PASS'

      - name: Run exact artifact without debugger via CreateProcessW
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path 'e2' -Recurse -File -Filter 'imp008e_e2_rasterizer_cached_retry.exe' | Select-Object -First 1
          if ($null -eq $exe) { throw 'E2 executable missing' }

          Add-Type -Language CSharp -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class NativeProcessRun {
              const uint WAIT_OBJECT_0 = 0;
              const uint WAIT_TIMEOUT = 258;

              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              struct STARTUPINFO {
                  public uint cb;
                  public string lpReserved;
                  public string lpDesktop;
                  public string lpTitle;
                  public uint dwX;
                  public uint dwY;
                  public uint dwXSize;
                  public uint dwYSize;
                  public uint dwXCountChars;
                  public uint dwYCountChars;
                  public uint dwFillAttribute;
                  public uint dwFlags;
                  public ushort wShowWindow;
                  public ushort cbReserved2;
                  public IntPtr lpReserved2;
                  public IntPtr hStdInput;
                  public IntPtr hStdOutput;
                  public IntPtr hStdError;
              }

              [StructLayout(LayoutKind.Sequential)]
              struct PROCESS_INFORMATION {
                  public IntPtr hProcess;
                  public IntPtr hThread;
                  public uint dwProcessId;
                  public uint dwThreadId;
              }

              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              static extern bool CreateProcessW(string lpApplicationName, StringBuilder lpCommandLine,
                  IntPtr lpProcessAttributes, IntPtr lpThreadAttributes, bool bInheritHandles,
                  uint dwCreationFlags, IntPtr lpEnvironment, string lpCurrentDirectory,
                  ref STARTUPINFO lpStartupInfo, out PROCESS_INFORMATION lpProcessInformation);

              [DllImport("kernel32.dll", SetLastError = true)]
              static extern uint WaitForSingleObject(IntPtr hHandle, uint dwMilliseconds);

              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool GetExitCodeProcess(IntPtr hProcess, out uint lpExitCode);

              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool TerminateProcess(IntPtr hProcess, uint uExitCode);

              [DllImport("kernel32.dll")]
              static extern bool CloseHandle(IntPtr hObject);

              public static int Run(string exePath) {
                  STARTUPINFO si = new STARTUPINFO();
                  si.cb = (uint)Marshal.SizeOf(typeof(STARTUPINFO));
                  PROCESS_INFORMATION pi;
                  var cmd = new StringBuilder("\"" + exePath + "\"");
                  string cwd = System.IO.Path.GetDirectoryName(exePath);
                  if (!CreateProcessW(exePath, cmd, IntPtr.Zero, IntPtr.Zero, true, 0, IntPtr.Zero, cwd, ref si, out pi))
                      throw new Win32Exception(Marshal.GetLastWin32Error(), "CreateProcessW failed");
                  try {
                      uint wait = WaitForSingleObject(pi.hProcess, 300000);
                      if (wait == WAIT_TIMEOUT) {
                          TerminateProcess(pi.hProcess, 124);
                          Console.WriteLine("IMP008E_E2_NATIVE_WAIT=TIMEOUT");
                          return 2;
                      }
                      if (wait != WAIT_OBJECT_0) {
                          Console.WriteLine("IMP008E_E2_NATIVE_WAIT=FAIL CODE=" + wait + " ERROR=" + Marshal.GetLastWin32Error());
                          return 3;
                      }
                      uint exitCode;
                      if (!GetExitCodeProcess(pi.hProcess, out exitCode))
                          throw new Win32Exception(Marshal.GetLastWin32Error(), "GetExitCodeProcess failed");
                      Console.WriteLine("IMP008E_E2_NATIVE_PROCESS_EXIT=0x" + exitCode.ToString("X8"));
                      return 0;
                  } finally {
                      if (pi.hThread != IntPtr.Zero) CloseHandle(pi.hThread);
                      if (pi.hProcess != IntPtr.Zero) CloseHandle(pi.hProcess);
                  }
              }
          }
          '@

          $rc = [NativeProcessRun]::Run($exe.FullName)
          Write-Host "IMP008E_E2_NATIVE_WRAPPER_RC=$rc"
          if ($rc -ne 0) { throw "Native process sequence capture failed with RC=$rc" }
