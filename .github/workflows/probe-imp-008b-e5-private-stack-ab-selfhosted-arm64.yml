name: Probe IMP-008B E5 Private Stack A-B Selfhosted ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-e5-private-stack-ab-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp-008b-e5-private-stack-ab-selfhosted-arm64
  cancel-in-progress: false

jobs:
  e5-private-stack-ab:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 60
    steps:
      - name: Verify retained E5 diagnostic workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'eden/.git')) { throw 'retained eden checkout missing' }
          $head = (git -C eden rev-parse HEAD).Trim()
          Write-Host "IMP008B_E5_PRIV_WORKSPACE_HEAD=$head"
          if ($head -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31') { throw "unexpected retained E5 workspace HEAD: $head" }
          $runtime = 'eden/src/core/arm/nce/arm_nce_windows.cpp'
          if (-not (Select-String -Path $runtime -SimpleMatch 'IMP008B_E5_AB_HISTORICAL_RUNTHREAD=PASS' -Quiet)) { throw 'historical RunThread TEB bypass missing' }
          if (Select-String -Path $runtime -SimpleMatch 'InstallGuestTebStackBounds(m_guest_ctx.sp, teb_stack_bounds)' -Quiet) { throw 'early TEB publication unexpectedly active' }
          if (-not (Select-String -Path $runtime -SimpleMatch 'IMP008B_E5_GENERIC_VEH_ENTER=PASS' -Quiet)) { throw 'generic VEH observer missing' }
          Write-Host 'IMP008B_E5_PRIV_RETAINED_WORKSPACE=PASS'

      - name: Set up CLANGARM64 toolchain for incremental rebuild
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: false
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p
            toolchain:p clang:p python-pip:p lld:p openssl:p boost:p fmt:p lz4:p
            nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p
            glslang:p enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p
            xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p libwebp:p
            libtiff:p brotli:p

      - name: Apply private-stack single-variable A-B
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $transition = 'eden/src/core/arm/nce/windows_nce_transition.cpp'
          $probe = 'eden/probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp'
          git -C eden checkout -- 'src/core/arm/nce/windows_nce_transition.cpp' 'probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp'
          if ($LASTEXITCODE -ne 0) { throw 'failed to reset experiment files' }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $old = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $new = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $text = [IO.File]::ReadAllText($transition)
          if ($text.IndexOf($old) -lt 0) { throw 'transition anchor missing' }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($transition, $text, $utf8)
          $anchor = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('c3RkOjp1aW50NjRfdCBSZWFkUGh5c2ljYWxYMTgoKSB7CiAgICBzdGQ6OnVpbnQ2NF90IHZhbHVle307CiAgICBhc20gdm9sYXRpbGUoIm1vdiAlMCwgeDE4IiA6ICI9ciIodmFsdWUpKTsKICAgIHJldHVybiB2YWx1ZTsKfQo='))
          $helper = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $callOld = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('ICAgIGNvbnN0IHU2NCBndWVzdF9wYyA9IGxvYWRfYmFzZV91NjQgKyBHdWVzdENvZGVPZmZzZXQ7CiAgICBjb25zdCB1NjQgZ3Vlc3Rfc3AgPSBsb2FkX2Jhc2VfdTY0ICsgSW5pdGlhbEltYWdlU2l6ZSAtIDB4MjA7CiAgICBLZXJuZWw6OlN2Yzo6VGhyZWFkQ29udGV4dCBjb250ZXh0e307Cg=='))
          $callNew = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $text = [IO.File]::ReadAllText($probe)
          $text = $text.Replace('#include <cstddef>', "#include <array>`n#include <cstddef>`n#include <cstring>")
          if ($text.IndexOf($anchor) -lt 0) { throw 'probe helper anchor missing' }
          $text = $text.Replace($anchor, $helper)
          if ($text.IndexOf($callOld) -lt 0) { throw 'probe call anchor missing' }
          $text = $text.Replace($callOld, $callNew)
          [IO.File]::WriteAllText($probe, $text, $utf8)
          git -C eden diff --check -- 'src/core/arm/nce/windows_nce_transition.cpp' 'probes/windows-arm64-nce-runthread-e5/x18_runtime_invariant.cpp'
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          Write-Host 'IMP008B_E5_PRIV_PATCH=PASS'

      - name: Rebuild E5 target incrementally
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build --target imp008b_e5_x18_runtime --parallel
          test -f build/bin/imp008b_e5_x18_runtime.exe
          echo 'IMP008B_E5_PRIV_INCREMENTAL_BUILD=PASS'

      - name: Launch E5 private-stack A-B runtime
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -uo pipefail
          set +e
          timeout 30s build/bin/imp008b_e5_x18_runtime.exe > imp008b-e5-private.out.log 2> imp008b-e5-private.err.log
          rc=$?
          set -e
          printf '%s\n' "$rc" > imp008b-e5-private.rc
          cat imp008b-e5-private.out.log imp008b-e5-private.err.log > imp008b-e5-private.log 2>/dev/null || true
          cat imp008b-e5-private.log || true
          echo "IMP008B_E5_PRIV_LAUNCH_RC=$rc"

      - name: Classify E5 private-stack boundary
        if: always()
        shell: powershell
        working-directory: eden
        run: |
          if (-not (Test-Path 'imp008b-e5-private.log')) { throw 'private-stack runtime log missing' }
          Get-Content 'imp008b-e5-private.log' | Select-String -Pattern 'IMP008B_E5_(PRIVATE_STACK|PRIV_|GENERIC_VEH_|X18_VEH_|X18_TRYREDIRECT|RUNTHREAD_RETURNED|HALT_REASON|SVC_NUMBER|RETURN_CONTEXT|EXCEPTION_)|IMP008B_E2_'
          $private = Select-String -Path 'imp008b-e5-private.log' -SimpleMatch 'IMP008B_E5_PRIVATE_STACK_READY=PASS' -Quiet
          if (-not $private) { throw 'guest stack was not converted to MEM_PRIVATE' }
          $generic = Select-String -Path 'imp008b-e5-private.log' -SimpleMatch 'IMP008B_E5_GENERIC_VEH_ENTER=PASS' -Quiet
          $x18 = Select-String -Path 'imp008b-e5-private.log' -SimpleMatch 'IMP008B_E5_X18_VEH_ENTER=PASS' -Quiet
          $returned = Select-String -Path 'imp008b-e5-private.log' -SimpleMatch 'IMP008B_E5_RUNTHREAD_RETURNED=PASS' -Quiet
          if ($generic) { Write-Host 'IMP008B_E5_PRIV_GENERIC_VEH=PASS' } else { Write-Host 'IMP008B_E5_PRIV_GENERIC_VEH=NO_ENTRY' }
          if ($x18) { Write-Host 'IMP008B_E5_PRIV_X18_VEH=PASS' } else { Write-Host 'IMP008B_E5_PRIV_X18_VEH=NO_ENTRY' }
          if ($returned) { Write-Host 'IMP008B_E5_PRIV_RUNTHREAD_RETURNED=PASS' } else { Write-Host 'IMP008B_E5_PRIV_RUNTHREAD_RETURNED=NO' }

      - name: Upload E5 private-stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-private-stack-ab-selfhosted
          path: |
            eden/imp008b-e5-private.log
            eden/imp008b-e5-private.out.log
            eden/imp008b-e5-private.err.log
            eden/imp008b-e5-private.rc
          if-no-files-found: warn
