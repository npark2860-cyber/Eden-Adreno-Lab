name: Probe IMP-008D D1 Mixed TEB Regression V3

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp008d-d1-mixed-teb-regression-v3-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp008d-d1-mixed-teb-regression-v3
  cancel-in-progress: false

jobs:
  d1-mixed-teb-regression-v3:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 15
    steps:
      - name: Build and run current-state D1 once
        shell: powershell
        run: |
          $script=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          Invoke-Expression $script

      - name: Upload D1 V3 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imp008d-d1-mixed-teb-regression-v3
          path: |
            eden/imp008d-d1-mixed-teb-v3-link.log
            eden/imp008d-d1-mixed-teb-v3.log
            eden/imp008d-d1-mixed-teb-v3.out.log
            eden/imp008d-d1-mixed-teb-v3.err.log
            eden/imp008d-d1-mixed-teb-v3.rc
            eden/imp008d-d1-first-exception.bin
          if-no-files-found: warn
