name: Build dc95 X1 GPU Submit Gap Attribution

on:
  workflow_dispatch:
  push:
    branches:
      - exp/x1-gpu-submit-gap-attribution
    paths:
      - '.github/x1-gpu-submit-gap-authorized-build.trigger'

concurrency:
  group: dc95-x1-gpu-submit-gap-attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: dc95 ARM64 / X1 GPU submit gap attribution
    runs-on: windows-11-arm
    timeout-minutes: 180

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard

    steps:
      - name: Checkout Adreno Lab
        uses: actions/checkout@v7
        with:
          path: lab
          fetch-depth: 0

      - name: Checkout Eden CI workflow used by dc95-era nightlies
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Checkout exact known-good Eden source
        uses: actions/checkout@v7
        with:
          repository: eden-emulator/mirror
          ref: dc95cd09eea9749250fe31a3072684d341d19417
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact dc95 checkout
        shell: bash
        run: |
          set -e
          test "$(git -C eden rev-parse HEAD)" = "dc95cd09eea9749250fe31a3072684d341d19417"

      - name: Install dc95-era Eden CI scripts
        shell: bash
        run: |
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Prepare compile-validated P0.2 non-scheduler patches
        shell: bash
        run: |
          set -e
          mkdir -p profiler-patches
          BASE=a845b6eafe39faf0b9dd038639a5db385cf9d08f
          for f in \
            src/video_core/renderer_vulkan/vk_buffer_cache.cpp \
            src/video_core/renderer_vulkan/vk_compute_pipeline.cpp \
            src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp \
            src/video_core/renderer_vulkan/vk_staging_buffer_pool.cpp \
            src/video_core/renderer_vulkan/vk_update_descriptor.cpp; do
            out="profiler-patches/$(basename "$f").patch"
            git -C lab diff --binary "$BASE" HEAD -- "$f" > "$out"
            test -s "$out"
          done
          cp lab/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp eden/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp
          cp lab/src/video_core/renderer_vulkan/vk_adreno_profiler.h eden/src/video_core/renderer_vulkan/vk_adreno_profiler.h

      - name: Apply P0.2 non-scheduler source hooks
        shell: bash
        working-directory: eden
        run: |
          set -e
          for p in \
            ../profiler-patches/vk_buffer_cache.cpp.patch \
            ../profiler-patches/vk_compute_pipeline.cpp.patch \
            ../profiler-patches/vk_graphics_pipeline.cpp.patch \
            ../profiler-patches/vk_staging_buffer_pool.cpp.patch \
            ../profiler-patches/vk_update_descriptor.cpp.patch; do
            git apply --ignore-whitespace "$p"
          done

      - name: Recreate complete current X1 diagnostic chain
        shell: bash
        run: |
          set -e
          python lab/tools/adreno_lab/transplant_dc95_descriptor_ring_profiler.py eden
          python lab/tools/adreno_lab/transplant_dc95_logging_checkboxes.py eden
          python lab/tools/adreno_lab/transplant_dc95_full_flow_hooks.py eden
          python lab/tools/adreno_lab/transplant_dc95_scheduler_flow_profiler.py eden/src/video_core/renderer_vulkan/vk_scheduler.cpp
          python lab/tools/adreno_lab/finalize_dc95_full_flow_profiler.py eden
          python lab/tools/adreno_lab/transplant_dc95_draw_dispatch_correlation.py eden
          python lab/tools/adreno_lab/transplant_dc95_draw_dispatch_ab_controls.py eden
          python lab/tools/adreno_lab/transplant_dc95_draw_other_reasons.py eden
          python lab/tools/adreno_lab/transplant_dc95_texture_fill_reasons.py eden
          python lab/tools/adreno_lab/transplant_dc95_alias_copy_reasons.py eden
          python lab/tools/adreno_lab/transplant_dc95_alias_sync_redundancy.py eden
          python lab/tools/adreno_lab/transplant_dc95_uniform_stream_reuse.py eden
          python lab/tools/adreno_lab/transplant_dc95_uniform_payload_fingerprint.py eden
          python lab/tools/adreno_lab/transplant_dc95_uniform_cache_ab.py eden
          python lab/tools/adreno_lab/transplant_dc95_frame_cadence_attribution.py eden
          python lab/tools/adreno_lab/transplant_dc95_swap_interval_3_to_2_ab.py eden
          python lab/tools/adreno_lab/transplant_dc95_diagnostic_harness.py eden

      - name: Recreate frame-build attribution layer
        shell: bash
        run: |
          set -e
          cp lab/src/video_core/renderer_vulkan/vk_x1_frame_build_profiler.h \
             eden/src/video_core/renderer_vulkan/vk_x1_frame_build_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_frame_build_attribution.py eden

      - name: Recreate GPU-command attribution layer
        shell: bash
        run: |
          set -e
          cp lab/src/video_core/x1_gpu_command_profiler.h eden/src/video_core/x1_gpu_command_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_gpu_command_attribution.py eden

      - name: Snapshot pre-GPU-submit state
        shell: bash
        run: |
          set -e
          python -m py_compile \
            lab/tools/adreno_lab/transplant_dc95_gpu_submit_gap_attribution.py \
            lab/tools/adreno_lab/analyze_x1_gpu_submit_gap_attribution.py \
            lab/tools/adreno_lab/transplant_dc95_gpu_command_attribution.py \
            lab/tools/adreno_lab/analyze_x1_gpu_command_attribution.py \
            lab/tools/adreno_lab/analyze_x1_frame_build_attribution.py \
            lab/tools/adreno_lab/analyze_x1_frame_cadence.py \
            lab/tools/adreno_lab/analyze_x1_dequeue_attribution.py

          test "$(git -C eden rev-parse HEAD)" = "dc95cd09eea9749250fe31a3072684d341d19417"
          git -C eden diff --check
          grep -q 'x1_gpu_command_attribution_log' eden/src/common/settings.h
          grep -q '\[X1-GPUCMD\]' eden/src/video_core/x1_gpu_command_profiler.h

          mkdir -p pre-gpusubmit/intended pre-gpusubmit/critical
          cp eden/src/common/settings.h pre-gpusubmit/intended/settings.h
          cp eden/src/yuzu/configuration/configure_debug.h pre-gpusubmit/intended/configure_debug.h
          cp eden/src/yuzu/configuration/configure_debug.cpp pre-gpusubmit/intended/configure_debug.cpp
          cp eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp pre-gpusubmit/intended/nvdrv_interface.cpp
          cp eden/src/core/hle/service/nvdrv/devices/nvhost_gpu.cpp pre-gpusubmit/intended/nvhost_gpu.cpp
          cp eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp pre-gpusubmit/intended/vk_rasterizer.cpp

          sha256sum eden/src/core/hle/service/nvnflinger/buffer_queue_producer.cpp > pre-gpusubmit/critical/producer.sha256
          sha256sum eden/src/core/hle/service/nvnflinger/hardware_composer.cpp > pre-gpusubmit/critical/composer.sha256
          sha256sum eden/src/core/hle/service/vi/conductor.cpp > pre-gpusubmit/critical/conductor.sha256
          sha256sum eden/src/video_core/gpu.cpp > pre-gpusubmit/critical/gpu.sha256
          sha256sum eden/src/video_core/gpu_thread.cpp > pre-gpusubmit/critical/gpu-thread.sha256
          sha256sum eden/src/video_core/control/scheduler.cpp > pre-gpusubmit/critical/control-scheduler.sha256
          sha256sum eden/src/video_core/dma_pusher.cpp > pre-gpusubmit/critical/dma-pusher.sha256
          sha256sum eden/src/video_core/renderer_vulkan/vk_swapchain.cpp > pre-gpusubmit/critical/swapchain.sha256
          sha256sum eden/src/video_core/renderer_vulkan/vk_scheduler.cpp > pre-gpusubmit/critical/vk-scheduler.sha256
          sha256sum eden/src/core/hle/service/nvdrv/devices/nvhost_ctrl.cpp > pre-gpusubmit/critical/nvhost-ctrl.sha256
          sha256sum eden/src/video_core/buffer_cache/buffer_cache.h > pre-gpusubmit/critical/buffer-cache.sha256
          sha256sum eden/src/video_core/renderer_vulkan/vk_buffer_cache.cpp > pre-gpusubmit/critical/vk-buffer-cache.sha256
          sha256sum eden/src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp > pre-gpusubmit/critical/vk-graphics-pipeline.sha256
          sha256sum eden/src/video_core/renderer_vulkan/vk_x1_frame_build_profiler.h > pre-gpusubmit/critical/frame-build-profiler.sha256
          sha256sum eden/src/video_core/x1_gpu_command_profiler.h > pre-gpusubmit/critical/gpu-command-profiler.sha256

      - name: Apply runtime-selectable GPU-submit-gap attribution
        shell: bash
        run: |
          set -e
          cp lab/src/video_core/x1_gpu_submit_profiler.h eden/src/video_core/x1_gpu_submit_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_gpu_submit_gap_attribution.py eden

      - name: Verify GPU-submit-gap attribution before configure
        shell: bash
        run: |
          set -e
          test "$(git -C eden rev-parse HEAD)" = "dc95cd09eea9749250fe31a3072684d341d19417"
          git -C eden diff --check

          grep -q 'x1_gpu_submit_gap_attribution_log' eden/src/common/settings.h
          grep -q 'X1 Log: GPU Submit Gap Attribution' eden/src/yuzu/configuration/configure_debug.cpp
          grep -q '\[X1-GPUSUBMIT\]' eden/src/video_core/x1_gpu_submit_profiler.h
          grep -q 'RecordServiceEntry' eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp
          grep -q 'RecordDeviceEntry' eden/src/core/hle/service/nvdrv/devices/nvhost_gpu.cpp
          grep -q 'RecordSubmitPushEntry' eden/src/core/hle/service/nvdrv/devices/nvhost_gpu.cpp
          grep -q 'X1GpuSubmitProfiler::Get().FrameEnd' eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp

          sha256sum -c pre-gpusubmit/critical/producer.sha256
          sha256sum -c pre-gpusubmit/critical/composer.sha256
          sha256sum -c pre-gpusubmit/critical/conductor.sha256
          sha256sum -c pre-gpusubmit/critical/gpu.sha256
          sha256sum -c pre-gpusubmit/critical/gpu-thread.sha256
          sha256sum -c pre-gpusubmit/critical/control-scheduler.sha256
          sha256sum -c pre-gpusubmit/critical/dma-pusher.sha256
          sha256sum -c pre-gpusubmit/critical/swapchain.sha256
          sha256sum -c pre-gpusubmit/critical/vk-scheduler.sha256
          sha256sum -c pre-gpusubmit/critical/nvhost-ctrl.sha256
          sha256sum -c pre-gpusubmit/critical/buffer-cache.sha256
          sha256sum -c pre-gpusubmit/critical/vk-buffer-cache.sha256
          sha256sum -c pre-gpusubmit/critical/vk-graphics-pipeline.sha256
          sha256sum -c pre-gpusubmit/critical/frame-build-profiler.sha256
          sha256sum -c pre-gpusubmit/critical/gpu-command-profiler.sha256

          check_count() {
            local before="$1" after="$2" token="$3"
            local b a
            b=$(grep -oF "$token" "$before" | wc -l | tr -d ' ')
            a=$(grep -oF "$token" "$after" | wc -l | tr -d ' ')
            test "$b" = "$a" || { echo "ERROR token count changed: $token $b -> $a" >&2; exit 1; }
          }

          check_count pre-gpusubmit/intended/nvdrv_interface.cpp eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp 'ctx.ReadBuffer(0)'
          check_count pre-gpusubmit/intended/nvdrv_interface.cpp eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp 'nvdrv->Ioctl1('
          check_count pre-gpusubmit/intended/nvdrv_interface.cpp eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp 'nvdrv->Ioctl2('
          check_count pre-gpusubmit/intended/nvhost_gpu.cpp eden/src/core/hle/service/nvdrv/devices/nvhost_gpu.cpp 'gpu.PushGPUEntries('
          check_count pre-gpusubmit/intended/nvhost_gpu.cpp eden/src/core/hle/service/nvdrv/devices/nvhost_gpu.cpp 'system.ApplicationMemory().ReadBlock('
          check_count pre-gpusubmit/intended/nvhost_gpu.cpp eden/src/core/hle/service/nvdrv/devices/nvhost_gpu.cpp 'std::memcpy('
          check_count pre-gpusubmit/intended/nvhost_gpu.cpp eden/src/core/hle/service/nvdrv/devices/nvhost_gpu.cpp 'std::scoped_lock lock(channel_mutex);'
          check_count pre-gpusubmit/intended/nvhost_gpu.cpp eden/src/core/hle/service/nvdrv/devices/nvhost_gpu.cpp 'syncpoint_manager.IsFenceSignalled('
          check_count pre-gpusubmit/intended/nvhost_gpu.cpp eden/src/core/hle/service/nvdrv/devices/nvhost_gpu.cpp 'syncpoint_manager.IncrementSyncpointMaxExt('

          {
            diff -u pre-gpusubmit/intended/settings.h eden/src/common/settings.h || true
            diff -u pre-gpusubmit/intended/configure_debug.h eden/src/yuzu/configuration/configure_debug.h || true
            diff -u pre-gpusubmit/intended/configure_debug.cpp eden/src/yuzu/configuration/configure_debug.cpp || true
            diff -u pre-gpusubmit/intended/nvdrv_interface.cpp eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp || true
            diff -u pre-gpusubmit/intended/nvhost_gpu.cpp eden/src/core/hle/service/nvdrv/devices/nvhost_gpu.cpp || true
            diff -u pre-gpusubmit/intended/vk_rasterizer.cpp eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp || true
          } > gpu-submit-only.diff
          test -s gpu-submit-only.diff

          if grep -E '^\+.*(sleep_for|sleep_until|item\.swap_interval[[:space:]]*=|m_swap_interval[[:space:]]*=|default_max_buffer_count[[:space:]]*=|override_max_buffer_count[[:space:]]*=|SetTarget|SpeedLimit|WaitForSyncOperation\()' gpu-submit-only.diff; then
            echo 'ERROR: behavior-changing timing/queue policy leaked into GPU-submit attribution diff' >&2
            exit 1
          fi

          git -C eden status --short

      - name: Set up MSYS2 CLANGARM64 exactly like Eden Nightly
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure dc95 ARM64 standard build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: ./.ci/build/configure.sh -DCCACHE_PATH=sccache

      - name: Build dc95 ARM64 X1 GPU submit gap attribution
        shell: msys2 {0}
        working-directory: eden
        run: cmake --build build

      - name: Package with Eden CI Windows packager
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: dc95cd09ee-x1-gpu-submit-gap-attribution
          MSYS_TOOLCHAIN: CLANGARM64
        run: ./.ci/package/windows.sh

      - name: Add analyzers and metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force extras | Out-Null
          Copy-Item lab/tools/adreno_lab/analyze_x1_gpu_submit_gap_attribution.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_gpu_command_attribution.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_frame_build_attribution.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_frame_cadence.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_dequeue_attribution.py extras/ -Force
          @'
          Experiment: X1 exact-dc95 runtime-selectable GPU submission-gap attribution
          Exact Eden source: dc95cd09eea9749250fe31a3072684d341d19417
          Branch: exp/x1-gpu-submit-gap-attribution

          New control:
          - X1 Log: GPU Submit Gap Attribution

          Recommended first run:
          - GPU Submit Gap Attribution ON
          - GPU Command Attribution ON
          - Frame Build Attribution ON
          - Frame Cadence ON
          - Dequeue Attribution ON
          - all behavioral A/B controls OFF
          - Scheduler/Present/Pipeline/Upload/QCOM heavy logs OFF
          - Descriptor Ring OFF

          [X1-GPUSUBMIT] splits:
          - gaps between candidate NVDRV submit service entries
          - gaps between confirmed nvhost_gpu submit-device entries
          - gaps between actual PushGPUEntries calls made by SubmitGPFIFOImpl
          - NVDRV IPC buffer read / device dispatch / output write time
          - GPFIFO allocation/copy/read time
          - SubmitGPFIFOImpl channel-lock/init/fence/syncpoint/push time
          '@ | Set-Content -Encoding UTF8 extras/GPU_SUBMIT_GAP_ATTRIBUTION.txt

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-dc95-X1-gpu-submit-gap-attribution
          path: |
            eden/artifacts/*
            extras/*
          if-no-files-found: error
          retention-days: 14