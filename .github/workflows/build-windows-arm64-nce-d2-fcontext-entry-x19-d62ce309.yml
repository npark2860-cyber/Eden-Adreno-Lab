name: Build Windows ARM64 NCE D2 fcontext entry x19

on:
  push:
    branches:
      - diag/windows-nce-d2-fcontext-entry-x19-d62ce309
    paths:
      - .github/diagnostics/d2-fcontext-entry-x19-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-d2-fcontext-entry-x19-d62ce309
  cancel-in-progress: false

env:
  BASE_SHA: d62ce3094d3b9b58210c7841328de161d2a92292
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: d2-fcontext-entry-x19

jobs:
  build-package:
    name: Windows ARM64 NCE D2 fcontext entry x19
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact diagnostic Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/d2-fcontext-entry-x19/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify x19-observer-only scope
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$SOURCE" merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          git -C "$SOURCE" diff --check "$BASE_SHA" "$GITHUB_SHA"

          CHANGED="$(git -C "$SOURCE" diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(src/yuzu/main\.cpp|\.github/workflows/build-windows-arm64-nce-d2-fcontext-entry-x19-d62ce309\.yml|\.github/diagnostics/d2-fcontext-entry-x19-trigger\.txt)$' || true)"
          test -z "$UNEXPECTED"

          test -z "$(git -C "$SOURCE" diff "$BASE_SHA" "$GITHUB_SHA" --             src/core/arm/nce src/common/host_memory.cpp src/common/host_memory.h             src/common/host_memory_windows_lease.h src/core/hle/kernel/physical_core.cpp             src/core/hle/kernel/physical_core.h)"

          SRC="$(git -C "$SOURCE" show "$GITHUB_SHA:src/yuzu/main.cpp")"
          grep -Fq 'NCE_D2_FASTFAIL_DEBUG' <<<"$SRC"
          grep -Fq 'frame2_lr_module=' <<<"$SRC"
          grep -Fq 'NCE_D2_FCONTEXT_ENTRY_X19' <<<"$SRC"
          grep -Fq 'context->X[19]' <<<"$SRC"
          grep -Fq 'ResolveD2FastFailModule(parent_pid, x19)' <<<"$SRC"
          grep -Fq 'WriteWindowsNceD2FcontextEntryX19Line(' <<<"$SRC"

          git -C "$SOURCE" diff "$BASE_SHA" "$GITHUB_SHA" -- src/yuzu/main.cpp > "$PROV/D2_FCONTEXT_ENTRY_X19.diff"

          printf 'BASE_SHA=%s\nDIAG_SHA=%s\nSOURCE_MODE=exact Git object\nHYPOTHESIS=terminal C0000409 is reached from Boost.Context make_fcontext return trampoline; x19 is the restored fcontext entry pointer\nSCOPE=frontend observer only; runtime remains exact d62 base with both validated StackTop fixes\nCAPTURE=fast-fail x19 plus module/RVA/VirtualQuery provenance\n' "$BASE_SHA" "$GITHUB_SHA" > "$PROV/BUILD_INFO.txt"

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: ${{ env.CI_REF }}
          path: build/validation/${{ github.sha }}/d2-fcontext-entry-x19/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 base
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          cache: false

      - name: Install CLANGARM64 toolchain from pinned direct mirrors
        shell: msys2 {0}
        run: |
          set -euo pipefail

          cat > /etc/pacman.d/mirrorlist.mingw <<'EOF'
          Server = https://repo.msys2.org/mingw/$repo/
          Server = https://mirror.yandex.ru/mirrors/msys2/mingw/$repo/
          Server = https://mirror.accum.se/mirror/msys2.org/mingw/$repo/
          Server = https://ftp.nluug.nl/pub/os/windows/msys2/builds/mingw/$repo/
          EOF

          cat > /etc/pacman.d/mirrorlist.msys <<'EOF'
          Server = https://repo.msys2.org/msys/$arch/
          Server = https://mirror.yandex.ru/mirrors/msys2/msys/$arch/
          Server = https://mirror.accum.se/mirror/msys2.org/msys/$arch/
          Server = https://ftp.nluug.nl/pub/os/windows/msys2/builds/msys/$arch/
          EOF

          if ! grep -Eq '^[[:space:]]*DisableDownloadTimeout([[:space:]]|$)' /etc/pacman.conf; then
            printf '\nDisableDownloadTimeout\n' >> /etc/pacman.conf
          fi

          pacman --noconfirm -Syy
          pacman --noconfirm -S --needed --overwrite '*'             git make autoconf libtool automake-wrapper patch jq pactoys ninja

          pacboy --noconfirm -S --needed             qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p             openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p             enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p             libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-fcontext-entry-x19/source
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json

      - name: Build full Windows ARM64 Eden diagnostic
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-fcontext-entry-x19/source
        run: |
          set -euo pipefail
          cmake --build build

      - name: Package Windows ARM64 Eden diagnostic
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/d2-fcontext-entry-x19/source
        env:
          ARTIFACT_REF: nce-d2-fcontext-entry-x19
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh

      - name: Prepare upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force

      - name: Upload fcontext x19 diagnostic package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-D2-FCONTEXT-X19
          path: build/validation/${{ github.sha }}/d2-fcontext-entry-x19/upload/*
          if-no-files-found: error
          retention-days: 14
