name: Probe IMP-008B E5 Full CONTEXT Diff

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-e5-full-context-diff-selfhosted-arm64.yml

permissions:
  contents: read

concurrency:
  group: probe-imp-008b-e5-full-context-diff
  cancel-in-progress: false

jobs:
  e5-full-context-diff:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 15
    steps:
      - name: Verify retained E5 state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'eden/.git')) { throw 'retained eden checkout missing' }
          $head = (git -C eden rev-parse HEAD).Trim()
          if ($head -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31') { throw "unexpected retained head $head" }
          $status = @(git -C eden status --short)
          Write-Host ('IMP008B_E5_FULLCTX_RETAINED_HEAD=' + $head)
          Write-Host ('IMP008B_E5_FULLCTX_DIRTY_ENTRIES=' + $status.Count)
          $transition = [IO.File]::ReadAllText((Resolve-Path 'eden/src/core/arm/nce/windows_nce_transition.cpp'))
          $arm = [IO.File]::ReadAllText((Resolve-Path 'eden/src/core/arm/nce/arm_nce_windows.cpp'))
          foreach ($marker in @('IMP008B_E5_NT_RESOLVED_BEFORE_TEB=PASS','IMP008B_E5_NT_CONTINUE_RETURN_STATUS')) {
            if (-not $transition.Contains($marker)) { throw "missing retained transition marker $marker" }
          }
          foreach ($marker in @('IMP008B_E5_HOST_TEB_BOUNDS_AB','IMP008B_E5_AV_CONTINUE_EXECUTION_AB')) {
            if (-not $arm.Contains($marker)) { throw "missing retained ARM marker $marker" }
          }
          Remove-Item 'eden/imp008b-e5-fullctx.log','eden/imp008b-e5-fullctx.out.log','eden/imp008b-e5-fullctx.err.log','eden/imp008b-e5-fullctx.rc','eden/imp008b-e5-fullctx-diff.txt','eden/imp008b-e5-fullctx-link.log','eden/imp008b-e5-fullctx-commands.txt' -Force -ErrorAction SilentlyContinue
          Write-Host 'IMP008B_E5_FULLCTX_RETAINED_STATE=PASS'

      - name: Add full ARM64 CONTEXT dump only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'eden/src/core/arm/nce/windows_nce_transition.cpp'
          $diagPath = 'eden/src/core/arm/nce/windows_nce_fullctx_diag.inc'
          $resolved = (Resolve-Path $path).Path
          $diagResolved = Join-Path (Get-Location) $diagPath
          $diagB64 = ''
          [IO.File]::WriteAllBytes($diagResolved,[Convert]::FromBase64String($diagB64))
          $text = [IO.File]::ReadAllText($resolved)

          if (-not $text.Contains('#include "windows_nce_fullctx_diag.inc"')) {
            $nsPattern = '(?m)^namespace \{\r?\n'
            $nsMatches = [regex]::Matches($text,$nsPattern)
            if ($nsMatches.Count -ne 1) { throw "anonymous namespace anchor count=$($nsMatches.Count)" }
            $text = [regex]::Replace($text,$nsPattern,"namespace {`n#include `"windows_nce_fullctx_diag.inc`"`n",1)
          }

          if (-not $text.Contains('DumpImp008bE5FullArm64Context(context);')) {
            $statusPattern = '(?m)^    const LONG nt_continue_status =\r?\n        direct_nt_continue\(reinterpret_cast<PCONTEXT>\(&context\), FALSE\);'
            $statusMatches = [regex]::Matches($text,$statusPattern)
            if ($statusMatches.Count -eq 1) {
              $replacement = "    DumpImp008bE5FullArm64Context(context);`n    const LONG nt_continue_status =`n        direct_nt_continue(reinterpret_cast<PCONTEXT>(&context), FALSE);"
              $text = [regex]::Replace($text,$statusPattern,$replacement,1)
            } else {
              $directPattern = '(?m)^    direct_nt_continue\(reinterpret_cast<PCONTEXT>\(&context\), FALSE\);'
              $directMatches = [regex]::Matches($text,$directPattern)
              if ($directMatches.Count -ne 1) { throw "NtContinue call anchor status=$($statusMatches.Count) direct=$($directMatches.Count)" }
              $replacement = "    DumpImp008bE5FullArm64Context(context);`n    direct_nt_continue(reinterpret_cast<PCONTEXT>(&context), FALSE);"
              $text = [regex]::Replace($text,$directPattern,$replacement,1)
            }
          }

          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($resolved,$text,$utf8)
          $check = [IO.File]::ReadAllText($resolved)
          if (-not $check.Contains('#include "windows_nce_fullctx_diag.inc"')) { throw 'full context include missing' }
          if (-not $check.Contains('DumpImp008bE5FullArm64Context(context);')) { throw 'full context call missing' }
          Write-Host 'IMP008B_E5_FULLCTX_PATCH=PASS'

      - name: Extract direct commands read-only
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          $commands = & 'C:\msys64\usr\bin\ninja.exe' -C build -t commands imp008b_e5_x18_runtime
          if ($LASTEXITCODE -ne 0) { throw "ninja tool-mode rc=$LASTEXITCODE" }
          [IO.File]::WriteAllLines((Join-Path (Get-Location) 'imp008b-e5-fullctx-commands.txt'),[string[]]$commands)
          Write-Host 'IMP008B_E5_FULLCTX_COMMANDS=PASS'

      - name: Compile transition object
        shell: powershell
        working-directory: eden/build
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(Get-Content '../imp008b-e5-fullctx-commands.txt')
          $hits = @($lines | Where-Object { $_ -match " -c '?C:/[^']*windows_nce_transition\.cpp'?$" })
          if ($hits.Count -ne 1) { throw "transition command count=$($hits.Count)" }
          $cmd = [string]$hits[0]
          $cmd = $cmd.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64')
          $cmd = $cmd.Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64')
          $cmd = $cmd.Replace('C:\msys64\clangarm64\bin\sccache.exe ','')
          $cmd = $cmd.Replace('C:/msys64/clangarm64/bin/sccache.exe ','')
          $cmd = [regex]::Replace($cmd,"'(C:/[^']+)'",'$1')
          & $env:ComSpec /D /S /C $cmd
          $rc=$LASTEXITCODE
          Write-Host "IMP008B_E5_FULLCTX_TRANSITION_RC=$rc"
          if ($rc -ne 0) { throw "transition compile failed rc=$rc" }

      - name: Link E5 runtime
        shell: powershell
        working-directory: eden/build
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(Get-Content '../imp008b-e5-fullctx-commands.txt')
          $hits = @($lines | Where-Object { $_ -match '-o bin\\imp008b_e5_x18_runtime\.exe' })
          if ($hits.Count -ne 1) { throw "link command count=$($hits.Count)" }
          $cmd=[string]$hits[0]
          $cmd=$cmd.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64')
          $cmd=$cmd.Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64')
          & $env:ComSpec /D /S /C $cmd 2>&1 | Tee-Object -FilePath '../imp008b-e5-fullctx-link.log'
          $rc=$LASTEXITCODE
          Write-Host "IMP008B_E5_FULLCTX_LINK_RC=$rc"
          if ($rc -ne 0) { throw "link failed rc=$rc" }

      - name: Run E5 exactly once
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference='Stop'
          $psi=New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName=(Resolve-Path 'build/bin/imp008b_e5_x18_runtime.exe').Path
          $psi.WorkingDirectory=(Get-Location).Path
          $psi.UseShellExecute=$false
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          $p=New-Object System.Diagnostics.Process
          $p.StartInfo=$psi
          if (-not $p.Start()) { throw 'runtime start failed' }
          $ot=$p.StandardOutput.ReadToEndAsync(); $et=$p.StandardError.ReadToEndAsync()
          $timeout=-not $p.WaitForExit(30000)
          if ($timeout) { $p.Kill(); $p.WaitForExit() }
          $out=$ot.Result; $err=$et.Result
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'imp008b-e5-fullctx.out.log'),$out)
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'imp008b-e5-fullctx.err.log'),$err)
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'imp008b-e5-fullctx.log'),$out+$err)
          if ($timeout) { $rc=124 } else { $rc=$p.ExitCode }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'imp008b-e5-fullctx.rc'),[string]$rc)
          Write-Host $out
          Write-Host $err
          Write-Host ('IMP008B_E5_FULLCTX_RUNTIME_RC={0} (0x{1:X8})' -f $rc,($rc -band 0xffffffffL))

      - name: Diff restore context 1 vs 2
        if: always()
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference='Continue'
          if (-not (Test-Path 'imp008b-e5-fullctx.log')) { Write-Host 'IMP008B_E5_FULLCTX_RUNTIME=NOT_REACHED'; exit 0 }
          $lines = @(Get-Content 'imp008b-e5-fullctx.log')
          $begins = @($lines | Where-Object { $_ -match '^IMP008B_E5_FULLCTX_BEGIN SEQ=' })
          Write-Host ('IMP008B_E5_FULLCTX_SNAPSHOT_COUNT=' + $begins.Count)
          $report = New-Object System.Collections.Generic.List[string]
          $report.Add('IMP008B_E5_FULLCTX_DIFF_BEGIN')

          $b1 = $begins | Where-Object { $_ -match 'SEQ=1\b' } | Select-Object -First 1
          $b2 = $begins | Where-Object { $_ -match 'SEQ=2\b' } | Select-Object -First 1
          if ($null -eq $b1 -or $null -eq $b2) {
            Write-Host 'IMP008B_E5_FULLCTX_TWO_SNAPSHOTS=NO'
          } else {
            Write-Host 'IMP008B_E5_FULLCTX_TWO_SNAPSHOTS=PASS'
            foreach ($key in @('SIZE','FLAGS','CPSR','SP','PC','TEB_LIMIT','TEB_BASE')) {
              $m1=[regex]::Match($b1,"$key=([^ ]+)")
              $m2=[regex]::Match($b2,"$key=([^ ]+)")
              if ($m1.Groups[1].Value -ne $m2.Groups[1].Value) {
                $line = "DIFF $key #1=$($m1.Groups[1].Value) #2=$($m2.Groups[1].Value)"
                $report.Add($line)
                Write-Host ('IMP008B_E5_FULLCTX_' + $line)
              }
            }

            for ($i=0; $i -lt 31; $i++) {
              $reg=('X{0:D2}' -f $i)
              $l1=$lines | Where-Object { $_ -match "^IMP008B_E5_FULLCTX_REG SEQ=1 $reg=" } | Select-Object -First 1
              $l2=$lines | Where-Object { $_ -match "^IMP008B_E5_FULLCTX_REG SEQ=2 $reg=" } | Select-Object -First 1
              if ($l1 -and $l2) {
                $v1=($l1 -split '=',2)[1]
                $v2=($l2 -split '=',2)[1]
                if ($v1 -ne $v2) {
                  $line="DIFF $reg #1=$v1 #2=$v2"
                  $report.Add($line)
                  Write-Host ('IMP008B_E5_FULLCTX_' + $line)
                }
              }
            }

            $fp1=$lines | Where-Object { $_ -match '^IMP008B_E5_FULLCTX_FPSTATE SEQ=1 ' } | Select-Object -First 1
            $fp2=$lines | Where-Object { $_ -match '^IMP008B_E5_FULLCTX_FPSTATE SEQ=2 ' } | Select-Object -First 1
            foreach ($key in @('FPCR','FPSR')) {
              $m1=[regex]::Match($fp1,"$key=([^ ]+)")
              $m2=[regex]::Match($fp2,"$key=([^ ]+)")
              if ($m1.Groups[1].Value -ne $m2.Groups[1].Value) {
                $line="DIFF $key #1=$($m1.Groups[1].Value) #2=$($m2.Groups[1].Value)"
                $report.Add($line)
                Write-Host ('IMP008B_E5_FULLCTX_' + $line)
              }
            }

            for ($i=0; $i -lt 32; $i++) {
              $vr=('V{0:D2}' -f $i)
              $l1=$lines | Where-Object { $_ -match "^IMP008B_E5_FULLCTX_VREG SEQ=1 $vr" } | Select-Object -First 1
              $l2=$lines | Where-Object { $_ -match "^IMP008B_E5_FULLCTX_VREG SEQ=2 $vr" } | Select-Object -First 1
              if ($l1 -and $l2) {
                $v1=($l1 -replace '^IMP008B_E5_FULLCTX_VREG SEQ=1 ','')
                $v2=($l2 -replace '^IMP008B_E5_FULLCTX_VREG SEQ=2 ','')
                if ($v1 -ne $v2) {
                  $line="DIFF $vr #1=$v1 #2=$v2"
                  $report.Add($line)
                  Write-Host ('IMP008B_E5_FULLCTX_' + $line)
                }
              }
            }

            $r1=$lines | Where-Object { $_ -match '^IMP008B_E5_FULLCTX_RAW SEQ=1 HEX=' } | Select-Object -First 1
            $r2=$lines | Where-Object { $_ -match '^IMP008B_E5_FULLCTX_RAW SEQ=2 HEX=' } | Select-Object -First 1
            if ($r1 -and $r2) {
              $h1=($r1 -replace '^IMP008B_E5_FULLCTX_RAW SEQ=1 HEX=','').Trim()
              $h2=($r2 -replace '^IMP008B_E5_FULLCTX_RAW SEQ=2 HEX=','').Trim()
              $rawDiff=New-Object System.Collections.Generic.List[string]
              $bytes=[Math]::Min([int]($h1.Length/2),[int]($h2.Length/2))
              for ($i=0; $i -lt $bytes; $i++) {
                $a=$h1.Substring($i*2,2)
                $b=$h2.Substring($i*2,2)
                if ($a -ne $b) { $rawDiff.Add(('0x{0:X3}:{1}>{2}' -f $i,$a,$b)) }
              }
              $line='RAW_BYTE_DIFF_COUNT=' + $rawDiff.Count
              $report.Add($line)
              Write-Host ('IMP008B_E5_FULLCTX_' + $line)
              if ($rawDiff.Count -gt 0) {
                $line='RAW_BYTE_DIFFS=' + ($rawDiff -join ',')
                $report.Add($line)
                Write-Host ('IMP008B_E5_FULLCTX_' + $line)
              }
            }
          }

          $report.Add('IMP008B_E5_FULLCTX_DIFF_END')
          [IO.File]::WriteAllLines((Join-Path (Get-Location) 'imp008b-e5-fullctx-diff.txt'),[string[]]$report)
          Get-Content 'imp008b-e5-fullctx.log' | Select-String -Pattern 'IMP008B_E2_RESTORE_CONTEXT|IMP008B_E2_BEFORE_NT_CONTINUE|IMP008B_E5_EXCEPTION_|IMP008B_E5_RUNTHREAD_RETURNED|IMP008B_E5_SVC_NUMBER|IMP008B_E5_NT_CONTINUE_RETURN_STATUS'
          if (Test-Path 'imp008b-e5-fullctx.rc') { Write-Host ('IMP008B_E5_FULLCTX_RAW_RC=' + (Get-Content 'imp008b-e5-fullctx.rc' -Raw).Trim()) }

      - name: Upload full CONTEXT diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-full-context-diff
          path: |
            eden/imp008b-e5-fullctx-commands.txt
            eden/imp008b-e5-fullctx-link.log
            eden/imp008b-e5-fullctx.log
            eden/imp008b-e5-fullctx.out.log
            eden/imp008b-e5-fullctx.err.log
            eden/imp008b-e5-fullctx.rc
            eden/imp008b-e5-fullctx-diff.txt
          if-no-files-found: warn
