name: Build Windows ARM64 NCE X18 STP Memory Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/build-windows-arm64-nce-x18-stp-memory-diag.yml

permissions:
  contents: read

concurrency:
  group: windows-arm64-nce-x18-stp-memory-diag
  cancel-in-progress: false

jobs:
  build-package:
    name: Windows ARM64 NCE x18 STP memory diagnostic package
    runs-on: windows-11-arm
    timeout-minutes: 180

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO
      PROD_SHA: 1572c8c55508d67d4423e025ec30ad7f3d2f9291

    steps:
      - name: Checkout validated Eden NCE branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Verify production-equivalent source
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          git cat-file -e "$PROD_SHA^{commit}"
          git diff --quiet "$PROD_SHA" HEAD -- src/common src/core src/video_core CMakeLists.txt
          grep -Fq 'guest_sp_value <= allocation_base || guest_sp_value >= allocation_end' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'tib->StackLimit = reinterpret_cast<void*>(allocation_base);' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'tib->StackBase = reinterpret_cast<void*>(allocation_end);' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'const auto fallback = m_windows_x18_runner->Dispatch(' src/core/arm/nce/arm_nce_windows.cpp
          echo 'NCE_X18_STP_MEMORY_SOURCE_GUARD=PASS'

      - name: Inject validation-only STP memory diagnostics
        shell: pwsh
        working-directory: eden
        run: |
          @'
          from pathlib import Path

          path = Path("src/core/arm/nce/arm_nce_windows.cpp")
          text = path.read_text(encoding="utf-8")

          def replace_once(label, old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "range",
              """    const auto guest_sp_value = static_cast<std::uintptr_t>(guest_sp);\n    if (guest_sp_value <= allocation_base || guest_sp_value >= allocation_end) {\n        return false;\n    }\n""",
              """    const auto guest_sp_value = static_cast<std::uintptr_t>(guest_sp);\n    if (guest_sp_value <= allocation_base || guest_sp_value > allocation_end) {\n        return false;\n    }\n""")

          replace_once(
              "teb-write",
              """    auto* const tib = reinterpret_cast<NT_TIB*>(NtCurrentTeb());\n    bounds.tib = tib;\n    bounds.host_stack_base = tib->StackBase;\n    bounds.host_stack_limit = tib->StackLimit;\n    tib->StackLimit = reinterpret_cast<void*>(allocation_base);\n    tib->StackBase = reinterpret_cast<void*>(allocation_end);\n    return true;\n""",
              """    auto* const tib = reinterpret_cast<NT_TIB*>(NtCurrentTeb());\n    bounds.tib = tib;\n    bounds.host_stack_base = tib->StackBase;\n    bounds.host_stack_limit = tib->StackLimit;\n    static std::atomic<u32> diag_teb_counter{0};\n    if (diag_teb_counter.fetch_add(1, std::memory_order_relaxed) == 0) {\n        LOG_ERROR(Core_ARM,\n                  \"IMP008_REALGAME_DIAG TEB_PREENTRY_BYPASS guest_sp=0x{:016X} allocation_base=0x{:016X} allocation_end=0x{:016X}\",\n                  guest_sp, static_cast<u64>(allocation_base), static_cast<u64>(allocation_end));\n    }\n    return true;\n""")

          replace_once(
              "process-hook",
              """    auto* const thread_params = &thread->GetNativeExecutionParameters();\n    auto* const process = thread->GetOwnerProcess();\n\n""",
              """    auto* const thread_params = &thread->GetNativeExecutionParameters();\n    auto* const process = thread->GetOwnerProcess();\n    static std::atomic<u64> diag_run_counter{0};\n    const u64 diag_run_seq = diag_run_counter.fetch_add(1, std::memory_order_relaxed);\n    u64 diag_parser_object = 0;\n\n    if (diag_run_seq < 128 && m_guest_ctx.svc == 0x21 && m_guest_ctx.tpidrro_el0 != 0) {\n        u32 diag_tls[8]{};\n        const bool diag_tls_ok = process->GetMemory().ReadBlock(\n            Common::ProcessAddress{m_guest_ctx.tpidrro_el0}, diag_tls, sizeof(diag_tls));\n        LOG_ERROR(Core_ARM,\n                  \"IMP008_REALGAME_DIAG IPC_TLS_AFTER_SVC seq={} ok={} base=0x{:016X} w00={:08X} w01={:08X} w02={:08X} w03={:08X} w04={:08X} w05={:08X} w06={:08X} w07={:08X}\",\n                  diag_run_seq, diag_tls_ok, m_guest_ctx.tpidrro_el0, diag_tls[0], diag_tls[1],\n                  diag_tls[2], diag_tls[3], diag_tls[4], diag_tls[5], diag_tls[6], diag_tls[7]);\n    }\n\n""")

          replace_once(
              "guest-return",
              """        if (const auto it = post_handlers.find(m_guest_ctx.pc); it != post_handlers.end()) {\n            hr = static_cast<HaltReason>(NCE::WindowsNceEnterGuest(\n                &m_guest_ctx, reinterpret_cast<const void*>(it->second)));\n        } else {\n            hr = static_cast<HaltReason>(NCE::WindowsNceEnterGuestContext(&m_guest_ctx));\n        }\n\n        RestoreHostTebStackBounds(teb_stack_bounds);\n""",
              """        if (const auto it = post_handlers.find(m_guest_ctx.pc); it != post_handlers.end()) {\n            hr = static_cast<HaltReason>(NCE::WindowsNceEnterGuest(\n                &m_guest_ctx, reinterpret_cast<const void*>(it->second)));\n        } else {\n            hr = static_cast<HaltReason>(NCE::WindowsNceEnterGuestContext(&m_guest_ctx));\n        }\n\n        if (diag_parser_object != 0 &&\n            static_cast<u64>(hr) == static_cast<u64>(HaltReason::SupervisorCall) &&\n            m_guest_ctx.svc == 0x21) {\n            u32 diag_obj[8]{};\n            const bool diag_obj_ok = process->GetMemory().ReadBlock(\n                Common::ProcessAddress{diag_parser_object}, diag_obj, sizeof(diag_obj));\n            LOG_ERROR(Core_ARM,\n                      \"IMP008_REALGAME_DIAG PARSER_OBJECT_AT_SVC seq={} ok={} base=0x{:016X} svc_x0=0x{:016X} w00={:08X} w01={:08X} w02={:08X} w03={:08X} w04={:08X} w05={:08X} w06={:08X} w07={:08X}\",\n                      diag_run_seq, diag_obj_ok, diag_parser_object, m_guest_ctx.cpu_registers[0],\n                      diag_obj[0], diag_obj[1], diag_obj[2], diag_obj[3], diag_obj[4],\n                      diag_obj[5], diag_obj[6], diag_obj[7]);\n        }\n\n        RestoreHostTebStackBounds(teb_stack_bounds);\n""")

          replace_once(
              "fallback-dispatch",
              """        const auto fallback = m_windows_x18_runner->Dispatch(\n            static_cast<u64>(hr), thread, m_guest_ctx, post_handlers);\n        if (!fallback.handled) {\n            break;\n        }\n""",
              """        const bool diag_x18_return =\n            static_cast<u64>(hr) == NCE::WindowsX18FallbackTrap::ReturnMarker;\n        u32 diag_x18_instruction = 0;\n        bool diag_x18_instruction_found = false;\n        if (diag_x18_return) {\n            if (const auto instruction =\n                    NCE::WindowsX18FallbackTrap::FindOriginalInstruction(m_guest_ctx.pc, post_handlers)) {\n                diag_x18_instruction = *instruction;\n                diag_x18_instruction_found = true;\n            }\n        }\n\n        const bool diag_stp = diag_x18_instruction_found && diag_x18_instruction == 0x2901C811;\n        u64 diag_stp_base = 0;\n        if (diag_stp) {\n            diag_stp_base = m_guest_ctx.cpu_registers[0];\n            diag_parser_object = diag_stp_base;\n            u32 diag_obj[8]{};\n            const bool diag_obj_ok = process->GetMemory().ReadBlock(\n                Common::ProcessAddress{diag_stp_base}, diag_obj, sizeof(diag_obj));\n            LOG_ERROR(Core_ARM,\n                      \"IMP008_REALGAME_DIAG PARSER_STP_PRE seq={} ok={} base=0x{:016X} w17={:08X} w18={:08X} w00={:08X} w01={:08X} w02={:08X} w03={:08X} w04={:08X} w05={:08X} w06={:08X} w07={:08X}\",\n                      diag_run_seq, diag_obj_ok, diag_stp_base,\n                      static_cast<u32>(m_guest_ctx.cpu_registers[17]),\n                      static_cast<u32>(m_guest_ctx.cpu_registers[18]),\n                      diag_obj[0], diag_obj[1], diag_obj[2], diag_obj[3], diag_obj[4],\n                      diag_obj[5], diag_obj[6], diag_obj[7]);\n        }\n\n        const auto fallback = m_windows_x18_runner->Dispatch(\n            static_cast<u64>(hr), thread, m_guest_ctx, post_handlers);\n\n        if (diag_stp) {\n            u32 diag_obj[8]{};\n            const bool diag_obj_ok = process->GetMemory().ReadBlock(\n                Common::ProcessAddress{diag_stp_base}, diag_obj, sizeof(diag_obj));\n            LOG_ERROR(Core_ARM,\n                      \"IMP008_REALGAME_DIAG PARSER_STP_POST seq={} ok={} base=0x{:016X} w00={:08X} w01={:08X} w02={:08X} w03={:08X} w04={:08X} w05={:08X} w06={:08X} w07={:08X}\",\n                      diag_run_seq, diag_obj_ok, diag_stp_base,\n                      diag_obj[0], diag_obj[1], diag_obj[2], diag_obj[3], diag_obj[4],\n                      diag_obj[5], diag_obj[6], diag_obj[7]);\n        }\n\n        if (!fallback.handled) {\n            break;\n        }\n""")

          path.write_text(text, encoding="utf-8")
          for marker in ["TEB_PREENTRY_BYPASS", "IPC_TLS_AFTER_SVC", "PARSER_STP_PRE", "PARSER_STP_POST", "PARSER_OBJECT_AT_SVC"]:
              if f"IMP008_REALGAME_DIAG {marker}" not in text:
                  raise SystemExit(f"missing marker {marker}")
          if "guest_sp_value >= allocation_end" in text:
              raise SystemExit("old inclusive upper-bound rejection still present")
          if "tib->StackLimit = reinterpret_cast<void*>(allocation_base);" in text:
              raise SystemExit("guest TEB StackLimit overwrite still present")
          if "tib->StackBase = reinterpret_cast<void*>(allocation_end);" in text:
              raise SystemExit("guest TEB StackBase overwrite still present")
          print("NCE_X18_STP_MEMORY_DIAG_INJECTION=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'x18 STP memory diagnostic injection failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          Write-Host 'NCE_X18_STP_MEMORY_DIAG_PATCH=PASS'

      - name: Checkout fixed dc95-era Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Set up normal Eden CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure Windows ARM64 GUI build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'IMP008_REALGAME_DIAG PARSER_STP_PRE' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'IMP008_REALGAME_DIAG PARSER_STP_POST' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'IMP008_REALGAME_DIAG PARSER_OBJECT_AT_SVC' src/core/arm/nce/arm_nce_windows.cpp
          echo 'NCE_X18_STP_MEMORY_DIAG_CONFIGURE=PASS'

      - name: Build full Windows ARM64 Eden GUI
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe || {
            echo 'GUI executable not found after full build' >&2
            find build -maxdepth 4 -iname '*.exe' -print
            exit 41
          }
          echo 'NCE_X18_STP_MEMORY_DIAG_BUILD=PASS'

      - name: Package Windows ARM64 Eden
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: nce-x18-stp-memory-${{ github.sha }}
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          find artifacts -maxdepth 2 -type f -print
          echo 'NCE_X18_STP_MEMORY_DIAG_PACKAGE=PASS'

      - name: Verify single-file package upload boundary
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path eden/artifacts -File)
          Write-Host "Package files found: $($files.Count)"
          $files | ForEach-Object { Write-Host $_.FullName }
          if ($files.Count -ne 1) { throw "Expected exactly one packaged file; found $($files.Count)" }
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item -LiteralPath $files[0].FullName -Destination upload/ -Force
          $upload = @(Get-ChildItem -Path upload -File)
          if ($upload.Count -ne 1) { throw "Expected exactly one upload file; found $($upload.Count)" }
          Write-Host 'NCE_X18_STP_MEMORY_DIAG_SINGLE_FILE_UPLOAD_BOUNDARY=PASS'

      - name: Upload Windows ARM64 NCE x18 STP memory diagnostic package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-X18-STP-MEMORY-${{ github.sha }}
          archive: false
          path: upload/*
          if-no-files-found: error
          retention-days: 14
