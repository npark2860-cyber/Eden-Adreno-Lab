name: Probe IMP-008B E5 Mixed TEB Limit A/B

on:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008b-e5-mixed-teb-limit-ab-selfhosted-arm64.yml

jobs:
  e5-mixed-teb-limit-ab:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 10
    steps:
      - name: Verify retained state
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Test-Path 'eden/.git')) { throw 'retained eden checkout missing' }
          $head=(git -C eden rev-parse HEAD).Trim()
          if ($head -ne '38ffd8f36f797c487e3e88ec7dbe4cac327a2c31') { throw "unexpected retained head $head" }
          $transitionPath='eden/src/core/arm/nce/windows_nce_transition.cpp'
          $armPath='eden/src/core/arm/nce/arm_nce_windows.cpp'
          foreach ($path in @($transitionPath,$armPath)) { if (-not (Test-Path $path)) { throw "missing $path" } }
          $transition=[IO.File]::ReadAllText((Resolve-Path $transitionPath))
          $arm=[IO.File]::ReadAllText((Resolve-Path $armPath))
          if (-not $transition.Contains('Imp008bE5CaptureFullContext(context);')) { throw 'full-context retained state missing' }
          if (-not $transition.Contains('reinterpret_cast<NT_TIB*>(teb)->StackLimit = reinterpret_cast<PVOID>(stack_limit);')) { throw 'guest StackLimit assignment missing' }
          if (-not $transition.Contains('reinterpret_cast<NT_TIB*>(teb)->StackBase = reinterpret_cast<PVOID>(stack_base);')) { throw 'guest StackBase assignment missing' }
          if (-not $arm.Contains('IMP008B_E5_HOST_TEB_BOUNDS_AB')) { throw 'x18 host TEB restore retained state missing' }
          if ($transition.Contains('IMP008B_E5_MIXED_TEB_LIMIT_AB')) { throw 'mixed TEB A/B already applied' }
          Remove-Item 'imp008b-e5-mixed-teb.log','imp008b-e5-mixed-teb.out.log','imp008b-e5-mixed-teb.err.log','imp008b-e5-mixed-teb.rc','imp008b-e5-mixed-teb-link.log','imp008b-e5-mixed-teb-commands.txt' -Force -ErrorAction SilentlyContinue
          Write-Host ('IMP008B_E5_MIXED_TEB_RETAINED_HEAD=' + $head)
          Write-Host ('IMP008B_E5_MIXED_TEB_DIRTY_ENTRIES=' + @((git -C eden status --short)).Count)
          Write-Host 'IMP008B_E5_MIXED_TEB_RETAINED_STATE=PASS'

      - name: Apply single StackLimit A/B variable
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path=(Resolve-Path 'eden/src/core/arm/nce/windows_nce_transition.cpp').Path
          $text=[IO.File]::ReadAllText($path)
          $needle='    reinterpret_cast<NT_TIB*>(teb)->StackLimit = reinterpret_cast<PVOID>(stack_limit);'
          if (([regex]::Matches($text,[regex]::Escape($needle))).Count -ne 1) { throw 'guest StackLimit assignment count mismatch' }
          $replacement=@'
    // IMP008B_E5_MIXED_TEB_LIMIT_AB: keep the live host StackLimit while NtContinue still
    // executes host-side stack-probe code; retain the existing guest StackBase publication.
    reinterpret_cast<NT_TIB*>(teb)->StackLimit = host_stack_limit_before_guest;
'@
          $text=$text.Replace($needle,$replacement.TrimEnd("`r","`n"))
          $utf8=New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($path,$text,$utf8)
          $verify=[IO.File]::ReadAllText($path)
          if (([regex]::Matches($verify,'IMP008B_E5_MIXED_TEB_LIMIT_AB')).Count -ne 1) { throw 'A/B marker count mismatch' }
          if ($verify.Contains($needle)) { throw 'old guest StackLimit assignment still present' }
          if (-not $verify.Contains('reinterpret_cast<NT_TIB*>(teb)->StackBase = reinterpret_cast<PVOID>(stack_base);')) { throw 'guest StackBase assignment changed unexpectedly' }
          Write-Host 'IMP008B_E5_MIXED_TEB_PATCH=PASS'
          Write-Host 'IMP008B_E5_MIXED_TEB_VARIABLE=host_StackLimit_plus_guest_StackBase'

      - name: Extract direct commands read-only
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference='Stop'
          $commands=& 'C:\msys64\usr\bin\ninja.exe' -C build -t commands imp008b_e5_x18_runtime
          if ($LASTEXITCODE -ne 0) { throw "ninja tool-mode rc=$LASTEXITCODE" }
          [IO.File]::WriteAllLines((Join-Path (Get-Location) '..\imp008b-e5-mixed-teb-commands.txt'),[string[]]$commands)
          Write-Host 'IMP008B_E5_MIXED_TEB_COMMANDS=PASS'

      - name: Compile transition object only
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference='Stop'
          $lines=@(Get-Content '..\imp008b-e5-mixed-teb-commands.txt')
          $hits=@($lines | Where-Object { (($_ -replace '\\','/')) -match " -c '?C:/.*?/src/core/arm/nce/windows_nce_transition\.cpp'?$" })
          if ($hits.Count -ne 1) { throw "transition command count=$($hits.Count)" }
          $cmd=[string]$hits[0]
          $cmd=$cmd.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64')
          $cmd=$cmd.Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64')
          $cmd=$cmd.Replace('C:\msys64\clangarm64\bin\sccache.exe ','')
          $cmd=$cmd.Replace('C:/msys64/clangarm64/bin/sccache.exe ','')
          $cmd=[regex]::Replace($cmd,"'(C:/[^']+)'",'$1')
          & $env:ComSpec /D /S /C $cmd
          $rc=$LASTEXITCODE
          Write-Host "IMP008B_E5_MIXED_TEB_COMPILE_RC=$rc"
          if ($rc -ne 0) { throw "transition compile failed rc=$rc" }

      - name: Link E5 runtime
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference='Stop'
          $lines=@(Get-Content '..\imp008b-e5-mixed-teb-commands.txt')
          $hits=@($lines | Where-Object { $_ -match '-o bin\\imp008b_e5_x18_runtime\.exe' })
          if ($hits.Count -ne 1) { throw "link command count=$($hits.Count)" }
          $cmd=[string]$hits[0]
          $cmd=$cmd.Replace('C:\actions-runner\_work\_temp\msys64\clangarm64','C:\msys64\clangarm64')
          $cmd=$cmd.Replace('C:/actions-runner/_work/_temp/msys64/clangarm64','C:/msys64/clangarm64')
          & $env:ComSpec /D /S /C $cmd 2>&1 | Tee-Object -FilePath '..\imp008b-e5-mixed-teb-link.log'
          $rc=$LASTEXITCODE
          Write-Host "IMP008B_E5_MIXED_TEB_LINK_RC=$rc"
          if ($rc -ne 0) { throw "link failed rc=$rc" }

      - name: Run E5 A/B exactly once
        shell: powershell
        working-directory: eden
        run: |
          $ErrorActionPreference='Stop'
          $psi=New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName=(Resolve-Path 'build/bin/imp008b_e5_x18_runtime.exe').Path
          $psi.WorkingDirectory=(Get-Location).Path
          $psi.UseShellExecute=$false
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          $p=New-Object System.Diagnostics.Process
          $p.StartInfo=$psi
          if (-not $p.Start()) { throw 'runtime start failed' }
          $ot=$p.StandardOutput.ReadToEndAsync()
          $et=$p.StandardError.ReadToEndAsync()
          $timeout=-not $p.WaitForExit(30000)
          if ($timeout) { $p.Kill(); $p.WaitForExit() }
          $out=$ot.Result
          $err=$et.Result
          [IO.File]::WriteAllText((Join-Path (Get-Location) '..\imp008b-e5-mixed-teb.out.log'),$out)
          [IO.File]::WriteAllText((Join-Path (Get-Location) '..\imp008b-e5-mixed-teb.err.log'),$err)
          [IO.File]::WriteAllText((Join-Path (Get-Location) '..\imp008b-e5-mixed-teb.log'),$out+$err)
          if ($timeout) { $rc=124 } else { $rc=$p.ExitCode }
          [IO.File]::WriteAllText((Join-Path (Get-Location) '..\imp008b-e5-mixed-teb.rc'),[string]$rc)
          Write-Host $out
          Write-Host $err
          Write-Host ('IMP008B_E5_MIXED_TEB_RUNTIME_RC={0} (0x{1:X8})' -f $rc,($rc -band 0xffffffffL))

      - name: Classify A/B result
        if: always()
        shell: powershell
        run: |
          if (-not (Test-Path 'imp008b-e5-mixed-teb.log')) { Write-Host 'IMP008B_E5_MIXED_TEB_RUNTIME=NOT_REACHED'; exit 0 }
          $text=Get-Content 'imp008b-e5-mixed-teb.log' -Raw
          Get-Content 'imp008b-e5-mixed-teb.log' | Select-String -Pattern 'IMP008B_E5_(RUNTHREAD_RETURNED|SVC_NUMBER|RETURN_CONTEXT|EXCEPTION_CODE|EXCEPTION_ADDRESS|EXCEPTION_INFORMATION_|FINAL|FULLCTX_BEGIN)|IMP008B_E2_RESTORE_CONTEXT|IMP008B_E2_BEFORE_NT_CONTINUE'
          if ($text.Contains('IMP008B_E5_RUNTHREAD_RETURNED=PASS') -and $text.Contains('IMP008B_E5_SVC_NUMBER=PASS')) {
            Write-Host 'IMP008B_E5_MIXED_TEB_AB=POSITIVE_E5_PASS_CANDIDATE'
          } elseif ($text.Contains('IMP008B_E5_EXCEPTION_CODE=0xC0000005')) {
            Write-Host 'IMP008B_E5_MIXED_TEB_AB=AV_REMAINS'
          } else {
            Write-Host 'IMP008B_E5_MIXED_TEB_AB=BEHAVIOR_CHANGED_REVIEW_REQUIRED'
          }
          if (Test-Path 'imp008b-e5-mixed-teb.rc') { Write-Host ('IMP008B_E5_MIXED_TEB_RAW_RC=' + (Get-Content 'imp008b-e5-mixed-teb.rc' -Raw).Trim()) }

      - name: Upload mixed TEB diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-mixed-teb-limit-ab
          path: |
            imp008b-e5-mixed-teb-commands.txt
            imp008b-e5-mixed-teb-link.log
            imp008b-e5-mixed-teb.log
            imp008b-e5-mixed-teb.out.log
            imp008b-e5-mixed-teb.err.log
            imp008b-e5-mixed-teb.rc
          if-no-files-found: warn
