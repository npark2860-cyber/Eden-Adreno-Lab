name: Apply IMP-008A Windows SVC Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: exp/imp-008-windows-nce-integration
          fetch-depth: 0

      - name: Apply bounded SVC patch
        run: python3 tools/imp008_patch_windows_svc.py

      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src/core/arm/nce/patcher.cpp"
          grep -q 'WriteWindowsCurrentNceParametersLookup(cg, X1)' src/core/arm/nce/patcher.cpp
          grep -q 'cg.LDR(X16, X17' src/core/arm/nce/patcher.cpp
          grep -q 'this->UnlockContext(cg)' src/core/arm/nce/patcher.cpp

      - name: Commit Windows SVC integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/arm/nce/patcher.cpp
          git commit -m "nce: add Windows-safe SVC trampoline path"
          git push origin HEAD:exp/imp-008-windows-nce-integration
