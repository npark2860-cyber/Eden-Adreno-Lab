name: Apply IMP-008A Windows CMake Wiring

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008-windows-nce-integration
    paths:
      - tools/imp008_patch_cmake_wiring.py
      - .github/workflows/imp-008a-apply-generated-helper-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: exp/imp-008-windows-nce-integration
          fetch-depth: 0

      - name: Apply bounded Windows NCE CMake wiring
        run: python3 tools/imp008_patch_cmake_wiring.py

      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'CMakeLists.txt\nsrc/core/CMakeLists.txt'
          test "$changed" = "$expected"
          grep -Fq 'ARCHITECTURE_arm64 AND (ANDROID OR LINUX OR WIN32)' CMakeLists.txt
          grep -Fq 'arm/nce/arm_nce_windows.cpp' src/core/CMakeLists.txt
          grep -Fq 'NCE_ARMASM64_CANDIDATES' src/core/CMakeLists.txt
          grep -Fq 'arm/nce/x18_site_patcher.cpp' src/core/CMakeLists.txt
          if awk '/if \(WIN32\)/,/else\(\)/' src/core/CMakeLists.txt | grep -Fq 'arm/nce/arm_nce.s'; then
            echo 'Linux arm_nce.s leaked into Windows NCE source branch' >&2
            exit 31
          fi

      - name: Commit Windows NCE build selection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/core/CMakeLists.txt
          git commit -m "nce: align Windows ARM64 NCE with normal CLANGARM64 build"
          git push origin HEAD:exp/imp-008-windows-nce-integration
