name: Apply IMP-008A Generated Helper Patch

on:
  push:
    branches:
      - exp/imp-008-windows-nce-integration
    paths:
      - tools/imp008_patch_generated_helpers.py
      - .github/workflows/imp-008a-apply-generated-helper-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: exp/imp-008-windows-nce-integration
          fetch-depth: 0

      - name: Apply bounded patch
        run: python3 tools/imp008_patch_generated_helpers.py

      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src/core/arm/nce/patcher.cpp"
          grep -q 'windows_generated_context.h' src/core/arm/nce/patcher.cpp
          grep -q 'WriteWindowsCurrentNceParametersLookup' src/core/arm/nce/patcher.cpp

      - name: Commit generated helper integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/arm/nce/patcher.cpp
          git commit -m "nce: use Windows-safe generated context lookup"
          git push origin HEAD:exp/imp-008-windows-nce-integration
