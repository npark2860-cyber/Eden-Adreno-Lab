name: Apply IMP-008A Windows Patch Window Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: exp/imp-008-windows-nce-integration
          fetch-depth: 0

      - name: Apply bounded Windows generated-patch window fix
        run: python3 tools/imp008_patch_windows_patch_window.py

      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'src/core/CMakeLists.txt\nsrc/core/arm/nce/arm_nce_windows.cpp\nsrc/core/arm/nce/patcher.cpp'
          test "$changed" = "$expected"
          grep -Fq 'WindowsPatchCodeMetadata::RegisterRange' src/core/arm/nce/patcher.cpp
          grep -Fq 'WindowsPatchCodeMetadata::Contains' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'state.patch_window' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'UnlockThreadParameters(params)' src/core/arm/nce/arm_nce_windows.cpp
          grep -Fq 'arm/nce/windows_patch_code_metadata.h' src/core/CMakeLists.txt

      - name: Commit patch-window ownership fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/CMakeLists.txt src/core/arm/nce/arm_nce_windows.cpp src/core/arm/nce/patcher.cpp
          git commit -m "nce: defer Windows breaks inside generated patch code"
          git push origin HEAD:exp/imp-008-windows-nce-integration
