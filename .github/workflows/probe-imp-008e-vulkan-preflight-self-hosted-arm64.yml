name: Probe IMP-008E Self-Hosted Vulkan Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008e-windows-nce-rasterizer-recovery-runtime
    paths:
      - .github/workflows/probe-imp-008e-vulkan-preflight-self-hosted-arm64.yml

permissions:
  contents: read

jobs:
  build-native-preflight:
    runs-on: windows-11-arm
    timeout-minutes: 20

    steps:
      - name: Checkout exact IMP-008E state
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0

      - name: Verify self-hosted wrapper-only scope
        shell: bash
        working-directory: eden
        run: |
          set -euo pipefail
          base='b89510ab347d5e1b898767e1285511ab289a975a'
          workflow='.github/workflows/probe-imp-008e-vulkan-preflight-self-hosted-arm64.yml'
          probe='probes/windows-arm64-vulkan-preflight/vulkan_capability.cpp'

          git cat-file -e "$base^{commit}"
          if ! git diff --quiet "$base" HEAD -- src/common src/core src/video_core CMakeLists.txt; then
            echo 'IMP008E_SELFHOSTED_PREFLIGHT_PRODUCTION_SCOPE=FAIL' >&2
            git diff --stat "$base" HEAD -- src/common src/core src/video_core CMakeLists.txt >&2
            exit 71
          fi
          actual="$(git diff --name-only "$base" HEAD)"
          if [ "$actual" != "$workflow" ]; then
            echo 'IMP008E_SELFHOSTED_PREFLIGHT_EXACT_SCOPE=FAIL' >&2
            git diff --name-status "$base" HEAD >&2
            exit 72
          fi
          test "$(git hash-object "$probe")" = '1b9e17236b0d4ae7ab62360d668f0a7de851e6a6'

          echo "IMP008E_SELFHOSTED_PREFLIGHT_GITHUB_SHA=${GITHUB_SHA}"
          echo "IMP008E_SELFHOSTED_PREFLIGHT_CHECKOUT_SHA=$(git rev-parse HEAD)"
          echo "IMP008E_SELFHOSTED_PREFLIGHT_WORKFLOW_BLOB_SHA=$(git hash-object "$workflow")"
          echo "IMP008E_SELFHOSTED_PREFLIGHT_PROBE_BLOB_SHA=$(git hash-object "$probe")"
          echo 'IMP008E_SELFHOSTED_PREFLIGHT_PRODUCTION_SCOPE=PASS'
          echo 'IMP008E_SELFHOSTED_PREFLIGHT_EXACT_SCOPE=PASS'

      - name: Set up minimal CLANGARM64 Vulkan toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            pactoys
          pacboy: >-
            clang:p vulkan-devel:p

      - name: Build portable native ARM64 preflight
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          mkdir -p build-preflight
          if ! clang++ -std=c++20 -O2 -Wall -Wextra -Werror -static \
              probes/windows-arm64-vulkan-preflight/vulkan_capability.cpp \
              -o build-preflight/imp008e_vulkan_preflight.exe \
              > imp008e-selfhosted-preflight-build.log 2>&1; then
            cat imp008e-selfhosted-preflight-build.log
            exit 73
          fi
          llvm-readobj --file-headers --coff-imports \
            build-preflight/imp008e_vulkan_preflight.exe \
            | tee -a imp008e-selfhosted-preflight-build.log
          grep -Fq 'IMAGE_FILE_MACHINE_ARM64' imp008e-selfhosted-preflight-build.log
          if grep -Eiq 'Name: (libc\+\+|libunwind|libgcc|libstdc\+\+|libwinpthread|msys-2\.0).*\.dll' \
              imp008e-selfhosted-preflight-build.log; then
            echo 'IMP008E_SELFHOSTED_PREFLIGHT_PORTABLE_IMPORTS=FAIL' >&2
            exit 74
          fi
          cat imp008e-selfhosted-preflight-build.log
          echo 'IMP008E_SELFHOSTED_PREFLIGHT_NATIVE_BUILD=PASS'
          echo 'IMP008E_SELFHOSTED_PREFLIGHT_PORTABLE_IMPORTS=PASS'

      - name: Upload exact native preflight
        uses: actions/upload-artifact@v4
        with:
          name: imp008e-vulkan-preflight-native-${{ github.sha }}
          path: |
            eden/build-preflight/imp008e_vulkan_preflight.exe
            eden/imp008e-selfhosted-preflight-build.log
          if-no-files-found: error
          retention-days: 7

  run-self-hosted-preflight:
    needs: build-native-preflight
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 20

    steps:
      - name: Download exact native preflight
        uses: actions/download-artifact@v5
        with:
          name: imp008e-vulkan-preflight-native-${{ github.sha }}
          path: preflight

      - name: Verify physical Windows ARM64 runner boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') {
            throw "Expected RUNNER_OS=Windows, got $env:RUNNER_OS"
          }
          if ($env:RUNNER_ARCH -ne 'ARM64') {
            throw "Expected RUNNER_ARCH=ARM64, got $env:RUNNER_ARCH"
          }
          $exe = Get-ChildItem -Path 'preflight' -Recurse -File -Filter 'imp008e_vulkan_preflight.exe' |
              Select-Object -First 1
          if ($null -eq $exe) {
            throw 'Native Vulkan preflight executable not found'
          }
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash
          Write-Host "IMP008E_SELFHOSTED_PREFLIGHT_GITHUB_SHA=${{ github.sha }}"
          Write-Host "IMP008E_SELFHOSTED_PREFLIGHT_RUNNER_OS=$env:RUNNER_OS"
          Write-Host "IMP008E_SELFHOSTED_PREFLIGHT_RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "IMP008E_SELFHOSTED_PREFLIGHT_OS_VERSION=$([Environment]::OSVersion.VersionString)"
          Write-Host "IMP008E_SELFHOSTED_PREFLIGHT_PROCESS_ARCH=$([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          Write-Host "IMP008E_SELFHOSTED_PREFLIGHT_OS_ARCH=$([Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          Write-Host "IMP008E_SELFHOSTED_PREFLIGHT_EXE_SHA256=$hash"
          Write-Host 'IMP008E_SELFHOSTED_PREFLIGHT_RUNNER_BOUNDARY=PASS'

      - name: Run physical-device Vulkan capability preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path 'preflight' -Recurse -File -Filter 'imp008e_vulkan_preflight.exe' |
              Select-Object -First 1
          if ($null -eq $exe) {
            throw 'Native Vulkan preflight executable not found'
          }

          $outPath = Join-Path (Get-Location).Path 'imp008e-selfhosted-preflight.out.log'
          $errPath = Join-Path (Get-Location).Path 'imp008e-selfhosted-preflight.err.log'
          $rcPath = Join-Path (Get-Location).Path 'imp008e-selfhosted-preflight.rc'
          $rcHexPath = Join-Path (Get-Location).Path 'imp008e-selfhosted-preflight.rc.hex'

          $process = Start-Process -FilePath $exe.FullName -WorkingDirectory (Get-Location).Path `
              -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $outPath `
              -RedirectStandardError $errPath
          $signed = [int]$process.ExitCode
          $unsigned = [BitConverter]::ToUInt32([BitConverter]::GetBytes($signed), 0)
          $hex = '0x{0:X8}' -f $unsigned

          [System.IO.File]::WriteAllText($rcPath, "$signed`n", [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText($rcHexPath, "$hex`n", [System.Text.UTF8Encoding]::new($false))
          if (Test-Path $outPath) { Get-Content $outPath }
          if (Test-Path $errPath) {
            Get-Content $errPath | ForEach-Object { [Console]::Error.WriteLine($_) }
          }
          Write-Host "IMP008E_SELFHOSTED_PREFLIGHT_NATIVE_EXIT_SIGNED=$signed"
          Write-Host "IMP008E_SELFHOSTED_PREFLIGHT_NATIVE_EXIT_HEX=$hex"
          Write-Host 'IMP008E_SELFHOSTED_PREFLIGHT_RUNTIME_CAPTURE=PASS'

      - name: Classify physical Vulkan environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = [System.IO.File]::ReadAllText('imp008e-selfhosted-preflight.rc').Trim()
          $hex = [System.IO.File]::ReadAllText('imp008e-selfhosted-preflight.rc.hex').Trim()
          $out = [System.IO.File]::ReadAllText('imp008e-selfhosted-preflight.out.log')

          Write-Host "IMP008E_SELFHOSTED_PREFLIGHT_CLASSIFY_NATIVE_RC=$signed"
          Write-Host "IMP008E_SELFHOSTED_PREFLIGHT_CLASSIFY_NATIVE_RC_HEX=$hex"
          if ($signed -eq '0' -and $out.Contains('IMP008E_VK_PREFLIGHT_GATE=PASS') -and
              $out.Contains('IMP008E_VK_PREFLIGHT_CLASSIFICATION=PREFLIGHT_PASS')) {
            Write-Host 'IMP008E_SELFHOSTED_PREFLIGHT_FINAL=PREFLIGHT_PASS'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## IMP-008E self-hosted Vulkan preflight: PREFLIGHT_PASS'
            exit 0
          }
          if ($signed -eq '72' -and
              $out.Contains('IMP008E_VK_PREFLIGHT_CLASSIFICATION=INCONCLUSIVE_ENVIRONMENT')) {
            $reason = ($out -split "`r?`n" | Where-Object { $_ -like 'IMP008E_VK_PREFLIGHT_REASON=*' } |
                Select-Object -Last 1)
            Write-Host 'IMP008E_SELFHOSTED_PREFLIGHT_FINAL=INCONCLUSIVE_ENVIRONMENT'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## IMP-008E self-hosted Vulkan preflight: INCONCLUSIVE_ENVIRONMENT'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $reason
            exit 0
          }

          Write-Host 'IMP008E_SELFHOSTED_PREFLIGHT_FINAL=INFRASTRUCTURE_FAILURE'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## IMP-008E self-hosted Vulkan preflight: INFRASTRUCTURE_FAILURE'
          exit 1

      - name: Persist self-hosted Vulkan preflight logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imp008e-selfhosted-vulkan-preflight-${{ github.run_id }}
          path: |
            imp008e-selfhosted-preflight.out.log
            imp008e-selfhosted-preflight.err.log
            imp008e-selfhosted-preflight.rc
            imp008e-selfhosted-preflight.rc.hex
          if-no-files-found: warn
