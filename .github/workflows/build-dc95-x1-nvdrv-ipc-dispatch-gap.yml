name: Build dc95 X1 NVDRV IPC Dispatch Gap

on:
  workflow_dispatch:
  push:
    paths:
      - '.x1_nvdrv_ipc_dispatch_build_once'

concurrency:
  group: dc95-x1-nvdrv-ipc-dispatch-gap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: dc95 ARM64 / X1 NVDRV IPC dispatch gap
    runs-on: windows-11-arm
    timeout-minutes: 180

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard

    steps:
      - name: Checkout Adreno Lab
        uses: actions/checkout@v7
        with:
          path: lab
          fetch-depth: 0

      - name: Checkout Eden CI workflow used by dc95-era nightlies
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Checkout exact known-good Eden source
        uses: actions/checkout@v7
        with:
          repository: eden-emulator/mirror
          ref: dc95cd09eea9749250fe31a3072684d341d19417
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact dc95 checkout
        shell: bash
        run: |
          set -e
          test "$(git -C eden rev-parse HEAD)" = "dc95cd09eea9749250fe31a3072684d341d19417"

      - name: Install dc95-era Eden CI scripts
        shell: bash
        run: |
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Prepare compile-validated P0.2 non-scheduler patches
        shell: bash
        run: |
          set -e
          mkdir -p profiler-patches
          BASE=a845b6eafe39faf0b9dd038639a5db385cf9d08f
          for f in \
            src/video_core/renderer_vulkan/vk_buffer_cache.cpp \
            src/video_core/renderer_vulkan/vk_compute_pipeline.cpp \
            src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp \
            src/video_core/renderer_vulkan/vk_staging_buffer_pool.cpp \
            src/video_core/renderer_vulkan/vk_update_descriptor.cpp; do
            out="profiler-patches/$(basename "$f").patch"
            git -C lab diff --binary "$BASE" HEAD -- "$f" > "$out"
            test -s "$out"
          done
          cp lab/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp eden/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp
          cp lab/src/video_core/renderer_vulkan/vk_adreno_profiler.h eden/src/video_core/renderer_vulkan/vk_adreno_profiler.h

      - name: Apply P0.2 non-scheduler source hooks
        shell: bash
        working-directory: eden
        run: |
          set -e
          for p in \
            ../profiler-patches/vk_buffer_cache.cpp.patch \
            ../profiler-patches/vk_compute_pipeline.cpp.patch \
            ../profiler-patches/vk_graphics_pipeline.cpp.patch \
            ../profiler-patches/vk_staging_buffer_pool.cpp.patch \
            ../profiler-patches/vk_update_descriptor.cpp.patch; do
            git apply --ignore-whitespace "$p"
          done

      - name: Recreate complete current X1 diagnostic chain
        shell: bash
        run: |
          set -e
          python lab/tools/adreno_lab/transplant_dc95_descriptor_ring_profiler.py eden
          python lab/tools/adreno_lab/transplant_dc95_logging_checkboxes.py eden
          python lab/tools/adreno_lab/transplant_dc95_full_flow_hooks.py eden
          python lab/tools/adreno_lab/transplant_dc95_scheduler_flow_profiler.py eden/src/video_core/renderer_vulkan/vk_scheduler.cpp
          python lab/tools/adreno_lab/finalize_dc95_full_flow_profiler.py eden
          python lab/tools/adreno_lab/transplant_dc95_draw_dispatch_correlation.py eden
          python lab/tools/adreno_lab/transplant_dc95_draw_dispatch_ab_controls.py eden
          python lab/tools/adreno_lab/transplant_dc95_draw_other_reasons.py eden
          python lab/tools/adreno_lab/transplant_dc95_texture_fill_reasons.py eden
          python lab/tools/adreno_lab/transplant_dc95_alias_copy_reasons.py eden
          python lab/tools/adreno_lab/transplant_dc95_alias_sync_redundancy.py eden
          python lab/tools/adreno_lab/transplant_dc95_uniform_stream_reuse.py eden
          python lab/tools/adreno_lab/transplant_dc95_uniform_payload_fingerprint.py eden
          python lab/tools/adreno_lab/transplant_dc95_uniform_cache_ab.py eden
          python lab/tools/adreno_lab/transplant_dc95_frame_cadence_attribution.py eden
          python lab/tools/adreno_lab/transplant_dc95_swap_interval_3_to_2_ab.py eden
          python lab/tools/adreno_lab/transplant_dc95_diagnostic_harness.py eden

      - name: Recreate frame-build attribution layer
        shell: bash
        run: |
          set -e
          cp lab/src/video_core/renderer_vulkan/vk_x1_frame_build_profiler.h \
             eden/src/video_core/renderer_vulkan/vk_x1_frame_build_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_frame_build_attribution.py eden

      - name: Recreate GPU-command attribution layer
        shell: bash
        run: |
          set -e
          cp lab/src/video_core/x1_gpu_command_profiler.h eden/src/video_core/x1_gpu_command_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_gpu_command_attribution.py eden

      - name: Recreate GPU-submit-gap attribution layer
        shell: bash
        run: |
          set -e
          cp lab/src/video_core/x1_gpu_submit_profiler.h eden/src/video_core/x1_gpu_submit_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_gpu_submit_gap_attribution.py eden

      - name: Recreate guest-submit-thread attribution layer
        shell: bash
        run: |
          set -e
          cp lab/src/video_core/x1_guest_submit_profiler.h eden/src/video_core/x1_guest_submit_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_guest_submit_thread_attribution.py eden

      - name: Snapshot pre-IPC-dispatch state
        shell: bash
        run: |
          set -e
          python -m py_compile \
            lab/tools/adreno_lab/transplant_dc95_nvdrv_ipc_dispatch_gap.py \
            lab/tools/adreno_lab/analyze_x1_nvdrv_ipc_dispatch_gap.py \
            lab/tools/adreno_lab/transplant_dc95_guest_submit_thread_attribution.py \
            lab/tools/adreno_lab/analyze_x1_guest_submit_thread_attribution.py \
            lab/tools/adreno_lab/transplant_dc95_gpu_submit_gap_attribution.py \
            lab/tools/adreno_lab/analyze_x1_gpu_submit_gap_attribution.py \
            lab/tools/adreno_lab/transplant_dc95_gpu_command_attribution.py \
            lab/tools/adreno_lab/analyze_x1_gpu_command_attribution.py \
            lab/tools/adreno_lab/analyze_x1_frame_build_attribution.py \
            lab/tools/adreno_lab/analyze_x1_frame_cadence.py \
            lab/tools/adreno_lab/analyze_x1_dequeue_attribution.py

          test "$(git -C eden rev-parse HEAD)" = "dc95cd09eea9749250fe31a3072684d341d19417"
          git -C eden diff --check
          grep -q 'x1_guest_submit_thread_attribution_log' eden/src/common/settings.h
          grep -q '\[X1-GUESTSUBMIT\]' eden/src/video_core/x1_guest_submit_profiler.h

          mkdir -p pre-ipc/intended pre-ipc/critical
          cp eden/src/common/settings.h pre-ipc/intended/settings.h
          cp eden/src/yuzu/configuration/configure_debug.h pre-ipc/intended/configure_debug.h
          cp eden/src/yuzu/configuration/configure_debug.cpp pre-ipc/intended/configure_debug.cpp
          cp eden/src/core/hle/kernel/svc/svc_ipc.cpp pre-ipc/intended/svc_ipc.cpp
          cp eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp pre-ipc/intended/nvdrv_interface.cpp
          cp eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp pre-ipc/intended/vk_rasterizer.cpp

          sha256sum eden/src/core/hle/kernel/k_client_session.cpp > pre-ipc/critical/k-client-session.sha256
          sha256sum eden/src/core/hle/kernel/k_server_session.cpp > pre-ipc/critical/k-server-session.sha256
          sha256sum eden/src/core/hle/kernel/k_thread.cpp > pre-ipc/critical/k-thread.sha256
          sha256sum eden/src/core/hle/kernel/k_scheduler.cpp > pre-ipc/critical/k-scheduler.sha256
          sha256sum eden/src/core/hle/kernel/global_scheduler_context.cpp > pre-ipc/critical/global-scheduler.sha256
          sha256sum eden/src/core/hle/service/services.cpp > pre-ipc/critical/services.sha256
          sha256sum eden/src/core/hle/service/server_manager.cpp > pre-ipc/critical/server-manager.sha256
          sha256sum eden/src/core/hle/service/os/multi_wait.cpp > pre-ipc/critical/multi-wait.sha256
          sha256sum eden/src/core/hle/service/nvdrv/devices/nvhost_gpu.cpp > pre-ipc/critical/nvhost-gpu.sha256
          sha256sum eden/src/core/hle/service/nvdrv/devices/nvhost_ctrl.cpp > pre-ipc/critical/nvhost-ctrl.sha256
          sha256sum eden/src/core/hle/service/nvnflinger/buffer_queue_producer.cpp > pre-ipc/critical/producer.sha256
          sha256sum eden/src/core/hle/service/nvnflinger/hardware_composer.cpp > pre-ipc/critical/composer.sha256
          sha256sum eden/src/core/hle/service/vi/conductor.cpp > pre-ipc/critical/conductor.sha256
          sha256sum eden/src/video_core/gpu.cpp > pre-ipc/critical/gpu.sha256
          sha256sum eden/src/video_core/gpu_thread.cpp > pre-ipc/critical/gpu-thread.sha256
          sha256sum eden/src/video_core/control/scheduler.cpp > pre-ipc/critical/control-scheduler.sha256
          sha256sum eden/src/video_core/dma_pusher.cpp > pre-ipc/critical/dma-pusher.sha256
          sha256sum eden/src/video_core/renderer_vulkan/vk_swapchain.cpp > pre-ipc/critical/swapchain.sha256
          sha256sum eden/src/video_core/renderer_vulkan/vk_scheduler.cpp > pre-ipc/critical/vk-scheduler.sha256
          sha256sum eden/src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp > pre-ipc/critical/vk-graphics-pipeline.sha256
          sha256sum eden/src/video_core/x1_gpu_command_profiler.h > pre-ipc/critical/gpu-command-profiler.sha256
          sha256sum eden/src/video_core/x1_gpu_submit_profiler.h > pre-ipc/critical/gpu-submit-profiler.sha256
          sha256sum eden/src/video_core/x1_guest_submit_profiler.h > pre-ipc/critical/guest-submit-profiler.sha256

      - name: Apply runtime-selectable NVDRV IPC dispatch-gap attribution
        shell: bash
        run: |
          set -e
          cp lab/src/core/x1_nvdrv_ipc_dispatch_profiler.h eden/src/core/x1_nvdrv_ipc_dispatch_profiler.h
          python lab/tools/adreno_lab/transplant_dc95_nvdrv_ipc_dispatch_gap.py eden

      - name: Verify NVDRV IPC dispatch-gap attribution before configure
        shell: bash
        run: |
          set -e
          test "$(git -C eden rev-parse HEAD)" = "dc95cd09eea9749250fe31a3072684d341d19417"
          git -C eden diff --check

          grep -q 'x1_nvdrv_ipc_dispatch_gap_log' eden/src/common/settings.h
          grep -q 'X1 Log: NVDRV IPC Dispatch Gap' eden/src/yuzu/configuration/configure_debug.cpp
          grep -q '\[X1-IPCDISPATCH\]' eden/src/core/x1_nvdrv_ipc_dispatch_profiler.h
          grep -q 'RecordSyncRequestEntry' eden/src/core/hle/kernel/svc/svc_ipc.cpp
          grep -q 'RecordNvdrvHandlerEntry' eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp
          grep -q 'RecordNvdrvHandlerComplete' eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp
          grep -q 'X1NvdrvIpcDispatchProfiler::Get().FrameEnd' eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp

          for f in pre-ipc/critical/*.sha256; do sha256sum -c "$f"; done

          check_count() {
            local before="$1" after="$2" token="$3"
            local b a
            b=$(grep -oF "$token" "$before" | wc -l | tr -d ' ')
            a=$(grep -oF "$token" "$after" | wc -l | tr -d ' ')
            test "$b" = "$a" || { echo "ERROR token count changed: $token $b -> $a" >&2; exit 1; }
          }

          check_count pre-ipc/intended/svc_ipc.cpp eden/src/core/hle/kernel/svc/svc_ipc.cpp 'session->SendSyncRequest('
          check_count pre-ipc/intended/nvdrv_interface.cpp eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp 'ctx.ReadBuffer(0)'
          check_count pre-ipc/intended/nvdrv_interface.cpp eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp 'nvdrv->Ioctl1('
          check_count pre-ipc/intended/nvdrv_interface.cpp eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp 'nvdrv->Ioctl2('
          check_count pre-ipc/intended/nvdrv_interface.cpp eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp 'RecordServiceEntry('
          check_count pre-ipc/intended/nvdrv_interface.cpp eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp 'RecordSubmitCaller('

          test "$(grep -oF 'RecordSyncRequestEntry(' eden/src/core/hle/kernel/svc/svc_ipc.cpp | wc -l | tr -d ' ')" = "1"
          test "$(grep -oF 'RecordNvdrvHandlerEntry(' eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp | wc -l | tr -d ' ')" = "2"
          test "$(grep -oF 'RecordNvdrvHandlerComplete(' eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp | wc -l | tr -d ' ')" = "2"

          {
            diff -u pre-ipc/intended/settings.h eden/src/common/settings.h || true
            diff -u pre-ipc/intended/configure_debug.h eden/src/yuzu/configuration/configure_debug.h || true
            diff -u pre-ipc/intended/configure_debug.cpp eden/src/yuzu/configuration/configure_debug.cpp || true
            diff -u pre-ipc/intended/svc_ipc.cpp eden/src/core/hle/kernel/svc/svc_ipc.cpp || true
            diff -u pre-ipc/intended/nvdrv_interface.cpp eden/src/core/hle/service/nvdrv/nvdrv_interface.cpp || true
            diff -u pre-ipc/intended/vk_rasterizer.cpp eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp || true
          } > ipc-dispatch-only.diff
          test -s ipc-dispatch-only.diff

          if grep -E '^\+.*(BeginWait\(|EndWait\(|DummyThread|StartAdditionalHostThreads|WaitHost\(|StallApplication\(|sleep_for|sleep_until|Sleep\(|SetState\(|SetPriority\(|SetCoreMask\(|Reschedule|YieldTo|PushGPUEntries\(|item\.swap_interval[[:space:]]*=|default_max_buffer_count[[:space:]]*=|SetTarget|SpeedLimit)' ipc-dispatch-only.diff; then
            echo 'ERROR: behavior-changing scheduling/IPC/GPU policy leaked into IPC dispatch attribution diff' >&2
            exit 1
          fi

          git -C eden status --short

      - name: Set up MSYS2 CLANGARM64 exactly like Eden Nightly
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure dc95 ARM64 standard build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: ./.ci/build/configure.sh -DCCACHE_PATH=sccache

      - name: Build dc95 ARM64 X1 NVDRV IPC dispatch gap
        shell: msys2 {0}
        working-directory: eden
        run: cmake --build build

      - name: Package with Eden CI Windows packager
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: dc95cd09ee-x1-nvdrv-ipc-dispatch-gap
          MSYS_TOOLCHAIN: CLANGARM64
        run: ./.ci/package/windows.sh

      - name: Add analyzers and metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force extras | Out-Null
          Copy-Item lab/tools/adreno_lab/analyze_x1_nvdrv_ipc_dispatch_gap.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_guest_submit_thread_attribution.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_gpu_submit_gap_attribution.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_gpu_command_attribution.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_frame_build_attribution.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_frame_cadence.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_dequeue_attribution.py extras/ -Force
          @'
          Experiment: X1 exact-dc95 NVDRV IPC dispatch-gap attribution
          Exact Eden source: dc95cd09eea9749250fe31a3072684d341d19417
          Branch: exp/x1-nvdrv-ipc-dispatch-gap

          New control:
          - X1 Log: NVDRV IPC Dispatch Gap

          Recommended first run:
          - NVDRV IPC Dispatch Gap ON
          - Guest Submit Thread Attribution ON
          - GPU Submit Gap Attribution ON
          - GPU Command Attribution ON
          - Frame Build Attribution ON
          - Frame Cadence ON
          - Dequeue Attribution ON
          - all behavioral A/B controls OFF
          - Scheduler/Present/Pipeline/Upload/QCOM heavy logs OFF
          - Descriptor Ring OFF

          [X1-IPCDISPATCH] reports:
          - guestPostAvg = current candidate sync-request entry minus prior candidate handler completion
          - ipcDispatchAvg = NVDRV candidate handler entry minus generic SendSyncRequest entry
          - serviceReplyAvg = candidate handler completion minus handler entry
          - dominant originator guest thread and missing-pair counters
          '@ | Set-Content -Encoding UTF8 extras/NVDRV_IPC_DISPATCH_GAP.txt

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-dc95-X1-nvdrv-ipc-dispatch-gap
          path: |
            eden/artifacts/*
            extras/*
          if-no-files-found: error
          retention-days: 14