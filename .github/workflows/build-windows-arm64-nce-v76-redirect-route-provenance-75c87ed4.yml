name: Build Windows ARM64 NCE V76 redirect route provenance 75c87ed4

on:
  push:
    branches:
      - diag/windows-nce-v76-redirect-route-provenance-75c87ed4
    paths:
      - .github/diagnostics/v76-redirect-route-provenance-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-nce-v76-redirect-route-provenance-75c87ed4
  cancel-in-progress: false

env:
  V75_BASE_SHA: 75c87ed4507a0fe6f1a89912a5353c3a5c03f3ba
  CI_REF: afead830f3a444427f9fdfd841218f932465c03a
  TEST_NAME: v76-redirect-route-provenance

jobs:
  build-package:
    name: Windows ARM64 NCE V76 redirect route provenance
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout exact V76 Git object
        uses: actions/checkout@v7
        with:
          repository: npark2860-cyber/Eden-Adreno-Lab
          ref: ${{ github.sha }}
          path: build/validation/${{ github.sha }}/v76-redirect-route-provenance/source
          fetch-depth: 0
          submodules: recursive

      - name: Verify V76 redirect-route provenance scope
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          SOURCE="$ROOT/source"
          PROV="$ROOT/provenance"
          mkdir -p "$PROV"

          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$SOURCE" merge-base --is-ancestor "$V75_BASE_SHA" "$GITHUB_SHA"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=no)"
          git -C "$SOURCE" diff --check "$V75_BASE_SHA" "$GITHUB_SHA"

          CHANGED="$(git -C "$SOURCE" diff --name-only "$V75_BASE_SHA" "$GITHUB_SHA")"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(src/core/arm/nce/arm_nce_windows\.cpp|\.github/workflows/build-windows-arm64-nce-v76-redirect-route-provenance-75c87ed4\.yml|\.github/diagnostics/v76-redirect-route-provenance-trigger\.txt)$' || true)"
          test -z "$UNEXPECTED"

          # V76 changes only route provenance on the two remaining RedirectToHost writers.
          test -z "$(git -C "$SOURCE" diff "$V75_BASE_SHA" "$GITHUB_SHA" -- \
            src/core/arm/nce/windows_nce_entry.asm \
            src/core/arm/nce/windows_nce_transition.cpp \
            src/core/arm/nce/windows_x18_fallback_trap.cpp \
            src/core/arm/nce/windows_x18_fallback_runner.cpp \
            src/core/arm/nce/x18_fallback.cpp \
            src/common/host_memory.cpp \
            src/common/host_memory.h \
            src/common/host_memory_windows_lease.h \
            src/dynarmic/src/dynarmic/backend/arm64/a64_interface.cpp \
            src/core/hle/kernel/physical_core.cpp \
            src/core/hle/kernel/physical_core.h \
            src/yuzu/main.cpp)"

          grep -Fq 'V76RedirectRouteMagicBase' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'V76RouteX18Fallback' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'V76RouteBreakLoop' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'InstallV76RedirectRouteProvenance(context, *guest, V76RouteX18Fallback);' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'InstallV76RedirectRouteProvenance(context, guest, V76RouteBreakLoop);' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'V74ProvenanceMagicBase' "$SOURCE/src/core/arm/nce/arm_nce_windows.cpp"
          grep -Fq 'WindowsNceV74HostStackBridge PROC' "$SOURCE/src/core/arm/nce/windows_nce_entry.asm"
          grep -Fq 'V75 diagnostic: keep natural Windows WER terminal handling uncontaminated' "$SOURCE/src/yuzu/main.cpp"

          git -C "$SOURCE" diff "$V75_BASE_SHA" "$GITHUB_SHA" -- src/core/arm/nce/arm_nce_windows.cpp > "$PROV/V76_REDIRECT_ROUTE_PROVENANCE.diff"
          printf 'V75_BASE_SHA=%s\nV76_SHA=%s\nSOURCE_MODE=exact tested V75 + x18/BreakLoop route provenance only\nEVIDENCE=clean V75 natural WER PID 3780 reproduces zero-scratch HostStackBridge terminal with no V74 AV magic; exact binary maps LR to the continuation after WindowsNceEnterGuestContext, leaving x18 fallback and cross-thread BreakLoop as the remaining intentional production RedirectToHost routes\nROUTE_MAGIC_BASE=0x5637365254500000\nROUTE_X18=0x0100\nROUTE_BREAKLOOP=0x0200\nISOLATION_DIR=build/validation/%s/%s\n' "$V75_BASE_SHA" "$GITHUB_SHA" "$GITHUB_SHA" "$TEST_NAME" > "$PROV/BUILD_INFO.txt"

      - name: Checkout fixed Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: build/validation/${{ github.sha }}/v76-redirect-route-provenance/ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/validation/$GITHUB_SHA/$TEST_NAME"
          rm -rf "$ROOT/source/.ci"
          cp -a "$ROOT/ci/.ci" "$ROOT/source/.ci"
          printf 'EDEN_CI_REF=%s\n' "$CI_REF" >> "$ROOT/provenance/BUILD_INFO.txt"

      - name: Set up CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: false
          install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p 7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure V76 Windows ARM64 NCE build
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v76-redirect-route-provenance/source
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          printf 'CONFIGURE_COMMAND=./.ci/build/configure.sh -DCCACHE_PATH=sccache\nNCE_COMPILE_GUARD=HAS_NCE=1\n' >> ../provenance/BUILD_INFO.txt

      - name: Build full Windows ARM64 Eden V76
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v76-redirect-route-provenance/source
        run: |
          set -euo pipefail
          cmake --build build
          test -f build/bin/eden.exe || test -f build/bin/yuzu.exe
          printf 'BUILD_COMMAND=cmake --build build\n' >> ../provenance/BUILD_INFO.txt

      - name: Package Windows ARM64 Eden V76
        shell: msys2 {0}
        working-directory: build/validation/${{ github.sha }}/v76-redirect-route-provenance/source
        env:
          ARTIFACT_REF: nce-v76-redirect-route-provenance-75c87ed4
          MSYS_TOOLCHAIN: CLANGARM64
        run: |
          set -euo pipefail
          ./.ci/package/windows.sh
          test -d artifacts
          printf 'PACKAGE_COMMAND=./.ci/package/windows.sh\nARTIFACT_REF=nce-v76-redirect-route-provenance-75c87ed4\n' >> ../provenance/BUILD_INFO.txt

      - name: Prepare V76 upload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/validation/$env:GITHUB_SHA/$env:TEST_NAME"
          $source = Join-Path $root 'source'
          $prov = Join-Path $root 'provenance'
          $files = @(Get-ChildItem -Path (Join-Path $source 'artifacts') -File)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged Eden artifact; found $($files.Count)" }
          $upload = Join-Path $root 'upload'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item $files[0].FullName $upload -Force
          Copy-Item (Join-Path $prov '*') $upload -Force
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash
          "PACKAGE_FILE=$($files[0].Name)" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')
          "PACKAGE_SHA256=$hash" | Add-Content (Join-Path $upload 'BUILD_INFO.txt')

      - name: Upload V76 package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-Windows-ARM64-NCE-V76-REDIRECT-ROUTE-PROVENANCE-75c87ed4
          path: build/validation/${{ github.sha }}/v76-redirect-route-provenance/upload/*
          if-no-files-found: error
          retention-days: 14
