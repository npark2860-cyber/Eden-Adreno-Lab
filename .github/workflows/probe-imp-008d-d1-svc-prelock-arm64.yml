name: Probe IMP-008D D1 Post-Resume Exception Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - exp/imp-008d-windows-nce-data-fault-runtime
    paths:
      - '.github/workflows/probe-imp-008d-d1-svc-prelock-arm64.yml'

permissions:
  contents: read

jobs:
  d1-post-resume-exception-runtime:
    runs-on: windows-11-arm
    timeout-minutes: 120

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard
      RELEASE_PGO_HOST: github.com
      RELEASE_PGO_REPO: Eden-CI/PGO

    steps:
      - name: Checkout IMP-008D branch
        uses: actions/checkout@v7
        with:
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Checkout fixed dc95-era Eden CI workflow
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Install fixed Eden CI scripts
        shell: bash
        run: |
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Apply checkout-only post-resume exception observer
        shell: pwsh
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          $probePath = 'probes/windows-arm64-nce-fault-d1/data_fault_skip_runtime.cpp'
          $probe = [System.IO.File]::ReadAllText($probePath).Replace("`r`n", "`n")

          function Replace-InText([string]$text, [string]$old, [string]$new, [string]$label) {
            $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
            if ($count -ne 1) {
              throw "$label match count was $count, expected 1"
            }
            return $text.Replace($old, $new)
          }

          $atomicOld = @'
          std::atomic<u32> g_observation_seen{};
          std::atomic<u32> g_fault_seen{};
          '@.Replace("`r`n", "`n").TrimEnd()
          $atomicNew = @'
          std::atomic<u32> g_observation_seen{};
          std::atomic<u32> g_post_resume_exception_seen{};
          std::atomic<u32> g_fault_seen{};
          '@.Replace("`r`n", "`n").TrimEnd()
          $probe = Replace-InText $probe $atomicOld $atomicNew 'post-resume exception atomic'

          $constOld = @'
          constexpr u32 D1GeneratedSaveGetterEnterVersion = 7;
          constexpr u32 D1GeneratedSaveGetterReturnVersion = 8;
          '@.Replace("`r`n", "`n").TrimEnd()
          $constNew = @'
          constexpr u32 D1GeneratedSaveGetterEnterVersion = 7;
          constexpr u32 D1GeneratedSaveGetterReturnVersion = 8;
          constexpr u32 D1PostResumeExceptionVersion = 13;
          '@.Replace("`r`n", "`n").TrimEnd()
          $probe = Replace-InText $probe $constOld $constNew 'post-resume exception version'

          $firstOld = @'
              u32 observation_expected = 0;
              if (g_observation_seen.compare_exchange_strong(observation_expected, 1,
                                                             std::memory_order_acq_rel)) {
          '@.Replace("`r`n", "`n").TrimEnd()
          $firstNew = @'
              u32 observation_expected = 0;
              const bool first_observation =
                  g_observation_seen.compare_exchange_strong(observation_expected, 1,
                                                             std::memory_order_acq_rel);
              if (first_observation) {
          '@.Replace("`r`n", "`n").TrimEnd()
          $probe = Replace-InText $probe $firstOld $firstNew 'first observation bool'

          $secondAnchor = @'
              }

              if (record.ExceptionCode != EXCEPTION_ACCESS_VIOLATION || record.NumberParameters < 2) {
          '@.Replace("`r`n", "`n").TrimEnd()
          $secondReplacement = @'
              }

              if (!first_observation) {
                  u32 second_expected = 0;
                  if (g_post_resume_exception_seen.compare_exchange_strong(
                          second_expected, 1, std::memory_order_acq_rel)) {
                      const auto& context =
                          *reinterpret_cast<const ARM64_NT_CONTEXT*>(exception->ContextRecord);
                      D1ContinueRegisterRecord post{};
                      post.magic = D1ObservationMagic;
                      post.version = D1PostResumeExceptionVersion;
                      post.sequence = 13;
                      post.exception_code = static_cast<u32>(record.ExceptionCode);
                      post.parameter_count = static_cast<u32>(record.NumberParameters);
                      post.value0 = reinterpret_cast<u64>(record.ExceptionAddress);
                      post.value1 = static_cast<u64>(context.Pc);
                      post.value2 = static_cast<u64>(context.Sp);
                      post.value3 = record.NumberParameters >= 1
                                        ? static_cast<u64>(record.ExceptionInformation[0])
                                        : 0;
                      post.value4 = record.NumberParameters >= 2
                                        ? static_cast<u64>(record.ExceptionInformation[1])
                                        : 0;

                      DWORD bytes_written{};
                      WriteFile(g_observation_file, &post, static_cast<DWORD>(sizeof(post)),
                                &bytes_written, nullptr);
                      FlushFileBuffers(g_observation_file);
                  }
              }

              if (record.ExceptionCode != EXCEPTION_ACCESS_VIOLATION || record.NumberParameters < 2) {
          '@.Replace("`r`n", "`n").TrimEnd()
          $probe = Replace-InText $probe $secondAnchor $secondReplacement 'second exception observer'

          [System.IO.File]::WriteAllText($probePath, $probe, [System.Text.UTF8Encoding]::new($false))

          if (-not (Select-String -Path $probePath -SimpleMatch 'D1PostResumeExceptionVersion = 13' -Quiet)) {
            throw 'post-resume exception version missing'
          }
          if (-not (Select-String -Path $probePath -SimpleMatch 'g_post_resume_exception_seen' -Quiet)) {
            throw 'post-resume exception observer missing'
          }
          if (-not (Select-String -Path $probePath -SimpleMatch 'post.sequence = 13;' -Quiet)) {
            throw 'post-resume exception record missing'
          }
          Write-Host 'IMP008D_D1_POST_RESUME_EXCEPTION_OBSERVER=PASS'

      - name: Add D1 target to checkout only
        shell: bash
        working-directory: eden
        run: |
          cat >> src/yuzu_cmd/CMakeLists.txt <<'CMAKE'

          file(WRITE "${CMAKE_BINARY_DIR}/imp008d_d1_vma.cpp"
              "#define VMA_IMPLEMENTATION\n#include \"video_core/vulkan_common/vma.h\"\n")
          add_executable(imp008d_d1_data_fault_skip
              ${CMAKE_SOURCE_DIR}/probes/windows-arm64-nce-fault-d1/data_fault_skip_runtime.cpp
              ${CMAKE_BINARY_DIR}/imp008d_d1_vma.cpp)
          target_include_directories(imp008d_d1_data_fault_skip PRIVATE ${CMAKE_SOURCE_DIR}/src)
          target_link_libraries(imp008d_d1_data_fault_skip PRIVATE
              common core input_common frontend_common video_core merry::oaknut)
          target_link_libraries(imp008d_d1_data_fault_skip PRIVATE ${PLATFORM_LIBRARIES} Threads::Threads)
          CMAKE
          echo 'IMP008D_D1_TARGET_WIRING=PASS'

      - name: Set up normal Eden CLANGARM64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure normal Windows ARM64 product build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          ./.ci/build/configure.sh -DCCACHE_PATH=sccache
          test -f build/compile_commands.json
          grep -Fq 'HAS_NCE=1' build/compile_commands.json
          grep -Fq 'arm_nce_windows.cpp' build/compile_commands.json
          echo 'IMP008D_D1_NORMAL_CONFIGURE=PASS'

      - name: Build D1 diagnostic executable
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build --target imp008d_d1_data_fault_skip --parallel > imp008d-d1-build.log 2>&1
          cat imp008d-d1-build.log
          echo 'IMP008D_D1_BUILD=PASS'

      - name: Run D1 diagnostic executable
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          exe="$(find build -type f -name 'imp008d_d1_data_fault_skip.exe' -print -quit)"
          test -n "$exe"
          set +e
          "$exe" > imp008d-d1.out.log 2> imp008d-d1.err.log
          rc=$?
          set -e
          printf '%s\n' "$rc" > imp008d-d1.rc
          cat imp008d-d1.out.log || true
          cat imp008d-d1.err.log >&2 || true
          echo "IMP008D_D1_PROCESS_EXIT=$rc"
          echo 'IMP008D_D1_RUNTIME_CAPTURE=PASS'

      - name: Classify D1 post-resume exception
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          rc="$(cat imp008d-d1.rc)"
          echo "IMP008D_D1_CLASSIFY_RC=$rc"
          exit "$rc"

      - name: Persist D1 post-resume exception logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imp008d-d1-post-resume-exception-${{ github.run_id }}
          path: |
            eden/imp008d-d1-build.log
            eden/imp008d-d1.out.log
            eden/imp008d-d1.err.log
            eden/imp008d-d1.rc
            eden/imp008d-d1-first-exception.bin
          if-no-files-found: warn
