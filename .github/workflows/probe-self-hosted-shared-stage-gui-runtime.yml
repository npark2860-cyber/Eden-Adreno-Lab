name: Probe Self-Hosted Shared Stage GUI Runtime
on:
  workflow_dispatch:
  push:
    branches: [exp/imp-008e-windows-nce-rasterizer-recovery-runtime]
    paths: [.github/workflows/probe-self-hosted-shared-stage-gui-runtime.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: probe-self-hosted-shared-stage-gui-runtime
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 10
    steps:
      - name: Download shared-stage Eden package
        uses: actions/download-artifact@v7
        with:
          name: Eden-Windows-nce-cinc-x18-shared-stage-753d52b2fe1dbbcf9471b24da33a5c293b6dd7f7-arm64-clang-standard.zip
          path: runtime/eden
          github-token: ${{ github.token }}
          repository: npark2860-cyber/Eden-Adreno-Lab
          run-id: 34769198199
      - name: Run exact three-down GUI sequence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:GITHUB_WORKSPACE 'runtime-output'
          if(Test-Path $out){Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue}
          New-Item -ItemType Directory -Force $out|Out-Null
          $eden=Join-Path $env:GITHUB_WORKSPACE 'runtime/eden/eden.exe'
          $cinc='C:\Emulators\ryujinx\roms\NCE-DIAG-CINC.nro'
          if(-not(Test-Path $eden -PathType Leaf)){throw "missing Eden GUI: $eden"}
          if(-not(Test-Path $cinc -PathType Leaf)){throw "missing CINC NRO: $cinc"}
          $logPath=Join-Path $env:APPDATA 'eden/log/eden_log.txt'
          if(Test-Path $logPath){Remove-Item $logPath -Force -ErrorAction SilentlyContinue}
          $p=Start-Process -FilePath $eden -PassThru
          $ready=$false
          $until=[DateTime]::UtcNow.AddSeconds(10)
          while([DateTime]::UtcNow-lt$until -and -not$p.HasExited){$p.Refresh();if($p.MainWindowHandle-ne0){$ready=$true;break};Start-Sleep -Milliseconds 100}
          $activated=$false
          if($ready -and -not$p.HasExited){
            $w=New-Object -ComObject WScript.Shell
            $activated=$w.AppActivate($p.Id)
            Start-Sleep -Milliseconds 700
            if($activated){
              1..3|ForEach-Object{$w.SendKeys('{DOWN}');Start-Sleep -Milliseconds 180}
              $w.SendKeys('{ENTER}')
              Start-Sleep -Milliseconds 1200
              $w.SendKeys('%n')
              Start-Sleep -Milliseconds 250
              $w.SendKeys($cinc)
              Start-Sleep -Milliseconds 250
              $w.SendKeys('{ENTER}')
            }
          }
          $map=$null;$view=$null;$max=-1
          $deadline=[DateTime]::UtcNow.AddSeconds(35)
          while(-not$p.HasExited -and [DateTime]::UtcNow-lt$deadline -and $null-eq$map){try{$map=[System.IO.MemoryMappedFiles.MemoryMappedFile]::OpenExisting('Local\EdenNceX18Stage',[System.IO.MemoryMappedFiles.MemoryMappedFileRights]::Read)}catch{Start-Sleep -Milliseconds 25}}
          if($null-ne$map){
            $view=$map.CreateViewAccessor(0,4,[System.IO.MemoryMappedFiles.MemoryMappedFileAccess]::Read)
            while(-not$p.HasExited -and [DateTime]::UtcNow-lt$deadline){$s=$view.ReadInt32(0);if($s-gt$max){$max=$s};if($max-ge2){break};Start-Sleep -Milliseconds 10}
            $s=$view.ReadInt32(0);if($s-gt$max){$max=$s}
          }
          $running=-not$p.HasExited
          if($running){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;try{$p.WaitForExit()}catch{}}
          if($null-ne$view){$view.Dispose()};if($null-ne$map){$map.Dispose()}
          if(Test-Path $logPath -PathType Leaf){Copy-Item $logPath (Join-Path $out 'eden_log_gui.txt') -Force;$text=Get-Content $logPath -Raw -ErrorAction SilentlyContinue}else{$text=''}
          if($null-eq$text){$text=''}
          $boot=$text.Contains('BootGame: Eden starting...')
          $n30=$text.Contains('IMP008_REENTRY_BREADCRUMB_PRE n=30')
          $meta=$text.Contains('IMP008_CINC_X18_METADATA')
          $caller=$text.Contains('IMP008_CINC_CALLER_ARG_SETUP_APPLIED')
          $pre=$text.Contains('IMP008_X18_FALLBACK_PRE')
          $post=$text.Contains('IMP008_X18_FALLBACK_POST')
          $cascade=$text.Contains('4001000A')
          if($max-eq3){$class='TRY_REDIRECT_RETURNED_FALSE'}elseif($max-ge2 -and $pre){$class='BOUNDARY_CROSSED_TO_FALLBACK_DISPATCH'}elseif($max-ge2){$class='TRY_REDIRECT_RETURNED_TRUE__HOST_RETURN_RESUME_BOUNDARY'}elseif($max-eq1){$class='ENTERED_X18_VEH__TRY_REDIRECT_DID_NOT_RETURN_TO_CALLER'}elseif($max-eq0){$class='STAGE_MAP_INITIALIZED__ORDINARY_X18_BRANCH_NOT_OBSERVED'}elseif(-not$boot){$class='THREE_DOWNS_NO_ALT_F_DID_NOT_BOOT'}else{$class='SHARED_STAGE_MAPPING_NOT_OBSERVED'}
          @("CLASSIFICATION=$class","MAX_STAGE=$max",'LAUNCH_MODE=EDEN_QT_GUI_THREE_DOWNS_NO_ALT_F',"WINDOW_READY=$ready","APP_ACTIVATED=$activated","BOOT_GAME=$boot","N30_REACHED=$n30","METADATA=$meta","CALLER_SETUP=$caller","FALLBACK_PRE=$pre","FALLBACK_POST=$post","CASCADE_4001000A=$cascade")|Set-Content (Join-Path $out 'runtime-status.txt')
          Get-Content (Join-Path $out 'runtime-status.txt')
      - name: Upload observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SELF-HOSTED-SHARED-STAGE-GUI-THREE-DOWNS
          path: runtime-output/*
          if-no-files-found: warn
          retention-days: 14
