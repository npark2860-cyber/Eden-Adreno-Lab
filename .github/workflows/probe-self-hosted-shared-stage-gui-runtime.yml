name: Probe Self-Hosted Production GUI Runtime
on:
  workflow_dispatch:
  push:
    branches: [exp/imp-008e-windows-nce-rasterizer-recovery-runtime]
    paths: [.github/workflows/probe-self-hosted-shared-stage-gui-runtime.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: probe-self-hosted-production-gui-runtime
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 10
    steps:
      - name: Download production Eden package
        uses: actions/download-artifact@v7
        with:
          name: Eden-Windows-nce-production-05243ec0e2507074a7d29a3d4ef4da9da740c95a-arm64-clang-standard.zip
          path: runtime/eden
          github-token: ${{ github.token }}
          repository: npark2860-cyber/Eden-Adreno-Lab
          run-id: 34778905214
      - name: Run exact three-down GUI sequence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:GITHUB_WORKSPACE 'runtime-output'
          if(Test-Path $out){Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue}
          New-Item -ItemType Directory -Force $out|Out-Null
          $eden=Join-Path $env:GITHUB_WORKSPACE 'runtime/eden/eden.exe'
          $cinc='C:\Emulators\ryujinx\roms\NCE-DIAG-CINC.nro'
          if(-not(Test-Path $eden -PathType Leaf)){throw "missing Eden GUI: $eden"}
          if(-not(Test-Path $cinc -PathType Leaf)){throw "missing CINC NRO: $cinc"}
          $logPath=Join-Path $env:APPDATA 'eden/log/eden_log.txt'
          if(Test-Path $logPath){Remove-Item $logPath -Force -ErrorAction SilentlyContinue}
          $p=Start-Process -FilePath $eden -PassThru
          $ready=$false
          $until=[DateTime]::UtcNow.AddSeconds(10)
          while([DateTime]::UtcNow-lt$until -and -not$p.HasExited){$p.Refresh();if($p.MainWindowHandle-ne0){$ready=$true;break};Start-Sleep -Milliseconds 100}
          $activated=$false
          if($ready -and -not$p.HasExited){
            $w=New-Object -ComObject WScript.Shell
            $activated=$w.AppActivate($p.Id)
            Start-Sleep -Milliseconds 700
            if($activated){
              1..3|ForEach-Object{$w.SendKeys('{DOWN}');Start-Sleep -Milliseconds 180}
              $w.SendKeys('{ENTER}')
              Start-Sleep -Milliseconds 1200
              $w.SendKeys('%n')
              Start-Sleep -Milliseconds 250
              $w.SendKeys($cinc)
              Start-Sleep -Milliseconds 250
              $w.SendKeys('{ENTER}')
            }
          }
          $boot=$false;$guestExit=$false;$cascade=$false;$forceStop=$false;$text=''
          $deadline=[DateTime]::UtcNow.AddSeconds(35)
          while(-not$p.HasExited -and [DateTime]::UtcNow-lt$deadline){
            if(Test-Path $logPath -PathType Leaf){
              try{$text=Get-Content $logPath -Raw -ErrorAction Stop}catch{$text=''}
              if($null-eq$text){$text=''}
              $boot=$text.Contains('BootGame: Eden starting...')
              $guestExit=$text.Contains('ExitProcess: Process')
              $cascade=$text.Contains('4001000A')
              $forceStop=$text.Contains('Force stopping EmuThread')
              if($guestExit -or $cascade){break}
            }
            Start-Sleep -Milliseconds 25
          }
          $running=-not$p.HasExited
          if($running){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;try{$p.WaitForExit()}catch{}}
          if(Test-Path $logPath -PathType Leaf){
            Copy-Item $logPath (Join-Path $out 'eden_log_gui.txt') -Force
            $text=Get-Content $logPath -Raw -ErrorAction SilentlyContinue
            if($null-eq$text){$text=''}
            $boot=$text.Contains('BootGame: Eden starting...')
            $guestExit=$text.Contains('ExitProcess: Process')
            $cascade=$text.Contains('4001000A')
            $forceStop=$text.Contains('Force stopping EmuThread')
          }
          if($boot -and $guestExit -and -not$cascade){$class='PRODUCTION_CINC_COMPLETED'}elseif(-not$boot){$class='THREE_DOWNS_NO_ALT_F_DID_NOT_BOOT'}elseif($cascade){$class='PRODUCTION_CINC_EXCEPTION_CASCADE'}elseif(-not$guestExit){$class='PRODUCTION_CINC_DID_NOT_COMPLETE'}else{$class='PRODUCTION_CINC_UNCLASSIFIED'}
          @("CLASSIFICATION=$class",'LAUNCH_MODE=EDEN_QT_GUI_THREE_DOWNS_NO_ALT_F',"WINDOW_READY=$ready","APP_ACTIVATED=$activated","BOOT_GAME=$boot","GUEST_EXIT_PROCESS=$guestExit","FORCE_STOP_EMUTHREAD=$forceStop","CASCADE_4001000A=$cascade","EDEN_WAS_RUNNING_AT_OBSERVATION_END=$running",'PACKAGE_RUN=34778905214','PACKAGE_HEAD=05243ec0e2507074a7d29a3d4ef4da9da740c95a')|Set-Content (Join-Path $out 'runtime-status.txt')
          Get-Content (Join-Path $out 'runtime-status.txt')
          if($class -ne 'PRODUCTION_CINC_COMPLETED'){exit 1}
      - name: Upload observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SELF-HOSTED-PRODUCTION-GUI-THREE-DOWNS
          path: runtime-output/*
          if-no-files-found: warn
          retention-days: 14
