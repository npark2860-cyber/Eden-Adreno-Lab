name: Apply P0 Adreno Profiler

on:
  push:
    branches:
      - lab/p0-adreno-profiler
    paths:
      - .github/workflows/p0-profiler-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/p0-adreno-profiler
          fetch-depth: 0

      - name: Apply source-only instrumentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/p0-profiler-bootstrap.yml').read_text(encoding='utf-8')
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n"
          start = workflow.index(marker_start) + len(marker_start)
          end = workflow.index(marker_end, start)
          block = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          script = script.replace(
              "'    deferred_clear.framebuffer = {};\\n\\n    std::array<VkClearValue, 9> clear_values{};'",
              "'    deferred_clear = {};\\n\\n    std::array<VkClearValue, 9> clear_values{};'",
              1,
          )
          script = script.replace(
              "Path('.github/workflows/p0-profiler-bootstrap.yml').unlink()",
              "pass",
              1,
          )
          exec(compile(script, '<p0-profiler-bootstrap>', 'exec'))
          PY

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/video_core/CMakeLists.txt \
            src/video_core/renderer_vulkan/vk_adreno_profiler.h \
            src/video_core/renderer_vulkan/vk_adreno_profiler.cpp \
            src/video_core/renderer_vulkan/renderer_vulkan.cpp \
            src/video_core/renderer_vulkan/vk_scheduler.cpp \
            src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp \
            src/video_core/renderer_vulkan/vk_compute_pipeline.cpp \
            src/video_core/renderer_vulkan/vk_update_descriptor.cpp \
            LAB/P0_PROFILER.md
          git diff --cached --check
          git commit -m "perf(lab): add opt-in P0 Adreno profiler [skip ci]"
          git push origin HEAD:lab/p0-adreno-profiler
