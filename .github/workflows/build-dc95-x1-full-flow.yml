name: Build dc95 X1 Draw Dispatch Correlation

on:
  workflow_dispatch:

concurrency:
  group: dc95-x1-draw-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: dc95 ARM64 / X1 draw-dispatch correlation
    runs-on: windows-11-arm
    timeout-minutes: 180

    env:
      TARGET: arm64
      COMPILER: clang
      PGO_TARGET: standard
      BUILD_ID: nightly
      DEVEL: "true"
      CCACHE: "true"
      ARCH: arm64-clang-standard

    steps:
      - name: Checkout Adreno Lab
        uses: actions/checkout@v7
        with:
          path: lab
          fetch-depth: 0

      - name: Checkout Eden CI workflow used by dc95-era nightlies
        uses: actions/checkout@v7
        with:
          repository: Eden-CI/Workflow
          ref: afead830f3a444427f9fdfd841218f932465c03a
          path: ci

      - name: Checkout exact known-good Eden source
        uses: actions/checkout@v7
        with:
          repository: eden-emulator/mirror
          ref: dc95cd09eea9749250fe31a3072684d341d19417
          path: eden
          fetch-depth: 0
          submodules: recursive

      - name: Install dc95-era Eden CI scripts
        shell: bash
        run: |
          rm -rf eden/.ci
          cp -a ci/.ci eden/.ci

      - name: Prepare compile-validated P0.2 non-scheduler patches
        shell: bash
        run: |
          set -e
          mkdir -p profiler-patches
          BASE=a845b6eafe39faf0b9dd038639a5db385cf9d08f
          for f in \
            src/video_core/renderer_vulkan/vk_buffer_cache.cpp \
            src/video_core/renderer_vulkan/vk_compute_pipeline.cpp \
            src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp \
            src/video_core/renderer_vulkan/vk_staging_buffer_pool.cpp \
            src/video_core/renderer_vulkan/vk_update_descriptor.cpp; do
            out="profiler-patches/$(basename "$f").patch"
            git -C lab diff --binary "$BASE" HEAD -- "$f" > "$out"
            test -s "$out"
          done
          cp lab/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp \
             eden/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp
          cp lab/src/video_core/renderer_vulkan/vk_adreno_profiler.h \
             eden/src/video_core/renderer_vulkan/vk_adreno_profiler.h

      - name: Apply P0.2 non-scheduler source hooks
        shell: bash
        working-directory: eden
        run: |
          set -e
          for p in \
            ../profiler-patches/vk_buffer_cache.cpp.patch \
            ../profiler-patches/vk_compute_pipeline.cpp.patch \
            ../profiler-patches/vk_graphics_pipeline.cpp.patch \
            ../profiler-patches/vk_staging_buffer_pool.cpp.patch \
            ../profiler-patches/vk_update_descriptor.cpp.patch; do
            git apply --ignore-whitespace "$p"
          done

      - name: Transplant descriptor-ring profiler
        shell: bash
        run: python lab/tools/adreno_lab/transplant_dc95_descriptor_ring_profiler.py eden

      - name: Transplant base diagnostic checkboxes
        shell: bash
        run: python lab/tools/adreno_lab/transplant_dc95_logging_checkboxes.py eden

      - name: Transplant X1 full-flow controls and non-scheduler hooks
        shell: bash
        run: python lab/tools/adreno_lab/transplant_dc95_full_flow_hooks.py eden

      - name: Transplant exact dc95 scheduler flow hooks
        shell: bash
        run: python lab/tools/adreno_lab/transplant_dc95_scheduler_flow_profiler.py eden/src/video_core/renderer_vulkan/vk_scheduler.cpp

      - name: Finalize exact dc95 diagnostic behavior
        shell: bash
        run: python lab/tools/adreno_lab/finalize_dc95_full_flow_profiler.py eden

      - name: Transplant Draw Dispatch cost correlation
        shell: bash
        run: python lab/tools/adreno_lab/transplant_dc95_draw_dispatch_correlation.py eden

      - name: Transplant signature based Draw Dispatch AB controls
        shell: bash
        run: python lab/tools/adreno_lab/transplant_dc95_draw_dispatch_ab_controls.py eden

      - name: Verify full-flow and Draw Dispatch instrumentation
        shell: bash
        run: |
          set -e
          python -m py_compile \
            lab/tools/adreno_lab/transplant_dc95_descriptor_ring_profiler.py \
            lab/tools/adreno_lab/transplant_dc95_logging_checkboxes.py \
            lab/tools/adreno_lab/transplant_dc95_full_flow_hooks.py \
            lab/tools/adreno_lab/transplant_dc95_scheduler_flow_profiler.py \
            lab/tools/adreno_lab/finalize_dc95_full_flow_profiler.py \
            lab/tools/adreno_lab/transplant_dc95_draw_dispatch_correlation.py \
            lab/tools/adreno_lab/transplant_dc95_draw_dispatch_ab_controls.py \
            lab/tools/adreno_lab/analyze_x1_full_flow_log.py \
            lab/tools/adreno_lab/analyze_x1_draw_dispatch_log.py
          git -C eden diff --check
          grep -q 'vk_adreno_profiler.cpp' eden/src/video_core/CMakeLists.txt
          grep -q 'AdrenoProfiler::Get().Initialize' eden/src/video_core/renderer_vulkan/renderer_vulkan.cpp
          grep -q 'AdrenoProfiler::Get().FrameEnd' eden/src/video_core/renderer_vulkan/renderer_vulkan.cpp
          grep -q 'RecordSchedulerWait' eden/src/video_core/renderer_vulkan/vk_scheduler.h
          grep -q 'sleep_time > std::chrono::milliseconds(15)' eden/src/video_core/renderer_vulkan/vk_scheduler.h
          if grep -q 'spin_tail' eden/src/video_core/renderer_vulkan/vk_scheduler.h; then
            echo 'ERROR: non-dc95 frame-pacing spin_tail policy leaked into diagnostic source' >&2
            exit 1
          fi
          grep -q 'EndRenderPass(RenderPassEndReason::Submit)' eden/src/video_core/renderer_vulkan/vk_scheduler.cpp
          grep -q 'EndRenderPass(RenderPassEndReason::FramebufferChange)' eden/src/video_core/renderer_vulkan/vk_scheduler.cpp
          for forbidden in MarkResolveShadowsUpToDate FlushDeferredClear depth_stencil_discard; do
            if grep -q "$forbidden" eden/src/video_core/renderer_vulkan/vk_scheduler.cpp; then
              echo "ERROR: later scheduler behavior leaked into exact dc95 diagnostic: $forbidden" >&2
              exit 1
            fi
          done
          grep -q 'RecordPresentWait("free-frame"' eden/src/video_core/renderer_vulkan/vk_present_manager.cpp
          grep -q 'RecordAcquire' eden/src/video_core/renderer_vulkan/vk_swapchain.cpp
          grep -q 'RecordPresentCall' eden/src/video_core/renderer_vulkan/vk_swapchain.cpp
          grep -q 'RecordShaderEmit("graphics-spirv"' eden/src/video_core/renderer_vulkan/vk_pipeline_cache.cpp
          grep -q 'RecordShaderEmit("compute-spirv"' eden/src/video_core/renderer_vulkan/vk_pipeline_cache.cpp
          grep -q 'RecordPipelineWait(false' eden/src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp
          grep -q 'RecordPipelineWait(true' eden/src/video_core/renderer_vulkan/vk_compute_pipeline.cpp
          grep -q 'gfxWait=' eden/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp
          grep -q 'computeWait=' eden/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp
          grep -q 'RecordBarrier("buffer-pre-copy"' eden/src/video_core/renderer_vulkan/vk_buffer_cache.cpp
          grep -q 'RecordBarrier("submit-upload"' eden/src/video_core/renderer_vulkan/vk_scheduler.cpp
          grep -q 'QcomEvent::DescriptorTilerPolicy' eden/src/video_core/renderer_vulkan/vk_descriptor_buffer.cpp
          grep -q 'QcomEvent::CustomBorderColor' eden/src/video_core/renderer_vulkan/vk_texture_cache.cpp
          test "$(grep -c 'device.GetDriverID() == VK_DRIVER_ID_QUALCOMM_PROPRIETARY' eden/src/video_core/renderer_vulkan/vk_texture_cache.cpp)" -ge 2
          grep -q 'x1_scheduler_sync_log{linkage, false' eden/src/common/settings.h
          grep -q 'x1_present_frame_log{linkage, false' eden/src/common/settings.h
          grep -q 'x1_pipeline_shader_log{linkage, false' eden/src/common/settings.h
          grep -q 'x1_upload_barrier_log{linkage, false' eden/src/common/settings.h
          grep -q 'x1_qcom_workaround_log{linkage, false' eden/src/common/settings.h
          grep -q 'x1_ab_skip_draw{linkage, false' eden/src/common/settings.h
          grep -q 'x1_ab_skip_dispatch{linkage, false' eden/src/common/settings.h
          grep -q 'X1 Log: Scheduler / Sync' eden/src/yuzu/configuration/configure_debug.cpp
          grep -q 'X1 Log: Present / Frame Pacing' eden/src/yuzu/configuration/configure_debug.cpp
          grep -q 'X1 Log: Pipeline / Shader' eden/src/yuzu/configuration/configure_debug.cpp
          grep -q 'X1 Log: Upload / Barrier' eden/src/yuzu/configuration/configure_debug.cpp
          grep -q 'X1 Log: QCOM Workaround Hits' eden/src/yuzu/configuration/configure_debug.cpp
          grep -q 'X1 A/B: Skip Matching Draw' eden/src/yuzu/configuration/configure_debug.cpp
          grep -q 'X1 A/B: Skip Matching Dispatch' eden/src/yuzu/configuration/configure_debug.cpp
          grep -q 'BeginWork(AdrenoProfiler::WorkOrigin::Draw)' eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -q 'BeginWork(AdrenoProfiler::WorkOrigin::Dispatch)' eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -q '\[X1-FLOW\]\[ORIGIN\]' eden/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp
          grep -q '\[X1-FLOW\]\[ORIGIN-CALL\]' eden/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp
          grep -q '\[X1-FLOW\]\[AB\]' eden/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          if grep -q 'EDEN_ADRENO_PROFILE' eden/src/video_core/renderer_vulkan/vk_adreno_profiler.cpp; then
            echo 'ERROR: legacy env var still controls full-flow profiler on/off' >&2
            exit 1
          fi
          if grep -q 'EDEN_X1_DESCRIPTOR_PROFILE"' eden/src/video_core/renderer_vulkan/vk_descriptor_ring_profiler.cpp; then
            echo 'ERROR: env var still controls descriptor profiler on/off' >&2
            exit 1
          fi
          git -C eden status --short

      - name: Set up MSYS2 CLANGARM64 exactly like Eden Nightly
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq
            pactoys ninja
          pacboy: >-
            qt6-tools:p qt6-translations:p qt6-svg:p
            7zip:p sccache:p cmake:p toolchain:p clang:p python-pip:p lld:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p
            enet:p opus:p mbedtls:p libusb:p unordered_dense:p
            jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p crt-git:p
            libwebp:p libtiff:p brotli:p

      - name: Configure dc95 ARM64 standard build
        shell: msys2 {0}
        working-directory: eden
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: ./.ci/build/configure.sh -DCCACHE_PATH=sccache

      - name: Build dc95 ARM64 X1 draw-dispatch correlation
        shell: msys2 {0}
        working-directory: eden
        run: cmake --build build

      - name: Package with Eden CI Windows packager
        shell: msys2 {0}
        working-directory: eden
        env:
          ARTIFACT_REF: dc95cd09ee-x1-draw-dispatch
          MSYS_TOOLCHAIN: CLANGARM64
        run: ./.ci/package/windows.sh

      - name: Add launcher analyzers and metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force extras | Out-Null
          Copy-Item lab/tools/adreno_lab/analyze_x1_full_flow_log.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_draw_dispatch_log.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_x1_descriptor_ring_log.py extras/ -Force
          Copy-Item lab/tools/adreno_lab/analyze_eden_gpu_log.py extras/ -Force
          @'
          $env:EDEN_X1_FLOW_PROFILE_FRAMES="120"
          $env:EDEN_X1_FLOW_SLOW_US="1000"
          $env:EDEN_X1_DESCRIPTOR_PROFILE_FRAMES="120"
          $eden = Join-Path $PSScriptRoot "eden.exe"
          if (-not (Test-Path $eden)) { throw "Place this script beside eden.exe" }
          Write-Host "Settings > Debug > Logging: enable Scheduler / Sync and Upload / Barrier for Draw/Dispatch correlation."
          & $eden
          '@ | Set-Content -Encoding UTF8 extras/RUN_X1_DRAW_DISPATCH_PROFILE.ps1
          @'
          Experiment: X1 Draw / Dispatch cost-correlation + signature A/B build
          Exact Eden source: dc95cd09eea9749250fe31a3072684d341d19417
          Build: Windows ARM64 / MSYS2 CLANGARM64 / clang / standard
          Parent diagnostic: exp/x1-full-flow-profiler
          Experiment branch: exp/x1-draw-dispatch-correlation

          DEFAULT MODE is instrumentation-only. Both behavioral A/B switches default OFF.

          For correlation, enable these existing GUI checkboxes before game launch:
            X1 Log: Scheduler / Sync
            X1 Log: Upload / Barrier

          New correlation output:
            [X1-FLOW][ORIGIN]       120-frame Draw vs Dispatch aggregate
            [X1-FLOW][ORIGIN-CALL]  heavy individual command preparation with signature

          Per-origin costs:
            staging upload bytes / buffer-copy calls+bytes / outside-RP ends / barriers / Scheduler::Wait

          Runtime A/B controls in Settings > Debug:
            X1 A/B: Skip Matching Draw      + Draw signature (hex)
            X1 A/B: Skip Matching Dispatch  + Dispatch signature (hex)

          Use the analyzer to identify a repeating expensive signature first. Then stop the game,
          enter exactly that signature, enable only the matching A/B switch, and rerun the same scene.
          This skips only the exact signature before its preparation path. It may cause missing
          graphics or logic and is diagnostic evidence, not a production optimization.
          '@ | Set-Content -Encoding UTF8 extras/EXPERIMENT.txt
          git -C eden diff -- src/common/settings.h src/yuzu/configuration/configure_debug.h src/yuzu/configuration/configure_debug.cpp src/video_core/CMakeLists.txt src/video_core/renderer_vulkan | Set-Content -Encoding UTF8 extras/DRAW_DISPATCH_CORRELATION.diff

      - name: List artifact files
        shell: pwsh
        run: Get-ChildItem -Recurse eden/artifacts,extras | Select-Object FullName,Length

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Eden-dc95-X1-draw-dispatch-correlation
          path: |
            eden/artifacts/*
            extras/*
          if-no-files-found: error
          retention-days: 14
