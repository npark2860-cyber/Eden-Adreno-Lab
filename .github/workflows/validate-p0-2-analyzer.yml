name: Validate P0.2 Analyzer

on:
  push:
    branches:
      - lab/p0-2-transfer-rp-reasons

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/p0-2-transfer-rp-reasons

      - name: Validate parser and aggregation
        shell: bash
        run: |
          python -m py_compile tools/adreno_lab/analyze_eden_gpu_log.py

          cat > /tmp/p0.log <<'EOF'
          [ 1.000] Render.Vulkan <Info> [ADRENO-P0] frames=120 | RP begin=240 (2.00/f) reuse=10 end=239 images=480 postRPbarriers=100 (0.83/f) deferredClear=4 | submit=120 (1.00/f) | finishWait=3 1.234ms workerWait=2 2.345ms | gfxPipe=5 fail=1 10.000ms computePipe=2 fail=0 3.000ms | descReserve=100 entries=1000 (8.3/f) dbufEntries=800 dbufBinds=50 overflow=0
          [ 1.001] Render.Vulkan <Info> [ADRENO-P0.2] frames=120 | RPend unknown=0 deferred=4 framebuffer=10 outside=20 submit=120 flushDeferred=5 | stagingUpload=100 12.345MiB stagingDownload=10 1.234MiB deferredDownload=4 0.456MiB | bufferCopy=50 8.765MiB reorderedUpload=20 4.321MiB
          [ 2.000] Render.Vulkan <Info> [ADRENO-P0] frames=120 | RP begin=120 (1.00/f) reuse=5 end=120 images=240 postRPbarriers=20 (0.17/f) deferredClear=1 | submit=60 (0.50/f) | finishWait=1 0.500ms workerWait=1 0.250ms | gfxPipe=1 fail=0 2.000ms computePipe=1 fail=0 1.000ms | descReserve=20 entries=200 (1.7/f) dbufEntries=100 dbufBinds=10 overflow=1
          [ 2.001] Render.Vulkan <Info> [ADRENO-P0.2] frames=120 | RPend unknown=1 deferred=1 framebuffer=2 outside=3 submit=60 flushDeferred=1 | stagingUpload=20 1.000MiB stagingDownload=2 0.100MiB deferredDownload=1 0.050MiB | bufferCopy=10 2.000MiB reorderedUpload=5 1.000MiB
          EOF

          python tools/adreno_lab/analyze_eden_gpu_log.py /tmp/p0.log --json > /tmp/p0.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/p0.json', encoding='utf-8'))
          p0 = d['adreno_profiler']['p0']
          p02 = d['adreno_profiler']['p0_2']
          assert p0['reports'] == 2
          assert p0['frames'] == 240
          assert p0['render_pass']['begin'] == 360
          assert p0['submission']['submits'] == 180
          assert abs(p0['waits']['finish_ms'] - 1.734) < 1e-9
          assert p0['descriptor']['overflows'] == 1
          assert p02['reports'] == 2
          assert p02['frames'] == 240
          assert p02['render_pass_end_reason']['outside_operation'] == 23
          assert p02['transfer']['buffer_copy_calls'] == 60
          assert abs(p02['transfer']['buffer_copy_mib_reported'] - 10.765) < 1e-9
          assert abs(p02['transfer']['reordered_upload_mib_reported'] - 5.321) < 1e-9
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-p0-2-analyzer.yml
          git commit -m "chore: remove temporary analyzer validation workflow [skip ci]"
          git push origin HEAD:lab/p0-2-transfer-rp-reasons
