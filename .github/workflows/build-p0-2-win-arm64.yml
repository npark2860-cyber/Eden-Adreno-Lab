name: Build P0.2 Windows ARM64

on:
  push:
    branches:
      - lab/build-p0-2-win-arm64
  workflow_dispatch:

jobs:
  build:
    name: Eden P0.2 / Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC ARM64 environment
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: arm64

      - name: Install LLVM/Clang
        uses: Nerixyz/install-llvm-action@feat/new-llvm-versions
        with:
          version: "22.1.4"
          env: true

      - name: Tool versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          clang-cl --version

      - name: Install Vulkan SDK
        shell: powershell
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure full ARM64 build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DYUZU_TESTS=OFF `
            -DENABLE_QT=ON `
            -DENABLE_OPENGL=OFF `
            -DYUZU_CMD=ON `
            -DYUZU_USE_BUNDLED_QT=ON `
            -DYUZU_USE_QT_MULTIMEDIA=OFF `
            -DYUZU_USE_QT_WEB_ENGINE=OFF `
            -DENABLE_UPDATE_CHECKER=OFF `
            -DENABLE_LTO=OFF `
            -DYUZU_DISABLE_LLVM=ON `
            -DYUZU_USE_BUNDLED_FFMPEG=ON `
            -DYUZU_USE_BUNDLED_SDL3=ON `
            -DYUZU_USE_BUNDLED_OPENSSL=ON

      - name: Build full Eden
        shell: pwsh
        run: cmake --build build --parallel 4

      - name: Assemble P0.2 test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/bin/* package/ -Recurse -Force
          New-Item -ItemType Directory -Force package/tools/adreno_lab | Out-Null
          Copy-Item tools/adreno_lab/analyze_eden_gpu_log.py package/tools/adreno_lab/ -Force
          Copy-Item LAB/P0_PROFILER.md package/ -Force
          Copy-Item LAB/P0_2_TRANSFER_AND_RP_REASONS.md package/ -Force
          @'
          $env:EDEN_ADRENO_PROFILE="1"
          $env:EDEN_ADRENO_PROFILE_FRAMES="120"
          $eden = Join-Path $PSScriptRoot "eden.exe"
          if (-not (Test-Path $eden)) { throw "eden.exe not found in package" }
          & $eden
          '@ | Set-Content -Encoding UTF8 package/RUN_P0_2.ps1
          @'
          Eden P0.2 Windows ARM64 test package
          Source: lab/p0-2-transfer-rp-reasons @ ffac24ffaebdd0cf4c0c7d4249f8ad28f7284808

          Run RUN_P0_2.ps1 from PowerShell. It enables EDEN_ADRENO_PROFILE=1 and a 120-frame report interval before launching eden.exe.

          Keep the game/save/scene/settings/cache state fixed during comparison captures. Preserve the complete Eden log.

          Analyze a captured log with:
          python tools/adreno_lab/analyze_eden_gpu_log.py "C:\path\to\log" --json
          '@ | Set-Content -Encoding UTF8 package/P0_2_README.txt
          Get-ChildItem package -Recurse | Select-Object FullName, Length

      - name: Upload ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: Eden-P0.2-Windows-ARM64-ffac24ff
          path: package
          if-no-files-found: error
          retention-days: 14
